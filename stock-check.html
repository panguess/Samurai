      c.querySelector('#rfPending').innerHTML = `<span class="warn">ยังไม่จับคู่อีก ${pending} รายการ</span>
        <button class="jump-btn" id="jumpUnresolvedBtn" type="button"><i class="ti ti-arrow-down" aria-hidden="true"></i> ไปที่รายการที่ยังไม่จับคู่${pending>1 ? ` (${jumpCursor+1}/${pending})` : ''}</button>`;
      c.querySelector('#jumpUnresolvedBtn').onclick = jumpToUnresolvedBatchItem;
    } else {
      c.querySelector('#rfPending').innerHTML = `จับคู่ครบแล้ว (${g.items.length} รายการ)`;
    }
    c.querySelector('#rfTotal').textContent = fmtMoneyBatch(total);
    updateBillHeaderMismatch();
  }
  drawAll();

  // ปุ่มนี้แค่ mark ว่ากลุ่มนี้ "ตรวจแล้ว" ในเครื่อง ไม่เรียก API เลย — ข้อมูลถูกส่งจริงทีเดียวตอนกด
  // "ส่งทั้งหมด" ที่ renderBillBatchReview (เรียก submitBillForReview วนทีละบิล)
  c.querySelector('#confirmBtn').onclick = ()=>{ g.reviewed = true; go('billBatchReview'); };
}

/* ---- 5d) แก้กลุ่มรูป — ไม่พยายาม "หั่น" รายการที่ AI อ่านมาแล้วเอง (ไม่รู้ว่าแต่ละรายการมาจากรูปไหน)
   เลือกรูปที่ต้องการแล้ววิเคราะห์ซ้ำผ่าน analyzeBillPhoto ตัวเดิมที่ใช้งานจริงทุกวันเสมอแทน รับประกันว่า
   ไม่มีทางได้ผลลัพธ์ปนกันมั่วจากการพยายามแยกข้อมูลที่ผสมกันไปแล้ว ---- */
function renderBillBatchRegroup(app){
  const sup = SUPPLIERS.find(s=>s.id===state.billSupplierId);
  app.appendChild(topbar('แก้กลุ่มรูป', {back:()=>go('billBatchReview'), meta: sup.name}));
  const c = document.createElement('div'); c.className='content';
  c.innerHTML = `
    <p class="hint">เลือกรูปที่ควรเป็น<b>บิลเดียวกัน</b> (ข้ามกลุ่มเดิมได้) แล้วให้ AI วิเคราะห์กลุ่มนี้ใหม่ — บิลที่ "ตรวจแล้ว" ถูกล็อกไว้ ไม่กระทบ</p>
    <div class="regroup-grid" id="regroupGrid"></div>
    <button class="btn btn-primary btn-block" id="regroupBtn" disabled>วิเคราะห์กลุ่มที่เลือกใหม่</button>
  `;
  app.appendChild(c);

  // เผื่อเปิดมาจากปุ่ม "แก้กลุ่มรูปนี้" ของการ์ดใดการ์ดหนึ่ง — ติ๊กรูปของกลุ่มนั้นไว้ให้ก่อนเป็นจุดเริ่ม
  const seedGroup = state.billBatchRegroupFrom != null ? state.billBatchGroups[state.billBatchRegroupFrom] : null;
  const picked = new Set(seedGroup ? seedGroup.photoIndices : []);

  // รูปของบิลที่ "ตรวจแล้ว"/ส่งแล้ว ล็อกไว้ไม่ให้แก้กลุ่มซ้ำที่นี่ — กันข้อมูลที่พึ่งยืนยันไปหายเงียบๆ
  // ถ้าจะแก้บิลนั้นจริงๆ ให้กด "แก้ไขรายการ" ที่หน้าตรวจสอบการแบ่งบิลแทน
  const lockedSet = new Set();
  state.billBatchGroups.forEach(gr=>{ if(gr.reviewed || gr.submitted) gr.photoIndices.forEach(i=> lockedSet.add(i)); });

  function draw(){
    const grid = c.querySelector('#regroupGrid');
    grid.innerHTML = state.billPhotos.map((url,i)=>{
      if(lockedSet.has(i)) return '';
      const isPicked = picked.has(i);
      const ownerGroup = state.billBatchGroups.find(gr=>gr.photoIndices.includes(i));
      const gi = state.billBatchGroups.indexOf(ownerGroup);
      return `<div class="regroup-chip ${isPicked?'is-picked':''}" data-i="${i}" role="button" tabindex="0" aria-pressed="${isPicked}" aria-label="รูปบิลที่ถ่ายไว้ หน้าที่ ${i+1} (ตอนนี้อยู่ในกลุ่มบิลที่ ${gi+1})">
        <div class="bill-photo-chip"><img src="${url}" alt="รูปบิลที่ถ่ายไว้ หน้าที่ ${i+1} (ตอนนี้อยู่ในกลุ่มบิลที่ ${gi+1})"></div>
        <span class="rg-badge">บิลที่ ${gi+1}</span>
        <span class="rg-check"><i class="ti ti-check" aria-hidden="true"></i></span>
      </div>`;
    }).join('');
    grid.querySelectorAll('[data-i]').forEach(el=> bindActivatable(el, ()=>{
      const i = +el.dataset.i;
      if(picked.has(i)) picked.delete(i); else picked.add(i);
      draw();
      // draw() รื้อ innerHTML ทั้งกริดใหม่ทุกครั้งที่เลือก/ยกเลิก — คืนโฟกัสกลับไปที่รูปเดิมที่เพิ่งกด
      // กันโฟกัสหลุดไปที่ <body> เงียบๆ เหมือนบั๊กเดิมที่เคยเจอกับ .ord-card-head/accordion มาก่อน
      const newEl = grid.querySelector(`[data-i="${i}"]`);
      if(newEl) newEl.focus();
    }));
    c.querySelector('#regroupBtn').disabled = picked.size===0;
  }
  draw();

  const isCurrent = renderToken(); // E2E-003: กดย้อนกลับระหว่างรอ AI — ทิ้งผล ไม่แก้กลุ่ม/ไม่ go() ทับหน้าปัจจุบัน
  c.querySelector('#regroupBtn').onclick = async ()=>{
    const btn = c.querySelector('#regroupBtn');
    btn.disabled = true; btn.textContent = 'กำลังวิเคราะห์...';
    try{
      const selected = [...picked].sort((a,b)=>a-b);
      const photos = selected.map(i=> state.billPhotos[i]);
      // เรียก analyzeBillPhoto ตัวเดิมตรงๆ (ไม่ใช่ analyzeBillBatch) — กลุ่มที่คนเลือกเองถือว่าเป็นเอกสาร
      // เดียวแน่นอนแล้ว ใช้ path ที่ทดสอบมาดีที่สุดในการอ่านให้ — apiPostSilentRetry() กันการเชื่อมต่อหลุด
      // ระหว่างรอเหมือนจุดอื่นๆ ที่เรียก analyzeBillPhoto/analyzeBillBatch (ดูคอมเมนต์เต็มที่นิยามฟังก์ชัน)
      const res = await apiPostSilentRetry('analyzeBillPhoto', { supplierId: state.billSupplierId, photos }, 270000, 3, (attempt, max)=>{
        if(attempt>1) btn.textContent = `การเชื่อมต่อหลุด กำลังลองใหม่ (${attempt}/${max})...`;
      }, BILL_API_URL);
      if(!isCurrent()) return;
      const items = (res.items||[]).map((it,i)=>({
        _id: 'rg'+Date.now()+'it'+i, billText: it.billText, unit: it.unit, qty: it.qty,
        receivedQty: it.qty, unitPrice: it.unitPrice,
        likelyNonProduct: !!it.likelyNonProduct, skip: !!it.likelyNonProduct,
        productId: it.productId || null, factor: it.conversionFactor || null,
        matchType: it.matchType || null, matchedAliasText: it.matchedAliasText || null,
        confirmed: it.matchType === 'exact',
      }));
      // ลบรูปที่เพิ่งเลือกออกจากกลุ่มเดิม (เฉพาะกลุ่มที่ยังไม่ตรวจ) — กลุ่มไหนว่างสนิทหลังลบให้ลบทิ้งไปด้วย
      state.billBatchGroups = state.billBatchGroups.filter(gr=>{
        if(gr.reviewed || gr.submitted) return true;
        gr.photoIndices = gr.photoIndices.filter(i=> !selected.includes(i));
        return gr.photoIndices.length > 0;
      });
      state.billBatchGroups.push({ photoIndices: selected, items, billHeader: res.billHeader||null, supplierMismatchWarning: res.supplierMismatchWarning||null, duplicateBillWarning: res.duplicateBillWarning||null, reviewed:false, submitted:false, idemKey: genIdemKey() });
      go('billBatchReview');
    }catch(err){
      if(!isCurrent()) return;
      btn.disabled = false; btn.textContent = 'วิเคราะห์กลุ่มที่เลือกใหม่';
      const fe = friendlyBillError(err);
      // E2E-009: ข้อความที่ไม่ใช่ [QUOTA] ผ่าน friendlyErrorMessage เหมือนจุดอื่นทั้งแอป (ไม่โชว์ exception ดิบ)
      alert(fe.title ? (fe.title + '\n' + fe.detail) : ('วิเคราะห์ไม่สำเร็จ: ' + friendlyErrorMessage(err)));
    }
  };
}

/* ---- 5e) ส่งครบทุกบิลในกลุ่มแล้ว ---- */
function renderBillBatchSuccess(app){
  const sup = SUPPLIERS.find(s=>s.id===state.billSupplierId);
  app.appendChild(topbar('บันทึกสำเร็จ', {}));
  const c = document.createElement('div'); c.className='content';
  const n = state.billBatchSubmittedCount != null ? state.billBatchSubmittedCount : state.billBatchGroups.filter(g=>g.submitted).length;
  // E2E-010: บิลที่ backend ข้ามเพราะเลขที่บิลซ้ำกับที่เคยเข้าระบบแล้ว ไม่ได้เข้าคิวใหม่ — บอกแยกให้ชัด
  const skippedDup = state.billBatchGroups.filter(g=> g.submitted && g.duplicateSkipped).length;
  const sent = Math.max(0, n - skippedDup);
  c.innerHTML = `
    <div class="success-wrap">
      <div class="success-icon" style="background:var(--amber-bg); color:var(--amber);"><i class="ti ti-clock" aria-hidden="true"></i></div>
      <h2>${skippedDup ? `ส่ง ${sent} บิลแล้ว · ข้าม ${skippedDup} บิลที่ซ้ำ` : `ส่ง ${n} บิลแล้ว`}</h2>
      <p>${sup.name} · ถ่ายโดย ${state.billStaffName}</p>
    </div>
    <div class="recap-card" style="text-align:left;">
      <p style="margin:0; font-size:13px; color:var(--text-secondary);">รูปบิลกับสิ่งที่จับคู่ไว้แล้วถูกเก็บไว้ให้ทุกใบ เจ้าของร้านจะเห็นในเมนู "บิลรอตรวจสอบ" แยกกัน ${sent} รายการ ตรวจทานแล้วกดบันทึกต้นทุนจริงทีละใบเอง${skippedDup ? ` (บิลที่ซ้ำ ${skippedDup} ใบไม่ได้สร้างใหม่ เจ้าของจะเห็นบิลเดิมที่เคยส่งไว้)` : ''}</p>
    </div>
    <button class="btn btn-primary btn-block" id="doneBtn">เสร็จสิ้น กลับหน้าแรก</button>
  `;
  app.appendChild(c);
  c.querySelector('#doneBtn').onclick = ()=> go('home');
}

/* ---- 6) บันทึกสำเร็จ ---- */
function renderBillSuccess(app){
  const sup = SUPPLIERS.find(s=>s.id===state.billSupplierId);
  const products = PRODUCTS.filter(p=>p.supplierId===sup.id);

  if(state.billMode !== 'owner-resume' && state.billDuplicateSkipped){
    // E2E-010: เลขที่บิลตรงกับบิลที่เคยเข้าระบบแล้ว — backend ไม่ได้สร้างแถวใหม่ (กันบิลซ้ำ) บอกพนักงานตรงๆ ว่าไม่ต้องส่งใหม่
    app.appendChild(topbar('บิลนี้ส่งไปแล้ว', {}));
    const c = document.createElement('div'); c.className='content';
    const billNo = state.billHeader && state.billHeader.billNumber;
    c.innerHTML = `
      <div class="success-wrap">
        <div class="success-icon" style="background:var(--purple-bg); color:var(--purple);"><i class="ti ti-info-circle" aria-hidden="true"></i></div>
        <h2>บิลนี้เคยส่งเข้าระบบแล้ว</h2>
        <p>${sup.name}${billNo ? ' · เลขที่บิล ' + escapeHtml(billNo) : ''}</p>
      </div>
      <div class="learned-note" role="status"><i class="ti ti-info-circle" aria-hidden="true"></i> ระบบไม่ได้สร้างบิลซ้ำ เจ้าของร้านจะเห็นบิลเดิมใน "บิลรอตรวจสอบ" ใบเดียว ไม่ต้องส่งใหม่</div>
      <button class="btn btn-primary btn-block" id="doneBtn">เสร็จสิ้น กลับหน้าแรก</button>
    `;
    app.appendChild(c);
    c.querySelector('#doneBtn').onclick = ()=> go('home');
    return;
  }
  if(state.billMode !== 'owner-resume'){
    // ลูกจ้างส่งแล้ว — ยังไม่ใช่การบันทึกต้นทุนจริง แค่ส่งเข้าคิวให้เจ้าของตรวจ/กดบันทึกจริงอีกที
    app.appendChild(topbar('บันทึกสำเร็จ', {}));
    const c = document.createElement('div'); c.className='content';
    c.innerHTML = `
      <div class="success-wrap">
        <div class="success-icon" style="background:var(--amber-bg); color:var(--amber);"><i class="ti ti-clock" aria-hidden="true"></i></div>
        <h2>บันทึกรายการนี้แล้ว</h2>
        <p>${sup.name} · ถ่ายโดย ${state.billStaffName}</p>
      </div>
      <div class="recap-card" style="text-align:left;">
        <p style="margin:0; font-size:13px; color:var(--text-secondary);">รูปบิลกับสิ่งที่จับคู่ไว้แล้วถูกเก็บไว้ให้แล้ว เจ้าของร้านจะเห็นในเมนู "บิลรอตรวจสอบ" ตรวจทานอีกรอบแล้วกดบันทึกต้นทุนจริงเอง</p>
      </div>
      <button class="btn btn-primary btn-block" id="doneBtn">เสร็จสิ้น กลับหน้าแรก</button>
    `;
    app.appendChild(c);
    c.querySelector('#doneBtn').onclick = ()=> go('home');
    return;
  }

  const kept = state.billItems.filter(it=>!it.skip);
  const total = kept.reduce((s,it)=> s + (it.qty*it.unitPrice||0), 0);
  const drifted = kept.filter(it=> Number((it.receivedQty-it.qty).toFixed(2)) !== 0);
  app.appendChild(topbar('บันทึกสำเร็จ', {}));
  const c = document.createElement('div'); c.className='content';
  c.innerHTML = `
    <div class="success-wrap">
      <div class="success-icon"><i class="ti ti-check" aria-hidden="true"></i></div>
      <h2>บันทึกต้นทุนเรียบร้อย</h2>
      <p>${sup.name} · โดย ${state.billStaffName}</p>
    </div>
    <div class="recap-card">
      ${kept.map(it=>{
        const p = products.find(x=>x.id===it.productId);
        const diff = Number((it.receivedQty-it.qty).toFixed(2));
        return `<div class="recap-row"><span class="rr-name">${escapeHtml(p?p.name:it.billText)}${diff!==0?` <span style="color:${diff<0?'var(--danger)':'var(--amber)'};font-weight:700;">(${diff<0?'ขาด':'เกิน'} ${Math.abs(diff)})</span>`:''}</span><span class="rr-val">${it.qty}${escapeHtml(it.unit)} · ฿${(it.qty*it.unitPrice).toLocaleString('th-TH',{maximumFractionDigits:0})}</span></div>`;
      }).join('')}
      <div class="recap-row"><span class="rr-name"><b>ยอดรวม (ตามบิล)</b></span><span class="rr-val" style="font-size:15px;">฿${total.toLocaleString('th-TH',{maximumFractionDigits:2})}</span></div>
    </div>
    ${drifted.length ? `<div class="learned-note drift-note"><i class="ti ti-alert-triangle" aria-hidden="true"></i> พบส่วนต่างจากบิล ${drifted.length} รายการ — เช็คช่อง "รับจริง" ของแต่ละรายการด้านบนเพื่อดูว่าซัพพลายเออร์ส่งขาด/เกินตรงไหน</div>` : ''}
    ${state.billLearnedCount>0 ? `<div class="learned-note"><i class="ti ti-sparkles" aria-hidden="true"></i> จดจำการจับคู่ใหม่ ${state.billLearnedCount} รายการไว้แล้ว ครั้งหน้าเจอชื่อเดิมจาก ${sup.name} ระบบจะจับคู่ให้อัตโนมัติทันที</div>` : ''}
    <button class="btn btn-primary btn-block" id="moreBtn">จับคู่บิลเจ้าอื่นต่อ</button>
    <button class="btn-text-cancel" id="doneBtn">เสร็จสิ้น กลับเมนู</button>
  `;
  app.appendChild(c);
  // เจอจริง 15 ก.ย. 69 (ต่อ): เดิมปุ่มหลักพา go('home') ซึ่งเป็นหน้าเลือกบทบาท (พนักงาน/เจ้าของ) — ต้องกด
  // "จัดการร้าน" แล้วใส่รหัส PIN ใหม่ทุกครั้ง ทั้งที่เพิ่งยืนยันตัวตนไปแล้วตอนเข้าหน้านี้ครั้งแรก น่ารำคาญมาก
  // เวลาต้องไล่จับคู่บิลค้างหลายเจ้าติดกัน — สลับให้ปุ่มหลักพากลับไปหน้า "บิลรอตรวจสอบ" ตรงๆ (ทำเจ้าถัดไปต่อ
  // ได้ทันที ไม่ต้องผ่าน PIN เพราะ go() ไม่มีการเช็คสิทธิ์ซ้ำอยู่แล้ว) ส่วนปุ่ม "เสร็จสิ้น" เปลี่ยนเป็น
  // go('ownerMenu') ตรงๆ แทน go('home') — ยังคงกลับไปยังเมนูเจ้าของแบบไม่ต้องใส่ PIN ซ้ำเหมือนกัน (pattern
  // เดียวกับปุ่มย้อนกลับของหน้า "บิลรอตรวจสอบ" เองที่ใช้ go('ownerMenu') อยู่แล้ว)
  c.querySelector('#doneBtn').onclick = ()=> go('ownerMenu');
  c.querySelector('#moreBtn').onclick = ()=> go('billPendingList');
}

/* ---- 7) เจ้าของ: บิลรอตรวจสอบ ---- */
// เจอจริง 13 ก.ย. 69: หน้านี้ยิงไปที่โปรเจกต์ Apps Script "BillCapture" แยกต่างหาก (BILL_API_URL) ซึ่งถูก
// เรียกใช้ห่างๆ กว่าโปรเจกต์หลักมาก (มีแค่ 5 action ใช้งาน) ทำให้เจอ "cold start" ของสคริปต์บ่อย — ไม่ error
// ไม่ค้างตาย แค่ช้ากว่าปกติมากตอนเปิดครั้งแรกของรอบ (แคช 30 วิที่ backend มีอยู่แล้วช่วยเฉพาะเปิดซ้ำถี่ๆ
// เท่านั้น) แก้ด้วย client-side cache แบบเดียวกับ bootstrap(): โชว์รายการล่าสุดที่เคยโหลดได้ทันทีจาก
// sessionStorage ระหว่างรอของจริงมาแทนที่เงียบๆ เบื้องหลัง ผู้ใช้จะรู้สึกว่าเร็วขึ้นทันทีแม้ backend ยังช้าอยู่
const PENDING_BILLS_CACHE_KEY = 'samurai_pending_bills_cache_v1';
const PENDING_BILLS_CACHE_KEY_V2 = 'samurai_pending_bills_cache_v2';
// E2E-008: draft หัวบิลที่ยังรอเซฟแบบหน่วงเวลา (saveDraftSoon ใน renderBillReview) — เซฟทันทีก่อนหน้าเว็บถูกปิด/ซ่อน
// ผูก listener แค่ครั้งเดียวทั้งไฟล์ (ไม่ผูกซ้ำทุกครั้งที่ render หน้าตรวจ) หน้าตรวจแต่ละรอบแค่ตั้ง/ล้าง hook นี้
let _draftFlushHook = null;
function flushPendingDraft(){ if(_draftFlushHook) _draftFlushHook(); }
window.addEventListener('pagehide', flushPendingDraft);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'hidden') flushPendingDraft(); });
// Speed รอบ 1 (C): ย้ายไป localStorage แบบเดียวกับแคช bootstrap (ดู readPersistCache) — บิลที่เพิ่งบันทึก/ทิ้งไป
// ยังถูกลบออกจากแคชทันทีผ่าน markPendingBillClosed เหมือนเดิม และ backend กันบันทึกซ้ำด้วย lock+เช็ค receipt แล้ว
function readPendingBillsCache(){
  const v = readPersistCache(PENDING_BILLS_CACHE_KEY_V2, PENDING_BILLS_CACHE_KEY);
  return Array.isArray(v) ? v : null;
}
function writePendingBillsCache(batches){ writePersistCache(PENDING_BILLS_CACHE_KEY_V2, PENDING_BILLS_CACHE_KEY, batches); }
// E2E fix (1 ต.ค. 69, จาก Final E2E Audit — E2E-001): เดิมหลังกด "บันทึกต้นทุน"/"ทิ้งบิลนี้" สำเร็จ แคชรายการ
// ใน sessionStorage ยังมีบิลนั้นอยู่ พอกลับมาหน้า "บิลรอตรวจสอบ" ก็โชว์บิลเดิมทันทีระหว่างรอรีเฟรช (ถ้ารีเฟรชล้มเหลว
// ค้างทั้ง session) กดเข้าไปบันทึกซ้ำได้ — finalizePurchaseReceipt ไม่ idempotent จึงเขียน PurchaseReceipts ซ้ำจริง
// (เทสยืนยัน 1 → 2 แถว) แก้: ลบออกจากแคชทันที + จำ batchId ไว้ซ่อนจากรายการตลอด session นี้ (batchId ไม่ซ้ำกันเลย
// มี ms ใน ID — ปลอดภัยที่จะจำไว้ทั้ง session) — ได้ผลพลอยได้คือรายการอัปเดตทันทีไม่ต้องรอ network
const _closedPendingBatchIds = new Set();
function markPendingBillClosed(batchId){
  if(!batchId) return;
  _closedPendingBatchIds.add(batchId);
  const cached = readPendingBillsCache();
  if(Array.isArray(cached)) writePendingBillsCache(cached.filter(b=> b.batchId !== batchId));
}
async function renderBillPendingList(app){
  const isCurrent = renderToken();
  app.appendChild(topbar('บิลรอตรวจสอบ', {back:()=>go('ownerMenu')}));
  const c = document.createElement('div'); c.className='content';
  app.appendChild(c);

  function drawList(allBatches){
    // E2E-001: ซ่อนบิลที่เครื่องนี้เพิ่งบันทึกต้นทุน/ทิ้งไปสำเร็จเสมอ — กันแคชเก่า (หรือรีเฟรชเบื้องหลังที่ยังไม่
    // กลับมา/ล้มเหลว) โชว์บิลเดิมค้างให้กดเข้าไปบันทึกซ้ำจนต้นทุนถูกนับ 2 เท่า (ดู markPendingBillClosed)
    const batches = allBatches.filter(b=> !_closedPendingBatchIds.has(b.batchId));
    if(!batches.length){ c.innerHTML = `<p class="empty-state">ไม่มีบิลค้างตรวจสอบตอนนี้ 🎉</p>`; return; }
    c.innerHTML = batches.map(b=>{
      const sup = SUPPLIERS.find(s=>s.id===b.supplierId);
      const done = b.items.filter(it=> it.skip || (it.productId && it.factor && it.confirmed)).length;
      return `<div class="pending-row" data-id="${b.batchId}" role="button" tabindex="0">
        <div class="sup-thumb"><i class="ti ti-building-store" aria-hidden="true"></i></div>
        <div class="pr-body">
          <div class="pr-title">${sup ? sup.name : b.supplierId}</div>
          <div class="pr-sub">ถ่ายโดย ${b.staffName} · ${b.date}</div>
          ${b.duplicateBillWarning ? `<div style="display:flex; gap:5px; align-items:flex-start; background:var(--amber-bg); color:var(--amber); font-size:11px; font-weight:600; padding:5px 8px; border-radius:7px; margin-top:7px;"><i class="ti ti-copy" aria-hidden="true" style="flex-shrink:0; margin-top:1px;"></i> อาจซ้ำกับบิลอื่น — ตรวจสอบก่อน</div>` : ''}
        </div>
        <span class="status-pill unmatched">${done}/${b.items.length} จับคู่แล้ว</span>
      </div>`;
    }).join('');
    c.querySelectorAll('.pending-row').forEach(el=> bindActivatable(el, ()=>{
      const b = batches.find(x=>x.batchId===el.dataset.id);
      go('billReview', {
        billMode:'owner-resume', billResumeBatchId:b.batchId, billSupplierId:b.supplierId,
        billStaffName:b.staffName, billPhotos: String(b.photoUrl||'').split(',').filter(Boolean), billItems:b.items,
        billHeader: b.billHeader || null,
        // เคลียร์ให้ชัดเจน — คำเตือนซัพพลายเออร์ไม่ตรงมาจาก analyzeBillPhoto ตอนวิเคราะห์สดเท่านั้น บิลค้างจาก
        // PendingBillReceipts ไม่มีข้อมูลนี้เก็บไว้ กันค่าเก่าจาก session ก่อนหน้าค้างโชว์ผิดบิล
        billSupplierMismatchWarning: null,
        // ต่างจากข้างบน — คำเตือนบิลซ้ำตอนนี้ backend คำนวณใหม่ทุกครั้งที่โหลดคิวนี้แล้ว (เทียบกับบิลอื่น
        // ในคิว/ที่บันทึกจริงแล้ว) ส่งต่อเข้าไปให้หน้ารีวิวโชว์ได้เลย ไม่ต้อง null ทิ้ง
        billDuplicateWarning: b.duplicateBillWarning || null
      });
    }));
  }

  // เจอจริง 7 ก.ย. 69: หน้านี้เคย apiGet('pendingBills') ครั้งเดียวจบ ไม่มี retry เลย (ต่างจาก
  // bootstrap() ที่ retry เงียบๆ ให้อยู่แล้ว) พอเจอการเชื่อมต่อหลุดแวบเดียว (Executions log ยืนยันว่า
  // backend สำเร็จเร็วทุกครั้ง <3 วิ) ก็ขึ้น "หมดเวลาเชื่อมต่อ" ทันทีโดยไม่มีแม้แต่ปุ่ม "ลองใหม่" ให้กด
  // ต้องกดย้อนกลับแล้วเข้าใหม่เอาเอง — เดิมแก้ด้วยปุ่ม "ลองใหม่" ก่อน (7 ก.ย. 69) ตอนนี้ (15 ก.ย. 69)
  // เปลี่ยนเป็นวนลองเงียบๆ ไม่จำกัดรอบแบบเดียวกับ bootstrap()/checkPin() แทนที่จะโชว์ error ค้างรอให้กดเอง
  // (silent=true ยังคงพฤติกรรมเดิม: มี cache โชว์อยู่แล้ว รีเฟรชเบื้องหลังพังแค่ครั้งเดียวไม่ต้อง retry ซ้ำ)
  async function load(silent){
    let stopTimer = null;
    if(!silent){
      const lt = loadingTimerHtml();
      c.innerHTML = `<p class="empty-state">กำลังโหลด...</p>${lt.html}`;
      stopTimer = attachLoadingTimer(document.getElementById(lt.id));
    }
    for(;;){
      let data;
      try{
        try{ data = await apiGet('pendingBills', null, 10000, BILL_API_URL); }
        catch(firstErr){ data = await apiGet('pendingBills', null, undefined, BILL_API_URL); }
      }catch(err){
        if(silent) return; // มี cache โชว์อยู่แล้ว รีเฟรชเบื้องหลังพังไม่ต้องรบกวนหน้าจอ ลองใหม่รอบหน้าแทน
        await new Promise(r=> setTimeout(r, 3000));
        if(!isCurrent()){ if(stopTimer) stopTimer(); return; } // ผู้ใช้ออกจากหน้านี้ไปแล้ว — เลิกวนลอง
        continue;
      }
      if(stopTimer) stopTimer();
      writePendingBillsCache(data.batches);
      if(isCurrent()) drawList(data.batches);
      return;
    }
  }

  const cached = readPendingBillsCache();
  if(cached){ drawList(cached); load(true); }
  else{ c.innerHTML = `<p class="empty-state">กำลังโหลด...</p>`; load(false); }
}

/* ============ STAFF: supplier list (all suppliers always shown) ============ */
// จัดกลุ่มตามรอบสั่งของวันนี้ (OrderDays เดียวกับที่ฝั่งเจ้าของใช้ผ่าน supplierDueToday())
// เรียงจากเร่งด่วนสุดไปน้อยสุด: "ต้องสั่งวันนี้ · ยังไม่สั่ง" → "ต้องสั่งวันนี้ · สั่งแล้ว" → "ไม่ถึงรอบวันนี้"
// เจตนาเดียวกับฝั่งเจ้าของ: ไม่ได้ล็อกร้านกลุ่มท้ายๆ ห้ามเช็ค/สั่ง แค่หรี่ลงบอกลำดับความสำคัญ (ดู .other-section)
// ภายในแต่ละกลุ่ม ไม่แยกหัวข้อย่อย "เช็คแล้ว/ยังไม่เช็ค" อีกชั้น (จะกลายเป็น 6 หัวข้อ รกเกิน) แค่เรียง
// ร้านที่เช็คแล้วไปท้ายกลุ่มนั้นๆ แล้วให้การ์ดจางลง+ติ๊กถูกเหมือนเดิม
async function renderSupplierList(app){
  const isCurrent = renderToken();
  let statusList;
  if(stockStatusCache){
    statusList = stockStatusCache;
  } else {
    const stopTimer = renderLoading(app, 'กำลังโหลดสถานะร้าน...');
    // 17 ก.ย. 69: เดิมพังครั้งเดียวก็ตัดจบแสดง error ทันที (ต้องกดย้อนกลับแล้วเข้าใหม่เอง) — เปลี่ยนเป็นวนลอง
    // เงียบๆ ไม่จำกัดรอบแบบเดียวกับ bootstrap()/renderSupplierCheck() แทน (getStockStatus เป็นแค่ read-only
    // ลองซ้ำได้ไม่จำกัดโดยไม่มีความเสี่ยงข้อมูลซ้ำซ้อน)
    for(;;){
      try{ statusList = await getStockStatus(); stopTimer(); break; }
      catch(err){ await new Promise(r=> setTimeout(r, 3000)); }
      if(!isCurrent()){ stopTimer(); return; } // ผู้ใช้ออกจากหน้านี้ไปแล้ว — เลิกวนลอง (ดู renderToken)
    }
    if(!isCurrent()) return; // โหลดเสร็จหลังผู้ใช้ออกไปแล้ว — ห้ามวาดทับหน้าปัจจุบัน
  }
  checkedProducts = new Set(statusList.filter(s=>s.checked).map(s=>s.productId));
  checkedSuppliers = new Set(
    SUPPLIERS.filter(s=>{
      const prods = PRODUCTS.filter(p=>p.supplierId===s.id);
      return prods.length>0 && prods.every(p=>checkedProducts.has(p.id));
    }).map(s=>s.id)
  );
  sessionCheckedSuppliers.forEach(id => checkedSuppliers.add(id));

  app.innerHTML = '';
  const doneCount = SUPPLIERS.filter(s=>checkedSuppliers.has(s.id)).length;

  app.appendChild(topbar('เลือกร้านที่จะเช็ค', {back:()=>go('home'), meta:`${doneCount} / ${SUPPLIERS.length}`}));
  const c = document.createElement('div'); c.className='content';
  c.innerHTML = `
    <div class="progress-track"><div class="progress-fill" style="width:${SUPPLIERS.length? doneCount/SUPPLIERS.length*100:0}%; background:var(--brand);"></div></div>
    <input type="text" id="search" placeholder="ค้นหาชื่อร้าน" style="margin-bottom:14px;">
    <div id="groups"></div>
  `;
  app.appendChild(c);
  const groupsEl = c.querySelector('#groups');

  function supplierOrderedToday(s){
    return PRODUCTS.some(p=> p.supplierId===s.id && orderedProductIds.has(p.id));
  }
  // ร้านที่เช็คแล้วเลื่อนไปท้ายกลุ่มเดียวกันเสมอ (ไม่ข้ามไปกลุ่มอื่น) — ลำดับเลขที่การ์ด (idx+1)
  // ยังอิง SUPPLIERS.indexOf(s) เดิมทุกที่ ไม่เปลี่ยนเลขตามกลุ่ม/การเรียง กันงงเวลาสลับจอ
  function sortWithin(list){
    return [...list].sort((a,b)=> (checkedSuppliers.has(a.id)?1:0) - (checkedSuppliers.has(b.id)?1:0));
  }

  function renderLists(filter){
    const f = (filter||'').trim();
    groupsEl.innerHTML = '';

    const due = SUPPLIERS.filter(s=> supplierDueToday(s));
    const rest = SUPPLIERS.filter(s=> !supplierDueToday(s));
    const dueNotOrdered = due.filter(s=> !supplierOrderedToday(s));
    const dueOrdered = due.filter(s=> supplierOrderedToday(s));

    function addSection(labelText, labelClass, list, statusPill, dim){
      const filtered = sortWithin(list).filter(s=> s.name.includes(f));
      if(!filtered.length) return;
      const label = document.createElement('h2');
      label.className = 'section-label' + (labelClass? ' '+labelClass : '');
      label.textContent = `${labelText} · ${filtered.length} เจ้า`;
      groupsEl.appendChild(label);
      const wrap = document.createElement('div');
      if(dim) wrap.className = 'other-section';
      const grid = document.createElement('div'); grid.className = 'sup-card-grid';
      filtered.forEach(s=> grid.appendChild(supplierCard(s, checkedSuppliers.has(s.id), SUPPLIERS.indexOf(s), statusPill, dim)));
      wrap.appendChild(grid);
      groupsEl.appendChild(wrap);
    }

    addSection('ต้องสั่งวันนี้ · ยังไม่สั่ง', 'urgent', dueNotOrdered, 'urgent', false);
    addSection('ต้องสั่งวันนี้ · สั่งแล้ว', 'ordered', dueOrdered, 'ordered', false);
    addSection(due.length ? 'ไม่ถึงรอบวันนี้' : 'เจ้าทั้งหมด', null, rest, null, true);

    if(!groupsEl.children.length) groupsEl.innerHTML = '<p class="empty-state">ไม่พบร้านที่ค้นหา</p>';
  }
  renderLists('');
  c.querySelector('#search').oninput = debounce((e)=>renderLists(e.target.value), 250);

  // สถานะ "สั่งแล้ว" ของแต่ละเจ้า — โหลดแยกจาก stockStatus เพราะเป็นคนละชีต (OrderLogs) ยิงแบบไม่รอ
  // (ไม่ await) ให้เห็นรายการร้านทันทีก่อน ไม่ต้องรอ network รอบสองจบก่อนถึงจะเห็นหน้าจอ — พอโหลดเสร็จ
  // ค่อย re-render อัปเดตกลุ่ม/ป้ายสถานะให้ตรง ถ้าโหลดไม่สำเร็จก็แค่ป้ายรอสั่ง/สั่งแล้วไม่อัปเดต ไม่กระทบการเช็คสต๊อก
  apiGet('orderedToday').then(orderedRes=>{
    orderedProductIds = new Set((orderedRes && orderedRes.productIds) || []);
    if(!isCurrent()) return; // ข้อมูลยังเก็บไว้ใช้ (บรรทัดบน) แต่ไม่ต้องวาดหน้าที่ผู้ใช้ออกไปแล้ว
    renderLists(c.querySelector('#search').value);
  }).catch(()=>{});
}

function supplierCard(s, isDone, idx, statusPill, dim){
  const col = iconColor(idx);
  const hasPhoto = !!s.imageUrl;
  const isUrgent = statusPill==='urgent' && !isDone;
  const card = document.createElement('div');
  card.className = 'sup-card' + (isDone?' done':'') + (isUrgent?' urgent':'');
  const pillHtml = statusPill
    ? `<span class="status-pill ${statusPill}">${statusPill==='urgent'?'รอสั่ง':'สั่งแล้ว'}</span>`
    : '';
  // WCAG AA fix (27 ก.ย. 69, ACC-008): เดิมใช้ container opacity (.sup-card.done / .other-section .sup-card)
  // ลดความชัดของ "เช็คแล้ว"/"ไม่ถึงรอบวันนี้" ทำให้ตัวอักษรสีเข้มถูกจางลงจนคอนทราสต์ไม่พอ (พังกฎ 1.4.3)
  // เปลี่ยนมาคุมสีตัวอักษร/ไอคอนตรงๆ แทน (แยกจากรูปสินค้าที่ยังหรี่ opacity ได้ปกติ เพราะไม่ใช่ตัวอักษร)
  const nameMuted = isDone || dim;
  card.innerHTML = `
    <div class="sup-icon-wrap">
      <span class="sup-num-badge">${idx+1}</span>
      <div class="sup-icon" style="background:${isDone?'var(--bg)':(hasPhoto?'transparent':col.bg)};">
        ${hasPhoto
          ? `<img src="${s.imageUrl}" alt="" loading="lazy" style="width:100%; height:100%; object-fit:cover; opacity:${isDone?'0.55':(dim?'0.85':'1')};">`
          : `<i class="ti ${isDone?'ti-check':'ti-meat'}" style="font-size:min(11vw,48px); color:${isDone?'var(--text-secondary)':col.fg};" aria-hidden="true"></i>`}
      </div>
    </div>
    <p style="margin:0; padding:0 8px; font-size:13px; font-weight:600; color:${nameMuted?'var(--text-secondary)':'var(--text)'}; line-height:1.3;">${s.name}</p>
    ${pillHtml}
  `;
  card.setAttribute('role','button');
  card.tabIndex = 0;
  bindActivatable(card, ()=>go('supplierCheck', {currentSupplierId: s.id}));
  return card;
}

/* ============ STAFF: single-page check (all products, 2-col grid) ============ */
async function renderSupplierCheck(app){
  const sup = SUPPLIERS.find(s=>s.id===state.currentSupplierId);
  const products = PRODUCTS.filter(p=>p.supplierId===sup.id);

  const isCurrent = renderToken();
  const stopTimer = renderLoading(app, 'กำลังโหลดข้อมูลสต๊อกวันนี้...');
  // 15 ก.ย. 69: เดิมพังครั้งเดียวก็ตัดจบแสดง error ทันที (ต้องกดย้อนกลับแล้วเข้าใหม่เอง) — เปลี่ยนเป็นวนลอง
  // เงียบๆ ไม่จำกัดรอบแบบเดียวกับ bootstrap()/checkPin() แทน
  let statusList;
  for(;;){
    try{
      statusList = await getStockStatus();
      stopTimer();
      break;
    }catch(err){
      await new Promise(r=> setTimeout(r, 3000));
    }
    if(!isCurrent()){ stopTimer(); return; } // ผู้ใช้ออกจากหน้านี้ไปแล้ว — เลิกวนลอง (ดู renderToken)
  }
  // E2E-002: โหลดเสร็จหลังผู้ใช้กดย้อนกลับไปแล้ว — เดิมวาดหน้าเช็คทับหน้าปัจจุบัน แต่ state.screen ไม่ใช่
  // 'supplierCheck' ระบบเซฟอัตโนมัติตอนปัดกลับ (popstate) เลยไม่ทำงาน ข้อมูลที่กรอกหายเงียบๆ — ตอนนี้หยุดตรงนี้
  // ก่อนแตะ DOM/supplierCheckDirty/supplierCheckAutoSave ใดๆ เลย
  if(!isCurrent()) return;
  statusList.filter(s=>products.some(p=>p.id===s.productId)).forEach(s=>{
    Object.entries(s.remain||{}).forEach(([uid,val])=>{ if(val!==null) stockValues[uid]=val; });
    if(s.checked) checkedProducts.add(s.productId);
  });
  app.innerHTML = '';
  supplierCheckDirty = false; // เข้าหน้านี้ใหม่ ยังไม่มีอะไรที่แก้แล้วยังไม่ได้บันทึกรอบนี้

  // บันทึกเฉพาะสินค้าที่ติ๊ก "เช็คแล้ว" จริงๆ ของเจ้านี้ — ใช้ร่วมกันทั้งตอนกดปุ่ม "เสร็จเจ้านี้" เอง
  // และตอนออกจากหน้าแบบไม่ตั้งใจ (ปัดกลับ/ปุ่ม back) แบบอัตโนมัติด้านล่าง คืน checkedItems ถ้าสำเร็จ,
  // null ถ้าไม่มีอะไรให้บันทึก (ยังไม่ติ๊กอะไรเลย), หรือ throw error ถ้าบันทึกไม่สำเร็จ
  async function saveCheckedItems(){
    const checkedItems = products.filter(p=>checkedProducts.has(p.id));
    if(!checkedItems.length) return null;
    const items = checkedItems.flatMap(p=>p.units.map(u=>({unitId:u.id, remainQty: stockValues[u.id]||0})));
    const photos = checkedItems.filter(p=>productPhotos[p.id]).map(p=>({productId:p.id, photo:productPhotos[p.id]}));
    await apiPost('saveStock', { staffName: state.staffName, supplierId: sup.id, items, photos });
    patchStockStatusChecked(checkedItems, items);
    if(checkedItems.length === products.length){
      checkedSuppliers.add(sup.id);
      sessionCheckedSuppliers.add(sup.id);
      saveSessionChecked();
    }
    supplierCheckDirty = false;
    return checkedItems;
  }

  // ออกจากหน้านี้แบบไม่ได้ตั้งใจ (ปัดกลับ/ปุ่ม back) ระหว่างที่มีข้อมูลค้าง — เซฟให้อัตโนมัติเงียบๆ ก่อน
  // ปล่อยให้ออกจริง ไม่ต้องถามอะไรถ้าเซฟผ่าน คืน true = ออกได้ (เซฟสำเร็จ/ไม่มีอะไรต้องเซฟ), false = ควร
  // อยู่ต่อ (ผู้ใช้เลือกไม่ออกหลังเซฟไม่สำเร็จ) — ถามยืนยันเฉพาะตอนเซฟอัตโนมัติไม่สำเร็จจริงๆ (เช่นเน็ตหลุด)
  // โชว์ toast "กำลังบันทึก..." ระหว่างรอด้วย เพราะเน็ตอ่อนๆ (ไม่ถึงกับหลุด) อาจรอได้นานสุดถึง API_TIMEOUT_MS
  // (25 วิ) กว่าจะรู้ผล ถ้าไม่มีอะไรโชว์เลยจะดูเหมือนแอปค้าง
  async function autoSaveOnLeave(){
    if(!supplierCheckDirty) return true;
    const toast = document.createElement('div'); toast.className='copy-toast'; toast.setAttribute('role','status'); toast.setAttribute('aria-live','polite'); toast.textContent='กำลังบันทึก...';
    document.body.appendChild(toast);
    try{ await saveCheckedItems(); return true; }
    catch(err){ return confirm('บันทึกอัตโนมัติไม่สำเร็จ (' + friendlyErrorMessage(err) + ')\nยืนยันออกจากหน้านี้โดยไม่บันทึกใช่ไหม?'); }
    finally{ toast.remove(); }
  }
  supplierCheckAutoSave = autoSaveOnLeave; // ให้ popstate listener (นอกฟังก์ชันนี้) เรียกใช้ได้ตอนปัดกลับ

  async function guardedLeave(){
    if(await autoSaveOnLeave()) go('supplierList');
  }
  app.appendChild(topbar(sup.name, {back:guardedLeave, numBadge:SUPPLIERS.indexOf(sup)+1}));
  const c = document.createElement('div'); c.className='content';

  const grid = document.createElement('div'); grid.className='prod-grid'; grid.setAttribute('role','list');
  c.appendChild(grid);

  // UX fix (28 ก.ย. 69, จาก Focused Usability & UX Audit — UX-002): เดิมปุ่มนี้อยู่ก่อน grid สินค้าเสมอ
  // (สิ่งแรกที่เจอทุกครั้งที่เข้าเช็คของเจ้าไหนก็ตาม) ทั้งที่เป็นงานเสริม (แนบรูปสินค้า) ไม่ใช่งานหลักที่ทำ
  // ทุกวัน (กรอกจำนวน) — ย้ายไปอยู่ท้าย grid แทน ตำแหน่งเดียวที่เปลี่ยน ไม่แตะเงื่อนไข/สิทธิ์การมองเห็นเลย
  // (ยังโชว์ให้พนักงานทุกคนเห็นเหมือนเดิมทุกประการ เผื่อมีสินค้าใหม่หรืออยากอัปเดตรูปทีหลัง)
  if(!CAMERA_PER_PRODUCT_ENABLED){
    const pickBtn = document.createElement('button');
    pickBtn.className = 'btn btn-block';
    pickBtn.style.marginTop = '14px';
    pickBtn.innerHTML = '<i class="ti ti-photo-plus" style="font-size:16px; vertical-align:-3px; margin-right:6px;" aria-hidden="true"></i>เลือกรูปสินค้า (หลายไฟล์)';
    pickBtn.onclick = ()=> multiPhotoInput.click();
    c.appendChild(pickBtn);
  }

  let photoTargetPid = null;
  const photoInput = document.createElement('input');
  photoInput.type = 'file'; photoInput.accept = 'image/*';
  photoInput.setAttribute('capture', 'environment'); // ต้องใช้ setAttribute ไม่ใช่ property assignment ถึงจะบังคับเปิดกล้องตรงได้ชัวร์ทุกเบราว์เซอร์
  photoInput.style.display = 'none';
  c.appendChild(photoInput);
  photoInput.onchange = async ()=>{
    const file = photoInput.files[0];
    const pid = photoTargetPid;
    photoInput.value = '';
    if(!file || !pid) return;
    try{
      productPhotos[pid] = await compressImage(file, 800, 0.6);
    }catch(err){ alert('ถ่ายรูปไม่สำเร็จ: ' + friendlyErrorMessage(err)); }
    renderGrid();
  };

  // เลือกรูปหลายไฟล์จากเครื่อง (แทนการถ่ายทีละรูป) แล้วไปหน้าจับคู่กับสินค้า
  const multiPhotoInput = document.createElement('input');
  multiPhotoInput.type = 'file'; multiPhotoInput.accept = 'image/*'; multiPhotoInput.multiple = true;
  multiPhotoInput.style.display = 'none';
  c.appendChild(multiPhotoInput);
  multiPhotoInput.onchange = async ()=>{
    const files = Array.from(multiPhotoInput.files || []);
    multiPhotoInput.value = '';
    if(!files.length) return;
    openPhotoMatchScreen(files, products, ()=>renderGrid());
  };

  function renderGrid(){
    grid.innerHTML='';
    products.forEach((p, idx)=>{
      const isChecked = checkedProducts.has(p.id);
      const col = iconColor(idx);
      const photoSrc = productPhotos[p.id] || p.photoUrl; // p.photoUrl: persisted one-time reference photo, once backend supports it
      const isCover = ALLOW_SET_COVER_PHOTO && !!p.photoUrl && sup.imageUrl === p.photoUrl;
      const isSkipped = isProductSkippedToday(p);
      const card = document.createElement('div');
      card.className = 'prod-card' + (isChecked?' checked':'') + (isCover?' is-cover':'') + (isSkipped?' skip-today':'');
      card.setAttribute('role','listitem');
      card.innerHTML = `
        <div class="prod-photo-area${(CAMERA_PER_PRODUCT_ENABLED && (!photoSrc || ALLOW_PHOTO_RETAKE))?' no-photo':''}" data-pid="${p.id}" style="background:${photoSrc?'transparent':(isChecked?'rgba(255,255,255,0.6)':col.bg)}; cursor:${CAMERA_PER_PRODUCT_ENABLED?'pointer':'default'};">
          ${photoSrc
            ? `<img src="${photoSrc}" alt="รูปสินค้า ${escapeHtml(p.name)}" loading="lazy">`
            : `<div class="photo-inner"><div class="photo-placeholder"><i class="ti ti-photo-off" style="font-size:28px; color:${col.fg};" aria-hidden="true"></i><span>ยังไม่มีรูป</span></div></div>`}
          ${(photoSrc && ALLOW_PHOTO_RETAKE && CAMERA_PER_PRODUCT_ENABLED) ? `<div class="retake-badge"><i class="ti ti-camera" aria-hidden="true"></i></div>` : ''}
          ${ALLOW_SET_COVER_PHOTO ? `<button class="cover-toggle${isCover?' is-cover':''}" data-pid="${p.id}" ${p.photoUrl?'':'disabled'} aria-label="ตั้งเป็นรูปปกร้านนี้"><i class="ti ${isCover?'ti-heart-filled':'ti-heart'}" aria-hidden="true"></i></button>` : ''}
          <button class="check-toggle" data-pid="${p.id}" aria-label="ทำเครื่องหมายว่าเช็คแล้ว"><i class="ti ${isChecked?'ti-circle-check-filled':'ti-circle'}" aria-hidden="true"></i></button>
        </div>
        ${isSkipped ? `<span class="skip-today-badge">🚫 งดสั่งวันนี้</span>` : ''}
        <p class="prod-card-name">${escapeHtml(p.name)}</p>
        ${isCover ? `<p class="cover-tag"><i class="ti ti-heart-filled" style="font-size:10px; vertical-align:-1px;" aria-hidden="true"></i> รูปปกร้านนี้</p>` : ''}
        <div class="unit-steppers-row">
          ${p.units.map(u=>`
            <div class="unit-stepper">
              <button class="step-btn minus" data-unit="${u.id}" ${isSkipped?'disabled':''}>−</button>
              <input type="text" inputmode="numeric" pattern="[0-9]*" class="step-input" data-unit="${u.id}" value="${stockValues[u.id]||0}" min="0" ${isSkipped?'disabled':''}>
              <button class="step-btn plus" data-unit="${u.id}" ${isSkipped?'disabled':''}>+</button>
              <span class="unit-tag${canEditUnitLabel()?' unit-tag-editable':''}" ${canEditUnitLabel()?`data-unit-edit="${u.id}" role="button" tabindex="0" aria-label="แก้ชื่อหน่วย ${escapeHtml(u.label)}"`:''}>${escapeHtml(u.label)}${canEditUnitLabel()?' <i class="ti ti-pencil" aria-hidden="true"></i>':''}</span>
            </div>
          `).join('')}
        </div>
        <button class="oos-btn" data-pid="${p.id}" data-units="${p.units.map(u=>u.id).join(',')}" ${isSkipped?'disabled':''}>🚫 ของหมด</button>
      `;
      grid.appendChild(card);
    });

    if(canAddProduct()){
      const addCard = document.createElement('div');
      addCard.className = 'add-prod-card';
      addCard.setAttribute('role','button');
      addCard.tabIndex = 0;
      addCard.innerHTML = '<i class="ti ti-plus" style="font-size:26px;" aria-hidden="true"></i><span>เพิ่มสินค้าใหม่</span>';
      bindActivatable(addCard, ()=> openAddProductScreen(sup, (newProduct)=>{
        products.push(newProduct);
        PRODUCTS.push(newProduct);
        renderGrid(); updateBar();
      }));
      grid.appendChild(addCard);
    }

    grid.querySelectorAll('.check-toggle').forEach(btn=>{
      btn.onclick = (e)=>{
        e.stopPropagation();
        const pid = btn.dataset.pid;
        supplierCheckDirty = true;
        if(checkedProducts.has(pid)) checkedProducts.delete(pid); else checkedProducts.add(pid);
        // แต่ก่อนรื้อสร้างการ์ดสินค้าทั้งหน้าใหม่ (renderGrid()) แค่เพราะติ๊ก/ถอนติ๊กสินค้าตัวเดียว — แก้แค่
        // การ์ดนั้นในจุดที่สถานะ "เช็คแล้ว" มีผลจริง (ไอคอนวงกลม, พื้นหลังรูป, คลาส .checked ของการ์ด)
        const isNowChecked = checkedProducts.has(pid);
        const card = btn.closest('.prod-card');
        if(card){
          card.classList.toggle('checked', isNowChecked);
          const icon = btn.querySelector('i');
          if(icon){ icon.classList.toggle('ti-circle', !isNowChecked); icon.classList.toggle('ti-circle-check-filled', isNowChecked); }
          const photoArea = card.querySelector('.prod-photo-area');
          if(photoArea && !photoArea.querySelector('img')){
            const idx = products.findIndex(x=>x.id===pid);
            const col = iconColor(idx);
            photoArea.style.background = isNowChecked ? 'rgba(255,255,255,0.6)' : col.bg;
          }
        }
        updateBar();
      };
    });
    if(ALLOW_SET_COVER_PHOTO){
      grid.querySelectorAll('.cover-toggle').forEach(btn=>{
        btn.onclick = async (e)=>{
          e.stopPropagation();
          if(btn.disabled) return;
          const pid = btn.dataset.pid;
          const p = products.find(x=>x.id===pid);
          if(!p || !p.photoUrl) return;
          btn.disabled = true;
          try{
            await apiPost('setSupplierCoverPhoto', { supplierId: sup.id, photoUrl: p.photoUrl }, true);
            sup.imageUrl = p.photoUrl; // อัปเดตให้เห็นผลทันทีในเครื่อง
            renderGrid();
          }catch(err){
            btn.disabled = false;
            alert('ตั้งรูปปกไม่สำเร็จ: ' + friendlyErrorMessage(err));
          }
        };
      });
    }
    if(canEditUnitLabel()){
      grid.querySelectorAll('.unit-tag-editable').forEach(tag=>{
        bindActivatable(tag, async (e)=>{
          e.stopPropagation();
          const uid = tag.dataset.unitEdit;
          const p = products.find(x=>x.units.some(u=>u.id===uid));
          const u = p?.units.find(u=>u.id===uid);
          if(!u) return;
          const newLabel = prompt('แก้ชื่อหน่วยของ "' + p.name + '"', u.label);
          if(newLabel===null) return; // ยกเลิก
          const trimmed = newLabel.trim();
          if(!trimmed || trimmed===u.label) return;
          const oldLabel = u.label;
          u.label = trimmed; // อัปเดตให้เห็นผลทันทีในเครื่อง
          renderGrid();
          try{
            await apiPost('setUnitLabel', { unitId: uid, label: trimmed, staffName: state.staffName }, true);
          }catch(err){
            u.label = oldLabel;
            renderGrid();
            alert('แก้ชื่อหน่วยไม่สำเร็จ: ' + friendlyErrorMessage(err));
          }
        });
      });
    }
    if(CAMERA_PER_PRODUCT_ENABLED){
      grid.querySelectorAll('.prod-photo-area.no-photo').forEach(area=>{
        area.onclick = ()=>{ photoTargetPid = area.dataset.pid; photoInput.click(); };
      });
    }
    // แตะช่องกรอก/กด +/- ของสินค้าไหน ถือว่าลูกจ้าง "เช็คแล้ว" สินค้าตัวนั้นทันที
    // ไม่ต้องกดวงกลม ✓ แยกอีกขั้น กันลืมกรอกแล้วข้อมูลไม่ถูกบันทึกตอนกด "เสร็จเจ้านี้"
    function markCardChecked(uid){
      supplierCheckDirty = true; // เรียกจากปุ่ม +/- ช่องกรอก และปุ่ม "ของหมด" — ทุกจุดที่แก้ stockValues จริง
      const card = grid.querySelector(`[data-unit="${uid}"]`)?.closest('.prod-card');
      if(!card) return;
      const pid = card.querySelector('.check-toggle')?.dataset.pid;
      if(!pid || checkedProducts.has(pid)) return;
      checkedProducts.add(pid);
      card.classList.add('checked');
      const icon = card.querySelector('.check-toggle i');
      if(icon){ icon.classList.remove('ti-circle'); icon.classList.add('ti-circle-check-filled'); }
      // เหมือน patch ใน .check-toggle onclick ด้านล่าง — พื้นหลังช่องรูป (กรณียังไม่มีรูป) ต้องเปลี่ยนเป็น
      // สีเช็คแล้วทันทีตรงนี้ด้วย ไม่งั้นจะไม่ตรงกับตอนกดวงกลม ✓ ตรงๆ (ค้างสีเดิมจนกว่าจะรีเฟรชทั้งหน้า)
      const photoArea = card.querySelector('.prod-photo-area');
      if(photoArea && !photoArea.querySelector('img')) photoArea.style.background = 'rgba(255,255,255,0.6)';
      updateBar();
    }
    grid.querySelectorAll('.minus, .plus').forEach(btn=>{
      btn.onclick = ()=>{
        const uid = btn.dataset.unit;
        const input = grid.querySelector(`.step-input[data-unit="${uid}"]`);
        let v = parseInt(input.value||0,10);
        v = btn.classList.contains('plus') ? v+1 : Math.max(0,v-1);
        input.value = v; stockValues[uid] = v;
        markCardChecked(uid);
      };
    });
    grid.querySelectorAll('.step-input').forEach(inp=>{
      inp.oninput = ()=>{
        stockValues[inp.dataset.unit] = Math.max(0, parseInt(inp.value||0,10));
        markCardChecked(inp.dataset.unit);
      };
    });
    // ปุ่มลัด "ของหมด" — ตั้งทุกหน่วยของสินค้านั้นเป็น 0 ให้ทันที (ไม่ต้องกด − ทีละหน่วย) แล้วนับว่า
    // เช็คแล้ว ไม่มีปุ่มยกเลิกแยกต่างหาก เพราะ "หมด" ไม่ใช่ flag พิเศษ แค่หมายถึง "เช็คแล้ว + คงเหลือ 0"
    // เหมือนกัน ถ้าลูกจ้างกด + เพิ่มจำนวนทีหลัง (เช่นไปเจอของในตู้เย็น) ตัวเลขก็จะโชว์แทน "หมด" เองอัตโนมัติ
    // ฝั่งเจ้าของ เพราะเป็นการอ่านค่าจำนวนจริง ไม่ได้เก็บสถานะ "เคยกดของหมด" ไว้แยก
    grid.querySelectorAll('.oos-btn').forEach(btn=>{
      btn.onclick = ()=>{
        const unitIds = btn.dataset.units.split(',');
        unitIds.forEach(uid=>{
          const input = grid.querySelector(`.step-input[data-unit="${uid}"]`);
          if(input) input.value = 0;
          stockValues[uid] = 0;
        });
        markCardChecked(unitIds[0]);
      };
    });
  }
  renderGrid();

  // skipDates เป็นค่าที่เจ้าของอาจตั้งขึ้นกะทันหันระหว่างวัน (เช่น เพิ่งกดงดสั่งเมื่อครู่นี้) ต่างจาก
  // ข้อมูลอื่นใน PRODUCTS/SUPPLIERS ที่แทบไม่เปลี่ยนบ่อย — ถ้าลูกจ้างเปิดหน้านี้ค้างมาตั้งแต่ก่อนเจ้าของ
  // จะกด PRODUCTS ที่โหลดมาตอน bootstrap() ครั้งแรกจะไม่รู้เรื่อง จึงรีเฟรช bootstrap เงียบๆ (แต่จำกัดความถี่
  // ด้วย refreshBootstrapIfStale กันยิง request ซ้ำถี่เกินไปตอนสลับดูหลายเจ้าติดๆ กัน ไปเพิ่มภาระ
  // Apps Script ที่ตอบช้าอยู่แล้วโดยไม่จำเป็น) แล้วอัปเดต products/แสดงผลใหม่ถ้าพบว่าเปลี่ยนไป
  refreshBootstrapIfStale(()=>{
    products.length = 0;
    products.push(...PRODUCTS.filter(p=>p.supplierId===sup.id));
    renderGrid();
  });

  const bar = document.createElement('div'); bar.className='stickybar';
  c.appendChild(bar);
  function updateBar(){
    const doneCount = products.filter(p=>checkedProducts.has(p.id)).length;
    bar.innerHTML = `<span><i class="ti ti-list-check" style="font-size:13px; vertical-align:-2px; margin-right:5px;"></i>เช็คแล้ว ${doneCount} จาก ${products.length} รายการ</span>
      <button class="btn-primary btn" id="finishSup">เสร็จเจ้านี้</button>`;
    bar.querySelector('#finishSup').onclick = async ()=>{
      const btn = bar.querySelector('#finishSup');
      btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
      try{
        const checkedItems = await saveCheckedItems();
        if(!checkedItems){
          btn.disabled = false; btn.textContent = 'เสร็จเจ้านี้';
          alert('ยังไม่ได้ติ๊กว่าเช็คสินค้าตัวไหนเลย');
          return;
        }
        go('staffDone');
      }catch(err){
        btn.disabled = false; btn.textContent = 'เสร็จเจ้านี้';
        alert('บันทึกไม่สำเร็จ: ' + friendlyErrorMessage(err));
      }
    };
  }
  updateBar();

  app.appendChild(c);
}

function renderStaffDone(app){
  app.appendChild(topbar('เช็คสต๊อกเสร็จแล้ว'));
  const c = document.createElement('div'); c.className='content';
  const total = SUPPLIERS.length; const doneN = checkedSuppliers.size;

function renderOwnerPin(app){
  app.appendChild(topbar('ใส่รหัสฝั่งเจ้าของร้าน', {back:()=>go('home')}));
  const c = document.createElement('div'); c.className='content';
  c.innerHTML = `
    <p style="font-size:13px; color:var(--text-secondary); margin:0 0 16px;">กรอกรหัสผ่านเพื่อเข้าฝั่งเจ้าของร้าน</p>
    <input type="password" inputmode="numeric" id="pinInput" maxlength="4" placeholder="••••" style="font-size:22px; text-align:center; letter-spacing:6px; padding:14px;">
    <p id="pinError" style="color:var(--danger); font-size:12px; margin:8px 0 0; min-height:16px; text-align:center;"></p>
    <p id="pinTimer" style="color:var(--text-secondary); font-size:11px; margin:2px 0 0; text-align:center;"></p>
  `;
  app.appendChild(c);
  const input = c.querySelector('#pinInput');
  const errEl = c.querySelector('#pinError');
  const timerEl = c.querySelector('#pinTimer');
  input.focus();

  const isCurrent = renderToken();
  let checking = false;
  async function trySubmit(){
    if(checking) return;
    const val = input.value.trim();
    if(val.length < 4) return;
    checking = true;
    input.disabled = true; errEl.textContent = 'กำลังตรวจสอบ...'; errEl.style.color = 'var(--text-secondary)';
    const stopTimer = attachLoadingTimer(timerEl);
    // เจอจริง 15 ก.ย. 69: เดิม catch แล้วโชว์ error ทันที ("ตรวจสอบรหัสไม่สำเร็จ: หมดเวลาเชื่อมต่อ...") ทั้งที่
    // backend มักสำเร็จจริงแค่ช้ากว่าที่แอปยอมรอ (เหตุผลเดียวกับที่แก้ bootstrap() ไปแล้ว) — error จาก
    // apiGet('checkPin') ที่นี่มีแต่กรณีเชื่อมต่อไม่สำเร็จเท่านั้น (รหัสผิดไม่ throw error แต่คืน valid:false
    // แยกต่างหากอยู่แล้ว) จึงปลอดภัยที่จะวนลองใหม่เงียบๆ ไม่จำกัดรอบเหมือนกัน
    for(;;){
      try{
        const res = await apiGet('checkPin', {pin: val});
        stopTimer();
        // ผู้ใช้กดย้อนกลับออกจากหน้า PIN ระหว่างรอไปแล้ว — ห้ามพาเข้าเมนูเจ้าของเองทั้งที่เขาไม่ได้อยู่หน้านี้แล้ว
        if(!isCurrent()) return;
        if(res && res.valid){ go('ownerMenu'); return; }
        errEl.textContent = 'รหัสไม่ถูกต้อง ลองใหม่อีกครั้ง'; errEl.style.color = 'var(--danger)';
        input.value='';
        break;
      }catch(err){
        await new Promise(r=> setTimeout(r, 3000));
        if(!isCurrent()){ stopTimer(); return; } // ออกจากหน้า PIN ไปแล้ว — เลิกวนลอง
      }
    }
    checking = false; input.disabled = false; input.focus();
  }
  input.addEventListener('input', trySubmit);
}
