// E2E fix (1 ต.ค. 69, จาก Final E2E Audit — E2E-004): เดิมคำนวณจาก stockValues ล้วนๆ สินค้าที่วันนี้ยังไม่มีใครเช็ค
// (ไม่มีค่าใน stockValues) เลยกลายเป็น 0 → นับเป็น "หมด" ตัวเลขเกินจริง และไม่ตรงกับหน้าสั่งของที่โชว์ "–" — ตอนนี้ใช้
// statusList (ผล stockStatus ชุดเดียวกับหน้าสั่งของ: checked = มีข้อมูลเช็ควันนี้ครบทุกหน่วย) แยก 4 สถานะ:
//   have/oos = เช็คแล้ว (oos = เหลือ 0 ทุกหน่วย) · skip = ยังไม่เช็คแต่เจ้าของตั้งงดวันนี้ไว้ · unchecked = ยังไม่เช็ค
// สินค้าที่งดแต่มีคนเช็คมาแล้วยังโชว์ยอดจริงตามข้อมูล (ไม่ซ่อนเป็น "งดวันนี้") — ไม่มีคำขอเพิ่ม ใช้ข้อมูลที่โหลดมาแล้ว
function renderStockTab(body, statusList){
  const statusById = {};
  (statusList || []).forEach(s=>{ statusById[s.productId] = s; });
  const allProducts = PRODUCTS.map(p=>{
    const st = statusById[p.id];
    const checked = !!(st && st.checked);
    let state, total = 0;
    if(checked){
      total = p.units.reduce((sum,u)=> sum + (Number(st.remain && st.remain[u.id]) || 0), 0);
      state = total === 0 ? 'oos' : 'have';
    } else {
      state = isProductSkippedToday(p) ? 'skip' : 'unchecked';
    }
    return {...p, st, state};
  });
  const count = k=> allProducts.filter(p=> p.state === k).length;
  const total = allProducts.length, have = count('have'), oos = count('oos'), unchecked = count('unchecked'), skip = count('skip');

  body.innerHTML = `<div class="metric-grid cols-4">
      <div class="metric"><p>ทั้งหมด</p><p>${total}</p></div>
      <div class="metric" style="background:var(--green-bg);"><p style="color:var(--green);">ยังมี</p><p style="color:var(--green);">${have}</p></div>
      <div class="metric" style="background:var(--amber-bg);"><p style="color:var(--amber);">หมด</p><p style="color:var(--amber);">${oos}</p></div>
      <div class="metric"><p>ยังไม่เช็ค</p><p style="color:var(--text-secondary);">${unchecked}</p></div>
    </div>
    ${skip ? `<p class="stock-skip-line"><span aria-hidden="true">🚫</span><span>งดสั่งวันนี้ ${skip} รายการ (ไม่นับเป็นหมด/ยังไม่เช็ค)</span></p>` : ''}
    <input type="text" id="search" placeholder="ค้นหาชื่อสินค้า" style="margin-bottom:10px;">
    <div id="tableWrap"></div>`;
  const tableWrap = body.querySelector('#tableWrap');

  function remainCell(p){
    if(p.state === 'skip' || p.state === 'unchecked') return '–';
    return p.units.map(u=>`${Number(p.st.remain && p.st.remain[u.id]) || 0} ${escapeHtml(u.label)}`).join(' / ');
  }
  function stateCell(p){
    if(p.state === 'oos') return '<span class="badge" style="background:var(--amber-mid); color:#412402;">หมด</span>';
    if(p.state === 'unchecked') return '<span class="badge badge-unchecked">ยังไม่เช็ค</span>';
    if(p.state === 'skip') return '<span class="badge badge-skip">🚫 งดวันนี้</span>';
    return '<span style="color:var(--text-secondary); font-size:12px;">ยังมี</span>';
  }
  function renderTable(filter){
    tableWrap.innerHTML='';
    SUPPLIERS.forEach(s=>{
      const items = allProducts.filter(p=>p.supplierId===s.id && p.name.includes(filter||''));
      if(!items.length) return;
      const col = NEUTRAL_COL;
      const head = document.createElement('h2'); head.className='sup-header';
      head.style.background = col.bg; head.style.color = col.text; head.style.borderColor = col.text;
      head.innerHTML = `<span>${s.name}</span>`;
      tableWrap.appendChild(head);
      const tbl = document.createElement('table'); tbl.style.width='100%'; tbl.style.fontSize='13px'; tbl.style.marginBottom='10px';
      tbl.innerHTML = items.map(p=>`<tr style="border-bottom:1px solid var(--border);">
          <td style="padding:7px 4px;">${escapeHtml(p.name)}</td>
          <td style="padding:7px 4px; text-align:right;">${remainCell(p)}</td>
          <td style="padding:7px 4px; text-align:right; white-space:nowrap;">${stateCell(p)}</td>
        </tr>`).join('');
      tableWrap.appendChild(tbl);
    });
  }
  renderTable('');
  body.querySelector('#search').oninput = debounce((e)=>renderTable(e.target.value), 250);
}

// E2E fix (1 ต.ค. 69, จาก Final E2E Audit — E2E-012): เดิมแท็บ "30 วัน"/"กำหนดเอง" เป็นแค่ <div> กดแล้วไม่มีอะไรเกิดขึ้น
// และมีกราฟแนวโน้มที่เป็นตัวเลขสมมติ — Code.gs getAnalytics(range) รองรับ '7d'/'30d' อยู่แล้ว ต่อให้ใช้ได้จริงผ่าน
// getAnalyticsCached() (แคชแยกตามช่วง สลับไปมาภายใน TTL ไม่ยิงคำขอซ้ำ) ซ่อน "กำหนดเอง" (backend ไม่รองรับ) และกราฟสมมติ
let _analyticsRangeReq = 0; // กดสลับแท็บเร็วๆ หลายครั้ง — ให้ผลของคำขอล่าสุดเท่านั้นที่ได้วาด
function renderAnalyticsTab(body, analytics, range){
  range = range === '30d' ? '30d' : '7d';
  const days = range === '30d' ? 30 : 7;
  const rows = (analytics?.topProducts||[]).slice(0,5);
  body.innerHTML = `
    <div class="tabs" role="tablist" aria-label="ช่วงเวลา">
      <button type="button" class="tab${range==='7d'?' active':''}" role="tab" aria-selected="${range==='7d'}" data-range="7d">7 วัน</button>
      <button type="button" class="tab${range==='30d'?' active':''}" role="tab" aria-selected="${range==='30d'}" data-range="30d">30 วัน</button>
    </div>
    <div style="background:#fff; border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px; margin-bottom:12px;">
      <h2 style="font-weight:600; font-size:13px; margin:0 0 8px;">สั่งบ่อยที่สุด (${days} วันล่าสุด)</h2>
      <table style="width:100%; font-size:13px;">
        <thead><tr><th style="text-align:left; font-weight:600;">สินค้า</th><th style="text-align:right; font-weight:600;">จำนวนที่สั่ง</th></tr></thead>
        <tbody id="analyticsRows">
        ${rows.length ? rows.map(r=>`<tr><td>${escapeHtml(r.name)}</td><td style="text-align:right;">${escapeHtml(r.total)}</td></tr>`).join('')
                      : '<tr><td colspan="2" style="color:var(--text-secondary);">ยังไม่มีข้อมูลสั่งของในช่วงนี้</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
  body.querySelectorAll('[data-range]').forEach(btn=>{
    btn.onclick = async ()=>{
      const next = btn.dataset.range;
      if(next === range) return;
      const req = ++_analyticsRangeReq;
      body.querySelectorAll('[data-range]').forEach(b=>{ const on = b===btn; b.classList.toggle('active', on); b.setAttribute('aria-selected', String(on)); });
      const tbody = body.querySelector('#analyticsRows');
      if(tbody) tbody.innerHTML = '<tr><td colspan="2" style="color:var(--text-secondary);">กำลังโหลด...</td></tr>';
      try{
        const data = await getAnalyticsCached(next);
        if(req !== _analyticsRangeReq || !body.isConnected) return; // มีการกดแท็บอื่นต่อ หรือออกจากหน้าไปแล้ว
        renderAnalyticsTab(body, data, next);
      }catch(err){
        if(req !== _analyticsRangeReq || !body.isConnected) return;
        renderAnalyticsTab(body, analytics, range); // คืนแท็บเดิมที่มีข้อมูลอยู่แล้ว
        alert('โหลดข้อมูล ' + (next==='30d'?'30':'7') + ' วันไม่สำเร็จ: ' + friendlyErrorMessage(err));
      }
    };
  });
}

/* ============ OWNER: Order page (accordion, grouped by supplier) ============ */
async function renderOrderPage(app){
  app.appendChild(topbar('สั่งของ', {back:()=>go('ownerMenu')}));
  const c = document.createElement('div'); c.className='content';
  const lt = loadingTimerHtml();
  c.innerHTML = `<p class="empty-state">กำลังโหลดข้อมูล...</p>${lt.html}`;
  app.appendChild(c);
  const stopTimer = attachLoadingTimer(document.getElementById(lt.id));

  // เดิมยิง 4 คำขอแยก (getStockStatus + orderedToday + confirmedToday + orderedItemsToday) พร้อมกันด้วย
  // Promise.all — เจอ 10 ก.ย. 69 ว่าคำขอที่ควรพร้อมกันเป๊ะกลับมี Start Time ห่างกันหลายวินาทีใน Apps
  // Script Executions log (สัญญาณคิว/serialize ฝั่ง backend) รวมเป็น action เดียว (orderPageData) แทน
  // ตัดจำนวนคำขอพร้อมกันต่อการเปิดหน้านี้ 1 ครั้งจาก 4 เหลือ 1
  //
  // (เคยลองเพิ่ม prefetch ยิง orderPageData ล่วงหน้าตั้งแต่หน้าเมนูเจ้าของ แต่ถอนออกแล้ว — ยิงทุกครั้งที่
  // เข้าเมนูไม่ว่าจะกด "สั่งของ" ต่อจริงหรือไม่ กลายเป็นคำขอเปล่าประโยชน์ที่แย่งคิว/โควต้า Apps Script กับ
  // คำขอจริงของหน้าอื่นที่เจ้าของกดไปแทน เช่น "สต๊อก & วิเคราะห์"/"บิลรอตรวจสอบ" — แลกไม่คุ้ม)
  //
  // เจอเพิ่ม 10 ก.ย. 69 (ต่อ): แค่รวมเป็น 1 คำขอยังไม่พอ — หน้านี้ถูกเข้าออกซ้ำๆ บ่อยมากระหว่างสั่งของ
  // หลายเจ้าในรอบเดียว (ดู ensureOrderPageData ด้านบนสำหรับรายละเอียดเต็ม) ใช้ cache TTL แทนการยิงคำขอใหม่
  // ทุกครั้งที่กลับมาหน้านี้
  // 15 ก.ย. 69: เดิมพังครั้งเดียวก็ตัดจบแสดง error ทันที — เปลี่ยนเป็นวนลองเงียบๆ ไม่จำกัดรอบแบบเดียวกับ
  // bootstrap()/checkPin() แทน
  const isCurrent = renderToken();
  for(;;){
    try{
      await ensureOrderPageData();
      stopTimer();
      break;
    }catch(err){
      await new Promise(r=> setTimeout(r, 3000));
    }
    if(!isCurrent()){ stopTimer(); return; } // ผู้ใช้ออกจากหน้านี้ไปแล้ว — เลิกวนลอง (ดู renderToken)
  }
  if(!isCurrent()) return; // ข้อมูลถูกเก็บลงแคชแล้ว (ensureOrderPageData) แต่ไม่ต้องสร้างหน้าที่ไม่มีใครดู
  const statusList = stockStatusCache;
  const statusByEntry = {}; statusList.forEach(s=> statusByEntry[s.productId] = s);
  const statusByProduct = {}; statusList.forEach(s=> statusByProduct[s.productId] = s.checked);
  // จัดกลุ่มสินค้าตาม supplierId ไว้ล่วงหน้าครั้งเดียว แทนการวน PRODUCTS.filter(p=>p.supplierId===s.id)
  // ทั้งอาเรย์ซ้ำๆ ทุกเจ้า ทุกครั้งที่ renderGroups()/supplierStats() ถูกเรียก (เช่น ทุกครั้งที่พิมพ์ค้นหา) —
  // PRODUCTS ไม่เปลี่ยนระหว่างที่อยู่หน้านี้ เลย cache แค่ครั้งเดียวพอ
  const productsBySupplier = new Map();
  function indexProducts(){
    productsBySupplier.clear();
    PRODUCTS.forEach(p=>{
      if(!productsBySupplier.has(p.supplierId)) productsBySupplier.set(p.supplierId, []);
      productsBySupplier.get(p.supplierId).push(p);
    });
  }
  indexProducts();
  function productsOf(supplierId){ return productsBySupplier.get(supplierId) || []; }

  c.innerHTML = `<div id="stats" class="stat-strip"></div>
    <p class="confirm-hint" role="note">แตะ <b>✓</b> เมื่อส่งออเดอร์จริงแล้ว <span class="dim">(ไม่ใช่แค่สร้างข้อความ)</span></p>
    <div style="display:flex; gap:8px; margin-bottom:12px;">
      <input type="text" id="search" placeholder="ค้นหาชื่อสินค้าหรือชื่อเจ้า" style="flex:1;">
    </div>
    <div id="groups"></div>`;
  const statsEl = c.querySelector('#stats');
  const groups = c.querySelector('#groups');

  const expandedSuppliers = new Set();

  function supplierStats(s){
    const items = productsOf(s.id);
    const checkedCount = items.filter(p=>statusByProduct[p.id]).length;
    const isOrdered = items.some(p=> orderedProductIds.has(p.id));
    const isConfirmed = confirmedSupplierIds.has(s.id);
    return { items, checkedCount, isOrdered, isConfirmed };
  }

  function renderStats(){
    const withItems = SUPPLIERS.filter(s=> productsOf(s.id).length > 0);
    let checkedSuppliers = 0, orderedSuppliers = 0, confirmedSuppliers = 0;
    withItems.forEach(s=>{
      const { items, checkedCount, isOrdered, isConfirmed } = supplierStats(s);
      const fullyChecked = items.length > 0 && checkedCount === items.length;
      if(fullyChecked) checkedSuppliers++;
      if(isOrdered) orderedSuppliers++;
      if(isConfirmed) confirmedSuppliers++;
    });
    statsEl.innerHTML = `
      <div class="stat-card"><div class="n">${withItems.length}</div><div class="lbl">เจ้าทั้งหมด</div></div>
      <div class="stat-card green"><div class="n">${checkedSuppliers}</div><div class="lbl">เช็คสต๊อกแล้ว</div></div>
      <div class="stat-card amber"><div class="n">${orderedSuppliers}</div><div class="lbl">สร้างข้อความแล้ว</div></div>
      <div class="stat-card amber"><div class="n">${confirmedSuppliers}</div><div class="lbl">ส่งออเดอร์แล้ว</div></div>
    `;
  }

  // สร้างการ์ดของเจ้าเดียว (ใช้ทั้งตอน render ทั้งหน้าใน renderGroups() และตอน rebuildCard() แพตช์เจ้าเดียว)
  // คืน null ถ้าเจ้านี้ไม่มีสินค้า หรือสินค้าทั้งหมดถูกกรองออกด้วยคำค้นหา (filter)
  function buildSupplierCard(s, filter){
    const allItems = productsOf(s.id);
    if(!allItems.length) return null;
    const items = allItems.filter(p=>p.name.includes(filter||'') || s.name.includes(filter||''));
    if(!items.length) return null;
    const stockupNote = supplierStockupNote(s);

    const { checkedCount, isOrdered, isConfirmed } = supplierStats(s);
    const fullyChecked = allItems.length > 0 && checkedCount === allItems.length;
    const open = expandedSuppliers.has(s.id);

    // เดิมบังคับให้เช็คสต๊อกครบทุกรายการก่อนถึงจะขึ้นสถานะ "สั่งแล้ว" — แต่ในทางปฏิบัติ
    // บางเจ้ามีของหลายสิบรายการ แต่วันนี้อยากสั่งแค่ 1-2 อย่างโดยไม่ต้องไล่เช็คสต๊อกทั้งหมด
    // จึงตัดเงื่อนไข fullyChecked ออก ขอแค่มีการสร้างข้อความสั่งของไปแล้วก็พอ (isOrdered)
    const orderDone = isOrdered;
    // Single combined status per supplier — one line, one color, states an action
    // rather than two badges (stock-check count vs order status) that read as unrelated.
    // นับตามจำนวนสินค้าที่ลูกจ้างกดติ๊กว่าเช็คแล้วจริงๆ เท่านั้น — สินค้าที่ลูกจ้างเช็คแล้วแต่ไม่มีของ
    // (กรอกคงเหลือเป็น 0) ก็นับว่า "เช็คแล้ว" เหมือนกัน เพราะติ๊กผ่านการเช็คสต๊อกไปแล้วจริง
    const checkedRatio = `${checkedCount}/${allItems.length}`;
    let stateClass, statusText, subText;
    if(orderDone){ stateClass='ordered'; statusText='✓ สั่งของแล้ววันนี้'; subText=`เช็คสต๊อกแล้ว ${checkedRatio} รายการ`; }
    else if(checkedCount === 0){ stateClass='wait'; statusText='⏳ รอเช็คสต๊อก'; subText=`ลูกจ้างยังไม่เริ่มเช็ค (${checkedRatio} รายการ)`; }
    else if(!fullyChecked){ stateClass='partial'; statusText='⏳ เช็คสต๊อกค้างอยู่'; subText=`เช็คแล้ว ${checkedRatio} รายการ`; }
    else{ stateClass='wait'; statusText='✓ เช็คสต๊อกครบแล้ว'; subText=`พร้อมเลือกรายการที่จะสั่ง (${checkedRatio})`; }

    // จำนวนรายการที่เจ้าของกดเลือกจะสั่งจริง (orderQty > 0) — นับจากที่กรอกเองล้วนๆ
    // ไม่เกี่ยวกับคงเหลือ/เช็คสต๊อก เพื่อไม่ให้ปนกับความไม่แน่นอนว่า "คงเหลือ 0" หมายถึงหมดจริงหรือลูกจ้างข้าม
    const baseSubText = subText;
    function countSelected(){ return allItems.filter(p=> (state.orderQty[p.id] ?? 0) > 0).length; }
    function selectedSuffix(){ const n = countSelected(); return n > 0 ? ` · เลือกไว้ ${n} รายการ` : ''; }
    subText = baseSubText + selectedSuffix();

    // data-supplier-card ใช้ให้ rebuildCard() หาการ์ดเดิมใน DOM มาแทนที่ด้วยตัวใหม่ตรงตำแหน่งเดิม
    const card = document.createElement('div'); card.className = 'ord-card state-' + stateClass + (open?' open':'');
    card.dataset.supplierCard = s.id;
    card.setAttribute('role','listitem');
    const strip = document.createElement('div'); strip.className = 'ord-card-strip';
    card.appendChild(strip);
    const main = document.createElement('div'); main.className = 'ord-card-main';

    const head = document.createElement('div'); head.className = 'ord-card-head';
    head.innerHTML = `
      <i class="ti ti-chevron-down chev"></i>
      <button type="button" class="order-done-check${isConfirmed?' confirmed':''}" title="กดเมื่อส่งออเดอร์ให้ร้านนี้แล้วจริง" aria-label="กดเมื่อส่งออเดอร์ให้ร้าน ${s.name} แล้วจริง" aria-pressed="${isConfirmed}">${isConfirmed?'✓':''}</button>
      <span class="order-confirmed-label"${isConfirmed?'':' hidden'}>ส่งแล้ว</span>
      <span class="ord-card-name">${s.name}</span>
      <div class="ord-card-status">
        <div class="status-top-row">
          ${stockupNote ? `<span class="stockup-tag">${stockupNote}</span>` : ''}
          <span class="status-line ${stateClass}">${statusText}</span>
        </div>
        <span class="status-sub">${subText}</span>
      </div>
    `;
    head.setAttribute('role','button');
    head.tabIndex = 0;
    head.setAttribute('aria-expanded', open ? 'true' : 'false');
    head.onclick = ()=>{
      if(expandedSuppliers.has(s.id)) expandedSuppliers.delete(s.id); else expandedSuppliers.add(s.id);
      rebuildCard(s);
      // rebuildCard() ทำ oldCard.replaceWith(newCard) — head เดิมที่เพิ่งรับ focus ไปหลุดออกจาก DOM
      // ทันที โฟกัสจะร่วงกลับไปที่ <body> เงียบๆ ถ้าไม่ดึงกลับ (เจอจริงตอนทดสอบ: กด Enter ครั้งที่สอง
      // เพื่อยุบกลับใช้ไม่ได้เลยเพราะไม่มีอะไรโฟกัสอยู่แล้ว) ดึง focus กลับมาที่ head ใบใหม่ในตำแหน่งเดิม
      // ทำเฉพาะจุดนี้จุดเดียว ไม่แก้ rebuildCard() เองเพราะมีอีก 4 จุดเรียกจากปุ่มอื่นในการ์ด
      // (เลือกทั้งหมด/งดสั่ง/แก้หน่วย) ที่ไม่ควรถูกแย่ง focus กลับมาที่ header
      const newHead = groups.querySelector(`[data-supplier-card="${s.id}"] .ord-card-head`);
      if(newHead) newHead.focus();
    };
    // ไม่ใช้ bindActivatable() ตรงๆ เพราะมี .order-done-check ซ้อนอยู่ข้างในอีกที (ดูด้านล่าง) —
    // keydown ของปุ่มนั้นจะ bubble ขึ้นมาถึง head ด้วย เช็ค e.target===head กันไม่ให้กด Enter/Space
    // ตอนโฟกัสอยู่ที่ปุ่มยืนยันไป toggle accordion ซ้อนกับที่ปุ่มนั้นทำงานของตัวเองอยู่แล้ว
    head.onkeydown = (e)=>{
      if(e.target !== head) return;
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); head.click(); }
    };
    main.appendChild(head);

    // วงกลม "✓" หน้าชื่อเจ้า — โผล่ทุกเจ้าเสมอ (ไม่ผูกกับ orderDone อีกต่อไป) เพราะบางทีเจ้าของ
    // สั่งของเองนอกแอปโดยไม่ผ่านการสร้างข้อความในระบบเลย ก็ยังต้องกดยืนยันว่าสั่งไปแล้วได้
    // ใช้เป็นปุ่มกดยืนยันด้วยมือว่า "ส่งออเดอร์ให้ร้านจริงแล้ว": วงว่าง = ยังไม่ได้ส่ง, วงเขียวมี ✓ = ส่งแล้ว
    // แยกจากสถานะ "สร้างข้อความแล้ว" (statusText ด้านขวา) ซึ่งแค่บอกว่าแอปบันทึกคำสั่งซื้อให้เท่านั้น
    // ไม่ได้รู้ว่าข้อความถูกส่งออกไปหา supplier จริงหรือยัง
    const confirmBtn = head.querySelector('.order-done-check');
    if(confirmBtn){
      // เก็บสถานะปัจจุบันไว้แยกในตัวแปรนี้ (ไม่ใช้ isConfirmed ตรงๆ) เพราะไม่ได้ renderGroups() ใหม่
      // ทั้งหน้าหลังกดสำเร็จอีกต่อไป (เพื่อความไว) — ถ้ายังอิง isConfirmed เดิม กดสลับซ้ำสองครั้ง
      // ในการ์ดเดียวกันโดยไม่รีเฟรชหน้า ครั้งที่สองจะยังอ่านค่าตั้งต้นเก่าอยู่ ผิดสถานะจริง
      let confirmedNow = isConfirmed;
      const confirmedLabel = head.querySelector('.order-confirmed-label');
      confirmBtn.onclick = async (e)=>{
        e.stopPropagation();
        const checked = !confirmedNow;
        // อัปเดตหน้าจอให้เห็นผลทันที ไม่รอ apiPost เสร็จก่อน (Apps Script มัก 1-3 วิ กว่าจะตอบ
        // กดแล้วรอเห็นผลช้าจะรู้สึกเหมือนกดไม่ติด) ค่อยยิงไปบันทึกจริงเบื้องหลัง แล้วเด้งกลับ
        // สถานะเดิมพร้อมแจ้งเตือนถ้าบันทึกไม่สำเร็จ
        confirmedNow = checked;
        confirmBtn.classList.toggle('confirmed', checked);
        confirmBtn.setAttribute('aria-pressed', String(checked));
        confirmBtn.textContent = checked ? '✓' : '';
        if(confirmedLabel) confirmedLabel.hidden = !checked;
        if(checked) confirmedSupplierIds.add(s.id); else confirmedSupplierIds.delete(s.id);
        renderStats();
        try{
          await apiPost('setSupplierOrderConfirm', { supplierId: s.id, confirmed: checked, staffName: state.staffName }, true);
        }catch(err){
          confirmedNow = !checked;
          confirmBtn.classList.toggle('confirmed', !checked);
          confirmBtn.setAttribute('aria-pressed', String(!checked));
          confirmBtn.textContent = !checked ? '✓' : '';
          if(confirmedLabel) confirmedLabel.hidden = checked;
          if(checked) confirmedSupplierIds.delete(s.id); else confirmedSupplierIds.add(s.id);
          renderStats();
          alert('บันทึกสถานะไม่สำเร็จ: ' + friendlyErrorMessage(err));
        }
      };
    }

    const body = document.createElement('div'); body.className = 'ord-card-body';

    const allSelected = items.length > 0 && items.every(p=> (state.orderQty[p.id] ?? 0) > 0);
    const selectRow = document.createElement('div'); selectRow.className = 'select-all-row';
    selectRow.innerHTML = `<button type="button" class="link-btn" data-selecttoggle>${allSelected ? 'ไม่เลือกเลย' : 'เลือกทั้งหมด'}</button>`;
    selectRow.querySelector('[data-selecttoggle]').onclick = ()=>{
      if(allSelected) items.forEach(p=> state.orderQty[p.id] = 0);
      else items.forEach(p=>{ state.orderQty[p.id] = state.orderQty[p.id] > 0 ? state.orderQty[p.id] : 1; });
      rebuildCard(s);
    };
    body.appendChild(selectRow);

    const groupBox = document.createElement('div'); groupBox.className='acc-group'; groupBox.style.borderRadius='0'; groupBox.style.border='none';

    items.forEach(p=>{
      const itemChecked = !!statusByProduct[p.id];
      if(state.orderQty[p.id]===undefined) state.orderQty[p.id] = 0;
      const qty = state.orderQty[p.id];
      // สินค้าที่มีหลายหน่วย (เล็ก→ใหญ่ เรียงตาม SortOrder) แสดงคงเหลือของทุกหน่วย
      // แต่สั่งของเป็นหน่วยใหญ่สุดเสมอ
      const uLabel = orderUnitLabel(p);
      const remainEntry = statusByEntry[p.id];
      const remainParts = p.units.map(u=>{
        const v = remainEntry ? remainEntry.remain[u.id] : null;
        return (v!==null && v!==undefined) ? `${v}<span class="u">${escapeHtml(u.label)}</span>` : null;
      }).filter(Boolean);
      const remainValues = p.units.map(u=> remainEntry ? remainEntry.remain[u.id] : null);
      // เช็คแล้ว + ทุกหน่วยคงเหลือ 0 = "หมด" จริง (ไม่ใช่แค่ยังไม่ได้เช็ค) — ไม่ต้องมี flag พิเศษเก็บแยก
      // เพราะข้อมูลนี้แยกออกจากกันอยู่แล้ว: ไม่เช็คเลย = remain เป็น null, เช็คแล้วคงเหลือ 0 = remain เป็น 0
      const isOutOfStock = itemChecked && remainValues.length && remainValues.every(v=> v===0);
      const remainDisplay = isOutOfStock ? `<span class="oos-badge">หมด</span>`
        : (itemChecked && remainParts.length ? remainParts.join(' ') : '–');

      const skipDates = upcomingSkipDates(p);
      const isSkipSet = skipDates.length > 0;

      const row = document.createElement('div');
      row.className = 'prow' + (isSkipSet ? ' skip-set' : '');
      row.innerHTML = `
        <div class="prow-top">
          <input type="checkbox" ${qty>0?'checked':''} data-check="${p.id}" aria-label="เลือกสั่ง ${escapeHtml(p.name)}">
          <div class="prow-name-wrap">
            <div class="prow-name">${escapeHtml(p.name)}</div>
            ${isSkipSet ? `<span class="prow-skip-sub">🚫 งด${skipDates.length>1?`${skipDates.length} วัน: `:'สั่งถึง '}${skipDates.map(formatShortThaiDate).join(', ')}</span>` : ''}
          </div>
          <button type="button" class="skip-toggle-btn${isSkipSet?' active':''}" data-skiptoggle="${p.id}">${isSkipSet?'ยกเลิกงด':'งดสั่งวันนี้'}</button>
        </div>
        <div class="prow-bottom">
          <div class="stat"><span class="lbl">คงเหลือ</span><span class="v">${remainDisplay}</span></div>
          <div class="stepper">
            <button type="button" data-step="-1" aria-label="ลดจำนวน ${escapeHtml(p.name)}">−</button>
            <input type="text" inputmode="numeric" pattern="[0-9]*" class="stepper-input" value="${qty}" min="0" step="1" data-qty="${p.id}" aria-label="จำนวนที่จะสั่ง ${escapeHtml(p.name)}">
            <button type="button" data-step="1" aria-label="เพิ่มจำนวน ${escapeHtml(p.name)}">+</button>
            <span class="unit-tag unit-tag-editable" data-unit-edit="${p.units[p.units.length-1].id}" role="button" tabindex="0" aria-label="แก้ชื่อหน่วยที่ใช้สั่งของ ${escapeHtml(p.name)}">${escapeHtml(uLabel)} <i class="ti ti-pencil" aria-hidden="true"></i></span>
          </div>
        </div>
      `;
      groupBox.appendChild(row);

      bindActivatable(row.querySelector('[data-unit-edit]'), async (e)=>{
        e.stopPropagation();
        const unit = p.units[p.units.length-1];
        const current = unit.orderLabel || unit.label;
        // แก้แค่ป้ายที่ใช้ตอนสั่งของกับซัพพลายเออร์ — ไม่กระทบป้ายที่ลูกจ้างใช้เช็คสต๊อก (unit.label)
        const newLabel = prompt('แก้ชื่อหน่วยที่ใช้ตอนสั่งของกับซัพพลายเออร์ของ "' + p.name + '"\n(ไม่กระทบหน่วยที่ลูกจ้างใช้เช็คสต๊อก)', current);
        if(newLabel===null) return; // ยกเลิก
        const trimmed = newLabel.trim();
        if(!trimmed || trimmed===current) return;
        const oldOrderLabel = unit.orderLabel;
        unit.orderLabel = trimmed; // อัปเดตให้เห็นผลทันทีในเครื่อง
        rebuildCard(s);
        // rebuildCard() รื้อ DOM การ์ดทั้งใบทิ้ง (ดูคอมเมนต์บนตัวฟังก์ชัน) — เปิดจากคีย์บอร์ดแล้วโฟกัสจะหลุด
        // ไปที่ <body> เงียบๆ เหมือนบั๊กเดิมที่เคยเจอกับ .ord-card-head มาก่อน คืนโฟกัสกลับไปที่ป้ายหน่วยตัวใหม่เอง
        const restoreTagFocus = ()=>{ const t = groups.querySelector(`[data-unit-edit="${unit.id}"]`); if(t) t.focus(); };
        restoreTagFocus();
        try{
          await apiPost('setOrderUnitLabel', { unitId: unit.id, label: trimmed }, true);
        }catch(err){
          unit.orderLabel = oldOrderLabel;
          rebuildCard(s);
          restoreTagFocus();
          alert('แก้ชื่อหน่วยไม่สำเร็จ: ' + friendlyErrorMessage(err));
        }
      });

      row.querySelector('[data-skiptoggle]').onclick = (e)=>{
        e.stopPropagation();
        if(isSkipSet){
          // ยกเลิกทุกวันที่ตั้งงดไว้ล่วงหน้าของสินค้าตัวนี้ในครั้งเดียว ไม่ใช่แค่วันล่าสุดวันเดียว —
          // เผื่อเคสที่เจ้าของตั้งงดไว้หลายวันไม่ติดกัน (เช่น งดทั้งวันนี้และอีก 3 วันข้างหน้าแยกกัน)
          const msg = skipDates.length > 1
            ? `ยกเลิกงดสั่ง "${p.name}" ทั้งหมด ${skipDates.length} วันที่ตั้งไว้?`
            : `ยกเลิกงดสั่ง "${p.name}"?`;
          if(!confirm(msg)) return;
          (async ()=>{
            try{
              // เดิมยิง Promise.all พร้อมกันทุกวันที่ในครั้งเดียว — pattern เดียวกับที่เคยเจอปัญหาคิว/
              // serialize ของ Apps Script ตอนหน้านี้เองเคยยิง 4 คำขอพร้อมกัน (ดู ensureOrderPageData
              // ด้านบน) สินค้าที่งดไว้หลายวันไม่ติดกันจะยิงหลายคำขอพร้อมกันโดยไม่จำเป็น เปลี่ยนเป็นยิง
              // ทีละคำขอแทน (ส่วนใหญ่มีแค่ 1 วันอยู่แล้ว ไม่กระทบเคสปกติ)
              for(const date of skipDates){
                await apiPost('setProductSkipDate', { productId: p.id, date, skip: false }, true);
              }
              p.skipDates = (p.skipDates||[]).filter(d=> !skipDates.includes(d));
              rebuildCard(s);
            }catch(err){ alert('ยกเลิกไม่สำเร็จ: ' + friendlyErrorMessage(err)); }
          })();
        }else{
          openSkipDatePicker(p, async (date)=>{
            try{
              await apiPost('setProductSkipDate', { productId: p.id, date, skip: true }, true);
              p.skipDates = [...(p.skipDates||[]), date];
              rebuildCard(s);
            }catch(err){ alert('บันทึกไม่สำเร็จ: ' + friendlyErrorMessage(err)); }
          });
        }
      };

      const qtyInput = row.querySelector(`[data-qty="${p.id}"]`);
      function setQty(v){
        state.orderQty[p.id] = Math.max(0, Math.round(v));
        qtyInput.value = state.orderQty[p.id];
        row.querySelector('[data-check]').checked = state.orderQty[p.id] > 0;
        const subEl = head.querySelector('.status-sub');
        if(subEl) subEl.textContent = baseSubText + selectedSuffix();
      }
      row.querySelector('[data-check]').onchange = (e)=>{
        setQty(e.target.checked ? 1 : 0);
      };
      qtyInput.oninput = (e)=> setQty(parseFloat(e.target.value||0));
      row.querySelectorAll('[data-step]').forEach(btn=>{
        btn.onclick = ()=> setQty(state.orderQty[p.id] + Number(btn.dataset.step));
      });
    });
    body.appendChild(groupBox);

    {
      const btnRow = document.createElement('div'); btnRow.className = 'sup-order-btn-row';
      const hasOrderedItemsToday = allItems.some(p=> orderedItemsTodayMap[p.id] && orderedItemsTodayMap[p.id].qty > 0);
      if(hasOrderedItemsToday){
        const viewBtn = document.createElement('button');
        viewBtn.type = 'button';
        viewBtn.className = 'btn'; viewBtn.style.fontSize='12px'; viewBtn.style.padding='6px 10px';
        viewBtn.innerHTML = '<i class="ti ti-message-2" style="font-size:13px; vertical-align:-2px;" aria-hidden="true"></i> ดูข้อความที่สั่งไปอีกครั้ง';
        viewBtn.onclick = (e)=>{
          e.stopPropagation();
          orderMessageSupplierId = s.id;
          orderMessageMode = 'all'; // E2E-005: ปุ่มนี้ = ดูรวมทุกรายการที่สั่งวันนี้
          go('orderMessage');
        };
        btnRow.appendChild(viewBtn);
      }
      const btn = document.createElement('button');
      btn.className = 'btn btn-primary'; btn.style.fontSize='12px'; btn.style.padding='6px 10px';
      btn.textContent = isOrdered ? 'สั่งของเจ้านี้อีกครั้ง' : 'สั่งของเจ้านี้';
      btn.onclick = async (e)=>{
        e.stopPropagation();
        const supItems = allItems.filter(p=> (state.orderQty[p.id] ?? 0) > 0).map(p=>{
          return { productId:p.id, forecast: 0, orderQty: state.orderQty[p.id], rateUsed: 1, orderUnit: orderUnitLabel(p) };
        });
        if(!supItems.length){ alert('ยังไม่ได้เลือกรายการที่จะสั่งของเจ้านี้'); return; }
        const originalLabel = btn.textContent;
        btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
        try{
          await apiPost('createOrderBatch', { items: supItems });
          supItems.forEach(it=>{
            orderedProductIds.add(it.productId);
            orderedItemsTodayMap[it.productId] = { qty: it.orderQty, unit: it.orderUnit };
          });
          // พาไปหน้าสร้างข้อความสั่งของทันที (เหมือนปุ่ม "สร้างข้อความสั่งของทั้งหมด" เดิม) แทนการ
          // แค่บันทึกเงียบๆ แล้วอยู่หน้าเดิม — กดแล้วปุ่มเปลี่ยนเป็น "กำลังบันทึก..." ชั่วครู่แล้ว "หายไป"
          // (การ์ดถูก re-render ใหม่) ทำให้ไม่รู้ว่าเกิดอะไรขึ้น พาไปหน้าถัดไปเลยเห็นผลชัดเจนกว่า
          supItems.forEach(it=>{ state.orderQty[it.productId] = 0; });
          lastOrderBatchBySupplier[s.id] = supItems.map(it=> ({ productId: it.productId, qty: it.orderQty, unit: it.orderUnit }));
          orderMessageSupplierId = s.id;
          orderMessageMode = 'batch'; // E2E-005: ข้อความหลังกดสั่ง = เฉพาะรายการรอบนี้
          go('orderMessage');
        }catch(err){
          btn.disabled = false; btn.textContent = originalLabel;
          alert('บันทึก OrderLogs ไม่สำเร็จ: ' + friendlyErrorMessage(err));
        }
      };
      btnRow.appendChild(btn);
      body.appendChild(btnRow);
    }

    main.appendChild(body);
    card.appendChild(main);
    return card;
  }

  // แทนที่การ์ดเจ้าเดียวใน DOM ด้วยเวอร์ชันล่าสุด แทนการเรียก renderGroups() ที่รื้อสร้างทั้ง 24 เจ้าใหม่หมด —
  // เจอจริง 15 ก.ย. 69: ลุงทวี (รายการเยอะสุดในร้าน ~50-60 แถวรวมหน่วย) หน่วงเห็นได้ชัดเวลากดขยาย/เลือกทั้งหมด/
  // งด/แก้ชื่อหน่วย เพราะทุกครั้งต้อง rebuild การ์ดของอีก 23 เจ้าที่ไม่เกี่ยวข้องไปด้วยทุกที — ช่องค้นหา (มี debounce
  // อยู่แล้ว) ยังคงเรียก renderGroups() เต็มรูปแบบตามเดิม เพราะต้องกรอง/จัดกลุ่มใหม่ทุกเจ้าจริงๆ ไม่เกี่ยวกับจุดนี้
  function rebuildCard(s){
    const filter = c.querySelector('#search').value;
    const oldCard = groups.querySelector(`[data-supplier-card="${s.id}"]`);
    const newCard = buildSupplierCard(s, filter);
    if(!oldCard || !newCard){ renderGroups(filter); return; } // fallback ปลอดภัย เผื่อหาการ์ดเดิมไม่เจอ
    oldCard.replaceWith(newCard);
  }

  function renderGroups(filter){
    groups.innerHTML='';
    // เจ้าที่ถึงรอบสั่งวันนี้ (ตาม OrderDays) ขึ้นก่อนเสมอ แยกเป็นเซกชัน "ต้องสั่งวันนี้" ด้านบน
    // กับ "เจ้าอื่นทั้งหมด" ด้านล่าง (การ์ดหรี่ลงนิดหน่อย) แทนป้ายลอยติดชื่อทีละใบ — อ่านง่ายกว่าตอนมีหลายเจ้า
    // ไม่ได้ซ่อนเจ้าอื่นออกจากรายการ เพราะเจ้าที่ไม่ได้กำหนดรอบ (orderDays ว่าง) ก็ยังต้องสั่งได้ตามปกติ
    const sortedSuppliers = [...SUPPLIERS].sort((a,b)=> (supplierDueToday(b)?1:0) - (supplierDueToday(a)?1:0));

    // เดินลูปแบบ dry-run ก่อนรอบเดียว แค่เพื่อนับว่าเจ้าที่ผ่านตัวกรอง (filter) มีกี่เจ้าอยู่ในแต่ละเซกชัน
    // ใช้โชว์ตัวเลข "· N เจ้า" ต่อท้ายหัวข้อเซกชัน โดยไม่ต้องคำนวณ allItems/items ซ้ำสองรอบเต็มๆ ในลูปหลัก
    let dueCount = 0, restCount = 0;
    sortedSuppliers.forEach(s=>{
      const allItems = productsOf(s.id);
      if(!allItems.length) return;
      const hasMatch = allItems.some(p=>p.name.includes(filter||'') || s.name.includes(filter||''));
      if(!hasMatch) return;
      if(supplierDueToday(s)) dueCount++; else restCount++;
    });
    // dueSection ห่อการ์ด "ต้องสั่งวันนี้" ไว้เป็นลิสต์ของตัวเอง (แยกจาก otherSection ที่มีอยู่แล้ว) เพื่อให้
    // ใส่ role="list" ได้ถูกต้อง — เดิมการ์ดกลุ่มนี้แปะตรงเข้า groups ปนกับ dueLabel (แค่ข้อความหัวข้อ ไม่ใช่
    // รายการข้อมูล) ทำให้ groups เองมี role="list" ไม่ได้เพราะลูกไม่ใช่ listitem ล้วน
    const dueSection = document.createElement('div');
    if(dueCount){
      const dueLabel = document.createElement('h2'); dueLabel.className = 'section-label due';
      dueLabel.textContent = `ต้องสั่งวันนี้ · ${dueCount} เจ้า`;
      groups.appendChild(dueLabel);
      dueSection.setAttribute('role','list');
      groups.appendChild(dueSection);
    }
    const restLabel = document.createElement('h2'); restLabel.className = 'section-label';
    restLabel.textContent = dueCount ? `เจ้าอื่นทั้งหมด · ${restCount} เจ้า` : 'เจ้าทั้งหมด';
    let restLabelInserted = false;
    const otherSection = document.createElement('div'); otherSection.className = 'other-section'; otherSection.setAttribute('role','list');

    sortedSuppliers.forEach(s=>{
      const allItems = productsOf(s.id);
      if(!allItems.length) return;
      const hasMatch = allItems.some(p=>p.name.includes(filter||'') || s.name.includes(filter||''));
      if(!hasMatch) return;
      const dueToday = supplierDueToday(s);
      // เจ้ากลุ่มแรกที่ไม่ถึงรอบวันนี้ (ตามลำดับที่ sort ไว้แล้ว) คือจุดเริ่มเซกชัน "เจ้าอื่นทั้งหมด"
      if(!dueToday && !restLabelInserted){ groups.appendChild(restLabel); groups.appendChild(otherSection); restLabelInserted = true; }
      const renderTarget = dueToday ? dueSection : otherSection;
      const card = buildSupplierCard(s, filter);
      if(card) renderTarget.appendChild(card);
    });
    if(!dueCount && !restCount) groups.innerHTML = '<p class="empty-state">ไม่พบสินค้าที่ค้นหา</p>';
  }

  renderStats();
  renderGroups('');
  c.querySelector('#search').oninput = debounce((e)=>{ renderStats(); renderGroups(e.target.value); }, 250);

  // E2E fix (1 ต.ค. 69, จาก Final E2E Audit — E2E-006): เดิมหน้านี้ไม่เคยรีเฟรชรายการสินค้าเลยตลอด session —
  // สินค้าที่ Mile เพิ่มจากหน้าเช็คสต๊อก (คนละเครื่อง) ไม่โผล่ให้เจ้าของสั่งจนกว่าจะปิดแอปเปิดใหม่ ใช้
  // refreshBootstrapIfStale() ตัวเดียวกับหน้าเช็คสต๊อก (จำกัดไม่เกินครั้งละ 45 วิ, backend มีแคช bootstrap อยู่แล้ว)
  // วาดใหม่เฉพาะเมื่อชุดสินค้าเปลี่ยนจริง (เพิ่ม/หาย) — จำนวนที่เลือกไว้ (state.orderQty) และการ์ดที่เปิดอยู่
  // (expandedSuppliers) คีย์ด้วย id จึงยังอยู่ครบ ถ้ากำลังพิมพ์ในช่องจำนวนอยู่ รอจนออกจากช่องก่อนค่อยวาด
  const productIdsKey = ()=> PRODUCTS.map(p=> p.id).sort().join(',');
  const shownIds = productIdsKey();
  refreshBootstrapIfStale(()=>{
    if(!isCurrent() || productIdsKey() === shownIds) return;
    const apply = ()=>{
      if(!isCurrent()) return;
      indexProducts();
      renderStats();
      renderGroups(c.querySelector('#search').value);
    };
    const ae = document.activeElement;
    if(ae && ae.tagName === 'INPUT' && groups.contains(ae)){
      groups.addEventListener('focusout', ()=> setTimeout(apply, 0), { once: true });
    } else {
      apply();
    }
  });
}

/* ============ OWNER: Order message ============ */
function renderOrderMessage(app){
  app.appendChild(topbar('สร้างข้อความสั่งของ', {back:()=>go('orderPage')}));
  const c = document.createElement('div'); c.className='content';

  // ดึงจาก orderedItemsTodayMap เสมอ (ข้อมูลจริงจาก OrderLogs ฝั่ง Apps Script ที่ถูกอัปเดตแล้วตั้งแต่
  // ก่อนเข้าหน้านี้ — ดู supplierCard()'s ปุ่ม "สั่งของเจ้านี้"/"ดูข้อความที่สั่งไปอีกครั้ง") ไม่ใช้
  // state.orderQty สดๆ เพราะถูกเคลียร์เป็น 0 ไปแล้วหลังสั่งสำเร็จ — ใช้ได้กับออเดอร์ที่สั่งไปแล้ววันนี้ทุกอัน
  // ไม่ว่าจะสั่งจากเครื่อง/รอบไหนก็ตาม และยังแสดงถูกต้องแม้กด back/forward ของเบราว์เซอร์กลับมาหน้านี้อีกครั้ง
  // (orderMessageSupplierId ไม่ถูกเคลียร์เป็น null หลังอ่าน ต่างจากเดิม)
  const supId = orderMessageSupplierId;
  const batch = orderMessageMode === 'batch' ? lastOrderBatchBySupplier[supId] : null;
  const items = batch
    ? batch.map(b=>{ const p = PRODUCTS.find(x=> x.id === b.productId); return p ? ({...p, orderUnit: b.unit || orderUnitLabel(p), qty: b.qty}) : null; })
        .filter(it=> it && it.qty > 0)
    : PRODUCTS.filter(p=> p.supplierId===supId && orderedItemsTodayMap[p.id] && orderedItemsTodayMap[p.id].qty>0)
        .map(p=> ({...p, orderUnit: orderedItemsTodayMap[p.id].unit || orderUnitLabel(p), qty: orderedItemsTodayMap[p.id].qty}));
  const bySupplier = {};
  items.forEach(it=>{ (bySupplier[it.supplierId] = bySupplier[it.supplierId]||[]).push(it); });

  if(!Object.keys(bySupplier).length){
    c.innerHTML = '<p class="empty-state">ยังไม่มีรายการที่เลือกสั่ง กลับไปหน้าสั่งของก่อนนะครับ</p>';
    app.appendChild(c); return;
  }

  Object.entries(bySupplier).forEach(([supId, list])=>{
    const sup = SUPPLIERS.find(s=>s.id===supId);
    const col = NEUTRAL_COL;
    // ฟอนต์โมโนสเปซ (เช่น Courier New) ไม่รองรับตัวอักษรไทย เบราว์เซอร์เลย fallback ไปใช้ฟอนต์ไทย
    // แบบสัดส่วน (proportional) แทน — ผลคือ pad ด้วยจำนวนตัวอักษร/ช่องว่างแล้วไม่ตรงกันจริงบนจอ
    // แก้โดยไม่พึ่งการนับตัวอักษรเลย ใช้ CSS grid 3 คอลัมน์ (ชื่อ | จำนวน | หน่วยนับ)
    // — ต้องเป็น grid container เดียวที่ครอบทุกแถว (ไม่ใช่ grid แยกทีละแถว) ความกว้างคอลัมน์
    // ถึงจะคำนวณรวมจากทุกแถวแล้วตรงกันจริง ไม่ว่าชื่อแถวไหนจะสั้นหรือยาวแค่ไหน
    // E2E-011 (ต่อจาก BUG-003): ชื่อสินค้า/ชื่อหน่วยมาจากการพิมพ์มือ ต้อง escape ก่อนแทรก innerHTML เหมือนจุดอื่น —
    // เฉพาะตัวอย่างบนจอเท่านั้น ข้อความที่คัดลอก (text ด้านล่าง) เป็น plain text อยู่แล้ว ไม่ต้อง/ห้าม escape
    const rowsHtml = list.map((it,i)=>`
      <span style="min-width:0;">${i+1}. ${escapeHtml(it.name)}</span>
      <span style="text-align:right; white-space:nowrap;">${escapeHtml(it.qty)}</span>
      <span style="text-align:left; white-space:nowrap;">${escapeHtml(it.orderUnit)}</span>`).join('');
    // ข้อความล้วนสำหรับคัดลอกไปวางแอปอื่น (LINE ฯลฯ) — คุมฟอนต์ปลายทางไม่ได้ จึงคั่นด้วยช่องว่างคงที่
    // แทนการพยายามจัดคอลัมน์ด้วยจำนวนช่องว่างผันแปร (ซึ่งตรงเฉพาะตอนพรีวิวในแอปเท่านั้น)
    // ใช้ non-breaking space ( ) คั่นระหว่าง "จำนวน" กับ "หน่วยนับ" แทนช่องว่างปกติ
    // กันไม่ให้กล่องแชทไลน์ (ที่ความกว้างจำกัด) ตัดขึ้นบรรทัดใหม่คั่นกลางระหว่างเลขกับหน่วย
    // เช่น "22 หิ้ว" ต้องขึ้นบรรทัดใหม่ด้วยกันทั้งคู่ ไม่ใช่ "22" ค้างบรรทัดบนแล้ว "หิ้ว" กระเด็นไปบรรทัดล่าง
    const lines = list.map((it,i)=>`${i+1}. ${it.name}  ${it.qty} ${it.orderUnit}`).join('\n');
    const todayLabel = new Date().toLocaleDateString('th-TH', {year:'numeric', month:'short', day:'numeric'});
    const text = `สั่งสินค้า\nวันที่สั่ง: ${todayLabel}\n\nรายการสั่งของ\n${lines}`;

    const card = document.createElement('div');
    card.style.background='#fff'; card.style.border='1px solid var(--border)';
    card.style.borderLeft = `3px solid ${col.text}`; card.style.borderRadius='0 var(--radius-lg) var(--radius-lg) 0'; card.style.padding='14px'; card.style.marginBottom='12px';
    card.innerHTML = `
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
        <div><p style="margin:0; font-weight:600; font-size:14px;">${sup.name}</p>
          <p style="margin:2px 0 0; font-size:11.5px; color:var(--text-secondary);">${batch ? 'เฉพาะรายการที่สั่งรอบนี้' : 'รวมทุกรายการที่สั่งวันนี้'}</p></div>
        <button class="btn copy-btn" style="font-size:12px; padding:6px 10px;"><i class="ti ti-copy" style="font-size:13px;"></i> คัดลอก</button>
      </div>
      <div style="display:grid; grid-template-columns:1fr auto auto; column-gap:8px; row-gap:4px; align-items:baseline; font-size:12px; line-height:1.5; background:var(--bg); padding:10px; border-radius:8px;">${rowsHtml}</div>
    `;
    card.querySelector('.copy-btn').onclick = ()=>{
      navigator.clipboard?.writeText(text).catch(()=>{});
      const toast = document.createElement('div'); toast.className='copy-toast'; toast.setAttribute('role','status'); toast.setAttribute('aria-live','polite'); toast.textContent='คัดลอกแล้ว';
      document.body.appendChild(toast); setTimeout(()=>toast.remove(), 1400);
    };
    c.appendChild(card);
  });

  // ปุ่ม "เสร็จสิ้น" แยกจากลูกศร back — กดลูกศร back รู้สึกเหมือนยกเลิก/ย้อนแอ็คชั่น
  // ทั้งที่จริงๆ ข้อความถูกสร้าง+บันทึกลง OrderLogs ไปแล้วตั้งแต่ก่อนเข้าหน้านี้
  // ปุ่มนี้แค่พากลับไปหน้าสั่งของเหมือนกัน แต่สื่อความหมายตรงว่า "คัดลอกเสร็จแล้ว จบงานนี้"
  const doneBtn = document.createElement('button');
  doneBtn.className = 'btn btn-primary btn-block';
  doneBtn.style.marginTop = '4px';
  doneBtn.textContent = 'เสร็จสิ้น';
  doneBtn.onclick = ()=> go('orderPage');
  c.appendChild(doneBtn);

  app.appendChild(c);
}

bootstrap();
</script>
