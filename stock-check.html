}

/* ============ STAFF: supplier list (all suppliers always shown) ============ */
// จัดกลุ่มตามรอบสั่งของวันนี้ (OrderDays เดียวกับที่ฝั่งเจ้าของใช้ผ่าน supplierDueToday())
// เรียงจากเร่งด่วนสุดไปน้อยสุด: "ต้องสั่งวันนี้ · ยังไม่สั่ง" → "ต้องสั่งวันนี้ · สั่งแล้ว" → "ไม่ถึงรอบวันนี้"
// เจตนาเดียวกับฝั่งเจ้าของ: ไม่ได้ล็อกร้านกลุ่มท้ายๆ ห้ามเช็ค/สั่ง แค่หรี่ลงบอกลำดับความสำคัญ (ดู .other-section)
// ภายในแต่ละกลุ่ม ไม่แยกหัวข้อย่อย "เช็คแล้ว/ยังไม่เช็ค" อีกชั้น (จะกลายเป็น 6 หัวข้อ รกเกิน) แค่เรียง
// ร้านที่เช็คแล้วไปท้ายกลุ่มนั้นๆ แล้วให้การ์ดจางลง+ติ๊กถูกเหมือนเดิม
async function renderSupplierList(app){
  let statusList;
  if(stockStatusCache){
    statusList = stockStatusCache;
  } else {
    renderLoading(app, 'กำลังโหลดสถานะร้าน...');
    try{ statusList = await getStockStatus(); }
    catch(err){ app.innerHTML = `<div class="empty-state" style="color:var(--danger);">โหลดสถานะไม่สำเร็จ: ${err.message}</div>`; return; }
  }
  checkedProducts = new Set(statusList.filter(s=>s.checked).map(s=>s.productId));
  checkedSuppliers = new Set(
    SUPPLIERS.filter(s=>{
      const prods = PRODUCTS.filter(p=>p.supplierId===s.id);
      return prods.length>0 && prods.every(p=>checkedProducts.has(p.id));
    }).map(s=>s.id)
  );
  sessionCheckedSuppliers.forEach(id => checkedSuppliers.add(id));

  app.innerHTML = '';
  const doneCount = SUPPLIERS.filter(s=>checkedSuppliers.has(s.id)).length;

  app.appendChild(topbar('เลือกร้านที่จะเช็ค', {back:()=>go('home'), meta:`${doneCount} / ${SUPPLIERS.length}`}));
  const c = document.createElement('div'); c.className='content';
  c.innerHTML = `
    <div class="progress-track"><div class="progress-fill" style="width:${SUPPLIERS.length? doneCount/SUPPLIERS.length*100:0}%; background:var(--brand);"></div></div>
    <input type="text" id="search" placeholder="ค้นหาชื่อร้าน" style="margin-bottom:14px;">
    <div id="groups"></div>
  `;
  app.appendChild(c);
  const groupsEl = c.querySelector('#groups');

  function supplierOrderedToday(s){
    return PRODUCTS.some(p=> p.supplierId===s.id && orderedProductIds.has(p.id));
  }
  // ร้านที่เช็คแล้วเลื่อนไปท้ายกลุ่มเดียวกันเสมอ (ไม่ข้ามไปกลุ่มอื่น) — ลำดับเลขที่การ์ด (idx+1)
  // ยังอิง SUPPLIERS.indexOf(s) เดิมทุกที่ ไม่เปลี่ยนเลขตามกลุ่ม/การเรียง กันงงเวลาสลับจอ
  function sortWithin(list){
    return [...list].sort((a,b)=> (checkedSuppliers.has(a.id)?1:0) - (checkedSuppliers.has(b.id)?1:0));
  }

  function renderLists(filter){
    const f = (filter||'').trim();
    groupsEl.innerHTML = '';

    const due = SUPPLIERS.filter(s=> supplierDueToday(s));
    const rest = SUPPLIERS.filter(s=> !supplierDueToday(s));
    const dueNotOrdered = due.filter(s=> !supplierOrderedToday(s));
    const dueOrdered = due.filter(s=> supplierOrderedToday(s));

    function addSection(labelText, labelClass, list, statusPill, dim){
      const filtered = sortWithin(list).filter(s=> s.name.includes(f));
      if(!filtered.length) return;
      const label = document.createElement('p');
      label.className = 'section-label' + (labelClass? ' '+labelClass : '');
      label.textContent = `${labelText} · ${filtered.length} เจ้า`;
      groupsEl.appendChild(label);
      const wrap = document.createElement('div');
      if(dim) wrap.className = 'other-section';
      const grid = document.createElement('div'); grid.className = 'sup-card-grid';
      filtered.forEach(s=> grid.appendChild(supplierCard(s, checkedSuppliers.has(s.id), SUPPLIERS.indexOf(s), statusPill)));
      wrap.appendChild(grid);
      groupsEl.appendChild(wrap);
    }

    addSection('ต้องสั่งวันนี้ · ยังไม่สั่ง', 'urgent', dueNotOrdered, 'urgent', false);
    addSection('ต้องสั่งวันนี้ · สั่งแล้ว', 'ordered', dueOrdered, 'ordered', false);
    addSection(due.length ? 'ไม่ถึงรอบวันนี้' : 'เจ้าทั้งหมด', null, rest, null, true);

    if(!groupsEl.children.length) groupsEl.innerHTML = '<p class="empty-state">ไม่พบร้านที่ค้นหา</p>';
  }
  renderLists('');
  c.querySelector('#search').oninput = debounce((e)=>renderLists(e.target.value), 250);

  // สถานะ "สั่งแล้ว" ของแต่ละเจ้า — โหลดแยกจาก stockStatus เพราะเป็นคนละชีต (OrderLogs) ยิงแบบไม่รอ
  // (ไม่ await) ให้เห็นรายการร้านทันทีก่อน ไม่ต้องรอ network รอบสองจบก่อนถึงจะเห็นหน้าจอ — พอโหลดเสร็จ
  // ค่อย re-render อัปเดตกลุ่ม/ป้ายสถานะให้ตรง ถ้าโหลดไม่สำเร็จก็แค่ป้ายรอสั่ง/สั่งแล้วไม่อัปเดต ไม่กระทบการเช็คสต๊อก
  apiGet('orderedToday').then(orderedRes=>{
    orderedProductIds = new Set((orderedRes && orderedRes.productIds) || []);
    renderLists(c.querySelector('#search').value);
  }).catch(()=>{});
}

function supplierCard(s, isDone, idx, statusPill){
  const col = iconColor(idx);
  const hasPhoto = !!s.imageUrl;
  const isUrgent = statusPill==='urgent' && !isDone;
  const card = document.createElement('div');
  card.className = 'sup-card' + (isDone?' done':'') + (isUrgent?' urgent':'');
  const pillHtml = statusPill
    ? `<span class="status-pill ${statusPill}">${statusPill==='urgent'?'รอสั่ง':'สั่งแล้ว'}</span>`
    : '';
  card.innerHTML = `
    <div class="sup-icon-wrap">
      <span class="sup-num-badge">${idx+1}</span>
      <div class="sup-icon" style="background:${isDone?'var(--bg)':(hasPhoto?'transparent':col.bg)};">
        ${hasPhoto
          ? `<img src="${s.imageUrl}" alt="" loading="lazy" style="width:100%; height:100%; object-fit:cover; opacity:${isDone?'0.55':'1'};">`
          : `<i class="ti ${isDone?'ti-check':'ti-meat'}" style="font-size:min(11vw,48px); color:${isDone?'var(--text-secondary)':col.fg};" aria-hidden="true"></i>`}
      </div>
    </div>
    <p style="margin:0; padding:0 8px; font-size:13px; font-weight:600; color:${isDone?'var(--text-secondary)':'var(--text)'}; line-height:1.3;">${s.name}</p>
    ${pillHtml}
  `;
  card.onclick = ()=>go('supplierCheck', {currentSupplierId: s.id});
  return card;
}

/* ============ STAFF: single-page check (all products, 2-col grid) ============ */
async function renderSupplierCheck(app){
  const sup = SUPPLIERS.find(s=>s.id===state.currentSupplierId);
  const products = PRODUCTS.filter(p=>p.supplierId===sup.id);

  renderLoading(app, 'กำลังโหลดข้อมูลสต๊อกวันนี้...');
  try{
    const statusList = await getStockStatus();
    statusList.filter(s=>products.some(p=>p.id===s.productId)).forEach(s=>{
      Object.entries(s.remain||{}).forEach(([uid,val])=>{ if(val!==null) stockValues[uid]=val; });
      if(s.checked) checkedProducts.add(s.productId);
    });
  }catch(err){
    app.innerHTML = `<div class="empty-state" style="color:var(--danger);">โหลดข้อมูลไม่สำเร็จ: ${err.message}</div>`; return;
  }
  app.innerHTML = '';
  supplierCheckDirty = false; // เข้าหน้านี้ใหม่ ยังไม่มีอะไรที่แก้แล้วยังไม่ได้บันทึกรอบนี้

  // บันทึกเฉพาะสินค้าที่ติ๊ก "เช็คแล้ว" จริงๆ ของเจ้านี้ — ใช้ร่วมกันทั้งตอนกดปุ่ม "เสร็จเจ้านี้" เอง
  // และตอนออกจากหน้าแบบไม่ตั้งใจ (ปัดกลับ/ปุ่ม back) แบบอัตโนมัติด้านล่าง คืน checkedItems ถ้าสำเร็จ,
  // null ถ้าไม่มีอะไรให้บันทึก (ยังไม่ติ๊กอะไรเลย), หรือ throw error ถ้าบันทึกไม่สำเร็จ
  async function saveCheckedItems(){
    const checkedItems = products.filter(p=>checkedProducts.has(p.id));
    if(!checkedItems.length) return null;
    const items = checkedItems.flatMap(p=>p.units.map(u=>({unitId:u.id, remainQty: stockValues[u.id]||0})));
    const photos = checkedItems.filter(p=>productPhotos[p.id]).map(p=>({productId:p.id, photo:productPhotos[p.id]}));
    await apiPost('saveStock', { staffName: state.staffName, supplierId: sup.id, items, photos });
    patchStockStatusChecked(checkedItems, items);
    if(checkedItems.length === products.length){
      checkedSuppliers.add(sup.id);
      sessionCheckedSuppliers.add(sup.id);
      saveSessionChecked();
    }
    supplierCheckDirty = false;
    return checkedItems;
  }

  // ออกจากหน้านี้แบบไม่ได้ตั้งใจ (ปัดกลับ/ปุ่ม back) ระหว่างที่มีข้อมูลค้าง — เซฟให้อัตโนมัติเงียบๆ ก่อน
  // ปล่อยให้ออกจริง ไม่ต้องถามอะไรถ้าเซฟผ่าน คืน true = ออกได้ (เซฟสำเร็จ/ไม่มีอะไรต้องเซฟ), false = ควร
  // อยู่ต่อ (ผู้ใช้เลือกไม่ออกหลังเซฟไม่สำเร็จ) — ถามยืนยันเฉพาะตอนเซฟอัตโนมัติไม่สำเร็จจริงๆ (เช่นเน็ตหลุด)
  // โชว์ toast "กำลังบันทึก..." ระหว่างรอด้วย เพราะเน็ตอ่อนๆ (ไม่ถึงกับหลุด) อาจรอได้นานสุดถึง API_TIMEOUT_MS
  // (25 วิ) กว่าจะรู้ผล ถ้าไม่มีอะไรโชว์เลยจะดูเหมือนแอปค้าง
  async function autoSaveOnLeave(){
    if(!supplierCheckDirty) return true;
    const toast = document.createElement('div'); toast.className='copy-toast'; toast.textContent='กำลังบันทึก...';
    document.body.appendChild(toast);
    try{ await saveCheckedItems(); return true; }
    catch(err){ return confirm('บันทึกอัตโนมัติไม่สำเร็จ (' + err.message + ')\nยืนยันออกจากหน้านี้โดยไม่บันทึกใช่ไหม?'); }
    finally{ toast.remove(); }
  }
  supplierCheckAutoSave = autoSaveOnLeave; // ให้ popstate listener (นอกฟังก์ชันนี้) เรียกใช้ได้ตอนปัดกลับ

  async function guardedLeave(){
    if(await autoSaveOnLeave()) go('supplierList');
  }
  app.appendChild(topbar(sup.name, {back:guardedLeave, numBadge:SUPPLIERS.indexOf(sup)+1}));
  const c = document.createElement('div'); c.className='content';

  if(!CAMERA_PER_PRODUCT_ENABLED){
    const pickBtn = document.createElement('button');
    pickBtn.className = 'btn btn-block';
    pickBtn.style.marginBottom = '14px';
    pickBtn.innerHTML = '<i class="ti ti-photo-plus" style="font-size:16px; vertical-align:-3px; margin-right:6px;" aria-hidden="true"></i>เลือกรูปสินค้า (หลายไฟล์)';
    pickBtn.onclick = ()=> multiPhotoInput.click();
    c.appendChild(pickBtn);
  }

  const grid = document.createElement('div'); grid.className='prod-grid';
  c.appendChild(grid);

  let photoTargetPid = null;
  const photoInput = document.createElement('input');
  photoInput.type = 'file'; photoInput.accept = 'image/*'; photoInput.capture = 'environment';
  photoInput.style.display = 'none';
  c.appendChild(photoInput);
  photoInput.onchange = async ()=>{
    const file = photoInput.files[0];
    const pid = photoTargetPid;
    photoInput.value = '';
    if(!file || !pid) return;
    try{
      productPhotos[pid] = await compressImage(file, 800, 0.6);
    }catch(err){ alert('ถ่ายรูปไม่สำเร็จ: ' + err.message); }
    renderGrid();
  };

  // เลือกรูปหลายไฟล์จากเครื่อง (แทนการถ่ายทีละรูป) แล้วไปหน้าจับคู่กับสินค้า
  const multiPhotoInput = document.createElement('input');
  multiPhotoInput.type = 'file'; multiPhotoInput.accept = 'image/*'; multiPhotoInput.multiple = true;
  multiPhotoInput.style.display = 'none';
  c.appendChild(multiPhotoInput);
  multiPhotoInput.onchange = async ()=>{
    const files = Array.from(multiPhotoInput.files || []);
    multiPhotoInput.value = '';
    if(!files.length) return;
    openPhotoMatchScreen(files, products, ()=>renderGrid());
  };

  function renderGrid(){
    grid.innerHTML='';
    products.forEach((p, idx)=>{
      const isChecked = checkedProducts.has(p.id);
      const col = iconColor(idx);
      const photoSrc = productPhotos[p.id] || p.photoUrl; // p.photoUrl: persisted one-time reference photo, once backend supports it
      const isCover = ALLOW_SET_COVER_PHOTO && !!p.photoUrl && sup.imageUrl === p.photoUrl;
      const isSkipped = isProductSkippedToday(p);
      const card = document.createElement('div');
      card.className = 'prod-card' + (isChecked?' checked':'') + (isCover?' is-cover':'') + (isSkipped?' skip-today':'');
      card.innerHTML = `
        <div class="prod-photo-area${(CAMERA_PER_PRODUCT_ENABLED && (!photoSrc || ALLOW_PHOTO_RETAKE))?' no-photo':''}" data-pid="${p.id}" style="background:${photoSrc?'transparent':(isChecked?'rgba(255,255,255,0.6)':col.bg)}; cursor:${CAMERA_PER_PRODUCT_ENABLED?'pointer':'default'};">
          ${photoSrc
            ? `<img src="${photoSrc}" alt="" loading="lazy">`
            : `<div class="photo-inner"><div class="photo-placeholder"><i class="ti ti-photo-off" style="font-size:28px; color:${col.fg};" aria-hidden="true"></i><span>ยังไม่มีรูป</span></div></div>`}
          ${(photoSrc && ALLOW_PHOTO_RETAKE && CAMERA_PER_PRODUCT_ENABLED) ? `<div class="retake-badge"><i class="ti ti-camera" aria-hidden="true"></i></div>` : ''}
          ${ALLOW_SET_COVER_PHOTO ? `<button class="cover-toggle${isCover?' is-cover':''}" data-pid="${p.id}" ${p.photoUrl?'':'disabled'} aria-label="ตั้งเป็นรูปปกร้านนี้"><i class="ti ${isCover?'ti-heart-filled':'ti-heart'}" aria-hidden="true"></i></button>` : ''}
          <button class="check-toggle" data-pid="${p.id}" aria-label="ทำเครื่องหมายว่าเช็คแล้ว"><i class="ti ${isChecked?'ti-circle-check-filled':'ti-circle'}" aria-hidden="true"></i></button>
        </div>
        ${isSkipped ? `<span class="skip-today-badge">🚫 งดสั่งวันนี้</span>` : ''}
        <p class="prod-card-name">${p.name}</p>
        ${isCover ? `<p class="cover-tag"><i class="ti ti-heart-filled" style="font-size:10px; vertical-align:-1px;" aria-hidden="true"></i> รูปปกร้านนี้</p>` : ''}
        <div class="unit-steppers-row">
          ${p.units.map(u=>`
            <div class="unit-stepper">
              <button class="step-btn minus" data-unit="${u.id}" ${isSkipped?'disabled':''}>−</button>
              <input type="text" inputmode="numeric" pattern="[0-9]*" class="step-input" data-unit="${u.id}" value="${stockValues[u.id]||0}" min="0" ${isSkipped?'disabled':''}>
              <button class="step-btn plus" data-unit="${u.id}" ${isSkipped?'disabled':''}>+</button>
              <span class="unit-tag${canEditUnitLabel()?' unit-tag-editable':''}" ${canEditUnitLabel()?`data-unit-edit="${u.id}"`:''}>${u.label}${canEditUnitLabel()?' <i class="ti ti-pencil" aria-hidden="true"></i>':''}</span>
            </div>
          `).join('')}
        </div>
        <button class="oos-btn" data-pid="${p.id}" data-units="${p.units.map(u=>u.id).join(',')}" ${isSkipped?'disabled':''}>🚫 ของหมด</button>
      `;
      grid.appendChild(card);
    });

    if(canAddProduct()){
      const addCard = document.createElement('div');
      addCard.className = 'add-prod-card';
      addCard.innerHTML = '<i class="ti ti-plus" style="font-size:26px;" aria-hidden="true"></i><span>เพิ่มสินค้าใหม่</span>';
      addCard.onclick = ()=> openAddProductScreen(sup, (newProduct)=>{
        products.push(newProduct);
        PRODUCTS.push(newProduct);
        renderGrid(); updateBar();
      });
      grid.appendChild(addCard);
    }

    grid.querySelectorAll('.check-toggle').forEach(btn=>{
      btn.onclick = (e)=>{
        e.stopPropagation();
        const pid = btn.dataset.pid;
        supplierCheckDirty = true;
        if(checkedProducts.has(pid)) checkedProducts.delete(pid); else checkedProducts.add(pid);
        // แต่ก่อนรื้อสร้างการ์ดสินค้าทั้งหน้าใหม่ (renderGrid()) แค่เพราะติ๊ก/ถอนติ๊กสินค้าตัวเดียว — แก้แค่
        // การ์ดนั้นในจุดที่สถานะ "เช็คแล้ว" มีผลจริง (ไอคอนวงกลม, พื้นหลังรูป, คลาส .checked ของการ์ด)
        const isNowChecked = checkedProducts.has(pid);
        const card = btn.closest('.prod-card');
        if(card){
          card.classList.toggle('checked', isNowChecked);
          const icon = btn.querySelector('i');
          if(icon){ icon.classList.toggle('ti-circle', !isNowChecked); icon.classList.toggle('ti-circle-check-filled', isNowChecked); }
          const photoArea = card.querySelector('.prod-photo-area');
          if(photoArea && !photoArea.querySelector('img')){
            const idx = products.findIndex(x=>x.id===pid);
            const col = iconColor(idx);
            photoArea.style.background = isNowChecked ? 'rgba(255,255,255,0.6)' : col.bg;
          }
        }
        updateBar();
      };
    });
    if(ALLOW_SET_COVER_PHOTO){
      grid.querySelectorAll('.cover-toggle').forEach(btn=>{
        btn.onclick = async (e)=>{
          e.stopPropagation();
          if(btn.disabled) return;
          const pid = btn.dataset.pid;
          const p = products.find(x=>x.id===pid);
          if(!p || !p.photoUrl) return;
          btn.disabled = true;
          try{
            await apiPost('setSupplierCoverPhoto', { supplierId: sup.id, photoUrl: p.photoUrl }, true);
            sup.imageUrl = p.photoUrl; // อัปเดตให้เห็นผลทันทีในเครื่อง
            renderGrid();
          }catch(err){
            btn.disabled = false;
            alert('ตั้งรูปปกไม่สำเร็จ: ' + err.message);
          }
        };
      });
    }
    if(canEditUnitLabel()){
      grid.querySelectorAll('.unit-tag-editable').forEach(tag=>{
        tag.onclick = async (e)=>{
          e.stopPropagation();
          const uid = tag.dataset.unitEdit;
          const p = products.find(x=>x.units.some(u=>u.id===uid));
          const u = p?.units.find(u=>u.id===uid);
          if(!u) return;
          const newLabel = prompt('แก้ชื่อหน่วยของ "' + p.name + '"', u.label);
          if(newLabel===null) return; // ยกเลิก
          const trimmed = newLabel.trim();
          if(!trimmed || trimmed===u.label) return;
          const oldLabel = u.label;
          u.label = trimmed; // อัปเดตให้เห็นผลทันทีในเครื่อง
          renderGrid();
          try{
            await apiPost('setUnitLabel', { unitId: uid, label: trimmed, staffName: state.staffName }, true);
          }catch(err){
            u.label = oldLabel;
            renderGrid();
            alert('แก้ชื่อหน่วยไม่สำเร็จ: ' + err.message);
          }
        };
      });
    }
    if(CAMERA_PER_PRODUCT_ENABLED){
      grid.querySelectorAll('.prod-photo-area.no-photo').forEach(area=>{
        area.onclick = ()=>{ photoTargetPid = area.dataset.pid; photoInput.click(); };
      });
    }
    // แตะช่องกรอก/กด +/- ของสินค้าไหน ถือว่าลูกจ้าง "เช็คแล้ว" สินค้าตัวนั้นทันที
    // ไม่ต้องกดวงกลม ✓ แยกอีกขั้น กันลืมกรอกแล้วข้อมูลไม่ถูกบันทึกตอนกด "เสร็จเจ้านี้"
    function markCardChecked(uid){
      supplierCheckDirty = true; // เรียกจากปุ่ม +/- ช่องกรอก และปุ่ม "ของหมด" — ทุกจุดที่แก้ stockValues จริง
      const card = grid.querySelector(`[data-unit="${uid}"]`)?.closest('.prod-card');
      if(!card) return;
      const pid = card.querySelector('.check-toggle')?.dataset.pid;
      if(!pid || checkedProducts.has(pid)) return;
      checkedProducts.add(pid);
      card.classList.add('checked');
      const icon = card.querySelector('.check-toggle i');
      if(icon){ icon.classList.remove('ti-circle'); icon.classList.add('ti-circle-check-filled'); }
      // เหมือน patch ใน .check-toggle onclick ด้านล่าง — พื้นหลังช่องรูป (กรณียังไม่มีรูป) ต้องเปลี่ยนเป็น
      // สีเช็คแล้วทันทีตรงนี้ด้วย ไม่งั้นจะไม่ตรงกับตอนกดวงกลม ✓ ตรงๆ (ค้างสีเดิมจนกว่าจะรีเฟรชทั้งหน้า)
      const photoArea = card.querySelector('.prod-photo-area');
      if(photoArea && !photoArea.querySelector('img')) photoArea.style.background = 'rgba(255,255,255,0.6)';
      updateBar();
    }
    grid.querySelectorAll('.minus, .plus').forEach(btn=>{
      btn.onclick = ()=>{
        const uid = btn.dataset.unit;
        const input = grid.querySelector(`.step-input[data-unit="${uid}"]`);
        let v = parseInt(input.value||0,10);
        v = btn.classList.contains('plus') ? v+1 : Math.max(0,v-1);
        input.value = v; stockValues[uid] = v;
        markCardChecked(uid);
      };
    });
    grid.querySelectorAll('.step-input').forEach(inp=>{
      inp.oninput = ()=>{
        stockValues[inp.dataset.unit] = Math.max(0, parseInt(inp.value||0,10));
        markCardChecked(inp.dataset.unit);
      };
    });
    // ปุ่มลัด "ของหมด" — ตั้งทุกหน่วยของสินค้านั้นเป็น 0 ให้ทันที (ไม่ต้องกด − ทีละหน่วย) แล้วนับว่า
    // เช็คแล้ว ไม่มีปุ่มยกเลิกแยกต่างหาก เพราะ "หมด" ไม่ใช่ flag พิเศษ แค่หมายถึง "เช็คแล้ว + คงเหลือ 0"
    // เหมือนกัน ถ้าลูกจ้างกด + เพิ่มจำนวนทีหลัง (เช่นไปเจอของในตู้เย็น) ตัวเลขก็จะโชว์แทน "หมด" เองอัตโนมัติ
    // ฝั่งเจ้าของ เพราะเป็นการอ่านค่าจำนวนจริง ไม่ได้เก็บสถานะ "เคยกดของหมด" ไว้แยก
    grid.querySelectorAll('.oos-btn').forEach(btn=>{
      btn.onclick = ()=>{
        const unitIds = btn.dataset.units.split(',');
        unitIds.forEach(uid=>{
          const input = grid.querySelector(`.step-input[data-unit="${uid}"]`);
          if(input) input.value = 0;
          stockValues[uid] = 0;
        });
        markCardChecked(unitIds[0]);
      };
    });
  }
  renderGrid();

  // skipDates เป็นค่าที่เจ้าของอาจตั้งขึ้นกะทันหันระหว่างวัน (เช่น เพิ่งกดงดสั่งเมื่อครู่นี้) ต่างจาก
  // ข้อมูลอื่นใน PRODUCTS/SUPPLIERS ที่แทบไม่เปลี่ยนบ่อย — ถ้าลูกจ้างเปิดหน้านี้ค้างมาตั้งแต่ก่อนเจ้าของ
  // จะกด PRODUCTS ที่โหลดมาตอน bootstrap() ครั้งแรกจะไม่รู้เรื่อง จึงรีเฟรช bootstrap เงียบๆ (แต่จำกัดความถี่
  // ด้วย refreshBootstrapIfStale กันยิง request ซ้ำถี่เกินไปตอนสลับดูหลายเจ้าติดๆ กัน ไปเพิ่มภาระ
  // Apps Script ที่ตอบช้าอยู่แล้วโดยไม่จำเป็น) แล้วอัปเดต products/แสดงผลใหม่ถ้าพบว่าเปลี่ยนไป
  refreshBootstrapIfStale(()=>{
    products.length = 0;
    products.push(...PRODUCTS.filter(p=>p.supplierId===sup.id));
    renderGrid();
  });

  const bar = document.createElement('div'); bar.className='stickybar';
  c.appendChild(bar);
  function updateBar(){
    const doneCount = products.filter(p=>checkedProducts.has(p.id)).length;
    bar.innerHTML = `<span><i class="ti ti-list-check" style="font-size:13px; vertical-align:-2px; margin-right:5px;"></i>เช็คแล้ว ${doneCount} จาก ${products.length} รายการ</span>
      <button class="btn-primary btn" id="finishSup">เสร็จเจ้านี้</button>`;
    bar.querySelector('#finishSup').onclick = async ()=>{
      const btn = bar.querySelector('#finishSup');
      btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
      try{
        const checkedItems = await saveCheckedItems();
        if(!checkedItems){
          btn.disabled = false; btn.textContent = 'เสร็จเจ้านี้';
          alert('ยังไม่ได้ติ๊กว่าเช็คสินค้าตัวไหนเลย');
          return;
        }
        go('staffDone');
      }catch(err){
        btn.disabled = false; btn.textContent = 'เสร็จเจ้านี้';
        alert('บันทึกไม่สำเร็จ: ' + err.message);
      }
    };
  }
  updateBar();

  app.appendChild(c);
}

/* ============ OWNER: PIN gate ============ */
function renderOwnerPin(app){
  app.appendChild(topbar('ใส่รหัสฝั่งเจ้าของร้าน', {back:()=>go('home')}));
  const c = document.createElement('div'); c.className='content';
  c.innerHTML = `
    <p style="font-size:13px; color:var(--text-secondary); margin:0 0 16px;">กรอกรหัสผ่านเพื่อเข้าฝั่งเจ้าของร้าน</p>
    <input type="password" inputmode="numeric" id="pinInput" maxlength="4" placeholder="••••" style="font-size:22px; text-align:center; letter-spacing:6px; padding:14px;">
    <p id="pinError" style="color:var(--danger); font-size:12px; margin:8px 0 0; min-height:16px; text-align:center;"></p>
  `;
  app.appendChild(c);
  const input = c.querySelector('#pinInput');
  const errEl = c.querySelector('#pinError');
  input.focus();

  let checking = false;
  async function trySubmit(){
    if(checking) return;
    const val = input.value.trim();
    if(val.length < 4) return;
    checking = true;
    input.disabled = true; errEl.textContent = 'กำลังตรวจสอบ...'; errEl.style.color = 'var(--text-secondary)';
    try{
      const res = await apiGet('checkPin', {pin: val});
      if(res && res.valid){ go('ownerMenu'); return; }
      errEl.textContent = 'รหัสไม่ถูกต้อง ลองใหม่อีกครั้ง'; errEl.style.color = 'var(--danger)';
      input.value='';
    }catch(err){
      errEl.textContent = 'ตรวจสอบรหัสไม่สำเร็จ: ' + err.message; errEl.style.color = 'var(--danger)';
    }
    checking = false; input.disabled = false; input.focus();
  }
  input.addEventListener('input', trySubmit);
}

/* ============ OWNER: merged Dashboard + Analytics ============ */
async function renderOwnerStockAnalytics(app){
  app.appendChild(topbar('สต๊อก & วิเคราะห์', {back:()=>go('ownerMenu')}));
  const c = document.createElement('div'); c.className='content';
  const tabs = document.createElement('div'); tabs.className='tabs';
  tabs.innerHTML = `<div class="tab ${state.ownerTab==='stock'?'active':''}" data-t="stock">สถานะสต๊อก</div>
                     <div class="tab ${state.ownerTab==='analytics'?'active':''}" data-t="analytics">วิเคราะห์การสั่งซื้อ</div>`;
  c.appendChild(tabs);
  const body = document.createElement('div'); body.innerHTML='<p class="empty-state">กำลังโหลด...</p>'; c.appendChild(body);
  app.appendChild(c);

  tabs.querySelectorAll('.tab').forEach(t=> t.onclick = ()=>{ go('ownerStockAnalytics', {ownerTab:t.dataset.t}); });

  try{
    if(state.ownerTab === 'stock'){
      const statusList = await getStockStatus();
      statusList.forEach(s=> Object.entries(s.remain||{}).forEach(([uid,val])=>{ if(val!==null) stockValues[uid]=val; }));
      renderStockTab(body);
    } else {
      const analytics = await apiGet('analytics', {range:'7d'});
      renderAnalyticsTab(body, analytics);
    }
  }catch(err){
    body.innerHTML = `<p class="empty-state" style="color:var(--danger);">โหลดข้อมูลไม่สำเร็จ: ${err.message}</p>`;
  }
}

function renderStockTab(body){
  const allProducts = PRODUCTS.map(p=>{
    const total = p.units.reduce((sum,u)=> sum + (stockValues[u.id]||0), 0);
    return {...p, total, empty: total===0};
  });
  const total = allProducts.length;
  const empty = allProducts.filter(p=>p.empty).length;

  body.innerHTML = `<div class="metric-grid">
      <div class="metric"><p>สินค้าทั้งหมด</p><p>${total}</p></div>
      <div class="metric" style="background:var(--green-bg);"><p style="color:var(--green);">ยังมี</p><p style="color:var(--green);">${total-empty}</p></div>
      <div class="metric" style="background:var(--amber-bg);"><p style="color:var(--amber);">หมด</p><p style="color:var(--amber);">${empty}</p></div>
    </div>
    <input type="text" id="search" placeholder="ค้นหาชื่อสินค้า" style="margin-bottom:10px;">
    <div id="tableWrap"></div>`;
  const tableWrap = body.querySelector('#tableWrap');

  function renderTable(filter){
    tableWrap.innerHTML='';
    SUPPLIERS.forEach(s=>{
      const items = allProducts.filter(p=>p.supplierId===s.id && p.name.includes(filter||''));
      if(!items.length) return;
      const col = NEUTRAL_COL;
      const head = document.createElement('div'); head.className='sup-header';
      head.style.background = col.bg; head.style.color = col.text; head.style.borderColor = col.text;
      head.innerHTML = `<span>${s.name}</span>`;
      tableWrap.appendChild(head);
      const tbl = document.createElement('table'); tbl.style.width='100%'; tbl.style.fontSize='13px'; tbl.style.marginBottom='10px';
      tbl.innerHTML = items.map(p=>`<tr style="border-bottom:1px solid var(--border);">
          <td style="padding:7px 4px;">${p.name}</td>
          <td style="padding:7px 4px; text-align:right;">${p.units.map(u=>`${stockValues[u.id]||0} ${u.label}`).join(' / ')}</td>
          <td style="padding:7px 4px; text-align:right; width:55px;">${p.empty? '<span class="badge" style="background:var(--amber-mid); color:#412402;">หมด</span>' : '<span style="color:var(--text-secondary); font-size:12px;">ยังมี</span>'}</td>
        </tr>`).join('');
      tableWrap.appendChild(tbl);
    });
  }
  renderTable('');
  body.querySelector('#search').oninput = debounce((e)=>renderTable(e.target.value), 250);
}

/* ============ OWNER: Order page (accordion, grouped by supplier) ============ */
async function renderOrderPage(app){
  app.appendChild(topbar('สั่งของ', {back:()=>go('ownerMenu')}));
  const c = document.createElement('div'); c.className='content';
  c.innerHTML = '<p class="empty-state">กำลังโหลดข้อมูล...</p>';
  app.appendChild(c);

  let statusList;
  try{
    const [sl, orderedRes, confirmedRes, orderedItemsRes] = await Promise.all([getStockStatus(), apiGet('orderedToday'), apiGet('confirmedToday'), apiGet('orderedItemsToday')]);
    statusList = sl;
    statusList.forEach(s=> Object.entries(s.remain||{}).forEach(([uid,val])=>{ if(val!==null) stockValues[uid]=val; }));
    orderedProductIds = new Set((orderedRes && orderedRes.productIds) || []);
    confirmedSupplierIds = new Set((confirmedRes && confirmedRes.supplierIds) || []);
    orderedItemsTodayMap = {};
    ((orderedItemsRes && orderedItemsRes.items) || []).forEach(it=>{ orderedItemsTodayMap[it.productId] = { qty: it.orderQty, unit: it.orderUnit }; });
  }catch(err){
    c.innerHTML = `<p class="empty-state" style="color:var(--danger);">โหลดข้อมูลไม่สำเร็จ: ${err.message}</p>`;
    return;
  }
  const statusByEntry = {}; statusList.forEach(s=> statusByEntry[s.productId] = s);
  const statusByProduct = {}; statusList.forEach(s=> statusByProduct[s.productId] = s.checked);
  // จัดกลุ่มสินค้าตาม supplierId ไว้ล่วงหน้าครั้งเดียว แทนการวน PRODUCTS.filter(p=>p.supplierId===s.id)
  // ทั้งอาเรย์ซ้ำๆ ทุกเจ้า ทุกครั้งที่ renderGroups()/supplierStats() ถูกเรียก (เช่น ทุกครั้งที่พิมพ์ค้นหา) —
  // PRODUCTS ไม่เปลี่ยนระหว่างที่อยู่หน้านี้ เลย cache แค่ครั้งเดียวพอ
  const productsBySupplier = new Map();
  PRODUCTS.forEach(p=>{
    if(!productsBySupplier.has(p.supplierId)) productsBySupplier.set(p.supplierId, []);
    productsBySupplier.get(p.supplierId).push(p);
  });
  function productsOf(supplierId){ return productsBySupplier.get(supplierId) || []; }

  c.innerHTML = `<div id="stats" class="stat-strip"></div>
    <div style="display:flex; gap:8px; margin-bottom:12px;">
      <input type="text" id="search" placeholder="ค้นหาชื่อสินค้าหรือชื่อเจ้า" style="flex:1;">
    </div>
    <div id="groups"></div>`;
  const statsEl = c.querySelector('#stats');
  const groups = c.querySelector('#groups');

  const expandedSuppliers = new Set();

  function supplierStats(s){
    const items = productsOf(s.id);
    const checkedCount = items.filter(p=>statusByProduct[p.id]).length;
    const isOrdered = items.some(p=> orderedProductIds.has(p.id));
    const isConfirmed = confirmedSupplierIds.has(s.id);
    return { items, checkedCount, isOrdered, isConfirmed };
  }

  function renderStats(){
    const withItems = SUPPLIERS.filter(s=> productsOf(s.id).length > 0);
    let checkedSuppliers = 0, orderedSuppliers = 0, confirmedSuppliers = 0;
    withItems.forEach(s=>{
      const { items, checkedCount, isOrdered, isConfirmed } = supplierStats(s);
      const fullyChecked = items.length > 0 && checkedCount === items.length;
      if(fullyChecked) checkedSuppliers++;
      if(isOrdered) orderedSuppliers++;
      if(isConfirmed) confirmedSuppliers++;
    });
    statsEl.innerHTML = `
      <div class="stat-card"><div class="n">${withItems.length}</div><div class="lbl">เจ้าทั้งหมด</div></div>
      <div class="stat-card green"><div class="n">${checkedSuppliers}</div><div class="lbl">เช็คสต๊อกแล้ว</div></div>
      <div class="stat-card amber"><div class="n">${orderedSuppliers}</div><div class="lbl">สร้างข้อความแล้ว</div></div>
      <div class="stat-card amber"><div class="n">${confirmedSuppliers}</div><div class="lbl">ส่งออเดอร์แล้ว</div></div>
    `;
  }

  function renderGroups(filter){
    groups.innerHTML='';
    // เจ้าที่ถึงรอบสั่งวันนี้ (ตาม OrderDays) ขึ้นก่อนเสมอ แยกเป็นเซกชัน "ต้องสั่งวันนี้" ด้านบน
    // กับ "เจ้าอื่นทั้งหมด" ด้านล่าง (การ์ดหรี่ลงนิดหน่อย) แทนป้ายลอยติดชื่อทีละใบ — อ่านง่ายกว่าตอนมีหลายเจ้า
    // ไม่ได้ซ่อนเจ้าอื่นออกจากรายการ เพราะเจ้าที่ไม่ได้กำหนดรอบ (orderDays ว่าง) ก็ยังต้องสั่งได้ตามปกติ
    const sortedSuppliers = [...SUPPLIERS].sort((a,b)=> (supplierDueToday(b)?1:0) - (supplierDueToday(a)?1:0));

    // เดินลูปแบบ dry-run ก่อนรอบเดียว แค่เพื่อนับว่าเจ้าที่ผ่านตัวกรอง (filter) มีกี่เจ้าอยู่ในแต่ละเซกชัน
    // ใช้โชว์ตัวเลข "· N เจ้า" ต่อท้ายหัวข้อเซกชัน โดยไม่ต้องคำนวณ allItems/items ซ้ำสองรอบเต็มๆ ในลูปหลัก
    let dueCount = 0, restCount = 0;
    sortedSuppliers.forEach(s=>{
      const allItems = productsOf(s.id);
      if(!allItems.length) return;
      const hasMatch = allItems.some(p=>p.name.includes(filter||'') || s.name.includes(filter||''));
      if(!hasMatch) return;
      if(supplierDueToday(s)) dueCount++; else restCount++;
    });
    if(dueCount){
      const dueLabel = document.createElement('div'); dueLabel.className = 'section-label due';
      dueLabel.textContent = `ต้องสั่งวันนี้ · ${dueCount} เจ้า`;
      groups.appendChild(dueLabel);
    }
    const restLabel = document.createElement('div'); restLabel.className = 'section-label';
    restLabel.textContent = dueCount ? `เจ้าอื่นทั้งหมด · ${restCount} เจ้า` : 'เจ้าทั้งหมด';
    let restLabelInserted = false;
    const otherSection = document.createElement('div'); otherSection.className = 'other-section';

    sortedSuppliers.forEach(s=>{
      const allItems = productsOf(s.id);
      if(!allItems.length) return;
      const items = allItems.filter(p=>p.name.includes(filter||'') || s.name.includes(filter||''));
      if(!items.length) return;
      const dueToday = supplierDueToday(s);
      const stockupNote = supplierStockupNote(s);
      // เจ้ากลุ่มแรกที่ไม่ถึงรอบวันนี้ (ตามลำดับที่ sort ไว้แล้ว) คือจุดเริ่มเซกชัน "เจ้าอื่นทั้งหมด"
      if(!dueToday && !restLabelInserted){ groups.appendChild(restLabel); groups.appendChild(otherSection); restLabelInserted = true; }
      const renderTarget = dueToday ? groups : otherSection;

      const { checkedCount, isOrdered, isConfirmed } = supplierStats(s);
      const fullyChecked = allItems.length > 0 && checkedCount === allItems.length;
      const open = expandedSuppliers.has(s.id);

      // เดิมบังคับให้เช็คสต๊อกครบทุกรายการก่อนถึงจะขึ้นสถานะ "สั่งแล้ว" — แต่ในทางปฏิบัติ
      // บางเจ้ามีของหลายสิบรายการ แต่วันนี้อยากสั่งแค่ 1-2 อย่างโดยไม่ต้องไล่เช็คสต๊อกทั้งหมด
      // จึงตัดเงื่อนไข fullyChecked ออก ขอแค่มีการสร้างข้อความสั่งของไปแล้วก็พอ (isOrdered)
      const orderDone = isOrdered;
      // Single combined status per supplier — one line, one color, states an action
      // rather than two badges (stock-check count vs order status) that read as unrelated.
      // นับตามจำนวนสินค้าที่ลูกจ้างกดติ๊กว่าเช็คแล้วจริงๆ เท่านั้น — สินค้าที่ลูกจ้างเช็คแล้วแต่ไม่มีของ
      // (กรอกคงเหลือเป็น 0) ก็นับว่า "เช็คแล้ว" เหมือนกัน เพราะติ๊กผ่านการเช็คสต๊อกไปแล้วจริง
      const checkedRatio = `${checkedCount}/${allItems.length}`;
      let stateClass, statusText, subText;
      if(orderDone){ stateClass='ordered'; statusText='✓ สั่งของแล้ววันนี้'; subText=`เช็คสต๊อกแล้ว ${checkedRatio} รายการ`; }
      else if(checkedCount === 0){ stateClass='wait'; statusText='⏳ รอเช็คสต๊อก'; subText=`ลูกจ้างยังไม่เริ่มเช็ค (${checkedRatio} รายการ)`; }
      else if(!fullyChecked){ stateClass='partial'; statusText='⏳ เช็คสต๊อกค้างอยู่'; subText=`เช็คแล้ว ${checkedRatio} รายการ`; }
      else{ stateClass='wait'; statusText='✓ เช็คสต๊อกครบแล้ว'; subText=`พร้อมเลือกรายการที่จะสั่ง (${checkedRatio})`; }

      // จำนวนรายการที่เจ้าของกดเลือกจะสั่งจริง (orderQty > 0) — นับจากที่กรอกเองล้วนๆ
      // ไม่เกี่ยวกับคงเหลือ/เช็คสต๊อก เพื่อไม่ให้ปนกับความไม่แน่นอนว่า "คงเหลือ 0" หมายถึงหมดจริงหรือลูกจ้างข้าม
      const baseSubText = subText;
      function countSelected(){ return allItems.filter(p=> (state.orderQty[p.id] ?? 0) > 0).length; }
      function selectedSuffix(){ const n = countSelected(); return n > 0 ? ` · เลือกไว้ ${n} รายการ` : ''; }
      subText = baseSubText + selectedSuffix();

      const card = document.createElement('div'); card.className = 'ord-card state-' + stateClass + (open?' open':'');
      const strip = document.createElement('div'); strip.className = 'ord-card-strip';
      card.appendChild(strip);
      const main = document.createElement('div'); main.className = 'ord-card-main';

      const head = document.createElement('div'); head.className = 'ord-card-head';
      head.innerHTML = `
        <i class="ti ti-chevron-down chev"></i>
        <button type="button" class="order-done-check${isConfirmed?' confirmed':''}" title="กดเมื่อส่งออเดอร์ให้ร้านนี้แล้วจริง">${isConfirmed?'✓':''}</button>
        <span class="ord-card-name">${s.name}</span>
        <div class="ord-card-status">
          <div class="status-top-row">
            ${stockupNote ? `<span class="stockup-tag">${stockupNote}</span>` : ''}
            <span class="status-line ${stateClass}">${statusText}</span>
          </div>
          <span class="status-sub">${subText}</span>
        </div>
      `;
      head.onclick = ()=>{
        if(expandedSuppliers.has(s.id)) expandedSuppliers.delete(s.id); else expandedSuppliers.add(s.id);
        renderGroups(c.querySelector('#search').value);
      };
      main.appendChild(head);

      // วงกลม "✓" หน้าชื่อเจ้า — โผล่ทุกเจ้าเสมอ (ไม่ผูกกับ orderDone อีกต่อไป) เพราะบางทีเจ้าของ
      // สั่งของเองนอกแอปโดยไม่ผ่านการสร้างข้อความในระบบเลย ก็ยังต้องกดยืนยันว่าสั่งไปแล้วได้
      // ใช้เป็นปุ่มกดยืนยันด้วยมือว่า "ส่งออเดอร์ให้ร้านจริงแล้ว": วงว่าง = ยังไม่ได้ส่ง, วงเขียวมี ✓ = ส่งแล้ว
      // แยกจากสถานะ "สร้างข้อความแล้ว" (statusText ด้านขวา) ซึ่งแค่บอกว่าแอปบันทึกคำสั่งซื้อให้เท่านั้น
      // ไม่ได้รู้ว่าข้อความถูกส่งออกไปหา supplier จริงหรือยัง
      const confirmBtn = head.querySelector('.order-done-check');
      if(confirmBtn){
        // เก็บสถานะปัจจุบันไว้แยกในตัวแปรนี้ (ไม่ใช้ isConfirmed ตรงๆ) เพราะไม่ได้ renderGroups() ใหม่
        // ทั้งหน้าหลังกดสำเร็จอีกต่อไป (เพื่อความไว) — ถ้ายังอิง isConfirmed เดิม กดสลับซ้ำสองครั้ง
        // ในการ์ดเดียวกันโดยไม่รีเฟรชหน้า ครั้งที่สองจะยังอ่านค่าตั้งต้นเก่าอยู่ ผิดสถานะจริง
        let confirmedNow = isConfirmed;
        confirmBtn.onclick = async (e)=>{
          e.stopPropagation();
          const checked = !confirmedNow;
          // อัปเดตหน้าจอให้เห็นผลทันที ไม่รอ apiPost เสร็จก่อน (Apps Script มัก 1-3 วิ กว่าจะตอบ
          // กดแล้วรอเห็นผลช้าจะรู้สึกเหมือนกดไม่ติด) ค่อยยิงไปบันทึกจริงเบื้องหลัง แล้วเด้งกลับ
          // สถานะเดิมพร้อมแจ้งเตือนถ้าบันทึกไม่สำเร็จ
          confirmedNow = checked;
          confirmBtn.classList.toggle('confirmed', checked);
          confirmBtn.textContent = checked ? '✓' : '';
          if(checked) confirmedSupplierIds.add(s.id); else confirmedSupplierIds.delete(s.id);
          renderStats();
          try{
            await apiPost('setSupplierOrderConfirm', { supplierId: s.id, confirmed: checked, staffName: state.staffName }, true);
          }catch(err){
            confirmedNow = !checked;
            confirmBtn.classList.toggle('confirmed', !checked);
            confirmBtn.textContent = !checked ? '✓' : '';
            if(checked) confirmedSupplierIds.delete(s.id); else confirmedSupplierIds.add(s.id);
            renderStats();
            alert('บันทึกสถานะไม่สำเร็จ: ' + err.message);
          }
        };
      }

      const body = document.createElement('div'); body.className = 'ord-card-body';

      const allSelected = items.length > 0 && items.every(p=> (state.orderQty[p.id] ?? 0) > 0);
      const selectRow = document.createElement('div'); selectRow.className = 'select-all-row';
      selectRow.innerHTML = `<button type="button" class="link-btn" data-selecttoggle>${allSelected ? 'ไม่เลือกเลย' : 'เลือกทั้งหมด'}</button>`;
      selectRow.querySelector('[data-selecttoggle]').onclick = ()=>{
        if(allSelected) items.forEach(p=> state.orderQty[p.id] = 0);
        else items.forEach(p=>{ state.orderQty[p.id] = state.orderQty[p.id] > 0 ? state.orderQty[p.id] : 1; });
        renderGroups(c.querySelector('#search').value);
      };
      body.appendChild(selectRow);

      const groupBox = document.createElement('div'); groupBox.className='acc-group'; groupBox.style.borderRadius='0'; groupBox.style.border='none';

      items.forEach(p=>{
        const itemChecked = !!statusByProduct[p.id];
        if(state.orderQty[p.id]===undefined) state.orderQty[p.id] = 0;
        const qty = state.orderQty[p.id];
        // สินค้าที่มีหลายหน่วย (เล็ก→ใหญ่ เรียงตาม SortOrder) แสดงคงเหลือของทุกหน่วย
        // แต่สั่งของเป็นหน่วยใหญ่สุดเสมอ
        const uLabel = orderUnitLabel(p);
        const remainEntry = statusByEntry[p.id];
        const remainParts = p.units.map(u=>{
          const v = remainEntry ? remainEntry.remain[u.id] : null;
          return (v!==null && v!==undefined) ? `${v}<span class="u">${u.label}</span>` : null;
        }).filter(Boolean);
        const remainValues = p.units.map(u=> remainEntry ? remainEntry.remain[u.id] : null);
        // เช็คแล้ว + ทุกหน่วยคงเหลือ 0 = "หมด" จริง (ไม่ใช่แค่ยังไม่ได้เช็ค) — ไม่ต้องมี flag พิเศษเก็บแยก
        // เพราะข้อมูลนี้แยกออกจากกันอยู่แล้ว: ไม่เช็คเลย = remain เป็น null, เช็คแล้วคงเหลือ 0 = remain เป็น 0
        const isOutOfStock = itemChecked && remainValues.length && remainValues.every(v=> v===0);
        const remainDisplay = isOutOfStock ? `<span class="oos-badge">หมด</span>`
          : (itemChecked && remainParts.length ? remainParts.join(' ') : '–');

        const skipDates = upcomingSkipDates(p);
        const isSkipSet = skipDates.length > 0;

        const row = document.createElement('div');
        row.className = 'prow' + (isSkipSet ? ' skip-set' : '');
        row.innerHTML = `
          <div class="prow-top">
            <input type="checkbox" ${qty>0?'checked':''} data-check="${p.id}">
            <div class="prow-name-wrap">
              <div class="prow-name">${p.name}</div>
              ${isSkipSet ? `<span class="prow-skip-sub">🚫 งด${skipDates.length>1?`${skipDates.length} วัน: `:'สั่งถึง '}${skipDates.map(formatShortThaiDate).join(', ')}</span>` : ''}
            </div>
            <button type="button" class="skip-toggle-btn${isSkipSet?' active':''}" data-skiptoggle="${p.id}">${isSkipSet?'ยกเลิกงด':'งดสั่งวันนี้'}</button>
          </div>
          <div class="prow-bottom">
            <div class="stat"><span class="lbl">คงเหลือ</span><span class="v">${remainDisplay}</span></div>
            <div class="stepper">
              <button type="button" data-step="-1">−</button>
              <input type="text" inputmode="numeric" pattern="[0-9]*" class="stepper-input" value="${qty}" min="0" step="1" data-qty="${p.id}">
              <button type="button" data-step="1">+</button>
              <span class="unit-tag unit-tag-editable" data-unit-edit="${p.units[p.units.length-1].id}">${uLabel} <i class="ti ti-pencil" aria-hidden="true"></i></span>
            </div>
          </div>
        `;
        groupBox.appendChild(row);

        row.querySelector('[data-unit-edit]').onclick = async (e)=>{
          e.stopPropagation();
          const unit = p.units[p.units.length-1];
          const current = unit.orderLabel || unit.label;
          // แก้แค่ป้ายที่ใช้ตอนสั่งของกับซัพพลายเออร์ — ไม่กระทบป้ายที่ลูกจ้างใช้เช็คสต๊อก (unit.label)
          const newLabel = prompt('แก้ชื่อหน่วยที่ใช้ตอนสั่งของกับซัพพลายเออร์ของ "' + p.name + '"\n(ไม่กระทบหน่วยที่ลูกจ้างใช้เช็คสต๊อก)', current);
          if(newLabel===null) return; // ยกเลิก
          const trimmed = newLabel.trim();
          if(!trimmed || trimmed===current) return;
          const oldOrderLabel = unit.orderLabel;
          unit.orderLabel = trimmed; // อัปเดตให้เห็นผลทันทีในเครื่อง
          renderGroups(c.querySelector('#search').value);
          try{
            await apiPost('setOrderUnitLabel', { unitId: unit.id, label: trimmed }, true);
          }catch(err){
            unit.orderLabel = oldOrderLabel;
            renderGroups(c.querySelector('#search').value);
            alert('แก้ชื่อหน่วยไม่สำเร็จ: ' + err.message);
          }
        };

        row.querySelector('[data-skiptoggle]').onclick = (e)=>{
          e.stopPropagation();
          if(isSkipSet){
            // ยกเลิกทุกวันที่ตั้งงดไว้ล่วงหน้าของสินค้าตัวนี้ในครั้งเดียว ไม่ใช่แค่วันล่าสุดวันเดียว —
            // เผื่อเคสที่เจ้าของตั้งงดไว้หลายวันไม่ติดกัน (เช่น งดทั้งวันนี้และอีก 3 วันข้างหน้าแยกกัน)
            const msg = skipDates.length > 1
              ? `ยกเลิกงดสั่ง "${p.name}" ทั้งหมด ${skipDates.length} วันที่ตั้งไว้?`
              : `ยกเลิกงดสั่ง "${p.name}"?`;
            if(!confirm(msg)) return;
            (async ()=>{
              try{
                await Promise.all(skipDates.map(date=>
                  apiPost('setProductSkipDate', { productId: p.id, date, skip: false }, true)
                ));
                p.skipDates = (p.skipDates||[]).filter(d=> !skipDates.includes(d));
                renderGroups(c.querySelector('#search').value);
              }catch(err){ alert('ยกเลิกไม่สำเร็จ: ' + err.message); }
            })();
          }else{
            openSkipDatePicker(p, async (date)=>{
              try{
                await apiPost('setProductSkipDate', { productId: p.id, date, skip: true }, true);
                p.skipDates = [...(p.skipDates||[]), date];
                renderGroups(c.querySelector('#search').value);
              }catch(err){ alert('บันทึกไม่สำเร็จ: ' + err.message); }
            });
          }
        };

        const qtyInput = row.querySelector(`[data-qty="${p.id}"]`);
        function setQty(v){
          state.orderQty[p.id] = Math.max(0, Math.round(v));
          qtyInput.value = state.orderQty[p.id];
          row.querySelector('[data-check]').checked = state.orderQty[p.id] > 0;
          const subEl = head.querySelector('.status-sub');
          if(subEl) subEl.textContent = baseSubText + selectedSuffix();
        }
        row.querySelector('[data-check]').onchange = (e)=>{
          setQty(e.target.checked ? 1 : 0);
        };
        qtyInput.oninput = (e)=> setQty(parseFloat(e.target.value||0));
        row.querySelectorAll('[data-step]').forEach(btn=>{
          btn.onclick = ()=> setQty(state.orderQty[p.id] + Number(btn.dataset.step));
        });
      });
      body.appendChild(groupBox);

      {
        const btnRow = document.createElement('div'); btnRow.className = 'sup-order-btn-row';
        const hasOrderedItemsToday = allItems.some(p=> orderedItemsTodayMap[p.id] && orderedItemsTodayMap[p.id].qty > 0);
        if(hasOrderedItemsToday){
          const viewBtn = document.createElement('button');
          viewBtn.type = 'button';
          viewBtn.className = 'btn'; viewBtn.style.fontSize='12px'; viewBtn.style.padding='6px 10px';
          viewBtn.innerHTML = '<i class="ti ti-message-2" style="font-size:13px; vertical-align:-2px;" aria-hidden="true"></i> ดูข้อความที่สั่งไปอีกครั้ง';
          viewBtn.onclick = (e)=>{
            e.stopPropagation();
            viewHistorySupplierId = s.id;
            go('orderMessage');
          };
          btnRow.appendChild(viewBtn);
        }
        const btn = document.createElement('button');
        btn.className = 'btn btn-primary'; btn.style.fontSize='12px'; btn.style.padding='6px 10px';
        btn.textContent = isOrdered ? 'สั่งของเจ้านี้อีกครั้ง' : 'สั่งของเจ้านี้';
        btn.onclick = async (e)=>{
          e.stopPropagation();
          const supItems = allItems.filter(p=> (state.orderQty[p.id] ?? 0) > 0).map(p=>{
            return { productId:p.id, forecast: 0, orderQty: state.orderQty[p.id], rateUsed: 1, orderUnit: orderUnitLabel(p) };
          });
          if(!supItems.length){ alert('ยังไม่ได้เลือกรายการที่จะสั่งของเจ้านี้'); return; }
          const originalLabel = btn.textContent;
          btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
          try{
            await apiPost('createOrderBatch', { items: supItems });
            supItems.forEach(it=>{
              orderedProductIds.add(it.productId);
              orderedItemsTodayMap[it.productId] = { qty: it.orderQty, unit: it.orderUnit };
            });
            // พาไปหน้าสร้างข้อความสั่งของทันที (เหมือนปุ่ม "สร้างข้อความสั่งของทั้งหมด" เดิม) แทนการ
            // แค่บันทึกเงียบๆ แล้วอยู่หน้าเดิม — กดแล้วปุ่มเปลี่ยนเป็น "กำลังบันทึก..." ชั่วครู่แล้ว "หายไป"
            // (การ์ดถูก re-render ใหม่) ทำให้ไม่รู้ว่าเกิดอะไรขึ้น พาไปหน้าถัดไปเลยเห็นผลชัดเจนกว่า
            lastOrderMessageSnapshot = {};
            supItems.forEach(it=>{ lastOrderMessageSnapshot[it.productId] = it.orderQty; state.orderQty[it.productId] = 0; });
            go('orderMessage');
          }catch(err){
            btn.disabled = false; btn.textContent = originalLabel;
            alert('บันทึก OrderLogs ไม่สำเร็จ: ' + err.message);
          }
        };
        btnRow.appendChild(btn);
        body.appendChild(btnRow);
      }

      main.appendChild(body);
      card.appendChild(main);
      renderTarget.appendChild(card);
    });
    if(!dueCount && !restCount) groups.innerHTML = '<p class="empty-state">ไม่พบสินค้าที่ค้นหา</p>';
  }

  renderStats();
  renderGroups('');
  c.querySelector('#search').oninput = debounce((e)=>{ renderStats(); renderGroups(e.target.value); }, 250);
}

/* ============ OWNER: Order message ============ */
function renderOrderMessage(app){
  app.appendChild(topbar('สร้างข้อความสั่งของ', {back:()=>go('orderPage')}));
  const c = document.createElement('div'); c.className='content';

  let items;
  if(viewHistorySupplierId){
    // มาจากปุ่ม "ดูข้อความที่สั่งไปอีกครั้ง" — ดึงจาก orderedItemsTodayMap (ข้อมูลจริงจาก OrderLogs
    // ฝั่ง Apps Script) ไม่ใช่ state.orderQty สดๆ (ซึ่งถูกเคลียร์ไปแล้วหลังสั่งสำเร็จ) และไม่ยิง
    // createOrderBatch ซ้ำด้วย — ใช้ได้กับออเดอร์ที่สั่งไปแล้ววันนี้ทุกอัน ไม่ว่าจะสั่งจากเครื่อง/รอบไหนก็ตาม
    const supId = viewHistorySupplierId;
    viewHistorySupplierId = null;
    items = PRODUCTS.filter(p=> p.supplierId===supId && orderedItemsTodayMap[p.id] && orderedItemsTodayMap[p.id].qty>0)
      .map(p=> ({...p, orderUnit: orderedItemsTodayMap[p.id].unit || orderUnitLabel(p), qty: orderedItemsTodayMap[p.id].qty}));
  } else {
    // ใช้สแนปช็อตที่เพิ่งสั่งไปถ้ามี (มาจากปุ่ม "สร้างข้อความสั่งของทั้งหมด") แทน state.orderQty
    // สดๆ เพราะ state.orderQty ถูกเคลียร์เป็น 0 ไปแล้วหลังสั่งสำเร็จ กันสั่งซ้ำ
    const qtySource = lastOrderMessageSnapshot || state.orderQty;
    lastOrderMessageSnapshot = null;
    items = Object.entries(qtySource).filter(([id,q])=>q>0).map(([id,q])=>{
      const p = PRODUCTS.find(x=>x.id===id);
      return {...p, orderUnit: orderUnitLabel(p), qty:q};
    });
  }
  const bySupplier = {};
  items.forEach(it=>{ (bySupplier[it.supplierId] = bySupplier[it.supplierId]||[]).push(it); });

  if(!Object.keys(bySupplier).length){
    c.innerHTML = '<p class="empty-state">ยังไม่มีรายการที่เลือกสั่ง กลับไปหน้าสั่งของก่อนนะครับ</p>';
    app.appendChild(c); return;
  }

  Object.entries(bySupplier).forEach(([supId, list])=>{
    const sup = SUPPLIERS.find(s=>s.id===supId);
    const col = NEUTRAL_COL;
    // ฟอนต์โมโนสเปซ (เช่น Courier New) ไม่รองรับตัวอักษรไทย เบราว์เซอร์เลย fallback ไปใช้ฟอนต์ไทย
    // แบบสัดส่วน (proportional) แทน — ผลคือ pad ด้วยจำนวนตัวอักษร/ช่องว่างแล้วไม่ตรงกันจริงบนจอ
    // แก้โดยไม่พึ่งการนับตัวอักษรเลย ใช้ CSS grid 3 คอลัมน์ (ชื่อ | จำนวน | หน่วยนับ)
    // — ต้องเป็น grid container เดียวที่ครอบทุกแถว (ไม่ใช่ grid แยกทีละแถว) ความกว้างคอลัมน์
    // ถึงจะคำนวณรวมจากทุกแถวแล้วตรงกันจริง ไม่ว่าชื่อแถวไหนจะสั้นหรือยาวแค่ไหน
    const rowsHtml = list.map((it,i)=>`
      <span style="min-width:0;">${i+1}. ${it.name}</span>
      <span style="text-align:right; white-space:nowrap;">${it.qty}</span>
      <span style="text-align:left; white-space:nowrap;">${it.orderUnit}</span>`).join('');
    // ข้อความล้วนสำหรับคัดลอกไปวางแอปอื่น (LINE ฯลฯ) — คุมฟอนต์ปลายทางไม่ได้ จึงคั่นด้วยช่องว่างคงที่
    // แทนการพยายามจัดคอลัมน์ด้วยจำนวนช่องว่างผันแปร (ซึ่งตรงเฉพาะตอนพรีวิวในแอปเท่านั้น)
    // ใช้ non-breaking space ( ) คั่นระหว่าง "จำนวน" กับ "หน่วยนับ" แทนช่องว่างปกติ
    // กันไม่ให้กล่องแชทไลน์ (ที่ความกว้างจำกัด) ตัดขึ้นบรรทัดใหม่คั่นกลางระหว่างเลขกับหน่วย
    // เช่น "22 หิ้ว" ต้องขึ้นบรรทัดใหม่ด้วยกันทั้งคู่ ไม่ใช่ "22" ค้างบรรทัดบนแล้ว "หิ้ว" กระเด็นไปบรรทัดล่าง
    const lines = list.map((it,i)=>`${i+1}. ${it.name}  ${it.qty} ${it.orderUnit}`).join('\n');
    const todayLabel = new Date().toLocaleDateString('th-TH', {year:'numeric', month:'short', day:'numeric'});
    const text = `สั่งสินค้า\nวันที่สั่ง: ${todayLabel}\n\nรายการสั่งของ\n${lines}`;

    const card = document.createElement('div');
    card.style.background='#fff'; card.style.border='1px solid var(--border)';
    card.style.borderLeft = `3px solid ${col.text}`; card.style.borderRadius='0 var(--radius-lg) var(--radius-lg) 0'; card.style.padding='14px'; card.style.marginBottom='12px';
    card.innerHTML = `
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
        <p style="margin:0; font-weight:600; font-size:14px;">${sup.name}</p>
        <button class="btn copy-btn" style="font-size:12px; padding:6px 10px;"><i class="ti ti-copy" style="font-size:13px;"></i> คัดลอก</button>
      </div>
      <div style="display:grid; grid-template-columns:1fr auto auto; column-gap:8px; row-gap:4px; align-items:baseline; font-size:12px; line-height:1.5; background:var(--bg); padding:10px; border-radius:8px;">${rowsHtml}</div>
    `;
    card.querySelector('.copy-btn').onclick = ()=>{
      navigator.clipboard?.writeText(text).catch(()=>{});
      const toast = document.createElement('div'); toast.className='copy-toast'; toast.textContent='คัดลอกแล้ว';
      document.body.appendChild(toast); setTimeout(()=>toast.remove(), 1400);
    };
    c.appendChild(card);
  });

  // ปุ่ม "เสร็จสิ้น" แยกจากลูกศร back — กดลูกศร back รู้สึกเหมือนยกเลิก/ย้อนแอ็คชั่น
  // ทั้งที่จริงๆ ข้อความถูกสร้าง+บันทึกลง OrderLogs ไปแล้วตั้งแต่ก่อนเข้าหน้านี้
  // ปุ่มนี้แค่พากลับไปหน้าสั่งของเหมือนกัน แต่สื่อความหมายตรงว่า "คัดลอกเสร็จแล้ว จบงานนี้"
  const doneBtn = document.createElement('button');
  doneBtn.className = 'btn btn-primary btn-block';
  doneBtn.style.marginTop = '4px';
  doneBtn.textContent = 'เสร็จสิ้น';
  doneBtn.onclick = ()=> go('orderPage');
  c.appendChild(doneBtn);

  app.appendChild(c);
}

bootstrap();
</script>
