<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ซามูไรไส้กรอก — เช็คสต๊อก & สั่งของ</title>
<link rel="apple-touch-icon" href="/icon-192-black.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192-black.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- ให้เบราว์เซอร์เริ่ม DNS + จับมือ TLS กับ backend ล่วงหน้าตั้งแต่หน้าเพิ่งเริ่มโหลด แทนที่จะรอให้
     สคริปต์ท้าย body เรียก apiGet('bootstrap') ก่อนถึงจะเริ่มเชื่อมต่อ — ช่วยเฉพาะตอน "เชื่อมต่อเย็น"
     (เพิ่งเปิดแท็บ/แอปใหม่ ไม่มีอะไรแคชไว้เลย) ซึ่งเป็นเคสที่ช้าที่สุด ดูคอมเมนต์ใน bootstrap() ด้วย —
     ใส่ทั้งสองโดเมนเพราะ script.google.com/exec redirect ไปยัง script.googleusercontent.com เสมอ -->
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<!-- media="print" + onload swap กันฟอนต์/ไอคอนจาก CDN บล็อกการรันสคริปต์หลักของแอป (สคริปต์เดียวที่ยิง
     apiGet('bootstrap') อยู่ท้าย body ต่อจาก <link> พวกนี้ — เบราว์เซอร์จะไม่รันสคริปต์ที่ตามหลัง
     stylesheet ที่ยังโหลดไม่เสร็จ ถ้าเน็ตเอื้อมไม่ถึง fonts.googleapis.com/cdn.jsdelivr.net ได้ (แพลตฟอร์ม
     บล็อก/เน็ตร้านหลุด) ทั้งแอปจะค้างจอเปล่าหลายวินาทีถึงหลักสิบวินาทีโดยไม่จำเป็น) -->
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" media="print" onload="this.media='all'">
<style>
  :root{
    --brand:#1A1A1A; --brand-bg:#ECECEA;
    --cream:#FCF9F2;
    --bg:#F1EFE8;
    --text:#2C2C2A; --text-secondary:#5F5E5A; --text-tertiary:#888780;
    --border:rgba(44,44,42,0.12); --border-strong:rgba(44,44,42,0.22);
    --radius-md:8px; --radius-lg:12px;
    --green:#085041; --green-bg:#E1F5EE;
    /* สเกลความเสี่ยงของการจับคู่รายการบิล (รับของ-ถ่ายบิล): เขียว(ตรงเป๊ะ) < เหลือง(คล้าย ต้องยืนยัน) <
       ส้ม(จับคู่ไม่ได้เลย — ใช้ --amber ด้านล่างนี้แหละ) — ดู renderBillReview() */
    --yellow:#7A6900; --yellow-bg:#FFF6C8;
    --amber:#854F0B; --amber-bg:#FAEEDA; --amber-mid:#EF9F27;
    --purple:#3C3489; --purple-bg:#EEEDFE;
    --pink:#993556; --pink-bg:#FBEAF0;
    --danger:#A32D2D; --danger-bg:#FCEBEB;
  }
  *{box-sizing:border-box;}
  body{font-family:'Sarabun',sans-serif; background:var(--bg); color:var(--text); margin:0; -webkit-font-smoothing:antialiased;}
  #app{max-width:600px; margin:0 auto; min-height:100vh; background:var(--cream); display:flex; flex-direction:column;}
  .topbar{background:var(--brand); color:var(--cream); padding:14px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:10;}
  .topbar h1{font-size:16px; font-weight:600; margin:0; flex:1;}
  .topbar .back{cursor:pointer; font-size:18px; background:none; border:none; color:var(--cream); padding:4px;}
  .topbar .meta{font-size:13px; opacity:0.9;}
  .content{flex:1; padding:14px; padding-bottom:80px;}
  button{font-family:inherit;}
  .btn{border:1px solid var(--border-strong); background:var(--cream); color:var(--text); border-radius:var(--radius-md); padding:9px 14px; font-size:13px; cursor:pointer;}
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--brand); color:var(--cream); border:none; font-weight:600;}
  .btn-text-cancel{width:100%; margin-top:8px; padding:9px 14px; background:none; border:none; color:var(--text-secondary); font-size:13px; text-decoration:underline; cursor:pointer;}
  .btn-block{width:100%; padding:12px; font-size:14px;}
  input[type=text], input[type=number], input[type=password], select{
    font-family:inherit; font-size:14px; border:1px solid var(--border-strong); border-radius:var(--radius-md);
    padding:8px 10px; width:100%; background:#fff; color:var(--text);
  }
  input:focus, select:focus{outline:2px solid var(--brand); outline-offset:1px;}
  table{border-collapse:collapse;}

  /* employee: supplier list */
  .progress-track{height:6px; background:var(--bg); border-radius:8px; overflow:hidden; margin:10px 0 14px;}
  .progress-fill{height:100%; background:var(--cream); opacity:0.8; border-radius:8px;}
  .sup-row{display:flex; align-items:center; gap:10px; padding:8px 12px; border:1px solid var(--border); border-radius:var(--radius-md); margin-bottom:6px; cursor:pointer; background:#fff;}
  .sup-row.done{opacity:0.5;}
  .sup-thumb{width:44px; height:44px; border-radius:var(--radius-md); background:var(--bg); display:flex; align-items:center; justify-content:center; color:var(--text-tertiary); font-size:18px; flex-shrink:0;}
  .sup-row p{margin:0; font-size:14px; font-weight:500; flex:1;}
  .section-label{font-size:13px; color:var(--text-secondary); margin:14px 0 6px; font-weight:500;}

  /* employee: stock check grid */
  .prod-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; align-items:stretch;}
  .prod-card{border-radius:16px; padding:10px; border:2px solid var(--border); display:flex; flex-direction:column; height:100%;}
  .prod-card.checked{background:#EAF3DE; border-color:#639922;}
  .prod-photo-area{position:relative; width:100%; padding-top:100%; border-radius:12px; overflow:hidden; margin-bottom:8px;}
  .prod-photo-area .photo-inner{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
  .prod-photo-area.no-photo{cursor:pointer;}
  .prod-photo-area img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;}
  .photo-placeholder{display:flex; flex-direction:column; align-items:center; gap:5px;}
  .photo-placeholder span{font-size:11px; color:var(--text-tertiary);}
  .prod-photo-area .check-toggle{position:absolute; top:6px; right:6px; background:rgba(255,255,255,0.9); border-radius:50%; width:26px; height:26px; display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; color:var(--text-tertiary); border:none; padding:0;}
  .retake-badge{position:absolute; top:6px; left:6px; background:rgba(255,255,255,0.9); border-radius:50%; width:26px; height:26px; display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--text-tertiary); pointer-events:none;}
  .cover-toggle{position:absolute; top:6px; left:6px; background:rgba(255,255,255,0.9); border-radius:50%; width:26px; height:26px; display:flex; align-items:center; justify-content:center; font-size:14px; cursor:pointer; color:var(--text-tertiary); border:none; padding:0;}
  .cover-toggle.is-cover{color:var(--danger);}
  .cover-toggle:disabled{opacity:0.35; cursor:not-allowed;}
  .prod-card.is-cover{border-color:var(--danger);}
  .cover-tag{font-size:10px; color:var(--danger); font-weight:600; margin:2px 0 0;}
  .add-prod-card{width:100%; min-width:0; min-height:140px; max-height:100%; border-radius:16px; border:1.5px dashed var(--border-strong); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--text-tertiary); cursor:pointer; background:none;}
  .add-prod-card span{text-align:center; padding:0 6px; font-size:12px;}
  /* จำนวนสินค้าคู่ (N) → การ์ด "เพิ่มสินค้าใหม่" (ลำดับที่ N+1 คี่) จะเหลือตัวเดียวในแถวสุดท้าย ไม่มีการ์ดคู่ให้ stretch
     เทียบความสูงด้วย เลยแบนเตี้ยกว่าการ์ดที่มีของ + เหลือช่องขวาว่างโบ๋ (ตกขอบ) แก้ด้วยการยืดเต็มแถวไปเลยในกรณีนี้ */
  .add-prod-card:nth-child(odd):last-child{ grid-column:1 / -1; min-height:96px; flex-direction:row; }

  /* add product form sheet (reuses match-overlay/match-sheet styles) */
  .addprod-body{overflow-y:auto; padding:12px 16px; flex:1;}
  .addprod-body label{display:block; font-size:12px; color:var(--text-secondary); margin:12px 0 4px;}
  .addprod-body label:first-child{margin-top:0;}
  .addprod-error{font-size:12px; color:var(--danger); margin-top:8px; display:none;}
  .date-opt-row{display:block; padding:10px 12px; border:1px solid var(--border-strong); border-radius:10px; margin-bottom:8px; font-size:13px; cursor:pointer;}
  .date-opt-row input{margin-right:8px; accent-color:var(--brand);}
  #skipCustomDate{width:100%; padding:8px; border:1px solid var(--border-strong); border-radius:8px; font-family:inherit; font-size:13px;}

  /* photo match screen */
  .match-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:80; display:flex; align-items:flex-end; justify-content:center;}
  .match-sheet{background:var(--cream); width:100%; max-width:600px; max-height:88vh; border-radius:16px 16px 0 0; display:flex; flex-direction:column; overflow:hidden;}
  .match-sheet-header{padding:14px 16px; border-bottom:1px solid var(--border); flex-shrink:0;}
  .match-sheet-header h2{margin:0 0 2px; font-size:15px; font-weight:600;}
  .match-sheet-header p{margin:0; font-size:12px; color:var(--text-tertiary);}
  .match-list{overflow-y:auto; padding:12px 16px; flex:1;}
  .match-row{display:flex; gap:10px; align-items:center; background:#fff; border:1px solid var(--border); border-radius:12px; padding:10px; margin-bottom:8px;}
  .match-thumb{width:56px; height:56px; border-radius:8px; object-fit:cover; flex-shrink:0; background:var(--bg);}
  .match-row .match-fname{font-size:11px; color:var(--text-tertiary); margin:0 0 4px;}
  .match-row select{font-size:13px; padding:6px 8px;}
  .match-status{font-size:18px; flex-shrink:0;}
  .match-status.done{color:#3B6D11;}
  .match-status.pending{color:var(--text-tertiary);}
  .match-sheet-footer{padding:12px 16px; border-top:1px solid var(--border); flex-shrink:0;}
  .prod-card.checked .check-toggle{color:#3B6D11;}
  .prod-card-name{font-size:12.5px; font-weight:500; margin:0 0 8px;}
  .unit-steppers-row{display:flex; flex-direction:column; gap:3px;}
  .unit-stepper{display:flex; align-items:center; gap:4px; background:#fff; border-radius:var(--radius-md); padding:4px 6px;}
  .prod-card.checked .unit-stepper{background:rgba(255,255,255,0.7);}
  .step-btn{width:24px; height:24px; border-radius:50%; background:var(--brand); color:var(--cream); border:none; font-size:13px; flex-shrink:0; cursor:pointer; line-height:1;}
  input.step-input{width:40px; min-width:0; flex:none; text-align:center; border:none; background:transparent; font-size:12.5px; padding:0;}
  .unit-tag{font-size:10px; color:var(--text-secondary); margin-left:auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .unit-tag-editable{cursor:pointer; text-decoration:underline dotted; text-underline-offset:2px;}
  .unit-tag-editable i{font-size:10px; vertical-align:-1px; margin-left:1px;}
  .oos-btn{width:100%; margin-top:6px; padding:6px; border-radius:8px; border:1.5px solid var(--danger); background:#fff; color:var(--danger); font-size:11px; font-weight:600; font-family:inherit; cursor:pointer;}
  /* สินค้าที่เจ้าของตั้งงดสั่ง/งดเช็คไว้เฉพาะวันนี้ (setProductSkipDate) — การ์ดยังโชว์อยู่เหมือนเดิม
     ไม่หายไปจากลิสต์ แต่จางลง+ขาวดำ กด +/− พิมพ์ช่อง หรือกดปุ่มของหมดไม่ได้เลย กันลูกจ้างงงว่าแอปพัง */
  .prod-card.skip-today{opacity:0.55; filter:grayscale(0.55);}
  .prod-card.skip-today .unit-stepper, .prod-card.skip-today .oos-btn{pointer-events:none;}
  .skip-today-badge{display:inline-block; font-size:10px; font-weight:700; color:#fff; background:var(--danger); border-radius:5px; padding:2px 7px; margin:0 0 6px;}
  .stickybar{position:sticky; bottom:0; background:var(--brand); padding:12px 14px; display:flex; align-items:center; justify-content:space-between; margin:14px -14px -80px; gap:10px;}
  .stickybar span{color:var(--cream); font-size:13px;}
  .stickybar .btn-primary{background:var(--cream); color:var(--brand);}

  /* owner */
  .nav-tile{background:#fff; border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px; cursor:pointer; display:flex; align-items:center; gap:12px; margin-bottom:10px;}
  .nav-tile.featured{border:2px solid var(--brand);}
  .nav-tile p{margin:0; font-weight:500; font-size:14px;}
  .nav-tile small{color:var(--text-secondary); font-size:12px;}
  .tabs{display:flex; gap:6px; margin-bottom:14px;}
  .tab{border:1px solid var(--border-strong); background:#fff; border-radius:var(--radius-md); padding:6px 13px; font-size:13px; cursor:pointer;}
  .tab.active{background:var(--brand); color:var(--cream); border-color:var(--brand);}
  .metric-grid{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; margin-bottom:14px;}
  .metric{background:var(--bg); border-radius:var(--radius-md); padding:9px;}
  .metric p:first-child{font-size:12px; color:var(--text-secondary); margin:0 0 4px;}
  .metric p:last-child{font-size:19px; font-weight:600; margin:0;}
  .sup-header{padding:7px 10px; border-radius:0; margin:0; border-left:3px solid; font-size:13px; font-weight:600; display:flex; justify-content:space-between; align-items:center; position:sticky; top:48px; z-index:3;}
  .badge{font-size:11px; padding:2px 8px; border-radius:6px; font-weight:500; display:inline-block;}
  .empty-state{text-align:center; color:var(--text-secondary); font-size:13px; padding:30px 0;}
  .copy-toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--text); color:#fff; padding:8px 16px; border-radius:8px; font-size:13px; z-index:60;}

  /* accordion order rows */
  .acc-group{border:1px solid var(--border); border-top:none; border-radius:0 0 var(--radius-lg) var(--radius-lg); overflow:hidden; margin-bottom:14px;}
  .select-all-row{padding:8px 10px; background:#fcfcfa; border-bottom:1px solid var(--border);}
  .link-btn{background:none; border:none; padding:0; font-family:inherit; font-size:11.5px; font-weight:600; color:var(--text-secondary); cursor:pointer;}
  .link-btn:active{opacity:0.6;}
  .prow{display:flex; flex-direction:column; gap:7px; padding:9px 10px; border-bottom:1px solid var(--border); background:#fff;}
  .prow:last-child{border-bottom:none;}
  .prow.low{background:var(--danger-bg);}
  .prow-top{display:flex; align-items:center; gap:9px;}
  .prow-bottom{display:flex; align-items:center; gap:6px;}
  .prow input[type=checkbox]{flex-shrink:0; width:17px; height:17px;}
  .prow-name{flex:1; min-width:0; font-size:13px; color:var(--text); line-height:1.3;}
  .prow.low .prow-name{font-weight:600;}
  .prow.skip-set{background:var(--danger-bg);}
  .prow-name-wrap{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px;}
  .prow-skip-sub{font-size:10.5px; color:var(--danger); font-weight:600;}
  .skip-toggle-btn{border:1px solid var(--danger); background:#fff; color:var(--danger); border-radius:7px; padding:5px 9px; font-size:11px; font-weight:600; font-family:inherit; cursor:pointer; white-space:nowrap; flex-shrink:0;}
  .skip-toggle-btn.active{background:var(--danger); color:#fff;}
  .stat{display:flex; flex-direction:column; align-items:flex-end; min-width:44px;}
  .stat .lbl{font-size:10px; color:var(--text-tertiary); font-weight:600; line-height:1.3; letter-spacing:0.02em;}
  .stat .v{font-size:19px; font-weight:800; color:var(--text); line-height:1.15; font-variant-numeric:tabular-nums;}
  .stat .v .u{font-size:11px; font-weight:600; color:var(--text-secondary); margin-left:2px;}
  .stat .v.muted{color:var(--text-tertiary); font-weight:500;}
  .oos-badge{display:inline-block; font-size:10.5px; font-weight:700; color:#fff; background:var(--danger); border-radius:5px; padding:1px 6px;}
  .stat.danger .lbl, .stat.danger .v{color:var(--danger);}
  .stepper{display:flex; align-items:center; border:1px solid var(--border-strong); border-radius:8px; overflow:hidden; background:#fff; flex-shrink:0; margin-left:auto;}
  .stepper .unit-tag{font-size:13px; font-weight:600; color:var(--text); margin-left:0; padding:0 8px 0 6px; overflow:visible; text-overflow:clip; white-space:nowrap; flex-shrink:0;}
  .stepper button{width:26px; height:28px; border:none; background:var(--bg); color:var(--text); font-size:14px; cursor:pointer; flex-shrink:0;}
  input.stepper-input{width:36px; min-width:0; flex-shrink:0; text-align:center; border:none; border-left:1px solid var(--border); border-right:1px solid var(--border); font-size:13px; font-weight:700; padding:5px 0;}

  /* order overview + collapsible supplier cards */
  .stat-strip{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; margin-bottom:12px;}
  .stat-card{background:#fff; border:1px solid var(--border); border-radius:var(--radius-md); padding:9px 6px; text-align:center;}
  .stat-card .n{font-size:19px; font-weight:700; line-height:1.1;}
  .stat-card .lbl{font-size:10.5px; color:var(--text-tertiary); margin-top:2px; line-height:1.2;}
  .stat-card.danger .n{color:var(--danger);}
  .stat-card.green .n{color:var(--green);}
  .stat-card.amber .n{color:var(--amber);}
  .ord-card{border:1px solid var(--border); border-radius:var(--radius-lg); margin-bottom:10px; overflow:hidden; background:#fff; display:flex;}
  .ord-card-strip{width:5px; flex-shrink:0; background:var(--border-strong);}
  .ord-card.state-needorder .ord-card-strip{background:var(--danger);}
  .ord-card.state-partial .ord-card-strip{background:var(--amber);}
  .ord-card.state-ordered .ord-card-strip{background:var(--green);}
  .ord-card-main{flex:1; min-width:0;}
  .ord-card-head{display:flex; align-items:center; gap:10px; padding:12px; cursor:pointer; background:var(--brand-bg);}
  .ord-card-head .chev{font-size:14px; color:var(--text-tertiary); transition:transform .15s; flex-shrink:0;}
  .ord-card.open .ord-card-head .chev{transform:rotate(180deg);}
  .ord-card.state-ordered .ord-card-head{background:var(--green-bg);}
  .order-done-check{width:18px; height:18px; border-radius:50%; background:none; border:2px solid var(--green); color:transparent; font-size:11px; font-weight:700; padding:0; display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer;}
  .order-done-check.confirmed{background:var(--green); color:#fff;}
  .order-done-check:disabled{opacity:0.5; cursor:default;}
  .ord-card-name{font-weight:600; font-size:14.5px; flex:1; min-width:0;}
  /* แท็ก "สั่งเผื่อ" — ข้อมูลเสริมแปะไว้ในคอลัมน์สถานะฝั่งขวา (ไม่ใช่ข้างชื่อเจ้า) เพราะชื่อเจ้าเป็น
     flex ที่ยืด/หดตามความยาวข้อความสถานะ ถ้าแปะข้างชื่อ พอสถานะเปลี่ยนความยาว (เช่น "เลือกไว้ N รายการ"
     โผล่/หาย) แท็กจะขยับตำแหน่งตามไปด้วย — วางในคอลัมน์ฝั่งขวาที่ตำแหน่งคงที่แทน ไม่ขยับอีก
     และอยู่ "บรรทัดเดียวกับสถานะ" (.status-top-row) ไม่ใช่ซ้อนเป็นบรรทัดใหม่ กันการ์ดที่มีแท็ก
     สูงกว่าการ์ดใบอื่นในลิสต์ */
  .status-top-row{display:flex; align-items:center; gap:6px;}

<body>
<div id="app"></div>
<script>
/* ============ LIVE API CONFIG ============ */
const API_URL = 'https://script.google.com/macros/s/AKfycbytmWrmwrjZQjeUUW1o6CpHZmr5lFAxZJISyvqoyD5hM2TmIABUVfPuqnXseF4-nmw9/exec';

const API_TIMEOUT_MS = 25000; // สัญญาณมือถืออ่อนๆ หรือ Apps Script cold start ตอบช้ากว่า 12 วิได้ง่ายๆ

// หน่วงการเรียก fn จนกว่าจะไม่มีการเรียกซ้ำอีกภายใน wait ms — ใช้กันช่องค้นหาที่ยิง
// renderGroups() รีบิลด์ DOM ทั้งลิสต์ทุกตัวอักษรที่พิมพ์ ซึ่งหนักมากถ้ามีการ์ดเปิดอยู่หลายสิบรายการ
function debounce(fn, wait){
  let t;
  return (...args)=>{ clearTimeout(t); t = setTimeout(()=> fn(...args), wait); };
}
async function apiGet(action, params, timeoutMs){
  const qs = new URLSearchParams({action, ...(params||{})}).toString();
  const controller = new AbortController();
  const t = setTimeout(()=>controller.abort(), timeoutMs || API_TIMEOUT_MS);
  try{
    const res = await fetch(`${API_URL}?${qs}`, { signal: controller.signal });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    return data;
  }catch(err){
    throw err.name==='AbortError' ? new Error('หมดเวลาเชื่อมต่อ ลองใหม่อีกครั้ง') : err;
  }finally{ clearTimeout(t); }
}
// retryOnTimeout: ใช้เฉพาะ action ที่ "set" ค่าตรงๆ (เรียกซ้ำแล้วผลลัพธ์เหมือนเดิม ไม่สร้างข้อมูลซ้ำ) เช่น
// setProductSkipDate/setUnitLabel/setOrderUnitLabel/setSupplierCoverPhoto/setSupplierOrderConfirm —
// ห้ามใช้กับ action ที่สร้างแถวใหม่ทุกครั้งที่เรียก (createOrderBatch, addProduct, saveStock,
// saveProductPhotos, saveStaffAvatar) เพราะ retry ซ้ำจะสร้างข้อมูล/อัปโหลดไฟล์ซ้ำซ้อนได้จริง
// timeoutMs: เผื่อไว้สำหรับ action ที่รู้อยู่แล้วว่าช้ากว่าปกติ (เช่น analyzeBillPhoto ที่ต้องรอ AI
// อ่านรูปบิล) ไม่ใส่ก็ใช้ API_TIMEOUT_MS ปกติเหมือนเดิม — คนละเรื่องกับ retryOnTimeout (ห้ามใส่ retryOnTimeout
// กับ action ที่ไม่ idempotent เด็ดขาด ดูคอมเมนต์ apiGet ด้านบน)
async function apiPost(action, payload, retryOnTimeout, timeoutMs){
  const controller = new AbortController();
  const t = setTimeout(()=>controller.abort(), timeoutMs || API_TIMEOUT_MS);
  try{
    const res = await fetch(API_URL, { method:'POST', body: JSON.stringify({action, ...payload}), signal: controller.signal });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    return data;
  }catch(err){
    if(err.name==='AbortError'){
      if(retryOnTimeout) return apiPost(action, payload, false, timeoutMs); // retry เงียบๆ 1 ครั้ง ไม่วนซ้ำไม่รู้จบ
      throw new Error('หมดเวลาเชื่อมต่อ ลองใหม่อีกครั้ง');
    }
    throw err;
  }finally{ clearTimeout(t); }
}

/* ============ product photo match screen ============ */
// เปิดหน้าจับคู่รูปที่เลือกจากเครื่อง (files) กับสินค้าของซัพพลายเออร์นี้ (products)
// เมื่อบันทึกสำเร็จจะเรียก onDone() เพื่อให้หน้าเดิม re-render
function openPhotoMatchScreen(files, products, onDone){
  const overlay = document.createElement('div');
  overlay.className = 'match-overlay';
  overlay.innerHTML = `
    <div class="match-sheet">
      <div class="match-sheet-header">
        <h2>จับคู่รูปกับสินค้า</h2>
        <p id="matchProgress">เลือกไว้ ${files.length} รูป · จับคู่แล้ว 0 จาก ${files.length}</p>
      </div>
      <div class="match-list" id="matchList"></div>
      <div class="match-sheet-footer">
        <button class="btn" style="width:100%; margin-bottom:8px;" id="matchCancel">ยกเลิก</button>
        <button class="btn btn-primary btn-block" id="matchSave" disabled>บันทึกรูปที่จับคู่แล้ว (0)</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  const matches = files.map(()=>null); // index -> productId | null
  const list = overlay.querySelector('#matchList');
  const progressEl = overlay.querySelector('#matchProgress');
  const saveBtn = overlay.querySelector('#matchSave');

  function updateProgress(){
    const n = matches.filter(Boolean).length;
    progressEl.textContent = `เลือกไว้ ${files.length} รูป · จับคู่แล้ว ${n} จาก ${files.length}`;
    saveBtn.textContent = `บันทึกรูปที่จับคู่แล้ว (${n})`;
    saveBtn.disabled = n === 0;
  }

  files.forEach((file, i)=>{
    const row = document.createElement('div');
    row.className = 'match-row';
    const url = URL.createObjectURL(file);
    row.innerHTML = `
      <img class="match-thumb" src="${url}" alt="" loading="lazy">
      <div style="flex:1; min-width:0;">
        <p class="match-fname">${file.name}</p>
        <select data-idx="${i}">
          <option value="" selected disabled>เลือกสินค้า...</option>
          ${products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}
        </select>
      </div>
      <span class="match-status pending" data-idx="${i}"><i class="ti ti-circle-dashed" aria-hidden="true"></i></span>
    `;
    row.querySelector('select').onchange = (e)=>{
      matches[i] = e.target.value || null;
      const statusEl = row.querySelector('.match-status');
      statusEl.className = 'match-status ' + (matches[i] ? 'done' : 'pending');
      statusEl.innerHTML = matches[i] ? '<i class="ti ti-check" aria-hidden="true"></i>' : '<i class="ti ti-circle-dashed" aria-hidden="true"></i>';
      updateProgress();
    };
    list.appendChild(row);
  });

  function close(){ overlay.remove(); }
  overlay.querySelector('#matchCancel').onclick = close;

  saveBtn.onclick = async ()=>{
    saveBtn.disabled = true; saveBtn.textContent = 'กำลังบันทึก...';
    try{
      const photos = [];
      for(let i=0; i<files.length; i++){
        if(!matches[i]) continue;
        const dataUrl = await compressImage(files[i], 600, 0.5);
        photos.push({ productId: matches[i], photo: dataUrl });
      }
      await apiPost('saveProductPhotos', { photos });
      photos.forEach(({productId, photo})=>{
        const p = products.find(x=>x.id===productId);
        if(p) p.photoUrl = photo; // อัปเดตให้เห็นผลทันทีในเครื่อง; รูปจริงบน Drive จะมาแทนตอนโหลดใหม่
      });
      close();
      onDone();
    }catch(err){
      saveBtn.disabled = false;
      alert('บันทึกรูปไม่สำเร็จ: ' + err.message);
      updateProgress();
    }
  };
}

// ชื่อวันอังกฤษ (3 ตัวย่อ) ตามลำดับ Date.getDay() (0=Sun ... 6=Sat) — ใช้เทียบกับ supplier.orderDays
// ที่มาจากคอลัมน์ OrderDays ในชีต Suppliers (คั่นด้วยคอมม่า เช่น "Mon,Thu")
// เทียบแบบไม่สนตัวพิมพ์เล็ก/ใหญ่ และตัดเหลือ 3 ตัวแรก รองรับทั้ง "Mon" และ "Monday"
const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function todayDayName(){ return DAY_NAMES[new Date().getDay()]; }
// วันที่ปัจจุบันรูปแบบ yyyy-MM-dd (ตาม timezone เครื่อง) — ใช้เทียบกับ product.skipDates
// ที่เจ้าของตั้งงดสั่ง/งดเช็คไว้เป็นครั้งคราว (ไม่ใช่กฎประจำสัปดาห์แบบ OrderDays)
function isoDate(d){
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function todayISODate(){ return isoDate(new Date()); }
function isProductSkippedToday(p){ return (p.skipDates||[]).includes(todayISODate()); }
const THAI_MONTHS_SHORT = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function formatShortThaiDate(iso){
  const [y,m,d] = String(iso).split('-').map(Number);
  if(!y||!m||!d) return iso;
  return `${d} ${THAI_MONTHS_SHORT[m-1]}`;
}
// วันที่ (ตัวเดียวหรือหลายตัว) ที่เจ้าของตั้งงดสั่งไว้ล่วงหน้าของสินค้าตัวนี้ (>= วันนี้) เรียงจากใกล้สุด
function upcomingSkipDates(p){
  const today = todayISODate();
  return (p.skipDates||[]).filter(d=> d >= today).sort();
}
function supplierDueToday(s){
  const today = todayDayName();
  return (s.orderDays||[]).some(d => String(d).trim().slice(0,3).toLowerCase() === today.toLowerCase());
}
// โน้ต "สั่งเผื่อ" ของแต่ละเจ้า — เดิมคำนวณอัตโนมัติจากช่วงห่างของ OrderDays แต่ในทางปฏิบัติ
// แต่ละเจ้าตกลงกับร้านไว้ไม่เหมือนกัน (บางเจ้า ×2 บางเจ้า ×3 ทั้งที่ช่วงห่างวันเท่ากัน หรือบางเจ้า
// เป็นโน้ตข้อความล้วนไม่ใช่ตัวคูณเลยก็มี) จึงเปลี่ยนมาใช้ค่าที่กำหนดเองจากคอลัมน์ StockupNotes
// ในชีต Suppliers แทน (ฟอร์แมต "วัน:ข้อความ" คั่นด้วย ; เช่น "Tue:×3 สั่งเผื่อ;Sat:ส่งจันทร์")
// ไม่เกี่ยวกับการจัดกลุ่ม "ต้องสั่งวันนี้"/"เจ้าอื่นทั้งหมด" เลย (อันนั้นยึดตาม OrderDays เหมือนเดิม)
function supplierStockupNote(s){
  const notes = s.stockupNotes || {};
  const today = todayDayName().toLowerCase();
  const key = Object.keys(notes).find(d => String(d).trim().slice(0,3).toLowerCase() === today);
  return key ? notes[key] : null;
}

function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const STOCK_STATUS_TTL = 45000; // ms - avoid refetching the whole sheet on every screen hop
async function getStockStatus(force){
  if(!force && stockStatusCache && (Date.now() - _stockStatusTs) < STOCK_STATUS_TTL) return stockStatusCache;
  const data = await apiGet('stockStatus');
  stockStatusCache = data; _stockStatusTs = Date.now();
  return data;
}
function invalidateStockStatus(){ stockStatusCache = null; _stockStatusTs = 0; }
function patchStockStatusChecked(products, items){
  // After a successful saveStock, update the cache in place instead of
  // invalidating it, so the next screen doesn't have to wait on another
  // full round-trip just to show what we already know was just saved.
  if(!stockStatusCache) return;
  const remainByUnit = {}; items.forEach(it=>{ remainByUnit[it.unitId] = it.remainQty; });
  products.forEach(p=>{
    let entry = stockStatusCache.find(s=>s.productId===p.id);
    if(!entry){ entry = {productId:p.id, checked:false, remain:{}}; stockStatusCache.push(entry); }
    entry.checked = true;
    entry.remain = entry.remain || {};
    p.units.forEach(u=>{ if(remainByUnit[u.id]!==undefined) entry.remain[u.id] = remainByUnit[u.id]; });
  });
  _stockStatusTs = Date.now();
}

const ICON_PALETTE = [
  {bg:'#FAEEDA', fg:'#854F0B'}, {bg:'#FBEAF0', fg:'#993556'},
  {bg:'#E1F5EE', fg:'#085041'}, {bg:'#EEEDFE', fg:'#3C3489'},
];
function iconColor(idx){ return ICON_PALETTE[idx % ICON_PALETTE.length]; }
function go(screen, extra, opts){
  state.screen = screen; Object.assign(state, extra||{});
  const snapshot = { screen: state.screen, staffName: state.staffName, currentSupplierId: state.currentSupplierId, ownerTab: state.ownerTab,
    billStaffName: state.billStaffName, billSupplierId: state.billSupplierId, billMode: state.billMode };
  if(opts && opts.replace){ history.replaceState(snapshot, ''); }
  else { history.pushState(snapshot, ''); }
  render();
}
// ปัดนิ้วสวนกลับ (ท่าทางของเบราว์เซอร์/มือถือ) หรือกดปุ่ม back ของเครื่อง ก็ยิง popstate เหมือนกัน
// ถ้าตอนนั้นอยู่หน้าเช็คสต๊อกแล้วมีข้อมูลที่ยังไม่ได้กด "เสร็จเจ้านี้" ให้ดัน state เดิมกลับขึ้นไปบน
// history ก่อน (เท่ากับ "ยกเลิก" การ back ที่เพิ่งเกิดไว้ชั่วคราว) แล้วเซฟข้อมูลที่ติ๊กไว้ให้อัตโนมัติ
// ระหว่างนั้นเงียบๆ ไม่ต้องถามอะไร พอเซฟเสร็จค่อย back จริงให้ (ยิง popstate รอบสองเข้า handler นี้
// อีกครั้ง คราวนี้ dirty เป็น false แล้วเลยผ่านไปตามปกติ) ถ้าเซฟไม่สำเร็จ (เช่นเน็ตหลุด) เท่านั้นถึงจะถาม
window.addEventListener('popstate', (e)=>{
  if(state.screen === 'supplierCheck' && supplierCheckDirty){
    history.pushState({ screen: state.screen, staffName: state.staffName, currentSupplierId: state.currentSupplierId, ownerTab: state.ownerTab }, '');
    // ปกติ supplierCheckAutoSave ต้องมีค่าเสมอตอนอยู่หน้านี้ (renderSupplierCheck ตั้งไว้ให้) เผื่อไว้กรณี
    // แปลกๆ ที่ไม่มีจริงๆ ค่อย fallback ไปถามตรงๆ แทนเซฟอัตโนมัติ
    const proceed = supplierCheckAutoSave
      ? supplierCheckAutoSave()
      : Promise.resolve(confirm('เช็คสต๊อกยังไม่เสร็จ ยืนยันออกจากหน้านี้โดยไม่บันทึกใช่ไหม?')).then(ok=>{ if(ok) supplierCheckDirty=false; return ok; });
    proceed.then(canLeave=>{ if(canLeave) history.back(); });
    return;
  }
  if(e.state){ Object.assign(state, e.state); } else { state.screen = 'home'; }
  render();
});
// กันเผื่อกรณีท่าทางปัดสวนกลับทำให้ทั้งหน้าเว็บถูกปิด/รีโหลดเลย (หลุดออกจาก SPA ไปนอก history ของแอป)
// ไม่ใช่แค่เปลี่ยนหน้าในแอป — เบราว์เซอร์ส่วนใหญ่โชว์กล่องเตือนมาตรฐานของตัวเอง (ข้อความที่ตั้งเองมักไม่ขึ้น
// บนเบราว์เซอร์รุ่นใหม่ๆ) กันหลุดสุดตัวอีกชั้น เผื่อ popstate ด้านบนไม่ทันจับ
window.addEventListener('beforeunload', (e)=>{
  if(state.screen === 'supplierCheck' && supplierCheckDirty){
    e.preventDefault();
    e.returnValue = '';
  }
});

const BOOTSTRAP_CACHE_KEY = 'samurai_bootstrap_cache_v1';
// กันรีเฟรช bootstrap ถี่เกินไปตอนสลับดูหลายเจ้าติดๆ กัน (เช่น เข้าหน้าเช็คสต๊อกของเจ้านี้แล้วกลับไปเจ้าอื่น
// แล้ววนมาเจ้าเดิมอีกภายในไม่กี่วิ) — รีเฟรชจริงเมื่อห่างจากครั้งก่อนเกิน BOOTSTRAP_REFRESH_TTL เท่านั้น
// เหมือนแพทเทิร์นเดียวกับ STOCK_STATUS_TTL
const BOOTSTRAP_REFRESH_TTL = 45000; // ms
let _bootstrapRefreshTs = 0;
function refreshBootstrapIfStale(onUpdated){
  if(Date.now() - _bootstrapRefreshTs < BOOTSTRAP_REFRESH_TTL) return;
  _bootstrapRefreshTs = Date.now();
  apiGet('bootstrap').then(data=>{
    SUPPLIERS = data.suppliers; PRODUCTS = data.products; STAFF = data.staff;
    writeBootstrapCache(data);
    if(onUpdated) onUpdated(data);
  }).catch(()=>{ _bootstrapRefreshTs = 0; }); // ล้มเหลว — อนุญาตให้ลองใหม่ได้เลยครั้งหน้า ไม่ต้องรอครบ TTL
}
function readBootstrapCache(){
  try{ return JSON.parse(sessionStorage.getItem(BOOTSTRAP_CACHE_KEY)); }catch(e){ return null; }
}
function writeBootstrapCache(data){
  try{ sessionStorage.setItem(BOOTSTRAP_CACHE_KEY, JSON.stringify(data)); }catch(e){}
}
async function bootstrap(){
  const app = document.getElementById('app');
  // ร้าน/สินค้า/พนักงาน แทบไม่เปลี่ยนบ่อย - ถ้ามี cache จากเซสชันก่อนหน้าให้ใช้ก่อนเลย
  // แล้วค่อยรีเฟรชข้อมูลใหม่เงียบๆ อยู่เบื้องหลัง แทนที่จะรอ Apps Script ทุกครั้งที่เปิดแอป
  const cached = readBootstrapCache();
  if(cached){
    SUPPLIERS = cached.suppliers; PRODUCTS = cached.products; STAFF = cached.staff;
    history.replaceState({screen:'home', staffName:'', currentSupplierId:null, ownerTab:'stock'}, '');
    render();
    getStockStatus().catch(()=>{});
    apiGet('bootstrap').then(data=>{
      SUPPLIERS = data.suppliers; PRODUCTS = data.products; STAFF = data.staff;
      writeBootstrapCache(data);
      _bootstrapRefreshTs = Date.now();
      // ข้อมูลจริงมาแล้ว (เช่น หน่วยสินค้าที่เพิ่งเพิ่มในชีต) — render จากข้อมูลเก่าไปแล้วตอนต้นฟังก์ชัน
      // ต้อง render ซ้ำอีกครั้งไม่งั้นหน้าจอจะค้างข้อมูลเก่าไปตลอด session จนกว่าจะปิดแท็บ
      render();
    }).catch(()=>{});
    return;
  }

  // Show the logo immediately instead of a blank spinner - the network
  // round trip to Apps Script is the slow part, not this render.
  app.innerHTML = '';
  app.appendChild(buildHero());
  const loadingEl = document.createElement('div');
  loadingEl.className = 'content';
  loadingEl.innerHTML = `<div class="empty-state" style="padding:40px 0;"><div style="font-size:30px; margin-bottom:10px;">⏳</div><p>กำลังโหลดข้อมูลร้าน...</p></div>`;
  app.appendChild(loadingEl);
  // การเชื่อมต่อ "เย็น" ครั้งแรกของ session (ไม่มีอะไรแคชไว้เลย เช่น เพิ่งปิดแท็บมาเปิดใหม่) มักช้ากว่า
  // ปกติมาก เพราะต้อง DNS + TLS handshake ใหม่ทั้งกับ script.google.com และโดเมนที่มัน redirect ไปอีกที
  // (script.googleusercontent.com) บวกกับ Apps Script อาจต้อง "ตื่น" จาก cold start — รวมกันแล้วหลุด
  // เวลาที่ตั้งไว้ (API_TIMEOUT_MS) ได้ง่ายๆ ทั้งที่ backend ไม่ได้มีปัญหาอะไรเลย (ยืนยันจาก Executions log
  // สะอาดหมดตอนไล่บั๊กนี้) พอกด "ลองใหม่" ครั้งที่สองจะติดทันทีเพราะ connection อุ่นแล้ว — ให้แอป retry
  // ให้เองเงียบๆ 1 ครั้งก่อนถึงจะโชว์ error จริงให้ผู้ใช้เห็น แทนที่จะบังคับให้ต้องกดปุ่มเองทุกครั้ง
  // รอบแรกให้ timeout สั้นกว่าปกติ (10 วิ แทน 25 วิ) เพราะถ้ามันจะพังจาก cold connection จริง รอนานกว่านี้
  // ก็ไม่ช่วยอะไร แค่ทำให้ผู้ใช้รอ error เปล่าๆ นานขึ้น — ตัดใจ retry เร็วๆ ไปเลยดีกว่า รอบที่สอง (ซึ่ง
  // connection น่าจะอุ่นแล้ว) ค่อยให้เวลาเต็ม 25 วิเผื่อไว้จริงๆ
  try{
    const data = await apiGet('bootstrap', null, 10000);
    SUPPLIERS = data.suppliers; PRODUCTS = data.products; STAFF = data.staff;
    writeBootstrapCache(data);
    _bootstrapRefreshTs = Date.now();
    getStockStatus().catch(()=>{});
    history.replaceState({screen:'home', staffName:'', currentSupplierId:null, ownerTab:'stock'}, '');
    render();
    return;
  }catch(firstErr){
    // ไม่ต้องบอกผู้ใช้ว่ารอบแรกพลาด แค่ลองใหม่เงียบๆ ให้เลย
  }
  try{
    const data = await apiGet('bootstrap');
    SUPPLIERS = data.suppliers; PRODUCTS = data.products; STAFF = data.staff;
    writeBootstrapCache(data);
    _bootstrapRefreshTs = Date.now();
    getStockStatus().catch(()=>{});
    history.replaceState({screen:'home', staffName:'', currentSupplierId:null, ownerTab:'stock'}, '');
    render();
  }catch(err){
    loadingEl.innerHTML = `<div class="empty-state" style="padding:40px 14px; color:var(--danger);">โหลดข้อมูลไม่สำเร็จ: ${err.message}<br><br><button class="btn" onclick="bootstrap()">ลองใหม่</button></div>`;
  }
}

function renderStaffName(app){
  app.appendChild(topbar('เลือกชื่อพนักงาน', {back:()=>go('home')}));
  const c = document.createElement('div'); c.className='content';
  const emojis = ['👋','✨','🌸','🔥','🍀'];
  c.innerHTML = `
    <p style="font-size:14px; font-weight:600; margin:0 0 2px;">วันนี้ใครจะมาเช็คสต๊อก? 🙋</p>
    <p style="font-size:12px; color:var(--text-tertiary); margin:0 0 16px;">แตะเลือกชื่อตัวเองได้เลย</p>
    ${STAFF.map((s,i)=>{
      const col = iconColor(i);
      const avatarInner = s.avatarUrl
        ? `<img src="${s.avatarUrl}" alt="">`
        : `<i class="ti ti-camera" style="font-size:26px; color:${col.fg};" aria-hidden="true"></i>`;
      return `<div class="pick-row">
        <div class="avatar-wrap">
          <div class="pick-avatar avatar-pick" data-staff-id="${s.id}" style="background:${col.bg};">
            ${avatarInner}
          </div>
          <span class="avatar-edit-badge"><i class="ti ti-camera" aria-hidden="true"></i></span>
        </div>
        <div class="staff-pick" data-name="${s.name}" style="display:flex; align-items:center; flex:1; cursor:pointer;">
          <p style="margin:0; font-size:15px; font-weight:600; flex:1;">${s.name}</p>
          <span style="font-size:17px;">${emojis[i % emojis.length]}</span>
        </div>
      </div>`;
    }).join('')}
  `;
  app.appendChild(c);

  const avatarInput = document.createElement('input');
  avatarInput.type = 'file'; avatarInput.accept = 'image/*'; // ไม่ตั้ง capture — ให้เลือกได้ทั้งถ่ายรูปใหม่หรือเลือกจากคลังภาพ
  avatarInput.style.display = 'none';
  c.appendChild(avatarInput);
  let avatarTargetId = null;
  avatarInput.onchange = async ()=>{
    const file = avatarInput.files[0];
    const staffId = avatarTargetId;
    avatarInput.value = '';
    if(!file || !staffId) return;
    const targetEl = c.querySelector(`.avatar-pick[data-staff-id="${staffId}"]`);
    try{
      const photo = await compressImage(file, 500, 0.7);
      const { avatarUrl } = await apiPost('saveStaffAvatar', { staffId, photo });
      const s = STAFF.find(x=>x.id===staffId);
      if(s) s.avatarUrl = avatarUrl;
      if(targetEl) targetEl.innerHTML = `<img src="${avatarUrl}" alt="">`;
    }catch(err){ alert('บันทึกรูปไม่สำเร็จ: ' + err.message); }
  };
  // แตะที่ตัวรูปเอง = ซูมดูรูปใหญ่ (ถ้ามีรูปแล้ว) กันเผลอกดเลือกพนักงานผิดคนตอนแค่อยากดูรูปชัดๆ
  // ส่วนป้ายกล้องเล็กๆ มุมขวาล่างแยกไว้เป็นปุ่ม "เปลี่ยนรูป" โดยเฉพาะ ไม่ปนกับการซูมอีกต่อไป
  function openAvatarLightbox(url){
    const lb = document.createElement('div'); lb.className = 'avatar-lightbox';
    lb.innerHTML = `<button class="lb-close" aria-label="ปิด">✕</button><img src="${url}" alt="">`;
    lb.onclick = ()=> lb.remove();
    lb.querySelector('.lb-close').onclick = (e)=>{ e.stopPropagation(); lb.remove(); };
    document.body.appendChild(lb);
  }
  c.querySelectorAll('.avatar-pick').forEach(avatar=>{
    avatar.onclick = (e)=>{
      e.stopPropagation();
      const staffId = avatar.dataset.staffId;
      const s = STAFF.find(x=>x.id===staffId);
      if(s && s.avatarUrl) openAvatarLightbox(s.avatarUrl);
      else{ avatarTargetId = staffId; avatarInput.click(); } // ยังไม่มีรูป — ไม่มีอะไรให้ซูม เปิดตัวเลือกรูปแทนเลย
    };
  });
  c.querySelectorAll('.avatar-edit-badge').forEach(badge=>{
    badge.onclick = (e)=>{
      e.stopPropagation();
      avatarTargetId = badge.closest('.avatar-wrap').querySelector('.avatar-pick').dataset.staffId;
      avatarInput.click();
    };
  });
  c.querySelectorAll('.staff-pick').forEach(el=> el.onclick = ()=>go('supplierList', {staffName: el.dataset.name}));
}

/* ============ รับของ — ถ่ายบิล ============ */
// เปิดให้พนักงานทุกคนใช้ได้ ไม่ผูกกับ PRIVILEGED_STAFF_NAME (ต่างจากแก้ชื่อหน่วย/เพิ่มสินค้าใหม่)
// เพราะเป็นงานประจำวันที่ต้องทำทุกครั้งที่ของมาส่ง ไม่ใช่การตั้งค่าระบบ

/* ---- 1) เลือกชื่อพนักงาน ---- */
function renderBillStaff(app){
  app.appendChild(topbar('ใครถ่ายบิลนี้?', {back:()=>go('home')}));
  const c = document.createElement('div'); c.className='content';
  c.innerHTML = STAFF.map((s,i)=>{
    const col = iconColor(i);
    const thumb = s.avatarUrl ? `<img src="${s.avatarUrl}" alt="" style="width:100%;height:100%;object-fit:cover;">` : s.name[0];
    return `<div class="sup-row" data-name="${s.name}">
      <div class="sup-thumb" style="background:${col.bg}; color:${col.fg}; overflow:hidden;">${thumb}</div>
      <p>${s.name}</p>
      <i class="ti ti-chevron-right" style="color:var(--text-tertiary);" aria-hidden="true"></i>
    </div>`;
  }).join('');
  app.appendChild(c);
  c.querySelectorAll('.sup-row').forEach(el=> el.onclick = ()=> go('billSupplier', {billStaffName: el.dataset.name}));
}

/* ---- 2) เลือกซัพพลายเออร์ ---- */
function renderBillSupplier(app){
  app.appendChild(topbar('บิลของซัพพลายเออร์ไหน?', {back:()=>go('billStaff'), meta: state.billStaffName}));
  const c = document.createElement('div'); c.className='content';
  c.innerHTML = `<input type="text" id="search" placeholder="ค้นหาซัพพลายเออร์" style="margin-bottom:12px;"><div id="supList"></div>`;
  const listEl = c.querySelector('#supList');
  function draw(filter){
    const items = SUPPLIERS.filter(s=> s.name.includes(filter||''));
    listEl.innerHTML = items.map(s=>{
      const n = PRODUCTS.filter(p=>p.supplierId===s.id).length;
      const thumb = s.imageUrl ? `<img src="${s.imageUrl}" alt="" style="width:100%;height:100%;object-fit:cover;">` : '<i class="ti ti-building-store" aria-hidden="true"></i>';
      return `<div class="sup-row" data-id="${s.id}">
        <div class="sup-thumb" style="overflow:hidden;">${thumb}</div>
        <p>${s.name}<br><span style="font-size:11px;color:var(--text-tertiary);font-weight:400;">สินค้า ${n} รายการ</span></p>
        <i class="ti ti-chevron-right" style="color:var(--text-tertiary);" aria-hidden="true"></i>
      </div>`;
    }).join('') || `<p class="empty-state">ไม่พบซัพพลายเออร์</p>`;
    listEl.querySelectorAll('.sup-row').forEach(el=> el.onclick = ()=> go('billCapture', {billSupplierId: el.dataset.id, billPhotos:[]}));
  }
  app.appendChild(c);
  draw('');
  c.querySelector('#search').oninput = debounce((e)=>draw(e.target.value.trim()), 200);
}

/* ---- 3) ถ่าย/เลือกรูปบิล ---- */
function renderBillCapture(app){
  const sup = SUPPLIERS.find(s=>s.id===state.billSupplierId);
  app.appendChild(topbar('ถ่ายรูปบิล', {back:()=>go('billSupplier'), meta: sup.name}));
  const c = document.createElement('div'); c.className='content';
  c.innerHTML = `
    <p class="capture-hint">ถ่ายรูปใบส่งของ/ใบวางบิลจาก <b>${sup.name}</b> ให้เห็นชัดทุกรายการ ถ่ายได้หลายรูปถ้าบิลมีหลายหน้า</p>
    <div class="bill-photo-strip" id="photoStrip"></div>
    <div class="capture-zone">
      <i class="ti ti-camera" aria-hidden="true"></i>
      <p id="captureLabel">ยังไม่มีรูปบิล</p>
      <button class="btn" id="pickPhoto">ถ่ายรูป / เลือกไฟล์</button>
    </div>
    <button class="btn btn-primary btn-block" id="analyzeBtn" disabled>วิเคราะห์บิลด้วย AI</button>
  `;
  app.appendChild(c);

  const fileInput = document.createElement('input');
  fileInput.type = 'file'; fileInput.accept = 'image/*'; fileInput.multiple = true; // ไม่ตั้ง capture — ให้เลือกได้ทั้งถ่ายรูปใหม่หรือเลือกจากคลังภาพ (เหมือน avatarInput)
  fileInput.style.display = 'none';
  c.appendChild(fileInput);
  c.querySelector('#pickPhoto').onclick = ()=> fileInput.click();

  function drawPhotos(){
    const strip = c.querySelector('#photoStrip');
    strip.innerHTML = state.billPhotos.map((url,i)=>`
      <div class="bill-photo-chip"><img src="${url}" alt=""><button class="rm" data-i="${i}">✕</button></div>`).join('');
    strip.querySelectorAll('.rm').forEach(b=> b.onclick = ()=>{ state.billPhotos.splice(+b.dataset.i,1); drawPhotos(); });
    c.querySelector('#captureLabel').textContent = state.billPhotos.length ? `เลือกไว้ ${state.billPhotos.length} รูป` : 'ยังไม่มีรูปบิล';
    c.querySelector('#analyzeBtn').disabled = state.billPhotos.length===0;
  }
  drawPhotos();

  fileInput.onchange = async ()=>{
    const files = [...fileInput.files]; fileInput.value = '';
    for(const file of files){
      try{ state.billPhotos.push(await compressImage(file, 1600, 0.8)); }catch(e){}
    }
    drawPhotos();
  };

  c.querySelector('#analyzeBtn').onclick = ()=> go('billAnalyzing');
}

/* ---- 4) กำลังวิเคราะห์ด้วย AI ---- */
function renderBillAnalyzing(app){
  const sup = SUPPLIERS.find(s=>s.id===state.billSupplierId);
  app.appendChild(topbar('กำลังวิเคราะห์', {}));
  const c = document.createElement('div'); c.className='content';
  c.innerHTML = `<div class="analyzing-wrap">
      <div class="spin-ring"></div>
      <h2>กำลังอ่านบิล...</h2>
      <p id="analyzeMsg">กำลังแยกรายการ จำนวน และราคาจากรูปที่ถ่ายไว้ อาจใช้เวลาสักครู่</p>
    </div>`;
  app.appendChild(c);

  // ปิด retryOnTimeout เอง — ถ้าพัง ให้ผู้ใช้กดลองใหม่เอง ไม่ auto-retry เงียบๆ เพราะยิงซ้ำ = เรียก AI ซ้ำ
  // (ไม่ได้เสียเงินก็จริง แต่ก็ไม่จำเป็นต้องยิงซ้ำโดยไม่รู้ตัว) ให้ timeout นานกว่าปกติเพราะ AI อ่านรูปช้ากว่า action ทั่วไป
  apiPost('analyzeBillPhoto', { supplierId: state.billSupplierId, photos: state.billPhotos }, false, 60000)
    .then(res=>{
      const items = (res.items||[]).map((it,i)=>({
        _id: 'it'+i, billText: it.billText, unit: it.unit, qty: it.qty,
        receivedQty: it.qty, // ค่าเริ่มต้น = ตามบิล — AI อ่านได้แค่ตัวเลขบนบิล ส่วน "รับจริง" ให้คนถ่ายแก้เองถ้านับไม่ตรง
        unitPrice: it.unitPrice,
        likelyNonProduct: !!it.likelyNonProduct, skip: !!it.likelyNonProduct,
        productId: it.productId || null, factor: it.conversionFactor || null,
        matchType: it.matchType || null, // 'exact' | 'fuzzy' | null (จาก Code.gs analyzeBillPhoto)
        matchedAliasText: it.matchedAliasText || null, // ข้อความเดิมที่ทำให้เกิด fuzzy match (โชว์เป็นคำอธิบาย)
        confirmed: it.matchType === 'exact', // fuzzy ต้องกดยืนยันเองเสมอ ไม่นับว่าจับคู่แล้วจนกว่าจะกด
      }));
      if(!items.length){ throw new Error('อ่านรายการจากบิลไม่ได้เลย ลองถ่ายรูปให้ชัดขึ้นอีกครั้ง'); }
      go('billReview', {billItems: items, billMode:'staff'}, {replace:true});
    })
    .catch(err=>{
      c.querySelector('.analyzing-wrap').innerHTML = `
        <p style="color:var(--danger); font-weight:600; margin-bottom:6px;">อ่านบิลไม่สำเร็จ</p>
        <p style="margin-bottom:16px;">${err.message}</p>
        <button class="btn btn-primary" id="retryAnalyze">ลองใหม่</button>
        <button class="btn-text-cancel" id="backCapture">กลับไปถ่ายรูปใหม่</button>
      `;
      c.querySelector('#retryAnalyze').onclick = ()=> render();
      c.querySelector('#backCapture').onclick = ()=> go('billCapture');
    });
}

/* ---- 5) ตรวจสอบ/จับคู่รายการ ---- */
// ใช้ 2 โหมด (state.billMode):
// - 'staff': ลูกจ้างถ่ายบิลใหม่ — กด "บันทึกรายการนี้" ได้เสมอไม่ว่าจับคู่ครบหรือยัง ไม่มีทางเขียน
//   PurchaseReceipts เองได้เลย (เรียก submitBillForReview ไปเข้าคิว PendingBillReceipts เท่านั้น)
// - 'owner-resume': เจ้าของเปิดบิลค้างจากหน้า "บิลรอตรวจสอบ" มาทำต่อ — ต้องจับคู่ครบก่อนถึงจะกด
//   "บันทึกต้นทุน" ได้ (เรียก finalizePurchaseReceipt เขียนลง PurchaseReceipts จริง)
function renderBillReview(app){
  const sup = SUPPLIERS.find(s=>s.id===state.billSupplierId);
  const products = PRODUCTS.filter(p=>p.supplierId===sup.id);
  const isResume = state.billMode === 'owner-resume';
  app.appendChild(topbar('ตรวจสอบรายการ', {
    back: ()=> isResume ? go('billPendingList') : go('billCapture'),
    meta: sup.name
  }));
  const c = document.createElement('div'); c.className='content';
  c.innerHTML = `
    <div class="review-bill-strip">
      ${state.billPhotos[0] ? `<img class="rb-thumb" src="${state.billPhotos[0]}" alt="">` : ''}
      <div class="rb-txt">อ่านได้ <b>${state.billItems.length} รายการ</b> จากรูปบิล ${state.billPhotos.length} ใบ ${isResume ? '· ถ่ายโดย '+state.billStaffName : ''}<br><i class="ti ti-folder" aria-hidden="true"></i> เก็บไว้ในโฟลเดอร์ Drive ของ ${sup.name} อัตโนมัติ</div>
      <button class="btn" id="viewPhoto">ดูรูป</button>
    </div>
    <div id="itemList"></div>
    <div class="review-footer">
      <div class="rf-summary"><span id="rfPending"></span><span>รวม <b class="rf-total" id="rfTotal">฿0</b></span></div>
      ${isResume
        ? `<button class="btn btn-primary btn-block" id="saveBtn" disabled>บันทึกต้นทุน</button>`
        : `<button class="btn btn-primary btn-block" id="submitBtn">บันทึกรายการนี้</button>`}
    </div>
  `;
  app.appendChild(c);
  c.querySelector('#viewPhoto').onclick = ()=>{
    const lb = document.createElement('div'); lb.className = 'bill-photo-lightbox';
    lb.innerHTML = `<button class="lb-close" aria-label="ปิด">✕</button>
      <div class="lb-scroll">${state.billPhotos.map(url=>`<img src="${url}" alt="">`).join('')}</div>`;
    lb.onclick = ()=> lb.remove();
    lb.querySelector('.lb-close').onclick = (e)=>{ e.stopPropagation(); lb.remove(); };
    document.body.appendChild(lb);
  };

  const listEl = c.querySelector('#itemList');

  // "จับคู่แล้ว" นับจริงเฉพาะที่ confirmed:true เท่านั้น — รายการที่ AI คาดว่าใช่ (matchType:'fuzzy')
  // ยังไม่นับว่าจับคู่จนกว่าจะมีคนกดยืนยันเอง กันเคส AI เดาผิดแล้วหลุดผ่านไปโดยไม่มีใครสังเกต
  function isResolved(it){ return it.skip || (it.productId && it.factor && it.confirmed); }
  function fmtMoney(n){ return '฿'+(n||0).toLocaleString('th-TH',{maximumFractionDigits:2}); }

  function itemCard(it){
    const card = document.createElement('div');
    const pendingFuzzy = it.productId && !it.confirmed;
    card.className = 'item-card' + (it.skip ? ' is-skip' : (it.productId && it.confirmed) ? ' is-matched' : '');
    const total = (it.qty * it.unitPrice) || 0;
    const product = products.find(p=>p.id===it.productId);
    let pillHtml, bodyHtml = '';

    if(it.skip) pillHtml = `<span class="status-pill skip"><i class="ti ti-eye-off" aria-hidden="true"></i> ไม่ใช่สินค้า</span>`;
    else if(pendingFuzzy) pillHtml = `<span class="status-pill fuzzy"><i class="ti ti-sparkles" aria-hidden="true"></i> คล้ายรายการเดิม — ยืนยัน</span>`;
    else if(it.productId) pillHtml = `<span class="status-pill matched"><i class="ti ti-check" aria-hidden="true"></i> ${it.matchType==='exact' ? 'จับคู่อัตโนมัติ' : 'จับคู่แล้ว'}</span>`;
    else pillHtml = `<span class="status-pill unmatched"><i class="ti ti-alert-triangle" aria-hidden="true"></i> ต้องจับคู่</span>`;

    if(!it.skip){
      if(pendingFuzzy){
        // ข้อความบนบิลไม่ตรงกับที่เคยจำไว้เป๊ะ (แค่ "ใกล้เคียง" ตาม similarity score จาก Code.gs) — ต้องให้
        // คนตัดสินใจเอง ไม่จับคู่ให้อัตโนมัติเงียบๆ เหมือน exact match เพราะนี่คือจุดที่ AI อาจเดาผิดได้จริง
        bodyHtml += `
          <div class="fuzzy-box">
            <div class="fz-label"><i class="ti ti-sparkles" aria-hidden="true"></i> AI คาดว่าคือ</div>
            <div class="fz-name">${product ? product.name : ''}</div>
            <div class="fz-hint">เพราะเจอ "${it.billText}" ใกล้เคียงกับ "${it.matchedAliasText||''}" ที่เคยยืนยันไว้ก่อนหน้า (ต่างกันแค่การเว้นวรรค/ตัวสะกดเล็กน้อย) — กรุณายืนยันว่าใช่รายการเดียวกันจริงก่อน</div>
            <div class="fz-actions">
              <button class="fz-confirm" data-confirm="1"><i class="ti ti-check" aria-hidden="true"></i> ใช่ ยืนยัน</button>
              <button class="fz-reject" data-reject="1">ไม่ใช่ เลือกใหม่</button>
            </div>
          </div>`;
      } else if(it.productId){
        const convertedQty = it.factor ? (it.receivedQty * it.factor) : it.receivedQty;
        bodyHtml += `<div class="matched-line"><i class="ti ti-check" aria-hidden="true"></i> ${product ? product.name : ''} ${it.factor && it.factor!==1 ? `· = ${convertedQty} ${product?product.orderUnit:''}` : ''}
          <button class="btn" style="margin-left:auto; padding:3px 8px; font-size:11px;" data-rematch="1">เปลี่ยน</button></div>`;
      } else {
        bodyHtml += `<select class="matchSelect">
            <option value="" selected disabled>ค้นหา/เลือกสินค้าของเรา...</option>
            ${products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}
          </select>`;
      }
      if(it.productId && it.needsFactor){
        bodyHtml += `<div class="conversion-box">
            <div class="cv-label"><i class="ti ti-sparkles" aria-hidden="true"></i> ตั้งอัตราแปลงหน่วย (ใหม่)</div>
            <div class="conversion-row">1 ${it.unit} = <input type="number" class="factorInput" min="0" step="0.01" placeholder="?"> ${product ? product.orderUnit : 'หน่วยของเรา'}</div>
            <div class="conversion-hint">จำไว้ใช้อัตโนมัติทุกครั้งที่เจอ "${it.billText}" จาก ${sup.name} อีก</div>
          </div>`;
      }
      bodyHtml += `
        <div class="item-field-row">
          <div class="item-field"><label>ตามบิล (${it.unit})</label><input type="number" class="qtyInput" value="${it.qty}" min="0" step="0.01"></div>
          <div class="item-field received"><label>รับจริง (${it.unit})</label><input type="number" class="receivedInput" value="${it.receivedQty}" min="0" step="0.01"></div>
        </div>
        <div id="driftSlot-${it._id}"></div>
        <div class="item-field-row">
          <div class="item-field"><label>ราคา/หน่วย (฿)</label><input type="number" class="priceInput" value="${it.unitPrice}" min="0" step="0.01"></div>
        </div>
        <div class="item-total"><span>รวมรายการนี้ (ตามบิล)</span><b>${fmtMoney(total)}</b></div>`;
    }

    card.innerHTML = `
      <div class="item-head">
        <div style="flex:1;min-width:0;">
          <div class="item-bill-text">${it.billText}</div>
          <div class="item-bill-raw">อ่านจากบิล: ${it.qty} ${it.unit} × ฿${it.unitPrice}</div>
        </div>
        ${pillHtml}
      </div>
      ${bodyHtml}
      ${it.likelyNonProduct ? `<label class="item-skip-toggle"><input type="checkbox" class="skipToggle" ${it.skip?'checked':''}> ข้ามรายการนี้ (ไม่ใช่สินค้าที่ต้องสต๊อก)</label>` : ''}
    `;

    function renderDrift(){
      const slot = card.querySelector(`#driftSlot-${it._id}`);
      if(!slot) return;
      const d = Number((it.receivedQty - it.qty).toFixed(2));
      if(!d){ slot.innerHTML = ''; return; }
      slot.innerHTML = d < 0
        ? `<div class="drift-flag short"><i class="ti ti-alert-triangle" aria-hidden="true"></i> ซัพพลายเออร์ส่งขาด ${Math.abs(d)} ${it.unit} (บิลระบุ ${it.qty} แต่รับจริง ${it.receivedQty})</div>`
        : `<div class="drift-flag over"><i class="ti ti-alert-triangle" aria-hidden="true"></i> ได้รับเกินบิล ${d} ${it.unit} (บิลระบุ ${it.qty} แต่รับจริง ${it.receivedQty})</div>`;
    }
    renderDrift();

    const sel = card.querySelector('.matchSelect');
    if(sel) sel.onchange = ()=>{ it.productId = sel.value; it.matchType = 'manual'; it.confirmed = true; it.needsFactor = true; it.factor = null; drawAll(); };
    const rematchBtn = card.querySelector('[data-rematch]');
    if(rematchBtn) rematchBtn.onclick = ()=>{ it.productId = null; it.factor = null; it.matchType = null; it.confirmed = false; it.needsFactor = false; drawAll(); };
    const confirmBtn = card.querySelector('[data-confirm]');
    if(confirmBtn) confirmBtn.onclick = ()=>{ it.confirmed = true; drawAll(); };
    const rejectBtn = card.querySelector('[data-reject]');
    if(rejectBtn) rejectBtn.onclick = ()=>{ it.productId = null; it.factor = null; it.matchType = null; it.confirmed = false; it.needsFactor = false; drawAll(); };
    const fac = card.querySelector('.factorInput');
    if(fac) fac.oninput = ()=>{ it.factor = fac.value ? Number(fac.value) : null; updateFooter(); };
    const qtyI = card.querySelector('.qtyInput');
    if(qtyI) qtyI.oninput = ()=>{ it.qty = Number(qtyI.value)||0; card.querySelector('.item-total b').textContent = fmtMoney(it.qty*it.unitPrice); updateFooter(); renderDrift(); };
    const recI = card.querySelector('.receivedInput');
    if(recI) recI.oninput = ()=>{ it.receivedQty = Number(recI.value)||0; renderDrift(); };
    const priI = card.querySelector('.priceInput');
    if(priI) priI.oninput = ()=>{ it.unitPrice = Number(priI.value)||0; card.querySelector('.item-total b').textContent = fmtMoney(it.qty*it.unitPrice); updateFooter(); };
    const skipT = card.querySelector('.skipToggle');
    if(skipT) skipT.onchange = ()=>{ it.skip = skipT.checked; drawAll(); };

    return card;
  }

  function drawAll(){
    listEl.innerHTML = '';
    state.billItems.forEach(it=> listEl.appendChild(itemCard(it)));
    updateFooter();
  }
  function updateFooter(){
    const pending = state.billItems.filter(it=> !isResolved(it)).length;
    const total = state.billItems.filter(it=> !it.skip).reduce((s,it)=> s + (it.qty*it.unitPrice||0), 0);
    // ฝั่งลูกจ้าง: บอกความคืบหน้าเฉยๆ ไม่บล็อกการส่ง (เจ้าของจะจับคู่ส่วนที่เหลือต่อเอง)
    // ฝั่งเจ้าของ (resume): ต้องจับคู่ครบก่อนถึงจะบันทึกจริงได้ เพราะรายการที่ไม่มี ProductID ผูกต้นทุนเข้ากับสินค้าไหนไม่ได้เลย
    c.querySelector('#rfPending').innerHTML = pending>0 ? `<span class="warn">ยังไม่จับคู่อีก ${pending} รายการ</span>` : `จับคู่ครบแล้ว (${state.billItems.length} รายการ)`;
    c.querySelector('#rfTotal').textContent = fmtMoney(total);
    const saveBtn = c.querySelector('#saveBtn');
    if(saveBtn) saveBtn.disabled = pending>0;
  }
  drawAll();

  const saveBtn = c.querySelector('#saveBtn');
  if(saveBtn) saveBtn.onclick = async ()=>{
    // โหมดเจ้าของเท่านั้นที่มีปุ่มนี้ — จุดเดียวในระบบที่เขียนต้นทุนจริงลง PurchaseReceipts
    saveBtn.disabled = true; saveBtn.textContent = 'กำลังบันทึก...';
    try{
      const items = state.billItems.filter(it=>!it.skip).map(it=>({
        productId: it.productId, billText: it.billText, billQty: it.qty, billUnit: it.unit,
        receivedQty: it.receivedQty, conversionFactor: it.factor || 1, unitPrice: it.unitPrice, saveAlias: true
      }));
      // ห้ามใส่ retryOnTimeout — finalizePurchaseReceipt สร้างแถวใหม่ทุกครั้งที่เรียก ไม่ idempotent
      const res = await apiPost('finalizePurchaseReceipt', {
        batchId: state.billResumeBatchId, supplierId: state.billSupplierId, staffName: state.billStaffName, items
      });
      go('billSuccess', {billLearnedCount: res.learnedCount||0});
    }catch(err){
      saveBtn.disabled = false; saveBtn.textContent = 'บันทึกต้นทุน';
      alert('บันทึกไม่สำเร็จ: ' + err.message);
    }
  };

  const submitBtn = c.querySelector('#submitBtn');
  if(submitBtn) submitBtn.onclick = async ()=>{
    // ฝั่งลูกจ้างไม่มีทางเขียนลง PurchaseReceipts เองเลย ไม่ว่าจะจับคู่ครบหรือไม่ก็ตาม — ทุกใบต้องผ่าน
    // เจ้าของตรวจ/กดบันทึกจริงอีกทีเสมอ (ดู renderBillPendingList / โหมด owner-resume ด้านบน)
    submitBtn.disabled = true; submitBtn.textContent = 'กำลังบันทึก...';
    try{
      // ส่งทุกรายการ (รวมที่ข้าม) ไปด้วย — เจ้าของต้องเห็นครบทุกรายการตอนตรวจ ไม่ใช่แค่ที่ลูกจ้างเลือกเก็บ
      // ห้ามใส่ retryOnTimeout — สร้างแถวใหม่/อัปโหลดรูปทุกครั้งที่เรียก ไม่ idempotent
      await apiPost('submitBillForReview', {
        supplierId: state.billSupplierId, staffName: state.billStaffName, photos: state.billPhotos, items: state.billItems
      });
      go('billSuccess', {});
    }catch(err){
      submitBtn.disabled = false; submitBtn.textContent = 'บันทึกรายการนี้';
      alert('บันทึกไม่สำเร็จ: ' + err.message);
    }
  };
}

/* ---- 6) บันทึกสำเร็จ ---- */
function renderBillSuccess(app){
  const sup = SUPPLIERS.find(s=>s.id===state.billSupplierId);
  const products = PRODUCTS.filter(p=>p.supplierId===sup.id);

  if(state.billMode !== 'owner-resume'){
    // ลูกจ้างส่งแล้ว — ยังไม่ใช่การบันทึกต้นทุนจริง แค่ส่งเข้าคิวให้เจ้าของตรวจ/กดบันทึกจริงอีกที
    app.appendChild(topbar('บันทึกสำเร็จ', {}));
    const c = document.createElement('div'); c.className='content';
    c.innerHTML = `
      <div class="success-wrap">
        <div class="success-icon" style="background:var(--amber-bg); color:var(--amber);"><i class="ti ti-clock" aria-hidden="true"></i></div>
        <h2>บันทึกรายการนี้แล้ว</h2>
        <p>${sup.name} · ถ่ายโดย ${state.billStaffName}</p>
      </div>
      <div class="recap-card" style="text-align:left;">
        <p style="margin:0; font-size:13px; color:var(--text-secondary);">รูปบิลกับสิ่งที่จับคู่ไว้แล้วถูกเก็บไว้ให้แล้ว เจ้าของร้านจะเห็นในเมนู "บิลรอตรวจสอบ" ตรวจทานอีกรอบแล้วกดบันทึกต้นทุนจริงเอง</p>
      </div>
      <button class="btn btn-primary btn-block" id="doneBtn">เสร็จสิ้น กลับหน้าแรก</button>
    `;
    app.appendChild(c);
    c.querySelector('#doneBtn').onclick = ()=> go('home');
    return;
  }

  const kept = state.billItems.filter(it=>!it.skip);
  const total = kept.reduce((s,it)=> s + (it.qty*it.unitPrice||0), 0);
  const drifted = kept.filter(it=> Number((it.receivedQty-it.qty).toFixed(2)) !== 0);
  app.appendChild(topbar('บันทึกสำเร็จ', {}));
  const c = document.createElement('div'); c.className='content';
  c.innerHTML = `
    <div class="success-wrap">
      <div class="success-icon"><i class="ti ti-check" aria-hidden="true"></i></div>
      <h2>บันทึกต้นทุนเรียบร้อย</h2>
      <p>${sup.name} · โดย ${state.billStaffName}</p>
    </div>
    <div class="recap-card">
      ${kept.map(it=>{
        const p = products.find(x=>x.id===it.productId);
        const diff = Number((it.receivedQty-it.qty).toFixed(2));
        return `<div class="recap-row"><span class="rr-name">${p?p.name:it.billText}${diff!==0?` <span style="color:${diff<0?'var(--danger)':'var(--amber)'};font-weight:700;">(${diff<0?'ขาด':'เกิน'} ${Math.abs(diff)})</span>`:''}</span><span class="rr-val">${it.qty}${it.unit} · ฿${(it.qty*it.unitPrice).toLocaleString('th-TH',{maximumFractionDigits:0})}</span></div>`;
      }).join('')}
      <div class="recap-row"><span class="rr-name"><b>ยอดรวม (ตามบิล)</b></span><span class="rr-val" style="font-size:15px;">฿${total.toLocaleString('th-TH',{maximumFractionDigits:2})}</span></div>
    </div>
    ${drifted.length ? `<div class="learned-note drift-note"><i class="ti ti-alert-triangle" aria-hidden="true"></i> พบส่วนต่างจากบิล ${drifted.length} รายการ — เช็คช่อง "รับจริง" ของแต่ละรายการด้านบนเพื่อดูว่าซัพพลายเออร์ส่งขาด/เกินตรงไหน</div>` : ''}
    ${state.billLearnedCount>0 ? `<div class="learned-note"><i class="ti ti-sparkles" aria-hidden="true"></i> จดจำการจับคู่ใหม่ ${state.billLearnedCount} รายการไว้แล้ว ครั้งหน้าเจอชื่อเดิมจาก ${sup.name} ระบบจะจับคู่ให้อัตโนมัติทันที</div>` : ''}
    <button class="btn btn-primary btn-block" id="doneBtn">เสร็จสิ้น กลับหน้าแรก</button>
    <button class="btn-text-cancel" id="moreBtn">กลับไปดูบิลรอตรวจสอบใบอื่น</button>
  `;
  app.appendChild(c);
  c.querySelector('#doneBtn').onclick = ()=> go('home');
  c.querySelector('#moreBtn').onclick = ()=> go('billPendingList');
}

/* ---- 7) เจ้าของ: บิลรอตรวจสอบ ---- */
async function renderBillPendingList(app){
  app.appendChild(topbar('บิลรอตรวจสอบ', {back:()=>go('ownerMenu')}));
  const c = document.createElement('div'); c.className='content';
  c.innerHTML = `<p class="empty-state">กำลังโหลด...</p>`;
  app.appendChild(c);
  try{
    const { batches } = await apiGet('pendingBills');
    if(!batches.length){ c.innerHTML = `<p class="empty-state">ไม่มีบิลค้างตรวจสอบตอนนี้ 🎉</p>`; return; }
    c.innerHTML = batches.map(b=>{
      const sup = SUPPLIERS.find(s=>s.id===b.supplierId);
      const done = b.items.filter(it=> it.skip || (it.productId && it.factor && it.confirmed)).length;
      return `<div class="pending-row" data-id="${b.batchId}">
        <div class="sup-thumb"><i class="ti ti-building-store" aria-hidden="true"></i></div>

      go('billReview', {

        billStaffName:b.staffName, billPhotos: String(b.photoUrl||'').split(',').filter(Boolean), billItems:b.items

  }catch(err){
    c.innerHTML = `<p class="empty-state" style="color:var(--danger);">โหลดไม่สำเร็จ: ${err.message}</p>`;
