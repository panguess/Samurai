<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- เจอปัญหาจริง 7 ก.ย. 69: ไอคอนที่ปักหน้าจอโฮมมือถือแคชหน้านี้ค้างไว้ ทำให้ deploy โค้ดใหม่ไปแล้วแต่
     มือถือยังเห็นโค้ดเก่าอยู่ (ต้องพิมพ์ URL พร้อม query string สุ่มถึงจะบังคับโหลดใหม่ได้) แก้หลักไว้ที่
     vercel.json (Cache-Control header จริง ซึ่งเบราว์เซอร์/ไอคอนหน้าโฮมให้น้ำหนักมากกว่า) — meta tag นี้
     เป็นการกันสำรองอีกชั้นเผื่อมี caching layer ไหนที่อ่าน meta tag แทน header จริง -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>ซามูไรไส้กรอก — เช็คสต๊อก & สั่งของ</title>
<link rel="apple-touch-icon" href="/icon-192-black.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192-black.png">
<!-- เจอ 15 ก.ย. 69: เข้าแอปไม่ได้ ("ไม่สามารถเปิดไฟล์ได้ในเวลานี้" — หน้า error ของ Google Drive เอง) เฉพาะตอน
     เปิดผ่าน Safari โปรไฟล์ปกติ ขณะที่ incognito เข้าได้ปกติเสมอ — สงสัยว่า Safari ปกติสะสม session/คุกกี้ของ
     Google จากการใช้งานเว็บอื่น (Gmail/Drive/Maps ฯลฯ) แล้วไปชนกับตอนแอปนี้ต้องเข้าถึงไฟล์ Drive (รูปสินค้า/
     สเปรดชีต) ทั้งที่แอปตั้งใจให้เข้าได้แบบไม่ต้องล็อกอิน Google เลย ("Anyone can access") — เพิ่ม
     apple-mobile-web-app-capable ให้ตอนเปิดจากไอคอนหน้าจอโฮม iOS รันแบบ standalone ซึ่งมี storage/คุกกี้
     แยกจาก Safari ปกติโดยสิ้นเชิง (คนละ partition กันเลย) เพื่อกันไม่ให้คุกกี้ที่สะสมจาก Safari ปกติมาปนกับ
     แอปนี้อีก — ยังไม่ยืนยัน 100% ว่าแก้ต้นตอได้จริง (เป็นสมมติฐานที่มีเหตุผลรองรับ ไม่ใช่คำยืนยัน) ผู้ใช้ต้องลบ
     ไอคอนเดิมที่เคยเพิ่มไว้แล้วเพิ่มใหม่หลัง deploy ถึงจะได้ผล -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ซามูไรไส้กรอก">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- ให้เบราว์เซอร์เริ่ม DNS + จับมือ TLS กับ backend ล่วงหน้าตั้งแต่หน้าเพิ่งเริ่มโหลด แทนที่จะรอให้
     สคริปต์ท้าย body เรียก apiGet('bootstrap') ก่อนถึงจะเริ่มเชื่อมต่อ — ช่วยเฉพาะตอน "เชื่อมต่อเย็น"
     (เพิ่งเปิดแท็บ/แอปใหม่ ไม่มีอะไรแคชไว้เลย) ซึ่งเป็นเคสที่ช้าที่สุด ดูคอมเมนต์ใน bootstrap() ด้วย —
     ใส่ทั้งสองโดเมนเพราะ script.google.com/exec redirect ไปยัง script.googleusercontent.com เสมอ -->
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<!-- media="print" + onload swap กันฟอนต์/ไอคอนจาก CDN บล็อกการรันสคริปต์หลักของแอป (สคริปต์เดียวที่ยิง
     apiGet('bootstrap') อยู่ท้าย body ต่อจาก <link> พวกนี้ — เบราว์เซอร์จะไม่รันสคริปต์ที่ตามหลัง
     stylesheet ที่ยังโหลดไม่เสร็จ ถ้าเน็ตเอื้อมไม่ถึง fonts.googleapis.com/cdn.jsdelivr.net ได้ (แพลตฟอร์ม
     บล็อก/เน็ตร้านหลุด) ทั้งแอปจะค้างจอเปล่าหลายวินาทีถึงหลักสิบวินาทีโดยไม่จำเป็น) -->
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.48.0/dist/tabler-icons.min.css" media="print" onload="this.media='all'">
<style>
  :root{
    --brand:#1A1A1A; --brand-bg:#ECECEA;
    --cream:#FCF9F2;
    --bg:#F1EFE8;
    /* WCAG AA fix (27 ก.ย. 69 — audit หมวด A): --text-tertiary เดิม #888780 contrast ~3.4:1 บนพื้น --cream/--bg
       (ต่ำกว่าเกณฑ์ข้อความ 4.5:1) เข้มขึ้นเป็น #67665E ให้ผ่าน ≥4.5:1 ทุกพื้นหลังที่ใช้จริง (cream/bg/#fff) —
       --border-strong เดิม alpha 0.22 contrast ~1.5:1 (ต่ำกว่าเกณฑ์ UI component boundary 3:1 มาก) เพิ่ม alpha
       เป็น 0.6 ให้ผ่าน ≥3.6:1 ทุกพื้นหลัง — ทั้งคู่เป็น token ที่ใช้ร่วมกันหลายสิบจุดในไฟล์ แก้ตรงนี้จุดเดียวกระทบ
       ภาพรวมทุกหน้าจอที่ใช้ตัวแปรนี้ (ตั้งใจ ไม่ใช่บั๊ก) */
    --text:#2C2C2A; --text-secondary:#5F5E5A; --text-tertiary:#67665E;
    --border:rgba(44,44,42,0.12); --border-strong:rgba(44,44,42,0.6);
    --radius-md:8px; --radius-lg:12px;
    --green:#085041; --green-bg:#E1F5EE;
    /* สเกลความเสี่ยงของการจับคู่รายการบิล (รับของ-ถ่ายบิล): เขียว(ตรงเป๊ะ) < เหลือง(คล้าย ต้องยืนยัน) <
       ส้ม(จับคู่ไม่ได้เลย — ใช้ --amber ด้านล่างนี้แหละ) — ดู renderBillReview() */
    --yellow:#7A6900; --yellow-bg:#FFF6C8;
    --amber:#854F0B; --amber-bg:#FAEEDA; --amber-mid:#EF9F27;
    --purple:#3C3489; --purple-bg:#EEEDFE;
    --pink:#993556; --pink-bg:#FBEAF0;
    --danger:#A32D2D; --danger-bg:#FCEBEB;
  }
  *{box-sizing:border-box;}
  body{font-family:'Sarabun',sans-serif; background:var(--bg); color:var(--text); margin:0; -webkit-font-smoothing:antialiased;}
  #app{max-width:600px; margin:0 auto; min-height:100vh; background:var(--cream); display:flex; flex-direction:column;}
  .topbar{background:var(--brand); color:var(--cream); padding:14px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:10;}
  .topbar h1{font-size:16px; font-weight:600; margin:0; flex:1;}
  .topbar .back{cursor:pointer; font-size:18px; background:none; border:none; color:var(--cream); padding:4px;}
  .topbar .meta{font-size:13px; opacity:0.9;}
  .content{flex:1; padding:14px; padding-bottom:80px;}
  button{font-family:inherit;}
  .btn{border:1px solid var(--border-strong); background:var(--cream); color:var(--text); border-radius:var(--radius-md); padding:9px 14px; font-size:13px; cursor:pointer;}
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--brand); color:var(--cream); border:none; font-weight:600;}
  .btn-text-cancel{width:100%; margin-top:8px; padding:9px 14px; background:none; border:none; color:var(--text-secondary); font-size:13px; text-decoration:underline; cursor:pointer;}
  .btn-block{width:100%; padding:12px; font-size:14px;}
  input[type=text], input[type=number], input[type=password], select{
    font-family:inherit; font-size:14px; border:1px solid var(--border-strong); border-radius:var(--radius-md);
    padding:8px 10px; width:100%; background:#fff; color:var(--text);
  }
  input:focus, select:focus{outline:2px solid var(--brand); outline-offset:1px;}
  table{border-collapse:collapse;}

  /* employee: supplier list */
  .progress-track{height:6px; background:var(--bg); border-radius:8px; overflow:hidden; margin:10px 0 14px;}
  .progress-fill{height:100%; background:var(--cream); opacity:0.8; border-radius:8px;}
  .sup-row{display:flex; align-items:center; gap:10px; padding:8px 12px; border:1px solid var(--border); border-radius:var(--radius-md); margin-bottom:6px; cursor:pointer; background:#fff;}
  .sup-row:focus-visible{outline:2px solid var(--brand); outline-offset:2px;}
  /* WCAG AA fix (27 ก.ย. 69, ACC-008): grep + ตรวจ classList.add ทั้งไฟล์ยืนยันว่า .sup-row ไม่เคยถูกเติมคลาส
     "done" จริงเลย (dead CSS ไม่มีผลกับผู้ใช้ตอนนี้) แก้ค่าไว้เพื่อความถูกต้องของ source เผื่อถูกใช้ในอนาคต */
  .sup-row.done{opacity:0.9;}
  .sup-thumb{width:44px; height:44px; border-radius:var(--radius-md); background:var(--bg); display:flex; align-items:center; justify-content:center; color:var(--text-tertiary); font-size:18px; flex-shrink:0;}
  .sup-row p{margin:0; font-size:14px; font-weight:500; flex:1;}
  .section-label{font-size:13px; color:var(--text-secondary); margin:14px 0 6px; font-weight:500;}

  /* employee: stock check grid */
  .prod-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; align-items:stretch;}
  .prod-card{border-radius:16px; padding:10px; border:2px solid var(--border); display:flex; flex-direction:column; height:100%;}
  .prod-card.checked{background:#EAF3DE; border-color:#639922;}
  .prod-photo-area{position:relative; width:100%; padding-top:100%; border-radius:12px; overflow:hidden; margin-bottom:8px;}
  .prod-photo-area .photo-inner{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
  .prod-photo-area.no-photo{cursor:pointer;}
  .prod-photo-area img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;}
  .photo-placeholder{display:flex; flex-direction:column; align-items:center; gap:5px;}
  .photo-placeholder span{font-size:11px; color:var(--text-tertiary);}
  .prod-photo-area .check-toggle{position:absolute; top:6px; right:6px; background:rgba(255,255,255,0.9); border-radius:50%; width:26px; height:26px; display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; color:var(--text-tertiary); border:none; padding:0;}
  .retake-badge{position:absolute; top:6px; left:6px; background:rgba(255,255,255,0.9); border-radius:50%; width:26px; height:26px; display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--text-tertiary); pointer-events:none;}
  .cover-toggle{position:absolute; top:6px; left:6px; background:rgba(255,255,255,0.9); border-radius:50%; width:26px; height:26px; display:flex; align-items:center; justify-content:center; font-size:14px; cursor:pointer; color:var(--text-tertiary); border:none; padding:0;}
  .cover-toggle.is-cover{color:var(--danger);}
  .cover-toggle:disabled{opacity:0.35; cursor:not-allowed;}
  .prod-card.is-cover{border-color:var(--danger);}
  .cover-tag{font-size:10px; color:var(--danger); font-weight:600; margin:2px 0 0;}
  /* ไอคอนติ๊กถูกแบบทึบ ("เช็คแล้ว" บนการ์ดสินค้าหน้าเช็คสต๊อก) — ตั้งแต่ Tabler 3.37.0 (ก.พ. 69)
     ไอคอนทึบถูกย้ายออกจาก tabler-icons.min.css ไปเป็นฟอนต์แยก แอปเคยโหลด @latest เลยได้ปุ่มว่างเปล่ามาตลอด (พบตอนล็อก
     เวอร์ชัน 1 ต.ค. 69) ไม่โหลด tabler-icons-filled.min.css ทั้งไฟล์เพราะไฟล์นั้นบังคับ .ti ทุกตัวเป็นฟอนต์ทึบ (!important)
     ไอคอนเส้นอื่นทั้งแอปจะเพี้ยน — ดึงแค่ไฟล์ฟอนต์ (เวอร์ชันเดียวกับลิงก์ด้านบน) ผูกเฉพาะคลาสนี้ เบราว์เซอร์โหลดฟอนต์นี้ก็ต่อเมื่อ
     มีติ๊กถูกโผล่บนจอจริงเท่านั้น รหัสตัวอักษรเอามาจาก tabler-icons-filled.min.css 3.48.0 (.ti-circle-check)
     ตั้งใจไม่ผูก ti-heart-filled (ปุ่ม/ป้ายรูปปก) — ผู้ใช้ไม่เอาหัวใจแล้ว ฟีเจอร์นั้นปิดอยู่ด้วย ALLOW_SET_COVER_PHOTO */
  @font-face{font-family:"tabler-icons-filled"; font-style:normal; font-weight:400; font-display:block;
    src:url("https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.48.0/dist/fonts/tabler-icons-filled.woff2?v3.48.0") format("woff2");}
  .ti.ti-circle-check-filled:before{font-family:"tabler-icons-filled"; content:"\f704";}
  .add-prod-card{width:100%; min-width:0; min-height:140px; max-height:100%; border-radius:16px; border:1.5px dashed var(--border-strong); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--text-tertiary); cursor:pointer; background:none;}
  .add-prod-card span{text-align:center; padding:0 6px; font-size:12px;}
  /* จำนวนสินค้าคู่ (N) → การ์ด "เพิ่มสินค้าใหม่" (ลำดับที่ N+1 คี่) จะเหลือตัวเดียวในแถวสุดท้าย ไม่มีการ์ดคู่ให้ stretch
     เทียบความสูงด้วย เลยแบนเตี้ยกว่าการ์ดที่มีของ + เหลือช่องขวาว่างโบ๋ (ตกขอบ) แก้ด้วยการยืดเต็มแถวไปเลยในกรณีนี้ */
  .add-prod-card:nth-child(odd):last-child{ grid-column:1 / -1; min-height:96px; flex-direction:row; }

  /* add product form sheet (reuses match-overlay/match-sheet styles) */
  .addprod-body{overflow-y:auto; padding:12px 16px; flex:1;}
  .addprod-body label{display:block; font-size:12px; color:var(--text-secondary); margin:12px 0 4px;}
  .addprod-body label:first-child{margin-top:0;}
  .addprod-error{font-size:12px; color:var(--danger); margin-top:8px; display:none;}
  .date-opt-row{display:block; padding:10px 12px; border:1px solid var(--border-strong); border-radius:10px; margin-bottom:8px; font-size:13px; cursor:pointer;}
  .date-opt-row input{margin-right:8px; accent-color:var(--brand);}
  #skipCustomDate{width:100%; padding:8px; border:1px solid var(--border-strong); border-radius:8px; font-family:inherit; font-size:13px;}

  /* photo match screen */
  .match-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:80; display:flex; align-items:flex-end; justify-content:center;}
  .match-sheet{background:var(--cream); width:100%; max-width:600px; max-height:88vh; border-radius:16px 16px 0 0; display:flex; flex-direction:column; overflow:hidden;}
  /* โฟกัสตัวกล่อง dialog เองตอนเปิด (setupDialogFocus) — ไม่ต้องมีกรอบ outline ล้อมทั้งแผ่น เพราะแผ่นทั้งอัน
     ก็คือ dialog ที่มองเห็นชัดเจนอยู่แล้ว ปุ่ม/ช่องกรอกข้างในยังมี focus ring ของตัวเองตามปกติไม่กระทบ */
  .match-sheet:focus{outline:none;}
  /* กันกรอบ outline เต็มจอตอน setupDialogFocus โฟกัสตัว lightbox เอง — ปุ่ม/รูปข้างในยังมี focus ring
     ของตัวเองตามปกติไม่กระทบ (เหมือน .match-sheet:focus ด้านบน) */
  .bill-photo-lightbox:focus, .avatar-lightbox:focus{outline:none;}
  .match-sheet-header{padding:14px 16px; border-bottom:1px solid var(--border); flex-shrink:0;}
  .match-sheet-header h2{margin:0 0 2px; font-size:15px; font-weight:600;}
  .match-sheet-header p{margin:0; font-size:12px; color:var(--text-tertiary);}
  .match-list{overflow-y:auto; padding:12px 16px; flex:1;}
  .match-row{display:flex; gap:10px; align-items:center; background:#fff; border:1px solid var(--border); border-radius:12px; padding:10px; margin-bottom:8px;}
  .match-thumb{width:56px; height:56px; border-radius:8px; object-fit:cover; flex-shrink:0; background:var(--bg);}
  .match-row .match-fname{font-size:11px; color:var(--text-tertiary); margin:0 0 4px;}
  .match-row select{font-size:13px; padding:6px 8px;}
  .match-status{font-size:18px; flex-shrink:0;}
  .match-status.done{color:#3B6D11;}
  .match-status.pending{color:var(--text-tertiary);}
  .match-sheet-footer{padding:12px 16px; border-top:1px solid var(--border); flex-shrink:0;}
  .prod-card.checked .check-toggle{color:#3B6D11;}
  .prod-card-name{font-size:12.5px; font-weight:500; margin:0 0 8px;}
  .unit-steppers-row{display:flex; flex-direction:column; gap:3px;}
  .unit-stepper{display:flex; align-items:center; gap:7px; background:#fff; border-radius:var(--radius-md); padding:4px 6px;}
  .prod-card.checked .unit-stepper{background:rgba(255,255,255,0.7);}
  .step-btn{width:24px; height:24px; border-radius:50%; background:var(--brand); color:var(--cream); border:none; font-size:13px; flex-shrink:0; cursor:pointer; line-height:1;}
  input.step-input{width:40px; min-width:0; flex:none; text-align:center; border:none; background:transparent; font-size:12.5px; padding:0;}
  .unit-tag{font-size:10px; color:var(--text-secondary); margin-left:auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  /* WCAG AA fix (27 ก.ย. 69, post-fix audit รอบ 3, ACC-007): เดิมไม่มี padding เลย พื้นที่แตะจริงวัดได้แค่
     14.6–20.7 × 15.0px (ต่ำกว่าเกณฑ์ 24×24px ของ WCAG 2.5.8) — จุดนี้ใช้ 2 ที่ในไฟล์ (หน้าเช็คสต๊อกของ Mile ที่นี่
     ไม่มีกฎ padding อื่นมาแข่ง specificity เลยรับ padding ตรงนี้ได้เต็มๆ / หน้าสั่งของฝั่งเจ้าของที่ .stepper .unit-tag
     มี padding ของตัวเองอยู่แล้วชนะ specificity นี้เสมอ — ต้องแก้แยกอีกจุดด้วย ดูกฎ .stepper .unit-tag-editable
     ด้านล่างที่บรรทัดหลัง .stepper .unit-tag เพื่อให้ลำดับแหล่งที่มาชนะ specificity เท่ากันได้ถูกต้อง) */
  .unit-tag-editable{cursor:pointer; text-decoration:underline dotted; text-underline-offset:2px; padding:6px;}
  .unit-tag-editable:focus-visible{outline:2px solid var(--brand); outline-offset:2px;}
  .unit-tag-editable i{font-size:10px; vertical-align:-1px; margin-left:1px;}
  .oos-btn{width:100%; margin-top:6px; padding:6px; border-radius:8px; border:1.5px solid var(--danger); background:#fff; color:var(--danger); font-size:11px; font-weight:600; font-family:inherit; cursor:pointer;}
  /* สินค้าที่เจ้าของตั้งงดสั่ง/งดเช็คไว้เฉพาะวันนี้ (setProductSkipDate) — การ์ดยังโชว์อยู่เหมือนเดิม
     ไม่หายไปจากลิสต์ แต่จางลง+ขาวดำ กด +/− พิมพ์ช่อง หรือกดปุ่มของหมดไม่ได้เลย กันลูกจ้างงงว่าแอปพัง */
  /* WCAG AA fix (27 ก.ย. 69, ACC-008): เดิม opacity ทำให้ .prod-card-name (ไม่มีสีกำหนดเอง สืบทอด --text เข้ม
     เต็มที่) คอนทราสต์ไม่พอ — เก็บ grayscale ไว้ตามเดิม (เป็น filter ที่ไม่กระทบคอนทราสต์ข้อความ) ตัด opacity
     ออก แล้วคุมสีชื่อสินค้าตรงๆ แทน (ดู .prod-card.skip-today .prod-card-name ด้านล่าง) */
  .prod-card.skip-today{filter:grayscale(0.55);}
  .prod-card.skip-today .prod-card-name{color:var(--text-secondary);}
  .prod-card.skip-today .unit-stepper, .prod-card.skip-today .oos-btn{pointer-events:none;}
  .skip-today-badge{display:inline-block; font-size:10px; font-weight:700; color:#fff; background:var(--danger); border-radius:5px; padding:2px 7px; margin:0 0 6px;}
  .stickybar{position:sticky; bottom:0; background:var(--brand); padding:12px 14px; display:flex; align-items:center; justify-content:space-between; margin:14px -14px -80px; gap:10px;}
  .stickybar span{color:var(--cream); font-size:13px;}
  .stickybar .btn-primary{background:var(--cream); color:var(--brand);}

  /* owner */
  .nav-tile{background:#fff; border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px; cursor:pointer; display:flex; align-items:center; gap:12px; margin-bottom:10px;}
  .nav-tile:focus-visible{outline:2px solid var(--brand); outline-offset:2px;}
  .nav-tile.featured{border:2px solid var(--brand);}
  .nav-tile p{margin:0; font-weight:500; font-size:14px;}
  .nav-tile small{color:var(--text-secondary); font-size:12px;}
  .tabs{display:flex; gap:6px; margin-bottom:14px;}
  .tab{border:1px solid var(--border-strong); background:#fff; border-radius:var(--radius-md); padding:6px 13px; font-size:13px; cursor:pointer;}
  .tab.active{background:var(--brand); color:var(--cream); border-color:var(--brand);}
  button.tab{font-family:inherit; color:var(--text);} /* E2E-012: แท็บช่วงเวลาเป็น <button> จริงแล้ว ให้หน้าตาเหมือนแท็บ <div> เดิม */
  .metric-grid{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; margin-bottom:14px;}
  .metric{background:var(--bg); border-radius:var(--radius-md); padding:9px;}
  .metric p:first-child{font-size:12px; color:var(--text-secondary); margin:0 0 4px;}
  .metric p:last-child{font-size:19px; font-weight:600; margin:0;}
  /* E2E-004 (1 ต.ค. 69): Dashboard สต๊อกมี 4 ช่อง (ทั้งหมด/ยังมี/หมด/ยังไม่เช็ค) — ป้ายสั้นและไม่ตัดบรรทัดให้พอดีจอแคบ 320px */
  .metric-grid.cols-4{grid-template-columns:repeat(4, minmax(0,1fr)); gap:6px;}
  .metric-grid.cols-4 .metric{padding:8px 7px; min-width:0;}
  .metric-grid.cols-4 .metric p:first-child{font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .badge-unchecked{background:var(--bg); color:var(--text-secondary); border:1px dashed var(--border-strong);}
  .badge-skip{background:var(--danger-bg); color:var(--danger); font-weight:600;}
  .stock-skip-line{display:flex; gap:6px; align-items:center; background:var(--danger-bg); color:var(--danger); border-radius:var(--radius-md); padding:6px 10px; font-size:12.5px; font-weight:600; margin:-6px 0 12px;}
  .sup-header{padding:7px 10px; border-radius:0; margin:0; border-left:3px solid; font-size:13px; font-weight:600; display:flex; justify-content:space-between; align-items:center; position:sticky; top:48px; z-index:3;}
  .badge{font-size:11px; padding:2px 8px; border-radius:6px; font-weight:500; display:inline-block;}
  .empty-state{text-align:center; color:var(--text-secondary); font-size:13px; padding:30px 0;}
  .copy-toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--text); color:#fff; padding:8px 16px; border-radius:8px; font-size:13px; z-index:60;}

  /* accordion order rows */
  .acc-group{border:1px solid var(--border); border-top:none; border-radius:0 0 var(--radius-lg) var(--radius-lg); overflow:hidden; margin-bottom:14px;}
  .select-all-row{padding:8px 10px; background:#fcfcfa; border-bottom:1px solid var(--border);}
  .link-btn{background:none; border:none; padding:0; font-family:inherit; font-size:11.5px; font-weight:600; color:var(--text-secondary); cursor:pointer;}
  .link-btn:active{opacity:0.6;}
  .prow{display:flex; flex-direction:column; gap:7px; padding:9px 10px; border-bottom:1px solid var(--border); background:#fff;}
  .prow:last-child{border-bottom:none;}
  .prow.low{background:var(--danger-bg);}
  .prow-top{display:flex; align-items:center; gap:9px;}
  .prow-bottom{display:flex; align-items:center; gap:6px;}
  .prow input[type=checkbox]{flex-shrink:0; width:24px; height:24px;}
  .prow-name{flex:1; min-width:0; font-size:13px; color:var(--text); line-height:1.3;}
  .prow.low .prow-name{font-weight:600;}
  .prow.skip-set{background:var(--danger-bg);}
  .prow-name-wrap{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px;}
  .prow-skip-sub{font-size:10.5px; color:var(--danger); font-weight:600;}
  .skip-toggle-btn{border:1px solid var(--danger); background:#fff; color:var(--danger); border-radius:7px; padding:5px 9px; font-size:11px; font-weight:600; font-family:inherit; cursor:pointer; white-space:nowrap; flex-shrink:0;}
  .skip-toggle-btn.active{background:var(--danger); color:#fff;}
  .stat{display:flex; flex-direction:column; align-items:flex-end; min-width:44px;}
  .stat .lbl{font-size:10px; color:var(--text-tertiary); font-weight:600; line-height:1.3; letter-spacing:0.02em;}
  .stat .v{font-size:19px; font-weight:800; color:var(--text); line-height:1.15; font-variant-numeric:tabular-nums;}
  .stat .v .u{font-size:11px; font-weight:600; color:var(--text-secondary); margin-left:2px;}
  .stat .v.muted{color:var(--text-tertiary); font-weight:500;}
  .oos-badge{display:inline-block; font-size:10.5px; font-weight:700; color:#fff; background:var(--danger); border-radius:5px; padding:1px 6px;}
  .stat.danger .lbl, .stat.danger .v{color:var(--danger);}
  .stepper{display:flex; align-items:center; border:1px solid var(--border-strong); border-radius:8px; overflow:hidden; background:#fff; flex-shrink:0; margin-left:auto;}
  .stepper .unit-tag{font-size:13px; font-weight:600; color:var(--text); margin-left:0; padding:0 8px 0 6px; overflow:visible; text-overflow:clip; white-space:nowrap; flex-shrink:0;}
  /* WCAG AA fix (27 ก.ย. 69, post-fix audit รอบ 3, ACC-007): จุดนี้ (หน้าสั่งของฝั่งเจ้าของ) วัดจริงได้ 32.7×21px
     กว้างพอแล้วแต่สูงขาด 3px จากเกณฑ์ 24px — เพิ่มแค่ padding แนวตั้ง ไม่แตะแนวนอน (กันไม่ให้ความกว้างของแถว
     .stepper เปลี่ยนจากที่ตั้งใจไว้เดิม) ต้องอยู่ "หลัง" กฎ .stepper .unit-tag ด้านบนเสมอ (specificity เท่ากัน
     2 คลาส ตัดสินด้วยลำดับในไฟล์ — เอาไว้ก่อนจะแพ้แล้วไม่มีผลอะไรเลย) */
  .stepper .unit-tag-editable{padding-top:4px; padding-bottom:4px;}
  .stepper button{width:26px; height:28px; border:none; background:var(--bg); color:var(--text); font-size:14px; cursor:pointer; flex-shrink:0;}
  input.stepper-input{width:36px; min-width:0; flex-shrink:0; text-align:center; border:none; border-left:1px solid var(--border); border-right:1px solid var(--border); font-size:13px; font-weight:700; padding:5px 0;}

  /* order overview + collapsible supplier cards */
  .stat-strip{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; margin-bottom:12px;}
  /* UX fix (28 ก.ย. 69, UX-003): อธิบายวงกลม ✓ ยืนยันส่งออเดอร์ (.order-done-check) ครั้งเดียวตรงนี้
     แทนที่จะไม่มีคำอธิบายเลยที่ไหนบนหน้าจอ — โชว์ครั้งเดียวเหนือรายชื่อร้าน ไม่พ่วงทุกแถวกันหน้าจอรก */
  .confirm-hint{font-size:11.5px; color:var(--text-tertiary); line-height:1.4; margin:0 0 12px;}
  .confirm-hint .dim{color:var(--text-tertiary);}
  .order-confirmed-label{font-size:10.5px; color:var(--green); font-weight:600; margin-left:4px;}
  .stat-card{background:#fff; border:1px solid var(--border); border-radius:var(--radius-md); padding:9px 6px; text-align:center;}
  .stat-card .n{font-size:19px; font-weight:700; line-height:1.1;}
  .stat-card .lbl{font-size:10.5px; color:var(--text-tertiary); margin-top:2px; line-height:1.2;}
  .stat-card.danger .n{color:var(--danger);}
  .stat-card.green .n{color:var(--green);}
  .stat-card.amber .n{color:var(--amber);}
  .ord-card{border:1px solid var(--border); border-radius:var(--radius-lg); margin-bottom:10px; overflow:hidden; background:#fff; display:flex;}
  .ord-card-strip{width:5px; flex-shrink:0; background:var(--border-strong);}
  .ord-card.state-needorder .ord-card-strip{background:var(--danger);}
  .ord-card.state-partial .ord-card-strip{background:var(--amber);}
  .ord-card.state-ordered .ord-card-strip{background:var(--green);}
  .ord-card-main{flex:1; min-width:0;}
  .ord-card-head{display:flex; align-items:center; gap:10px; padding:12px; cursor:pointer; background:var(--brand-bg);}
  /* offset ติดลบ (ไม่ใช่ค่าบวกแบบการ์ดอื่น) เพราะ .ord-card แม่มี overflow:hidden ครอบอยู่ — ถ้าใช้ offset
     บวกแบบเดิม กรอบโฟกัสที่ล้นออกนอกกรอบจะโดนตัดไปครึ่งหนึ่ง มองไม่เห็นเต็มวง */
  .ord-card-head:focus-visible{outline:2px solid var(--brand); outline-offset:-2px;}
  .ord-card-head .chev{font-size:14px; color:var(--text-tertiary); transition:transform .15s; flex-shrink:0;}
  .ord-card.open .ord-card-head .chev{transform:rotate(180deg);}
  .ord-card.state-ordered .ord-card-head{background:var(--green-bg);}
  .order-done-check{width:24px; height:24px; border-radius:50%; background:none; border:2px solid var(--green); color:transparent; font-size:13px; font-weight:700; padding:0; display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer;}
  .order-done-check.confirmed{background:var(--green); color:#fff;}
  .order-done-check:disabled{opacity:0.5; cursor:default;}
  .ord-card-name{font-weight:600; font-size:14.5px; flex:1; min-width:0;}
  /* แท็ก "สั่งเผื่อ" — ข้อมูลเสริมแปะไว้ในคอลัมน์สถานะฝั่งขวา (ไม่ใช่ข้างชื่อเจ้า) เพราะชื่อเจ้าเป็น
     flex ที่ยืด/หดตามความยาวข้อความสถานะ ถ้าแปะข้างชื่อ พอสถานะเปลี่ยนความยาว (เช่น "เลือกไว้ N รายการ"
     โผล่/หาย) แท็กจะขยับตำแหน่งตามไปด้วย — วางในคอลัมน์ฝั่งขวาที่ตำแหน่งคงที่แทน ไม่ขยับอีก
     และอยู่ "บรรทัดเดียวกับสถานะ" (.status-top-row) ไม่ใช่ซ้อนเป็นบรรทัดใหม่ กันการ์ดที่มีแท็ก
     สูงกว่าการ์ดใบอื่นในลิสต์ */
  .status-top-row{display:flex; align-items:center; gap:6px;}
  .stockup-tag{font-size:11px; font-weight:700; color:var(--amber); background:var(--amber-bg); border-radius:6px; padding:2px 7px; white-space:nowrap;}
  /* หัวข้อเซกชัน "ต้องสั่งวันนี้" / "เจ้าอื่นทั้งหมด" — แพทเทิร์นเดียวกับ .role-label ที่มีอยู่แล้ว */
  .section-label{font-size:10.5px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-tertiary); margin:18px 0 9px 2px; display:flex; align-items:center; gap:7px;}
  .section-label::after{content:''; flex:1; height:1px; background:var(--border-strong);}
  .section-label.due{color:var(--amber);}
  .section-label.due::after{background:rgba(133,79,11,0.25);}
  .section-label:first-child{margin-top:0;}
  /* WCAG AA fix (27 ก.ย. 69, ACC-008): opacity เดิมบนการ์ดทั้งใบทำให้ข้อความคอนทราสต์ไม่พอ (คอนทราสต์ 5.49:1
     ของ --text-secondary บน --brand-bg ผ่านเกณฑ์ ≥4.5:1 อยู่แล้วโดยไม่ต้องหรี่ opacity) เปลี่ยนมาคุมสีชื่อร้าน
     ตรงๆ แทน คงความรู้สึก "หรี่ลง" ไว้แต่ไม่พังคอนทราสต์ */
  .other-section .ord-card-name{color:var(--text-secondary);}
  .ord-card-status{display:flex; flex-direction:column; gap:2px; align-items:flex-end; flex-shrink:0;}
  .status-line{font-size:13px; font-weight:600; white-space:nowrap;}
  .status-line.wait{color:var(--text-tertiary);}
  .status-line.partial{color:var(--amber);}
  .status-line.needorder{color:var(--danger);}
  .status-line.ordered{color:var(--green);}
  .status-sub{font-size:11px; color:var(--text-tertiary); white-space:nowrap;}
  .ord-card-body{display:none; border-top:1px solid var(--border);}
  .ord-card.open .ord-card-body{display:block;}
  .sup-order-btn-row{padding:8px 10px; display:flex; justify-content:flex-end;}

  /* playful redesign additions */
  .hero{background:var(--brand); padding:1.8rem 1.5rem 1rem; text-align:center;}
  .hero-logo{width:180px; max-width:70vw; height:auto; display:block; margin:0 auto 6px;}
  .hero-left{display:flex; align-items:center; gap:12px;}
  .hero-date{text-align:right; flex-shrink:0;}
  .hero-date strong{display:block; font-size:13px; font-weight:600; color:rgba(252,249,242,0.7);}
  /* WCAG AA fix (27 ก.ย. 69, post-fix audit รอบ 3 — พบว่าจุดนี้ใช้ rgba() ของตัวเอง ไม่ได้ผูกกับ --text-tertiary
     เลย แก้ตัวแปรตอนแรกจึงไม่ครอบคลุมจุดนี้ เดิม alpha 0.38 contrast ~3.47:1 ต่ำกว่าเกณฑ์ 4.5:1 → เพิ่ม alpha
     เป็น 0.5 ให้ผ่าน ~5.0:1 บนพื้น --brand */
  .hero-date span{font-size:11px; color:rgba(252,249,242,0.5);}
  .role-label{font-size:10.5px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-tertiary); margin:18px 0 9px 2px; display:flex; align-items:center; gap:7px;}
  .role-label::after{content:''; flex:1; height:1px; background:var(--border-strong);}
  .action-card{display:flex; align-items:center; gap:16px; padding:22px 20px; border-radius:16px; border:1px solid var(--border-strong); background:#fff; cursor:pointer; margin-bottom:10px; -webkit-tap-highlight-color:transparent; box-shadow:0 2px 8px rgba(0,0,0,0.06);}
  .action-card:focus-visible{outline:2px solid var(--brand); outline-offset:2px;}
  .action-card.primary{background:var(--brand); border-color:transparent;}
  .action-card.primary .act-title{color:var(--cream);}
  /* WCAG AA fix (27 ก.ย. 69, post-fix audit รอบ 3): การ์ด .primary/.bill มี override สีของตัวเอง ไม่ได้ผูกกับ
     --text-tertiary เลย (แก้ตัวแปรตอนแรกจึงไม่ครอบคลุม) เดิม .primary .act-sub alpha 0.45 contrast 4.31:1
     (ต่ำกว่า 4.5:1 เฉียดนิดเดียว) → เพิ่มเป็น 0.5 ให้ผ่าน ~5.0:1 — .bill .act-sub เดิม alpha 0.6 contrast
     2.84:1 (ต่ำกว่ามาก) → เพิ่มเป็น 0.9 ให้ผ่าน ~5.6:1 บนพื้น .action-card.bill (#FEF3DF) */
  .action-card.primary .act-sub{color:rgba(252,249,242,0.5);}
  .action-card.primary .act-chev{color:rgba(252,249,242,0.3);}
  .action-card.bill{background:#FEF3DF; border-color:rgba(122,70,8,0.16);}
  .action-card.bill .act-title{color:#7A4608;}
  .action-card.bill .act-sub{color:rgba(122,70,8,0.9);}
  .action-card.bill .act-chev{color:rgba(122,70,8,0.3);}
  .act-icon{width:56px; height:56px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:37.5px; flex-shrink:0;}
  .act-body{flex:1;}
  .act-title{font-size:22.5px; font-weight:700; color:var(--text); margin-bottom:4px;}
  /* WCAG AA fix (27 ก.ย. 69, post-fix audit รอบ 3): เดิมมี opacity:0.75 ทับซ้อนกับ alpha ของ color ที่ override
     ไว้ใน .action-card.primary/.bill (บรรทัดด้านบน) ทำให้ contrast จริงต่ำกว่าที่คำนวณไว้ตอนแรกมาก (opacity ของ
     element เองไม่โผล่ใน getComputedStyle().color ตอนคำนวณ ต้องคูณเพิ่มเอง) ลบ opacity ทิ้ง ให้ค่า alpha ที่ตั้งไว้
     ในแต่ละ context (0.5 / 0.9 ด้านบน, หรือสีทึบของ --text-tertiary ในการ์ดฐาน) เป็นตัวกำหนด contrast ตรงๆ ค่าเดียว
     ไม่ซ้อนกันอีก — ใช้แค่ 3 จุดนี้เท่านั้นทั้งไฟล์ (การ์ดหน้าแรก 3 ใบ) ปลอดภัยที่จะลบ */
  .act-sub{font-size:15px; color:var(--text-tertiary); line-height:1.4;}
  .act-chev{font-size:22px; color:var(--text-tertiary); flex-shrink:0; opacity:0.35;}
  .icon-card{display:flex; align-items:center; gap:13px; background:#fff; border:0.5px solid var(--border); border-radius:14px; padding:13px; margin-bottom:9px; cursor:pointer;}
  .icon-box{width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .pick-row{display:flex; align-items:center; gap:13px; background:#fff; border:0.5px solid var(--border); border-radius:16px; padding:10px 14px; margin-bottom:9px; cursor:pointer;}
  .pick-avatar{width:96px; height:96px; border-radius:50%; border:2px solid var(--text); display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden; cursor:zoom-in;}
  .pick-avatar:focus-visible, .avatar-edit-badge:focus-visible, .staff-pick:focus-visible{outline:2px solid var(--brand); outline-offset:2px;}
  .pick-avatar img{width:100%; height:100%; object-fit:cover; display:block;}
  .avatar-lightbox{position:fixed; inset:0; background:rgba(0,0,0,0.88); display:flex; align-items:center; justify-content:center; z-index:90;}
  .avatar-lightbox img{max-width:82vw; max-height:70vh; border-radius:20px; box-shadow:0 10px 40px rgba(0,0,0,0.5);}
  .avatar-lightbox .lb-close{position:absolute; top:20px; right:18px; color:#fff; font-size:26px; background:none; border:none; cursor:pointer; padding:6px;}
  .avatar-wrap{position:relative; flex-shrink:0;}
  .avatar-edit-badge{position:absolute; bottom:-2px; right:-2px; width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,0.55); color:var(--text-tertiary); display:flex; align-items:center; justify-content:center; font-size:14px; border:1.5px solid var(--border); cursor:pointer;}
  .sup-card-grid{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:9px;}
  /* รูปกินเต็มการ์ด (ไม่มีกรอบซ้อนกรอบ) — เดิม .sup-icon มีบอร์เดอร์+รัศมีมุมของตัวเอง
     ซ้อนอยู่ในการ์ดที่มีบอร์เดอร์+padding อยู่แล้ว รูปเลยดูหดเล็กกว่าที่ควรจะเป็น ตอนนี้ตัดกรอบชั้นในออก
     ให้รูปชนขอบการ์ดแล้วปล่อยให้ overflow:hidden ของการ์ดตัดมุมโค้งให้แทน กรอบเดียวพอ (กรอบการ์ด) */
  .sup-card{display:flex; flex-direction:column; align-items:center; gap:8px; background:#fff; border:0.5px solid var(--border); border-radius:16px; padding-bottom:10px; text-align:center; cursor:pointer; overflow:hidden;}
  .sup-card:focus-visible{outline:2px solid var(--brand); outline-offset:2px;}
  /* WCAG AA fix (27 ก.ย. 69, ACC-008): opacity เดิมทำให้ข้อความชื่อร้าน/ไอคอนคอนทราสต์ไม่พอ — ตอนนี้
     supplierCard() คุมสีตัวอักษร/ไอคอนตรงๆ แทนแล้ว (ดู nameMuted ใน supplierCard()) ไม่ต้องใช้ opacity อีก */
  .sup-card.urgent{border:1px solid rgba(163,45,45,0.4); box-shadow:0 0 0 1px rgba(163,45,45,0.12) inset;}
  .sup-icon-wrap{position:relative; width:100%;}
  .sup-icon{width:100%; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .sup-num-badge{position:absolute; top:6px; left:6px; min-width:28px; height:28px; padding:0 6px; border-radius:14px; background:var(--brand); color:var(--cream); border:2.5px solid #fff; font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 4px rgba(0,0,0,0.3); z-index:1;}
  /* ป้ายสถานะสั่งของบนการ์ดร้าน (เฉพาะร้านที่ถึงรอบ OrderDays วันนี้) — ดู renderSupplierList() */
  .status-pill{font-size:9px; font-weight:700; padding:2px 7px; border-radius:999px; white-space:nowrap; margin-top:-2px;}
  .status-pill.urgent{background:var(--danger-bg); color:var(--danger);}
  .status-pill.ordered{background:var(--green-bg); color:var(--green);}
  .status-pill.matched{background:var(--green-bg); color:var(--green);}
  .status-pill.unmatched{background:var(--amber-bg); color:var(--amber);}
  .status-pill.skip{background:var(--brand-bg); color:var(--text-secondary);}
  .status-pill.fuzzy{background:var(--yellow-bg); color:var(--yellow);}
  .section-label.urgent{color:var(--danger);}
  .section-label.urgent::after{background:rgba(163,45,45,0.22);}
  .section-label.ordered{color:var(--green);}
  .section-label.ordered::after{background:rgba(8,80,65,0.22);}
  .topbar-num-badge{min-width:28px; height:28px; padding:0 6px; border-radius:14px; background:var(--brand); color:var(--cream); border:2px solid #fff; font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-left:auto;}

  /* ============ รับของ — ถ่ายบิล ============ */
  .capture-hint{font-size:13px; color:var(--text-secondary); line-height:1.55; margin-bottom:16px;}
  .capture-zone{border:1.5px dashed var(--border-strong); border-radius:var(--radius-lg); padding:26px 16px; text-align:center; margin-bottom:14px;}
  .capture-zone i{font-size:26px; color:var(--text-tertiary); margin-bottom:8px; display:block;}
  .capture-zone p{font-size:12.5px; color:var(--text-tertiary); margin:0 0 14px;}
  .bill-pick-row{display:flex; gap:8px;}
  .bill-pick-row .btn{flex:1; white-space:nowrap;}
  .bill-photo-strip{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .bill-photo-chip{position:relative; width:72px; height:96px; border-radius:8px; overflow:hidden; border:1px solid var(--border-strong); flex-shrink:0; background:var(--bg);}
  .bill-photo-chip img{width:100%; height:100%; object-fit:cover; display:block;}
  .bill-photo-chip .rm{position:absolute; top:2px; right:2px; width:24px; height:24px; border-radius:50%; background:rgba(28,26,20,0.72); color:#fff; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; font-size:13px; line-height:1;}

  .analyzing-wrap{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:70px 20px; text-align:center;}
  .spin-ring{width:40px; height:40px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--purple); animation:spin 0.9s linear infinite; margin-bottom:18px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){.spin-ring{animation:none; border-top-color:var(--border-strong);}}
  .analyzing-wrap h2{font-size:15px; font-weight:600; margin:0 0 6px;}
  .analyzing-wrap p{font-size:12.5px; color:var(--text-tertiary); max-width:280px; line-height:1.5; margin:0;}

  .item-card{border:1px solid var(--border); border-radius:var(--radius-lg); padding:12px; margin-bottom:10px; background:#fff; scroll-margin-top:64px;}
  /* Speed รอบ 1 (F): บิลใหญ่ 50+ รายการ เบราว์เซอร์ต้องจัดวางข้อความไทยทุกการ์ดทั้งที่มองเห็นแค่ 2-3 ใบ — ข้ามการ์ดที่อยู่นอกจอ
     (ใช้ขนาดประมาณ 330px แทน แล้วจำขนาดจริงหลังเห็นครั้งแรก) เบราว์เซอร์ที่ไม่รู้จัก property นี้ก็แค่วาดทุกใบเหมือนเดิม */
  .item-card{content-visibility:auto; contain-intrinsic-size:auto 330px;}
  .item-card.is-matched{border-color:rgba(8,80,65,0.22);}
  /* WCAG AA fix (27 ก.ย. 69, ACC-008): opacity เดิมบนการ์ดทั้งใบทำให้ข้อความชื่อรายการ (.item-bill-text ปกติ
     ไม่มีสี กำหนดเอง สืบทอด --text เข้มเต็มที่) คอนทราสต์ไม่พอ — คุมสีตรงๆ ที่ .item-bill-text แทน (ดูด้านล่าง) */
  .item-card.is-skip .item-bill-text{color:var(--text-secondary);}
  .item-head{display:flex; align-items:flex-start; gap:8px; margin-bottom:9px;}
  .item-bill-text{font-size:13.5px; font-weight:600; flex:1; min-width:0;}
  .item-bill-raw{font-size:11px; color:var(--text-tertiary); margin-top:1px;}
  .item-field-row{display:flex; gap:8px; margin-bottom:8px;}
  .item-field{flex:1; min-width:0;}
  .item-field label{display:block; font-size:10.5px; color:var(--text-tertiary); margin-bottom:3px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em;}
  .item-field input{font-size:13.5px; padding:7px 9px; font-variant-numeric:tabular-nums;}
  .item-field.received label{color:var(--text-secondary);}
  .item-field.received input{border-color:var(--text); font-weight:600;}
  .drift-flag{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; border-radius:6px; padding:7px 9px; margin-bottom:8px;}
  .drift-flag.short{background:var(--danger-bg); color:var(--danger);}
  .drift-flag.over{background:var(--amber-bg); color:var(--amber);}
  .matched-line{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--green); background:var(--green-bg); border-radius:6px; padding:6px 9px; margin-bottom:8px;}
  .conversion-box{background:var(--amber-bg); border-radius:8px; padding:9px 10px; margin-bottom:8px;}
  .conversion-box .cv-label{font-size:11.5px; color:var(--amber); font-weight:600; margin-bottom:6px; display:flex; align-items:center; gap:5px;}
  .conversion-row{display:flex; align-items:center; gap:6px; font-size:13px; flex-wrap:wrap;}
  .conversion-row input{width:64px; text-align:center; padding:6px;}
  /* WCAG AA fix (27 ก.ย. 69, post-fix audit รอบ 3): พื้นหลังจริงคือ --amber-bg (จาก .conversion-box) ไม่ใช่ขาว
     ตามที่เข้าใจผิดตอนแรก — เดิม rgba(122,70,8,0.75) contrast ~3.85:1 (ต่ำกว่า 4.5:1) เปลี่ยนเป็น var(--amber)
     สีทึบตรงๆ (ตัวเดียวกับ .cv-label ข้างบนในกล่องเดียวกัน) ให้ผ่าน ~5.86:1 */
  .conversion-hint{font-size:11px; color:var(--amber); margin-top:6px; line-height:1.4;}
  .fuzzy-box{background:var(--yellow-bg); border-radius:8px; padding:10px 11px; margin-bottom:8px;}
  .fuzzy-box .fz-label{font-size:11.5px; color:var(--yellow); font-weight:600; margin-bottom:4px; display:flex; align-items:center; gap:5px;}
  .fuzzy-box .fz-name{font-size:13.5px; font-weight:600; margin-bottom:8px;}
  /* WCAG AA fix (27 ก.ย. 69, post-fix audit รอบ 3): เดิม rgba(122,105,0,0.8) contrast ~3.4:1 บน --yellow-bg
     (ต่ำกว่า 4.5:1) เปลี่ยนเป็น var(--yellow) สีทึบตรงๆ (ตัวเดียวกับ .fz-label ข้างบนในกล่องเดียวกัน) ให้ผ่าน ~5.0:1 */
  .fuzzy-box .fz-hint{font-size:11px; color:var(--yellow); margin-bottom:9px; line-height:1.4;}
  .fuzzy-box .fz-actions{display:flex; gap:8px;}
  .fuzzy-box .fz-actions button{flex:1; padding:8px; font-size:12.5px; border-radius:8px; border:none; cursor:pointer; font-family:inherit; font-weight:600;}
  .fz-confirm{background:var(--yellow); color:#fff;}
  .fz-reject{background:#fff; color:var(--text-secondary); border:1px solid var(--border-strong) !important;}
  .item-total{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:var(--text-secondary); margin-top:8px; padding-top:8px; border-top:1px dashed var(--border); font-variant-numeric:tabular-nums;}
  .item-total b{color:var(--text); font-size:14px;}
  .item-skip-toggle{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-secondary); margin-top:8px; cursor:pointer; user-select:none;}
  .item-skip-toggle input{width:14px; height:14px; margin:0;}

  .review-footer{position:sticky; bottom:0; background:var(--cream); border-top:1px solid var(--border); padding:12px 16px 14px; margin:0 -14px -80px;}
  .review-footer .rf-summary{display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px; color:var(--text-secondary); margin-bottom:9px; gap:8px; flex-wrap:wrap;}
  .review-footer .rf-summary .warn{color:var(--amber); font-weight:600;}
  .review-footer .rf-total{font-size:19px; font-weight:700; font-variant-numeric:tabular-nums;}
  .rf-left{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .jump-btn{display:inline-flex; align-items:center; gap:5px; background:var(--amber-bg); color:var(--amber); border:none; border-radius:999px; padding:5px 11px 5px 9px; font-size:11px; font-weight:700; cursor:pointer; white-space:nowrap; font-family:inherit;}
  /* WCAG AA fix (27 ก.ย. 69): เดิม hover ใช้ --amber-mid (สีอ่อน) เป็นพื้นหลังกับตัวอักษรขาว contrast ~2.2:1
     (ต่ำกว่าเกณฑ์ 4.5:1 มาก) เปลี่ยนเป็น --amber (สีเข้ม) แทน ยังให้ความรู้สึก "เข้มขึ้นตอน hover" เหมือนเดิม
     แต่ contrast ขึ้นเป็น ~6.7:1 */
  .jump-btn:hover{background:var(--amber); color:#fff;}
  @keyframes jumpPulse{
    0%{ box-shadow:0 0 0 0 rgba(239,159,39,0.55); border-color:var(--amber-mid); }
    70%{ box-shadow:0 0 0 9px rgba(239,159,39,0); border-color:var(--amber-mid); }
    100%{ box-shadow:0 0 0 0 rgba(239,159,39,0); }
  }
  .jump-highlight{animation:jumpPulse 1.4s ease-out; border-color:var(--amber-mid) !important;}

  .success-wrap{text-align:center; padding:24px 8px 6px;}
  .success-icon{width:56px; height:56px; border-radius:50%; background:var(--green-bg); color:var(--green); display:flex; align-items:center; justify-content:center; margin:0 auto 14px; font-size:26px;}
  .success-wrap h2{font-size:16.5px; font-weight:700; margin:0 0 4px;}
  .success-wrap p{font-size:12.5px; color:var(--text-tertiary); margin:0;}
  .recap-card{background:var(--bg); border-radius:var(--radius-lg); padding:14px; margin:18px 0; text-align:left;}
  .recap-row{display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:6px 0; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums;}
  .recap-row:last-child{border-bottom:none;}
  .recap-row .rr-name{color:var(--text-secondary); font-variant-numeric:normal;}
  .recap-row .rr-val{font-weight:600; text-align:right; flex-shrink:0;}
  .learned-note{display:flex; gap:8px; background:var(--purple-bg); color:var(--purple); border-radius:8px; padding:9px 11px; font-size:12px; line-height:1.5; text-align:left; margin-bottom:18px;}
  .learned-note i{flex-shrink:0; margin-top:1px;}
  .drift-note{background:var(--danger-bg); color:var(--danger);}

  .review-bill-strip{display:flex; align-items:center; gap:10px; background:var(--bg); border-radius:var(--radius-md); padding:8px 10px; margin-bottom:14px;}
  .review-bill-strip .rb-thumb{width:34px; height:44px; border-radius:5px; border:1px solid var(--border-strong); object-fit:cover; flex-shrink:0; background:#fff;}
  .review-bill-strip .rb-txt{flex:1; min-width:0; font-size:11.5px; color:var(--text-secondary); line-height:1.5;}
  .review-bill-strip .rb-txt b{color:var(--text); font-weight:600;}
  .review-bill-strip button{flex-shrink:0;}

  /* การ์ดหัวบิล (วันที่/เลขที่บิล/ยอดรวม/VAT) — ขึ้นเฉพาะบิลบริษัทจดทะเบียนที่ Gemini อ่านค่าพวกนี้ได้จริง
     (analyzeBillPhoto คืน billHeader:null สำหรับบิลเขียนมือ) ไม่ขึ้นการ์ดนี้เลยถ้าไม่มีข้อมูล ไม่ใช่บั๊ก */
  .bill-header-card{border:1px solid var(--border); border-radius:var(--radius-lg); padding:12px; margin-bottom:14px; background:#fff;}
  .bhc-label{display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; color:var(--text-secondary); margin:0 0 10px; text-transform:uppercase; letter-spacing:0.02em;}
  .bhc-label .tag{background:var(--green-bg); color:var(--green); font-size:9.5px; font-weight:700; padding:2px 7px; border-radius:999px; text-transform:none; letter-spacing:0;}
  .bhc-row{display:flex; gap:8px; margin-bottom:8px;}
  .bhc-field{flex:1; min-width:0;}
  .bhc-field label{display:block; font-size:10.5px; color:var(--text-tertiary); margin-bottom:3px; font-weight:600;}
  .bhc-field input{width:100%; font-variant-numeric:tabular-nums;}
  .bhc-field.total{padding-top:9px; border-top:1px dashed var(--border);}
  .bhc-field.total input{font-weight:700; font-size:15px;}
  .bhc-mismatch{margin-top:9px; background:var(--amber-bg); color:var(--amber); font-size:11.5px; padding:8px 10px; border-radius:8px; display:flex; gap:6px; align-items:flex-start; line-height:1.5;}

  /* คำเตือน "เลือกซัพพลายเออร์ผิด" (7 ก.ย. 69) — สีแดงเข้มกว่า .bhc-mismatch เพราะรุนแรงกว่า (ทั้งบิลผิดเจ้า
     ไม่ใช่แค่ยอดไม่ตรงบรรทัดเดียว) วางไว้บนสุดของหน้ารีวิวให้เห็นก่อนอย่างอื่นเสมอ */
  .supplier-mismatch-warning{background:var(--danger-bg); border:1.5px solid var(--danger); border-radius:var(--radius-lg); padding:11px 12px; margin-bottom:14px; display:flex; gap:9px; align-items:flex-start;}
  .supplier-mismatch-warning .icon{color:var(--danger); font-size:17px; flex-shrink:0; margin-top:1px;}
  .supplier-mismatch-warning .smw-title{font-size:13px; font-weight:700; color:var(--danger); margin:0 0 3px;}
  .supplier-mismatch-warning .smw-body{font-size:12px; color:var(--text); line-height:1.55; margin:0 0 9px;}
  .supplier-mismatch-warning .btn{padding:7px 12px; font-size:12px;}
  /* คำเตือน "บิลนี้อาจซ้ำ" (7 ก.ย. 69 — ต่อ) — เตือนอย่างเดียว ไม่บล็อกการบันทึก (ต่างจาก
     supplier-mismatch-warning ที่ร้ายแรงกว่าเพราะทั้งบิลอาจผิดเจ้า) ใช้สีส้ม (--amber) แยกระดับความรุนแรง */
  .duplicate-bill-warning{background:var(--amber-bg); border:1.5px solid var(--amber-mid); border-radius:var(--radius-lg); padding:11px 12px; margin-bottom:14px; display:flex; gap:9px; align-items:flex-start;}
  .duplicate-bill-warning .icon{color:var(--amber); font-size:17px; flex-shrink:0; margin-top:1px;}
  .duplicate-bill-warning .dbw-title{font-size:13px; font-weight:700; color:var(--amber); margin:0 0 3px;}
  .duplicate-bill-warning .dbw-body{font-size:12px; color:var(--text); line-height:1.55; margin:0 0 8px;}
  .duplicate-bill-warning .dbw-meta{display:flex; align-items:center; gap:6px; margin-bottom:9px; flex-wrap:wrap;}
  .duplicate-bill-warning .dbw-pill{font-size:10px; font-weight:700; padding:2px 7px; border-radius:5px;}
  .duplicate-bill-warning .dbw-pill.pending{background:#fff; color:var(--amber);}
  .duplicate-bill-warning .dbw-pill.finalized{background:var(--green-bg); color:var(--green);}
  .duplicate-bill-warning .btn{padding:7px 12px; font-size:12px;}
  .bill-photo-lightbox{position:fixed; inset:0; background:rgba(0,0,0,0.88); z-index:90; display:flex; align-items:center; justify-content:center; padding:20px;}
  .bill-photo-lightbox .lb-scroll{max-width:92vw; max-height:85vh; overflow-y:auto; display:flex; flex-direction:column; gap:12px;}
  .bill-photo-lightbox img{max-width:92vw; max-height:85vh; border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,0.5); display:block; transition:transform .15s ease; transform-origin:center top;}
  .bill-photo-lightbox .lb-close{position:absolute; top:20px; right:18px; color:#fff; font-size:26px; background:none; border:none; cursor:pointer; padding:6px;}
  /* WCAG AA fix (27 ก.ย. 69, C-4): ซูมรูปบิลเดิมทำได้แค่ดับเบิลคลิก/เมาส์สกอลล์ กดคีย์บอร์ดไม่ได้ — เพิ่มคำแนะนำ
     ให้เห็นว่ากด +/− ซูมได้ (ดู openBillPhotoLightbox) ใช้สีขาวคู่กับพื้นหลังดำเข้มเดิมของ lightbox (contrast สูงอยู่แล้ว) */
  .bill-photo-lightbox .lb-zoom-hint{position:absolute; top:20px; left:18px; color:#fff; font-size:11px; margin:0; opacity:0.85; max-width:58vw; line-height:1.4;}
  .bill-photo-lightbox .lb-zoom-hint kbd{border:1px solid rgba(255,255,255,0.5); border-radius:4px; padding:0 4px; font-size:10px;}
  /* utility: ซ่อนจากตาแต่ยังอ่านได้ด้วย screen reader — ใช้กับ live region ของ attachLoadingTimer (D-8) */
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}

  /* ============ โหมดใหม่ 7 ก.ย. 69: แยกหลายบิลอัตโนมัติ ============ */
  .batch-toggle{border:1.5px solid var(--purple); background:var(--purple-bg); border-radius:var(--radius-lg); padding:11px 12px; margin-bottom:14px; display:flex; gap:10px; align-items:flex-start; cursor:pointer;}

<script>
/* ============ LIVE API CONFIG ============ */
const API_URL = 'https://script.google.com/macros/s/AKfycbytmWrmwrjZQjeUUW1o6CpHZmr5lFAxZJISyvqoyD5hM2TmIABUVfPuqnXseF4-nmw9/exec';
// Apps Script Web App รันในนามบัญชี Google เดียวกันทุกคำขอ ("Execute as: Me") — แปลว่าทุกคนที่เปิดแอปนี้
// (เจ้าของ + ลูกจ้างทุกคน ไม่ว่ากี่คน) ใช้โควต้า "จำนวนการรันพร้อมกัน" ก้อนเดียวกันหมด เจอ 10 ก.ย. 69 ว่า
// ตอนลูกจ้างถ่ายบิลให้ AI อ่าน (analyzeBillPhoto/analyzeBillBatch กินเวลา 45-100+ วิต่อครั้งเพราะรอ Gemini

// เปิดหน้าอื่นพร้อมกันพอดี คำขอนั้นมีโอกาสถูก Google ปฏิเสธตั้งแต่ชั้น infrastructure เลย (ไม่ถึงโค้ด doGet

const BILL_API_URL = 'https://script.google.com/macros/s/AKfycbydw4-CO8PXffbbFV5cRcY030PxLASKknm27Jt4kBE1NYbkXRaZ4inCKXL_6CKFiAg5/exec';

const API_TIMEOUT_MS = 25000; // สัญญาณมือถืออ่อนๆ หรือ Apps Script cold start ตอบช้ากว่า 12 วิได้ง่ายๆ

// เจอจริง 15 ก.ย. 69: submitBillForReview ไม่ idempotent (สร้างแถวใหม่ทุกครั้งที่เรียก) ถ้าเจอ timeout
// (เช่นตอน BillCapture project cold start) แล้วพนักงานกดปุ่ม "บันทึกรายการนี้"/"ส่งทั้งหมด" ซ้ำเอง จะได้บิล
// ซ้ำในคิว "บิลรอตรวจสอบ" จริง (เจอเคสจริง 3 บิลซ้ำสตาร์อัพ) — สร้าง key ใหม่ตอนบิลถูกอ่านสำเร็จครั้งแรก
// (ก่อนเข้าหน้ารีวิว) ใช้ซ้ำได้ทุกครั้งที่ retry ส่งบิลใบเดียวกัน backend เช็คแล้วไม่สร้างซ้อนถ้าเจอ key เดิม
function genIdemKey(){ return 'BI' + Date.now() + '_' + Math.random().toString(36).slice(2); }

// escape ข้อความก่อนแทรกลง innerHTML — ต้องใช้กับข้อความที่มาจากการพิมพ์มือ (ชื่อสินค้า/ชื่อหน่วยนับ
// ที่เจ้าของ/Mile ตั้งเองผ่าน "เพิ่มสินค้าใหม่"/"แก้ชื่อหน่วย") เสมอตอนแทรกลง innerHTML แบบ template
// string ตรงๆ — กัน stored-XSS ถ้ามีคนตั้งชื่อสินค้า/หน่วยเป็น payload เช่น <img onerror=...>
// (เจอจริงจาก Focused Functional & Bug Audit 28 ก.ย. 69 — BUG-003)
function escapeHtml(str){
  return String(str==null?'':str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// หน่วงการเรียก fn จนกว่าจะไม่มีการเรียกซ้ำอีกภายใน wait ms — ใช้กันช่องค้นหาที่ยิง
// renderGroups() รีบิลด์ DOM ทั้งลิสต์ทุกตัวอักษรที่พิมพ์ ซึ่งหนักมากถ้ามีการ์ดเปิดอยู่หลายสิบรายการ
function debounce(fn, wait){
  let t;
  return (...args)=>{ clearTimeout(t); t = setTimeout(()=> fn(...args), wait); };
}

// ผูก handler ให้ el (การ์ด/แถวที่ทำหน้าที่เหมือนปุ่มแต่ไม่ใช่ <button> จริง) ทำงานได้ทั้งคลิก/แตะ
// และคีย์บอร์ด (Enter/Space) — el ต้องมี role="button" tabindex="0" ประกาศไว้ใน HTML อยู่แล้ว
// ใช้เฉพาะจุดที่ el ทำแค่ 1 การกระทำเดียวทั้งก้อน ถ้าในการ์ด/แถวมีปุ่มย่อยซ้อนอยู่ข้างในอีก (เช่น
// ord-card-head ที่มี .order-done-check ซ้อนอยู่) ห้ามใช้ฟังก์ชันนี้ตรงๆ เพราะ keydown จะ bubble
// ขึ้นมาชนกับปุ่มข้างในได้ ต้องเขียน handler แยกเฉพาะจุดนั้น
function bindActivatable(el, handler){
  el.onclick = handler;
  el.onkeydown = (e)=>{
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); handler(e); }
  };
}

// จัดการโฟกัสให้ overlay dialog ทั้ง 3 จุด (จับคู่รูปกับสินค้า/เพิ่มสินค้าใหม่/งดสั่งชั่วคราว ใช้ role="dialog"
// เหมือนกันหมด) — เดิมเปิดแล้วโฟกัสไม่ขยับเข้าไปเลย (screen reader ไม่รู้ตัวด้วยซ้ำว่ามีหน้าต่างเปิดขึ้นมา)
// กด Esc ปิดไม่ได้ และปิดแล้วโฟกัสหายไปที่ <body> ไม่กลับไปจุดเดิม — เรียกทันทีหลัง appendChild(overlay)
// sheetEl ต้องเป็น element ที่มี role="dialog" (จะถูกใส่ tabindex="-1" ให้ที่นี่ ไม่ต้องประกาศเองใน HTML)
// คืนฟังก์ชัน restoreFocus ให้ close() ของแต่ละจุดเรียกเองหลัง overlay.remove() เสมอ
// จงใจไม่ทำ full focus-trap (บังคับวน Tab ในกรอบ dialog เท่านั้น) หรือ inert พื้นหลัง — ประเมินแล้วว่า
// ส่วนนี้ (ย้ายโฟกัสเข้า+Esc ปิด+คืนโฟกัส) ได้ประโยชน์ส่วนใหญ่แล้วโดยความเสี่ยงต่ำกว่ามาก
function setupDialogFocus(overlay, sheetEl, closeFn){
  const triggerEl = document.activeElement;
  sheetEl.tabIndex = -1;
  sheetEl.focus();
  overlay.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape'){ e.preventDefault(); closeFn(); }
  });
  return function restoreFocus(){
    if(triggerEl && document.body.contains(triggerEl) && typeof triggerEl.focus === 'function'){
      triggerEl.focus();
    }
  };
}
async function apiGet(action, params, timeoutMs, baseUrl){
  const qs = new URLSearchParams({action, ...(params||{})}).toString();
  const controller = new AbortController();
  const t = setTimeout(()=>controller.abort(), timeoutMs || API_TIMEOUT_MS);
  try{
    const res = await fetch(`${baseUrl || API_URL}?${qs}`, { signal: controller.signal });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    return data;
  }catch(err){
    throw err.name==='AbortError' ? new Error('หมดเวลาเชื่อมต่อ ลองใหม่อีกครั้ง') : err;
  }finally{ clearTimeout(t); }
}
// retryOnTimeout: ใช้เฉพาะ action ที่ "set" ค่าตรงๆ (เรียกซ้ำแล้วผลลัพธ์เหมือนเดิม ไม่สร้างข้อมูลซ้ำ) เช่น
// setProductSkipDate/setUnitLabel/setOrderUnitLabel/setSupplierCoverPhoto/setSupplierOrderConfirm —
// ห้ามใช้กับ action ที่สร้างแถวใหม่ทุกครั้งที่เรียก (createOrderBatch, addProduct, saveStock,
// saveProductPhotos, saveStaffAvatar) เพราะ retry ซ้ำจะสร้างข้อมูล/อัปโหลดไฟล์ซ้ำซ้อนได้จริง
// timeoutMs: เผื่อไว้สำหรับ action ที่รู้อยู่แล้วว่าช้ากว่าปกติ (เช่น analyzeBillPhoto ที่ต้องรอ AI
// อ่านรูปบิล) ไม่ใส่ก็ใช้ API_TIMEOUT_MS ปกติเหมือนเดิม — คนละเรื่องกับ retryOnTimeout (ห้ามใส่ retryOnTimeout
// กับ action ที่ไม่ idempotent เด็ดขาด ดูคอมเมนต์ apiGet ด้านบน)
async function apiPost(action, payload, retryOnTimeout, timeoutMs, baseUrl){
  const controller = new AbortController();
  const t = setTimeout(()=>controller.abort(), timeoutMs || API_TIMEOUT_MS);
  try{
    const res = await fetch(baseUrl || API_URL, { method:'POST', body: JSON.stringify({action, ...payload}), signal: controller.signal });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    return data;
  }catch(err){
    if(err.name==='AbortError'){
      if(retryOnTimeout) return apiPost(action, payload, false, timeoutMs, baseUrl); // retry เงียบๆ 1 ครั้ง ไม่วนซ้ำไม่รู้จบ
      throw new Error('หมดเวลาเชื่อมต่อ ลองใหม่อีกครั้ง');
    }
    throw err;
  }finally{ clearTimeout(t); }
}

// เจอจริง 7 ก.ย. 69: analyzeBillPhoto/analyzeBillBatch ใช้เวลานาน (40-100+ วิ กว่า Gemini จะอ่านจบ)
// ทำให้การเชื่อมต่อฝั่งเว็บหลุดเป็นระยะระหว่างรอ ("Load failed" — error ระดับ fetch จริงๆ ไม่ใช่
// AbortError ของเราเอง เพราะ timeout ตั้งไว้ 270 วิ ยังไม่ทันถึง) ยืนยันจาก Executions log ว่า
// backend สำเร็จทุกครั้งไม่มีข้อยกเว้น ปัญหาคือแค่ผลลัพธ์ไม่ทันกลับมาถึงจอ — ฟังก์ชันนี้ลองซ้ำอัตโนมัติ
// เงียบๆ ให้แทนที่จะบังคับให้คนกด "ลองใหม่" เอง ปลอดภัยเพราะ action ที่ใช้ฟังก์ชันนี้ต้องเป็นแค่
// "อ่าน/วิเคราะห์" ล้วนๆ ไม่เขียนอะไรลงชีตเลย (analyzeBillPhoto/analyzeBillBatch เท่านั้น) ยิงซ้ำกี่ครั้ง
// ก็ไม่มีข้อมูลซ้ำซ้อน — คนละกรณีกับ retryOnTimeout ของ apiPost() ด้านบนที่สงวนไว้เฉพาะ action "set"
// ค่าตรงๆ (retry แค่ 1 ครั้งตอน AbortError) ห้ามเอาฟังก์ชันนี้ไปใช้กับ action ที่สร้างแถวใหม่/อัปโหลดไฟล์
// (submitBillForReview, finalizePurchaseReceipt ฯลฯ) เด็ดขาด เพราะจะยิงซ้ำแล้วสร้างข้อมูลซ้อนจริง
// เปิดดูรูปบิลเต็มจอ — บนมือถือบีบนิ้วซูมได้เองอยู่แล้วจากเบราว์เซอร์ (viewport ไม่ได้ปิด user-scalable
// ไว้) ไม่ต้องเขียนอะไรเพิ่ม แต่บนคอมพิวเตอร์ไม่มีนิ้วให้บีบ (เจอจริง 7 ก.ย. 69 — เจ้าของรีวิวบิลผ่านคอม
// บางครั้ง) เลยเพิ่มดับเบิลคลิก/เมาส์สกอลล์ซูมให้ใช้ได้ทั้งสองทาง ใช้ร่วมกันทั้งหน้ารีวิวบิลปกติและโหมด
// หลายบิล กันโค้ดซ้ำ 2 จุด
function openBillPhotoLightbox(urls){
  const lb = document.createElement('div'); lb.className = 'bill-photo-lightbox';
  lb.setAttribute('role','dialog');
  lb.setAttribute('aria-label', urls.length>1 ? `รูปบิลขยายเต็มจอ (${urls.length} รูป)` : 'รูปบิลขยายเต็มจอ');
  lb.innerHTML = `<button class="lb-close" aria-label="ปิด">✕</button>
    <p class="lb-zoom-hint">แตะรูปแล้วกด <kbd>+</kbd>/<kbd>−</kbd> เพื่อซูม, <kbd>Enter</kbd> เพื่อซูมสลับ</p>
    <div class="lb-scroll">${urls.map((url,i)=>`<img src="${url}" alt="รูปบิลที่ถ่ายไว้ หน้าที่ ${i+1} จาก ${urls.length}" tabindex="0">`).join('')}</div>`;
  document.body.appendChild(lb);
  const restoreFocus = setupDialogFocus(lb, lb, ()=>close());
  function close(){ lb.remove(); restoreFocus(); }
  lb.onclick = (e)=>{ if(e.target===lb) close(); };
  lb.querySelector('.lb-close').onclick = (e)=>{ e.stopPropagation(); close(); };
  lb.querySelectorAll('img').forEach(img=>{
    let scale = 1;
    const applyScale = ()=>{ img.style.transform = `scale(${scale})`; img.style.cursor = scale>1 ? 'zoom-out' : 'zoom-in'; };
    img.ondblclick = (e)=>{ e.stopPropagation(); scale = scale>1 ? 1 : 2.2; applyScale(); };
    img.addEventListener('wheel', (e)=>{
      e.preventDefault(); e.stopPropagation();
      scale = Math.min(4, Math.max(1, scale + (e.deltaY<0 ? 0.25 : -0.25)));
      applyScale();
    }, {passive:false});
    // WCAG AA fix (27 ก.ย. 69, C-4): เดิมซูมได้แค่ดับเบิลคลิก/เมาส์สกอลล์ (ใช้เมาส์เท่านั้น) เพิ่มคีย์บอร์ด
    // ให้ทำแบบเดียวกันได้ — +/− ขยับทีละ 0.25 เหมือน wheel, Enter/Space สลับ 1x/2.2x เหมือน dblclick ทุก
    // ประการ ไม่แก้ behavior เดิมของ dblclick/wheel เลยแม้แต่บรรทัดเดียว แค่เพิ่มทางเข้าใหม่คู่กัน
    img.onkeydown = (e)=>{
      if(e.key==='+' || e.key==='='){ e.preventDefault(); e.stopPropagation(); scale = Math.min(4, scale+0.25); applyScale(); }
      else if(e.key==='-' || e.key==='_'){ e.preventDefault(); e.stopPropagation(); scale = Math.max(1, scale-0.25); applyScale(); }
      else if(e.key==='Enter' || e.key===' '){ e.preventDefault(); e.stopPropagation(); scale = scale>1 ? 1 : 2.2; applyScale(); }
    };
    applyScale();
  });
}
async function apiPostSilentRetry(action, payload, timeoutMs, maxAttempts, onAttempt, baseUrl){
  let lastErr;
  for(let attempt=1; attempt<=maxAttempts; attempt++){
    if(onAttempt) onAttempt(attempt, maxAttempts);
    try{ return await apiPost(action, payload, false, timeoutMs, baseUrl); }
    catch(err){
      lastErr = err;
      // เจอจริง 17 ก.ย. 69: โควต้า Gemini free tier เต็ม (backend มาร์ค [QUOTA] ไว้ — ดู callGeminiOnce ใน
      // BillCapture-Code.gs) เป็น error ที่ backend ยืนยันแล้วจริงๆ ว่าคำขอไม่ผ่าน ไม่ใช่แค่การเชื่อมต่อหลุด —
      // ต่างจาก error อื่นที่ฟังก์ชันนี้ถูกออกแบบมาให้ลองซ้ำ (Load failed/timeout) ยิงซ้ำถี่ๆ อีก 2-3 ครั้ง
      // มีแต่จะไปแย่งโควต้าที่มีจำกัดอยู่แล้ว (ต่อนาที รวมทั้งร้าน) ซ้ำเติมเปล่าๆ เจอแล้วหยุดทันที ไม่ลองซ้ำต่อ
      if(String(err.message||'').indexOf('[QUOTA]') !== -1) throw err;
      if(attempt<maxAttempts) await new Promise(r=> setTimeout(r, 2000)); // เว้นจังหวะสั้นๆ ให้เน็ตนิ่งก่อนลองใหม่
    }
  }
  throw lastErr;
}
// E2E fix + perf (1 ต.ค. 69, จาก Final E2E Audit — E2E-003): จำคำขอ analyzeBillPhoto ล่าสุดไว้ 1 ชุด (ทั้งระหว่าง
// รอและหลังได้ผลแล้ว) — กดวิเคราะห์ซ้ำด้วยรูปชุดเดิม+ซัพพลายเออร์เดิม (เช่น ย้อนกลับออกไประหว่างรอแล้วกดใหม่, หรือ
// กลับไปหน้าถ่ายรูปแล้วกดวิเคราะห์อีกรอบ) จะได้ผลทันที/ต่อคิวคำขอเดิมที่กำลังรออยู่ แทนการยิงให้ Gemini อ่านใหม่อีก
// 45-100 วิและเปลืองโควต้า — ปลอดภัยเพราะ analyzeBillPhoto อ่านอย่างเดียวไม่เขียนชีต ล้างทิ้งเมื่อ: พัง (ลองใหม่ได้
// จริง), ส่งบิลเข้าคิว/บันทึกต้นทุนสำเร็จ (คำเตือนบิลซ้ำ/alias ที่เพิ่งเรียนรู้ต้องคำนวณใหม่), หรือเกิน 10 นาที
// คืน deep copy ทุกครั้ง — หน้าตรวจแก้ billHeader ตรงๆ (h.billNumber = ...) ห้ามไปแก้ผลที่จำไว้ด้วย
const ANALYZE_CACHE_TTL = 10 * 60 * 1000;
let _analyzeCache = null; // { key, promise, ts }
// key = ซัพพลายเออร์ + hash เต็มทุกตัวอักษรของรูปทุกใบ (FNV-1a 32 บิต + ความยาว) — ไม่ใช้แค่ท้ายสตริง กันรูปคนละใบ
// ที่บังเอิญยาวเท่ากันถูกนับเป็นรูปเดียวกัน ใช้เวลาไม่กี่สิบ ms แม้รูปรวมหลาย MB (เทียบกับรอ AI 45-100 วิ)
function analyzeCacheKey(supplierId, photos){
  return supplierId + '|' + photos.map(p=>{
    const str = String(p);
    let h = 0x811c9dc5;
    for(let i=0; i<str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return str.length + ':' + (h >>> 0).toString(36);
  }).join(',');
}
function analyzeBillPhotoShared(supplierId, photos, onAttempt){
  const key = analyzeCacheKey(supplierId, photos);
  if(!_analyzeCache || _analyzeCache.key !== key || (Date.now() - _analyzeCache.ts) > ANALYZE_CACHE_TTL){
    const entry = { key, ts: Date.now(),
      promise: apiPostSilentRetry('analyzeBillPhoto', { supplierId, photos }, 270000, 3, onAttempt, BILL_API_URL) };
    entry.promise.catch(()=>{ if(_analyzeCache === entry) _analyzeCache = null; });
    _analyzeCache = entry;
  }
  return _analyzeCache.promise.then(res=> JSON.parse(JSON.stringify(res)));
}
function clearAnalyzeCache(){ _analyzeCache = null; }
// error ที่มี marker [QUOTA] มาจาก backend (callGeminiOnce เจอ Gemini 429) — แปลข้อความดิบของ Gemini
// (เต็มไปด้วยศัพท์เทคนิค/ลิงก์ billing) เป็นข้อความที่พนักงานเข้าใจและรู้ว่าต้องทำอะไรต่อ ใช้ร่วมกันทั้ง 3
// จุดที่เรียก analyzeBillPhoto/analyzeBillBatch แล้วต้องโชว์ error ให้คนเห็น
function friendlyBillError(err){
  const msg = String(err && err.message || '');
  if(msg.indexOf('[QUOTA]') !== -1){
    return {
      title: 'AI อ่านบิลเต็มคิวชั่วคราว',
      detail: 'อาจมีคนถ่ายบิลพร้อมกันหลายคน หรือถ่ายติดกันถี่เกินไปในเวลาสั้นๆ กรุณารอสัก 1 นาทีแล้วกด "ลองใหม่" อีกครั้ง',
    };
  }
  return { title: null, detail: msg };
}
// UX fix (28 ก.ย. 69, จาก Focused Usability & UX Audit — UX-001): จุดอื่นๆ ในแอปที่โชว์ error ให้ผู้ใช้เห็น
// (alert/confirm/showError รวม 18 จุด — ไม่นับ friendlyBillError ด้านบนที่มี pattern ของตัวเองอยู่แล้ว)
// เดิมเอา err.message ดิบจาก backend มาต่อท้ายข้อความตรงๆ — ถ้า backend โยน exception จริง (เช่น Google
// Apps Script stack trace) พนักงานจะเห็นข้อความแบบ "Exception: Cannot read properties of null (reading
// 'getRange') at setUnitLabel(Code:842:19)" ซึ่งอ่านไม่รู้เรื่องและไม่รู้จะทำอะไรต่อ — ฟังก์ชันนี้ตรวจจับว่า
// ข้อความ "ดูเป็นเทคนิค" (มีคำว่า Exception/TypeError/ReferenceError/SyntaxError หรือรูปแบบ stack trace
// อย่าง "at ...(file:line:col)") แล้วแทนที่ด้วยข้อความกลางที่บอกให้ทำอะไรต่อแทน — ข้อความที่อ่านรู้เรื่องอยู่แล้ว
// (เช่น "หมดเวลาเชื่อมต่อ ลองใหม่อีกครั้ง" จาก apiGet/apiPost) ปล่อยผ่านเหมือนเดิมไม่แตะ — ของจริงยัง
// log ไว้ที่ console.error เสมอ ไม่ได้หายไปไหน เผื่อต้องไล่บั๊กทีหลัง
function friendlyErrorMessage(err){
  const raw = String((err && err.message) || err || '');
  console.error('[friendlyErrorMessage] raw:', raw);
  const looksTechnical = /Exception|TypeError|ReferenceError|SyntaxError|at\s+\S+\(.*:\d+:\d+\)/.test(raw);
  return looksTechnical ? 'เกิดข้อผิดพลาดบางอย่าง ลองใหม่อีกครั้งนะครับ ถ้ายังไม่ได้ให้บอกเจ้าของร้าน' : raw;
}

/* ============ product photo match screen ============ */
// เปิดหน้าจับคู่รูปที่เลือกจากเครื่อง (files) กับสินค้าของซัพพลายเออร์นี้ (products)
// เมื่อบันทึกสำเร็จจะเรียก onDone() เพื่อให้หน้าเดิม re-render
function openPhotoMatchScreen(files, products, onDone){
  const overlay = document.createElement('div');
  overlay.className = 'match-overlay';
  overlay.innerHTML = `
    <div class="match-sheet" role="dialog" aria-labelledby="matchSheetTitle">
      <div class="match-sheet-header">
        <h2 id="matchSheetTitle">จับคู่รูปกับสินค้า</h2>
        <p id="matchProgress">เลือกไว้ ${files.length} รูป · จับคู่แล้ว 0 จาก ${files.length}</p>
      </div>
      <div class="match-list" id="matchList"></div>
      <div class="match-sheet-footer">
        <button class="btn" style="width:100%; margin-bottom:8px;" id="matchCancel">ยกเลิก</button>
        <button class="btn btn-primary btn-block" id="matchSave" disabled>บันทึกรูปที่จับคู่แล้ว (0)</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const restoreFocus = setupDialogFocus(overlay, overlay.querySelector('.match-sheet'), ()=>close());

  const matches = files.map(()=>null); // index -> productId | null
  const list = overlay.querySelector('#matchList');
  const progressEl = overlay.querySelector('#matchProgress');
  const saveBtn = overlay.querySelector('#matchSave');

  function updateProgress(){
    const n = matches.filter(Boolean).length;
    progressEl.textContent = `เลือกไว้ ${files.length} รูป · จับคู่แล้ว ${n} จาก ${files.length}`;
    saveBtn.textContent = `บันทึกรูปที่จับคู่แล้ว (${n})`;
    saveBtn.disabled = n === 0;
  }

  files.forEach((file, i)=>{
    const row = document.createElement('div');
    row.className = 'match-row';
    const url = URL.createObjectURL(file);
    row.innerHTML = `
      <img class="match-thumb" src="${url}" alt="รูปสินค้าที่เลือกไว้ ${i+1}: ${file.name}" loading="lazy">
      <div style="flex:1; min-width:0;">
        <p class="match-fname">${file.name}</p>
        <select data-idx="${i}" aria-label="เลือกสินค้าให้ตรงกับรูป ${file.name}">
          <option value="" selected disabled>เลือกสินค้า...</option>
          ${products.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}
        </select>
      </div>
      <span class="match-status pending" data-idx="${i}"><i class="ti ti-circle-dashed" aria-hidden="true"></i></span>
    `;
    row.querySelector('select').onchange = (e)=>{
      matches[i] = e.target.value || null;
      const statusEl = row.querySelector('.match-status');
      statusEl.className = 'match-status ' + (matches[i] ? 'done' : 'pending');
      statusEl.innerHTML = matches[i] ? '<i class="ti ti-check" aria-hidden="true"></i>' : '<i class="ti ti-circle-dashed" aria-hidden="true"></i>';
      updateProgress();
    };
    list.appendChild(row);
  });

  function close(){ overlay.remove(); restoreFocus(); }
  overlay.querySelector('#matchCancel').onclick = close;

  saveBtn.onclick = async ()=>{
    saveBtn.disabled = true; saveBtn.textContent = 'กำลังบันทึก...';
    try{
      const photos = [];
      for(let i=0; i<files.length; i++){
        if(!matches[i]) continue;
        const dataUrl = await compressImage(files[i], 600, 0.5);
        photos.push({ productId: matches[i], photo: dataUrl });
      }
      await apiPost('saveProductPhotos', { photos });
      photos.forEach(({productId, photo})=>{
        const p = products.find(x=>x.id===productId);
        if(p) p.photoUrl = photo; // อัปเดตให้เห็นผลทันทีในเครื่อง; รูปจริงบน Drive จะมาแทนตอนโหลดใหม่
      });
      close();
      onDone();
    }catch(err){
      saveBtn.disabled = false;
      alert('บันทึกรูปไม่สำเร็จ: ' + friendlyErrorMessage(err));
      updateProgress();
    }
  };
}

// ชื่อวันอังกฤษ (3 ตัวย่อ) ตามลำดับ Date.getDay() (0=Sun ... 6=Sat) — ใช้เทียบกับ supplier.orderDays
// ที่มาจากคอลัมน์ OrderDays ในชีต Suppliers (คั่นด้วยคอมม่า เช่น "Mon,Thu")
// เทียบแบบไม่สนตัวพิมพ์เล็ก/ใหญ่ และตัดเหลือ 3 ตัวแรก รองรับทั้ง "Mon" และ "Monday"
const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function todayDayName(){ return DAY_NAMES[new Date().getDay()]; }
// วันที่ปัจจุบันรูปแบบ yyyy-MM-dd (ตาม timezone เครื่อง) — ใช้เทียบกับ product.skipDates
// ที่เจ้าของตั้งงดสั่ง/งดเช็คไว้เป็นครั้งคราว (ไม่ใช่กฎประจำสัปดาห์แบบ OrderDays)
function isoDate(d){
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function todayISODate(){ return isoDate(new Date()); }
function isProductSkippedToday(p){ return (p.skipDates||[]).includes(todayISODate()); }
const THAI_MONTHS_SHORT = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function formatShortThaiDate(iso){
  const [y,m,d] = String(iso).split('-').map(Number);
  if(!y||!m||!d) return iso;
  return `${d} ${THAI_MONTHS_SHORT[m-1]}`;
}
// วันที่ (ตัวเดียวหรือหลายตัว) ที่เจ้าของตั้งงดสั่งไว้ล่วงหน้าของสินค้าตัวนี้ (>= วันนี้) เรียงจากใกล้สุด
function upcomingSkipDates(p){
  const today = todayISODate();
  return (p.skipDates||[]).filter(d=> d >= today).sort();
}
function supplierDueToday(s){
  const today = todayDayName();
  return (s.orderDays||[]).some(d => String(d).trim().slice(0,3).toLowerCase() === today.toLowerCase());
}
// โน้ต "สั่งเผื่อ" ของแต่ละเจ้า — เดิมคำนวณอัตโนมัติจากช่วงห่างของ OrderDays แต่ในทางปฏิบัติ
// แต่ละเจ้าตกลงกับร้านไว้ไม่เหมือนกัน (บางเจ้า ×2 บางเจ้า ×3 ทั้งที่ช่วงห่างวันเท่ากัน หรือบางเจ้า
// เป็นโน้ตข้อความล้วนไม่ใช่ตัวคูณเลยก็มี) จึงเปลี่ยนมาใช้ค่าที่กำหนดเองจากคอลัมน์ StockupNotes
// ในชีต Suppliers แทน (ฟอร์แมต "วัน:ข้อความ" คั่นด้วย ; เช่น "Tue:×3 สั่งเผื่อ;Sat:ส่งจันทร์")
// ไม่เกี่ยวกับการจัดกลุ่ม "ต้องสั่งวันนี้"/"เจ้าอื่นทั้งหมด" เลย (อันนั้นยึดตาม OrderDays เหมือนเดิม)
function supplierStockupNote(s){
  const notes = s.stockupNotes || {};
  const today = todayDayName().toLowerCase();

function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function ensureOrderPageData(force){
  if(!force && stockStatusCache && (Date.now() - _orderPageDataTs) < STOCK_STATUS_TTL) return;
  const data = await apiGet('orderPageData');
  stockStatusCache = data.stockStatus; _stockStatusTs = Date.now();
  data.stockStatus.forEach(s=> Object.entries(s.remain||{}).forEach(([uid,val])=>{ if(val!==null) stockValues[uid]=val; }));
  orderedProductIds = new Set((data.ordered && data.ordered.productIds) || []);
  confirmedSupplierIds = new Set((data.confirmed && data.confirmed.supplierIds) || []);
  orderedItemsTodayMap = {};
  ((data.orderedItems && data.orderedItems.items) || []).forEach(it=>{ orderedItemsTodayMap[it.productId] = { qty: it.orderQty, unit: it.orderUnit }; });
  _orderPageDataTs = Date.now();
}
function patchStockStatusChecked(products, items){
  // After a successful saveStock, update the cache in place instead of
  // invalidating it, so the next screen doesn't have to wait on another
  // full round-trip just to show what we already know was just saved.
  if(!stockStatusCache) return;
  const remainByUnit = {}; items.forEach(it=>{ remainByUnit[it.unitId] = it.remainQty; });
  products.forEach(p=>{
    let entry = stockStatusCache.find(s=>s.productId===p.id);
    if(!entry){ entry = {productId:p.id, checked:false, remain:{}}; stockStatusCache.push(entry); }
    entry.checked = true;
    entry.remain = entry.remain || {};
    p.units.forEach(u=>{ if(remainByUnit[u.id]!==undefined) entry.remain[u.id] = remainByUnit[u.id]; });
  });
  _stockStatusTs = Date.now();
}

// ถ้าตอนนั้นอยู่หน้าเช็คสต๊อกแล้วมีข้อมูลที่ยังไม่ได้กด "เสร็จเจ้านี้" ให้ดัน state เดิมกลับขึ้นไปบน
// history ก่อน (เท่ากับ "ยกเลิก" การ back ที่เพิ่งเกิดไว้ชั่วคราว) แล้วเซฟข้อมูลที่ติ๊กไว้ให้อัตโนมัติ
// ระหว่างนั้นเงียบๆ ไม่ต้องถามอะไร พอเซฟเสร็จค่อย back จริงให้ (ยิง popstate รอบสองเข้า handler นี้
// อีกครั้ง คราวนี้ dirty เป็น false แล้วเลยผ่านไปตามปกติ) ถ้าเซฟไม่สำเร็จ (เช่นเน็ตหลุด) เท่านั้นถึงจะถาม
window.addEventListener('popstate', (e)=>{
  if(state.screen === 'supplierCheck' && supplierCheckDirty){
    history.pushState({ screen: state.screen, staffName: state.staffName, currentSupplierId: state.currentSupplierId, ownerTab: state.ownerTab }, '');
    // ปกติ supplierCheckAutoSave ต้องมีค่าเสมอตอนอยู่หน้านี้ (renderSupplierCheck ตั้งไว้ให้) เผื่อไว้กรณี
    // แปลกๆ ที่ไม่มีจริงๆ ค่อย fallback ไปถามตรงๆ แทนเซฟอัตโนมัติ
    const proceed = supplierCheckAutoSave
      ? supplierCheckAutoSave()
      : Promise.resolve(confirm('เช็คสต๊อกยังไม่เสร็จ ยืนยันออกจากหน้านี้โดยไม่บันทึกใช่ไหม?')).then(ok=>{ if(ok) supplierCheckDirty=false; return ok; });
    proceed.then(canLeave=>{ if(canLeave) history.back(); });
    return;
  }
  if(e.state){ Object.assign(state, e.state); } else { state.screen = 'home'; }
  render();
});
