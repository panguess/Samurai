<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ซามูไรไส้กรอก — เช็คสต๊อก & สั่งของ</title>
<link rel="apple-touch-icon" href="/icon-192-black.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192-black.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
  :root{
    --brand:#1A1A1A; --brand-bg:#ECECEA;
    --cream:#FCF9F2;
    --bg:#F1EFE8;
    --text:#2C2C2A; --text-secondary:#5F5E5A; --text-tertiary:#888780;
    --border:rgba(44,44,42,0.12); --border-strong:rgba(44,44,42,0.22);
    --radius-md:8px; --radius-lg:12px;
    --green:#085041; --green-bg:#E1F5EE;
    --amber:#854F0B; --amber-bg:#FAEEDA; --amber-mid:#EF9F27;
    --purple:#3C3489; --purple-bg:#EEEDFE;
    --pink:#993556; --pink-bg:#FBEAF0;
    --danger:#A32D2D; --danger-bg:#FCEBEB;
  }
  *{box-sizing:border-box;}
  body{font-family:'Sarabun',sans-serif; background:var(--bg); color:var(--text); margin:0; -webkit-font-smoothing:antialiased;}
  #app{max-width:600px; margin:0 auto; min-height:100vh; background:var(--cream); display:flex; flex-direction:column;}
  .topbar{background:var(--brand); color:var(--cream); padding:14px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:10;}
  .topbar h1{font-size:16px; font-weight:600; margin:0; flex:1;}
  .topbar .back{cursor:pointer; font-size:18px; background:none; border:none; color:var(--cream); padding:4px;}
  .topbar .meta{font-size:13px; opacity:0.9;}
  .content{flex:1; padding:14px; padding-bottom:80px;}
  button{font-family:inherit;}
  .btn{border:1px solid var(--border-strong); background:var(--cream); color:var(--text); border-radius:var(--radius-md); padding:9px 14px; font-size:13px; cursor:pointer;}
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--brand); color:var(--cream); border:none; font-weight:600;}
  .btn-text-cancel{width:100%; margin-top:8px; padding:9px 14px; background:none; border:none; color:var(--text-secondary); font-size:13px; text-decoration:underline; cursor:pointer;}
  .btn-block{width:100%; padding:12px; font-size:14px;}
  input[type=text], input[type=number], input[type=password], select{
    font-family:inherit; font-size:14px; border:1px solid var(--border-strong); border-radius:var(--radius-md);
    padding:8px 10px; width:100%; background:#fff; color:var(--text);
  }
  input:focus, select:focus{outline:2px solid var(--brand); outline-offset:1px;}
  table{border-collapse:collapse;}

  /* employee: supplier list */
  .progress-track{height:6px; background:var(--bg); border-radius:8px; overflow:hidden; margin:10px 0 14px;}
  .progress-fill{height:100%; background:var(--cream); opacity:0.8; border-radius:8px;}
  .sup-row{display:flex; align-items:center; gap:10px; padding:8px 12px; border:1px solid var(--border); border-radius:var(--radius-md); margin-bottom:6px; cursor:pointer; background:#fff;}
  .sup-row.done{opacity:0.5;}
  .sup-thumb{width:44px; height:44px; border-radius:var(--radius-md); background:var(--bg); display:flex; align-items:center; justify-content:center; color:var(--text-tertiary); font-size:18px; flex-shrink:0;}
  .sup-row p{margin:0; font-size:14px; font-weight:500; flex:1;}
  .section-label{font-size:13px; color:var(--text-secondary); margin:14px 0 6px; font-weight:500;}

  /* employee: stock check grid */
  .prod-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; align-items:stretch;}
  .prod-card{border-radius:16px; padding:10px; border:2px solid var(--border); display:flex; flex-direction:column; height:100%;}
  .prod-card.checked{background:#EAF3DE; border-color:#639922;}
  .prod-photo-area{position:relative; width:100%; padding-top:100%; border-radius:12px; overflow:hidden; margin-bottom:8px;}
  .prod-photo-area .photo-inner{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
  .prod-photo-area.no-photo{cursor:pointer;}
  .prod-photo-area img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;}
  .photo-placeholder{display:flex; flex-direction:column; align-items:center; gap:5px;}
  .photo-placeholder span{font-size:11px; color:var(--text-tertiary);}
  .prod-photo-area .check-toggle{position:absolute; top:6px; right:6px; background:rgba(255,255,255,0.9); border-radius:50%; width:26px; height:26px; display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; color:var(--text-tertiary); border:none; padding:0;}
  .retake-badge{position:absolute; top:6px; left:6px; background:rgba(255,255,255,0.9); border-radius:50%; width:26px; height:26px; display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--text-tertiary); pointer-events:none;}
  .cover-toggle{position:absolute; top:6px; left:6px; background:rgba(255,255,255,0.9); border-radius:50%; width:26px; height:26px; display:flex; align-items:center; justify-content:center; font-size:14px; cursor:pointer; color:var(--text-tertiary); border:none; padding:0;}
  .cover-toggle.is-cover{color:var(--danger);}
  .cover-toggle:disabled{opacity:0.35; cursor:not-allowed;}
  .prod-card.is-cover{border-color:var(--danger);}
  .cover-tag{font-size:10px; color:var(--danger); font-weight:600; margin:2px 0 0;}
  .add-prod-card{width:100%; min-width:0; min-height:140px; max-height:100%; border-radius:16px; border:1.5px dashed var(--border-strong); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--text-tertiary); cursor:pointer; background:none;}
  .add-prod-card span{text-align:center; padding:0 6px; font-size:12px;}

  /* add product form sheet (reuses match-overlay/match-sheet styles) */
  .addprod-body{overflow-y:auto; padding:12px 16px; flex:1;}
  .addprod-body label{display:block; font-size:12px; color:var(--text-secondary); margin:12px 0 4px;}
  .addprod-body label:first-child{margin-top:0;}
  .addprod-error{font-size:12px; color:var(--danger); margin-top:8px; display:none;}

  /* photo match screen */
  .match-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:80; display:flex; align-items:flex-end; justify-content:center;}
  .match-sheet{background:var(--cream); width:100%; max-width:600px; max-height:88vh; border-radius:16px 16px 0 0; display:flex; flex-direction:column; overflow:hidden;}
  .match-sheet-header{padding:14px 16px; border-bottom:1px solid var(--border); flex-shrink:0;}
  .match-sheet-header h2{margin:0 0 2px; font-size:15px; font-weight:600;}
  .match-sheet-header p{margin:0; font-size:12px; color:var(--text-tertiary);}
  .match-list{overflow-y:auto; padding:12px 16px; flex:1;}
  .match-row{display:flex; gap:10px; align-items:center; background:#fff; border:1px solid var(--border); border-radius:12px; padding:10px; margin-bottom:8px;}
  .match-thumb{width:56px; height:56px; border-radius:8px; object-fit:cover; flex-shrink:0; background:var(--bg);}
  .match-row .match-fname{font-size:11px; color:var(--text-tertiary); margin:0 0 4px;}
  .match-row select{font-size:13px; padding:6px 8px;}
  .match-status{font-size:18px; flex-shrink:0;}
  .match-status.done{color:#3B6D11;}
  .match-status.pending{color:var(--text-tertiary);}
  .match-sheet-footer{padding:12px 16px; border-top:1px solid var(--border); flex-shrink:0;}
  .prod-card.checked .check-toggle{color:#3B6D11;}
  .prod-card-name{font-size:12.5px; font-weight:500; margin:0 0 8px;}
  .unit-steppers-row{display:flex; flex-direction:column; gap:3px;}
  .unit-stepper{display:flex; align-items:center; gap:4px; background:#fff; border-radius:var(--radius-md); padding:4px 6px;}
  .prod-card.checked .unit-stepper{background:rgba(255,255,255,0.7);}
  .step-btn{width:24px; height:24px; border-radius:50%; background:var(--brand); color:var(--cream); border:none; font-size:13px; flex-shrink:0; cursor:pointer; line-height:1;}
  input.step-input{width:40px; min-width:0; flex:none; text-align:center; border:none; background:transparent; font-size:12.5px; padding:0;}
  .unit-tag{font-size:10px; color:var(--text-secondary); margin-left:auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .stickybar{position:sticky; bottom:0; background:var(--brand); padding:12px 14px; display:flex; align-items:center; justify-content:space-between; margin:14px -14px -80px; gap:10px;}
  .stickybar span{color:var(--cream); font-size:13px;}
  .stickybar .btn-primary{background:var(--cream); color:var(--brand);}

  /* owner */
  .nav-tile{background:#fff; border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px; cursor:pointer; display:flex; align-items:center; gap:12px; margin-bottom:10px;}
  .nav-tile.featured{border:2px solid var(--brand);}
  .nav-tile p{margin:0; font-weight:500; font-size:14px;}
  .nav-tile small{color:var(--text-secondary); font-size:12px;}
  .tabs{display:flex; gap:6px; margin-bottom:14px;}
  .tab{border:1px solid var(--border-strong); background:#fff; border-radius:var(--radius-md); padding:6px 13px; font-size:13px; cursor:pointer;}
  .tab.active{background:var(--brand); color:var(--cream); border-color:var(--brand);}
  .metric-grid{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; margin-bottom:14px;}
  .metric{background:var(--bg); border-radius:var(--radius-md); padding:9px;}
  .metric p:first-child{font-size:12px; color:var(--text-secondary); margin:0 0 4px;}
  .metric p:last-child{font-size:19px; font-weight:600; margin:0;}
  .sup-header{padding:7px 10px; border-radius:0; margin:0; border-left:3px solid; font-size:13px; font-weight:600; display:flex; justify-content:space-between; align-items:center; position:sticky; top:48px; z-index:3;}
  .badge{font-size:11px; padding:2px 8px; border-radius:6px; font-weight:500; display:inline-block;}
  .empty-state{text-align:center; color:var(--text-secondary); font-size:13px; padding:30px 0;}
  .copy-toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--text); color:#fff; padding:8px 16px; border-radius:8px; font-size:13px; z-index:60;}

  /* accordion order rows */
  .acc-group{border:1px solid var(--border); border-top:none; border-radius:0 0 var(--radius-lg) var(--radius-lg); overflow:hidden; margin-bottom:14px;}
  .select-all-row{padding:8px 10px; background:#fcfcfa; border-bottom:1px solid var(--border);}
  .link-btn{background:none; border:none; padding:0; font-family:inherit; font-size:11.5px; font-weight:600; color:var(--text-secondary); cursor:pointer;}
  .link-btn:active{opacity:0.6;}
  .prow{display:flex; flex-direction:column; gap:7px; padding:9px 10px; border-bottom:1px solid var(--border); background:#fff;}
  .prow:last-child{border-bottom:none;}
  .prow.low{background:var(--danger-bg);}
  .prow-top{display:flex; align-items:center; gap:9px;}
  .prow-bottom{display:flex; align-items:center; gap:6px;}
  .prow input[type=checkbox]{flex-shrink:0; width:17px; height:17px;}
  .prow-name{flex:1; min-width:0; font-size:13px; color:var(--text); line-height:1.3;}
  .prow.low .prow-name{font-weight:600;}
  .stat{display:flex; flex-direction:column; align-items:flex-end; min-width:38px;}
  .stat .lbl{font-size:8.5px; color:var(--text-tertiary); font-weight:600; line-height:1.3;}
  .stat .v{font-size:13px; font-weight:700; color:var(--text); line-height:1.2;}
  .stat .v .u{font-size:9px; font-weight:500; margin-left:1px;}
  .stat .v.muted{color:var(--text-tertiary); font-weight:500;}
  .stat.danger .lbl, .stat.danger .v{color:var(--danger);}
  .stepper{display:flex; align-items:center; border:1px solid var(--border-strong); border-radius:8px; overflow:hidden; background:#fff; flex-shrink:0; margin-left:auto;}
  .stepper .unit-tag{font-size:13px; font-weight:600; color:var(--text); margin-left:0; padding:0 8px 0 6px; overflow:visible; text-overflow:clip; white-space:nowrap; flex-shrink:0;}
  .stepper button{width:26px; height:28px; border:none; background:var(--bg); color:var(--text); font-size:14px; cursor:pointer; flex-shrink:0;}
  input.stepper-input{width:36px; min-width:0; flex-shrink:0; text-align:center; border:none; border-left:1px solid var(--border); border-right:1px solid var(--border); font-size:13px; font-weight:700; padding:5px 0;}

  /* order overview + collapsible supplier cards */
  .stat-strip{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; margin-bottom:12px;}
  .stat-card{background:#fff; border:1px solid var(--border); border-radius:var(--radius-md); padding:9px 6px; text-align:center;}
  .stat-card .n{font-size:19px; font-weight:700; line-height:1.1;}
  .stat-card .lbl{font-size:10.5px; color:var(--text-tertiary); margin-top:2px; line-height:1.2;}
  .stat-card.danger .n{color:var(--danger);}
  .stat-card.green .n{color:var(--green);}
  .stat-card.amber .n{color:var(--amber);}
  .ord-card{border:1px solid var(--border); border-radius:var(--radius-lg); margin-bottom:10px; overflow:hidden; background:#fff; display:flex;}
  .ord-card-strip{width:5px; flex-shrink:0; background:var(--border-strong);}
  .ord-card.state-needorder .ord-card-strip{background:var(--danger);}
  .ord-card.state-partial .ord-card-strip{background:var(--amber);}
  .ord-card.state-ordered .ord-card-strip{background:var(--green);}
  .ord-card-main{flex:1; min-width:0;}
  .ord-card-head{display:flex; align-items:center; gap:10px; padding:12px; cursor:pointer; background:var(--brand-bg);}
  .ord-card-head .chev{font-size:14px; color:var(--text-tertiary); transition:transform .15s; flex-shrink:0;}
  .ord-card.open .ord-card-head .chev{transform:rotate(180deg);}
  .ord-card.state-ordered .ord-card-head{background:var(--green-bg);}
  .order-done-check{width:17px; height:17px; border-radius:50%; background:var(--green); color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .ord-card-name{font-weight:600; font-size:14.5px; flex:1; min-width:0;}
  .ord-card-status{display:flex; flex-direction:column; gap:2px; align-items:flex-end; flex-shrink:0;}
  .status-line{font-size:13px; font-weight:600; white-space:nowrap;}
  .status-line.wait{color:var(--text-tertiary);}
  .status-line.partial{color:var(--amber);}
  .status-line.needorder{color:var(--danger);}
  .status-line.ordered{color:var(--green);}
  .status-sub{font-size:11px; color:var(--text-tertiary); white-space:nowrap;}
  .confirm-sent-row{display:flex; align-items:center; gap:6px; padding:8px 12px; font-size:12.5px; color:var(--text-secondary); cursor:pointer; border-top:1px solid var(--border); background:var(--cream);}
  .confirm-sent-row input{width:15px; height:15px; flex-shrink:0;}
  .ord-card-body{display:none; border-top:1px solid var(--border);}
  .ord-card.open .ord-card-body{display:block;}
  .sup-order-btn-row{padding:8px 10px; display:flex; justify-content:flex-end;}

  /* playful redesign additions */
  .hero{background:var(--brand); padding:1.8rem 1.5rem 1rem; text-align:center;}
  .hero-logo{width:180px; max-width:70vw; height:auto; display:block; margin:0 auto 6px;}
  .hero-left{display:flex; align-items:center; gap:12px;}
  .hero-date{text-align:right; flex-shrink:0;}
  .hero-date strong{display:block; font-size:13px; font-weight:600; color:rgba(252,249,242,0.7);}
  .hero-date span{font-size:11px; color:rgba(252,249,242,0.38);}
  .role-label{font-size:10.5px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-tertiary); margin:18px 0 9px 2px; display:flex; align-items:center; gap:7px;}
  .role-label::after{content:''; flex:1; height:1px; background:var(--border-strong);}
  .action-card{display:flex; align-items:center; gap:16px; padding:22px 20px; border-radius:16px; border:1px solid var(--border-strong); background:#fff; cursor:pointer; margin-bottom:10px; -webkit-tap-highlight-color:transparent; box-shadow:0 2px 8px rgba(0,0,0,0.06);}
  .action-card.primary{background:var(--brand); border-color:transparent;}
  .action-card.primary .act-title{color:var(--cream);}
  .action-card.primary .act-sub{color:rgba(252,249,242,0.45);}
  .action-card.primary .act-chev{color:rgba(252,249,242,0.3);}
  .action-card.bill{background:#FEF3DF; border-color:rgba(122,70,8,0.16);}
  .action-card.bill .act-title{color:#7A4608;}
  .action-card.bill .act-sub{color:rgba(122,70,8,0.6);}
  .action-card.bill .act-chev{color:rgba(122,70,8,0.3);}
  .act-icon{width:56px; height:56px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:37.5px; flex-shrink:0;}
  .act-body{flex:1;}
  .act-title{font-size:22.5px; font-weight:700; color:var(--text); margin-bottom:4px;}
  .act-sub{font-size:15px; color:var(--text-tertiary); line-height:1.4; opacity:0.75;}
  .act-chev{font-size:22px; color:var(--text-tertiary); flex-shrink:0; opacity:0.35;}
  .icon-card{display:flex; align-items:center; gap:13px; background:#fff; border:0.5px solid var(--border); border-radius:14px; padding:13px; margin-bottom:9px; cursor:pointer;}
  .icon-box{width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .pick-row{display:flex; align-items:center; gap:13px; background:#fff; border:0.5px solid var(--border); border-radius:16px; padding:10px 14px; margin-bottom:9px; cursor:pointer;}
  .pick-avatar{width:96px; height:96px; border-radius:50%; border:2px solid var(--text); display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden; cursor:pointer;}
  .pick-avatar img{width:100%; height:100%; object-fit:cover; display:block;}
  .avatar-wrap{position:relative; flex-shrink:0;}
  .avatar-edit-badge{position:absolute; bottom:-2px; right:-2px; width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,0.55); color:var(--text-tertiary); display:flex; align-items:center; justify-content:center; font-size:14px; border:1.5px solid var(--border); pointer-events:none;}
  .sup-card-grid{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:9px;}
  .sup-card{display:flex; flex-direction:column; align-items:center; gap:8px; background:#fff; border:0.5px solid var(--border); border-radius:16px; padding:10px 6px; text-align:center; cursor:pointer;}
  .sup-card.done{opacity:0.55;}
  .sup-icon-wrap{position:relative; width:100%;}
  .sup-icon{width:100%; aspect-ratio:1/1; border-radius:18px; border:2px solid var(--text); display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .sup-num-badge{position:absolute; top:-8px; left:-8px; min-width:28px; height:28px; padding:0 6px; border-radius:14px; background:var(--brand); color:var(--cream); border:2.5px solid #fff; font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 4px rgba(0,0,0,0.3); z-index:1;}
  .topbar-num-badge{min-width:28px; height:28px; padding:0 6px; border-radius:14px; background:var(--brand); color:var(--cream); border:2px solid #fff; font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-left:auto;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ LIVE API CONFIG ============ */
const API_URL = 'https://script.google.com/macros/s/AKfycbytmWrmwrjZQjeUUW1o6CpHZmr5lFAxZJISyvqoyD5hM2TmIABUVfPuqnXseF4-nmw9/exec';

const API_TIMEOUT_MS = 25000; // สัญญาณมือถืออ่อนๆ หรือ Apps Script cold start ตอบช้ากว่า 12 วิได้ง่ายๆ
async function apiGet(action, params){
  const qs = new URLSearchParams({action, ...(params||{})}).toString();
  const controller = new AbortController();
  const t = setTimeout(()=>controller.abort(), API_TIMEOUT_MS);
  try{
    const res = await fetch(`${API_URL}?${qs}`, { signal: controller.signal });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    return data;
  }catch(err){
    throw err.name==='AbortError' ? new Error('หมดเวลาเชื่อมต่อ ลองใหม่อีกครั้ง') : err;
  }finally{ clearTimeout(t); }
}
async function apiPost(action, payload){
  const controller = new AbortController();
  const t = setTimeout(()=>controller.abort(), API_TIMEOUT_MS);
  try{
    const res = await fetch(API_URL, { method:'POST', body: JSON.stringify({action, ...payload}), signal: controller.signal });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    return data;
  }catch(err){
    throw err.name==='AbortError' ? new Error('หมดเวลาเชื่อมต่อ ลองใหม่อีกครั้ง') : err;
  }finally{ clearTimeout(t); }
}

/* ============ product photo match screen ============ */
// เปิดหน้าจับคู่รูปที่เลือกจากเครื่อง (files) กับสินค้าของซัพพลายเออร์นี้ (products)
// เมื่อบันทึกสำเร็จจะเรียก onDone() เพื่อให้หน้าเดิม re-render
function openPhotoMatchScreen(files, products, onDone){
  const overlay = document.createElement('div');
  overlay.className = 'match-overlay';
  overlay.innerHTML = `
    <div class="match-sheet">
      <div class="match-sheet-header">
        <h2>จับคู่รูปกับสินค้า</h2>
        <p id="matchProgress">เลือกไว้ ${files.length} รูป · จับคู่แล้ว 0 จาก ${files.length}</p>
      </div>
      <div class="match-list" id="matchList"></div>
      <div class="match-sheet-footer">
        <button class="btn" style="width:100%; margin-bottom:8px;" id="matchCancel">ยกเลิก</button>
        <button class="btn btn-primary btn-block" id="matchSave" disabled>บันทึกรูปที่จับคู่แล้ว (0)</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  const matches = files.map(()=>null); // index -> productId | null
  const list = overlay.querySelector('#matchList');
  const progressEl = overlay.querySelector('#matchProgress');
  const saveBtn = overlay.querySelector('#matchSave');

  function updateProgress(){
    const n = matches.filter(Boolean).length;
    progressEl.textContent = `เลือกไว้ ${files.length} รูป · จับคู่แล้ว ${n} จาก ${files.length}`;
    saveBtn.textContent = `บันทึกรูปที่จับคู่แล้ว (${n})`;
    saveBtn.disabled = n === 0;
  }

  files.forEach((file, i)=>{
    const row = document.createElement('div');
    row.className = 'match-row';
    const url = URL.createObjectURL(file);
    row.innerHTML = `
      <img class="match-thumb" src="${url}" alt="">
      <div style="flex:1; min-width:0;">
        <p class="match-fname">${file.name}</p>
        <select data-idx="${i}">
          <option value="" selected disabled>เลือกสินค้า...</option>
          ${products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}
        </select>
      </div>
      <span class="match-status pending" data-idx="${i}"><i class="ti ti-circle-dashed" aria-hidden="true"></i></span>
    `;
    row.querySelector('select').onchange = (e)=>{
      matches[i] = e.target.value || null;
      const statusEl = row.querySelector('.match-status');
      statusEl.className = 'match-status ' + (matches[i] ? 'done' : 'pending');
      statusEl.innerHTML = matches[i] ? '<i class="ti ti-check" aria-hidden="true"></i>' : '<i class="ti ti-circle-dashed" aria-hidden="true"></i>';
      updateProgress();
    };
    list.appendChild(row);
  });

  function close(){ overlay.remove(); }
  overlay.querySelector('#matchCancel').onclick = close;

  saveBtn.onclick = async ()=>{
    saveBtn.disabled = true; saveBtn.textContent = 'กำลังบันทึก...';
    try{
      const photos = [];
      for(let i=0; i<files.length; i++){
        if(!matches[i]) continue;
        const dataUrl = await compressImage(files[i], 600, 0.5);
        photos.push({ productId: matches[i], photo: dataUrl });
      }
      await apiPost('saveProductPhotos', { photos });
      photos.forEach(({productId, photo})=>{
        const p = products.find(x=>x.id===productId);
        if(p) p.photoUrl = photo; // อัปเดตให้เห็นผลทันทีในเครื่อง; รูปจริงบน Drive จะมาแทนตอนโหลดใหม่
      });
      close();
      onDone();
    }catch(err){
      saveBtn.disabled = false;
      alert('บันทึกรูปไม่สำเร็จ: ' + err.message);
      updateProgress();
    }
  };
}

function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const STOCK_STATUS_TTL = 45000; // ms - avoid refetching the whole sheet on every screen hop
async function getStockStatus(force){
  if(!force && stockStatusCache && (Date.now() - _stockStatusTs) < STOCK_STATUS_TTL) return stockStatusCache;
  const data = await apiGet('stockStatus');
  stockStatusCache = data; _stockStatusTs = Date.now();
  return data;
}
function invalidateStockStatus(){ stockStatusCache = null; _stockStatusTs = 0; }
function patchStockStatusChecked(products, items){
  // After a successful saveStock, update the cache in place instead of
  // invalidating it, so the next screen doesn't have to wait on another
  // full round-trip just to show what we already know was just saved.
  if(!stockStatusCache) return;
  const remainByUnit = {}; items.forEach(it=>{ remainByUnit[it.unitId] = it.remainQty; });
  products.forEach(p=>{
    let entry = stockStatusCache.find(s=>s.productId===p.id);
    if(!entry){ entry = {productId:p.id, checked:false, remain:{}}; stockStatusCache.push(entry); }
    entry.checked = true;
    entry.remain = entry.remain || {};
    p.units.forEach(u=>{ if(remainByUnit[u.id]!==undefined) entry.remain[u.id] = remainByUnit[u.id]; });
  });
  _stockStatusTs = Date.now();
}

async function bootstrap(){
  const app = document.getElementById('app');
  // ร้าน/สินค้า/พนักงาน แทบไม่เปลี่ยนบ่อย - ถ้ามี cache จากเซสชันก่อนหน้าให้ใช้ก่อนเลย
  // แล้วค่อยรีเฟรชข้อมูลใหม่เงียบๆ อยู่เบื้องหลัง แทนที่จะรอ Apps Script ทุกครั้งที่เปิดแอป
  const cached = readBootstrapCache();
  if(cached){
    SUPPLIERS = cached.suppliers; PRODUCTS = cached.products; STAFF = cached.staff;
    history.replaceState({screen:'home', staffName:'', currentSupplierId:null, ownerTab:'stock'}, '');
    render();
    getStockStatus().catch(()=>{});
    apiGet('bootstrap').then(data=>{
      SUPPLIERS = data.suppliers; PRODUCTS = data.products; STAFF = data.staff;
      writeBootstrapCache(data);
      // ข้อมูลจริงมาแล้ว (เช่น หน่วยสินค้าที่เพิ่งเพิ่มในชีต) — render จากข้อมูลเก่าไปแล้วตอนต้นฟังก์ชัน
      // ต้อง render ซ้ำอีกครั้งไม่งั้นหน้าจอจะค้างข้อมูลเก่าไปตลอด session จนกว่าจะปิดแท็บ
      render();
    }).catch(()=>{});
    return;
  }

  // Show the logo immediately instead of a blank spinner - the network
  // round trip to Apps Script is the slow part, not this render.
  app.innerHTML = '';
  app.appendChild(buildHero());
  const loadingEl = document.createElement('div');
  loadingEl.className = 'content';
  loadingEl.innerHTML = `<div class="empty-state" style="padding:40px 0;"><div style="font-size:30px; margin-bottom:10px;">⏳</div><p>กำลังโหลดข้อมูลร้าน...</p></div>`;
  app.appendChild(loadingEl);
  try{
    const data = await apiGet('bootstrap');
    SUPPLIERS = data.suppliers; PRODUCTS = data.products; STAFF = data.staff;
    writeBootstrapCache(data);
    getStockStatus().catch(()=>{});
    history.replaceState({screen:'home', staffName:'', currentSupplierId:null, ownerTab:'stock'}, '');
    render();
  }catch(err){
    loadingEl.innerHTML = `<div class="empty-state" style="padding:40px 14px; color:var(--danger);">โหลดข้อมูลไม่สำเร็จ: ${err.message}<br><br><button class="btn" onclick="bootstrap()">ลองใหม่</button></div>`;
  }
}

          <span class="avatar-edit-badge"><i class="ti ti-camera" aria-hidden="true"></i></span>
        </div>
        <div class="staff-pick" data-name="${s.name}" style="display:flex; align-items:center; flex:1; cursor:pointer;">
          <p style="margin:0; font-size:15px; font-weight:600; flex:1;">${s.name}</p>
          <span style="font-size:17px;">${emojis[i % emojis.length]}</span>
        </div>
      </div>`;
    }).join('')}
  `;
  app.appendChild(c);

  const avatarInput = document.createElement('input');
  avatarInput.type = 'file'; avatarInput.accept = 'image/*'; // ไม่ตั้ง capture — ให้เลือกได้ทั้งถ่ายรูปใหม่หรือเลือกจากคลังภาพ
  avatarInput.style.display = 'none';
  c.appendChild(avatarInput);
  let avatarTargetId = null;
  avatarInput.onchange = async ()=>{
    const file = avatarInput.files[0];
    const staffId = avatarTargetId;
    avatarInput.value = '';
    if(!file || !staffId) return;
    const targetEl = c.querySelector(`.avatar-pick[data-staff-id="${staffId}"]`);

      const photo = await compressImage(file, 500, 0.7);
      const { avatarUrl } = await apiPost('saveStaffAvatar', { staffId, photo });

      if(targetEl) targetEl.innerHTML = `<img src="${avatarUrl}" alt="">`;

/* ============ STAFF: supplier list (all suppliers always shown) ============ */
async function renderSupplierList(app){
  let statusList;
  if(stockStatusCache){
    statusList = stockStatusCache;
  } else {
    renderLoading(app, 'กำลังโหลดสถานะร้าน...');
    try{ statusList = await getStockStatus(); }
    catch(err){ app.innerHTML = `<div class="empty-state" style="color:var(--danger);">โหลดสถานะไม่สำเร็จ: ${err.message}</div>`; return; }
  }

  checkedProducts = new Set(statusList.filter(s=>s.checked).map(s=>s.productId));
  checkedSuppliers = new Set(
    SUPPLIERS.filter(s=>{
      const prods = PRODUCTS.filter(p=>p.supplierId===s.id);
      return prods.length>0 && prods.every(p=>checkedProducts.has(p.id));
    }).map(s=>s.id)
  );
  sessionCheckedSuppliers.forEach(id => checkedSuppliers.add(id));

  app.innerHTML = '';
  const pending = SUPPLIERS.filter(s=>!checkedSuppliers.has(s.id));
  const done = SUPPLIERS.filter(s=>checkedSuppliers.has(s.id));

  app.appendChild(topbar('เลือกร้านที่จะเช็ค', {back:()=>go('home'), meta:`${done.length} / ${SUPPLIERS.length}`}));
  const c = document.createElement('div'); c.className='content';
  c.innerHTML = `
    <div class="progress-track"><div class="progress-fill" style="width:${SUPPLIERS.length? done.length/SUPPLIERS.length*100:0}%; background:var(--brand);"></div></div>
    <input type="text" id="search" placeholder="ค้นหาชื่อร้าน" style="margin-bottom:14px;">
    <p class="section-label" style="margin-top:0;">ยังไม่เช็ค (${pending.length})</p>
    <div id="pendingList" class="sup-card-grid"></div>
    <p class="section-label">เช็คแล้ว (${done.length}) <i class="ti ti-check" style="font-size:13px; vertical-align:-1px;" aria-hidden="true"></i></p>
    <div id="doneList" class="sup-card-grid"></div>
  `;
  app.appendChild(c);

  function renderLists(filter){
    const f = (filter||'').trim();
    const pl = c.querySelector('#pendingList'); const dl = c.querySelector('#doneList');
    pl.innerHTML=''; dl.innerHTML='';
    pending.filter(s=>s.name.includes(f)).forEach((s)=> pl.appendChild(supplierCard(s, false, SUPPLIERS.indexOf(s))));
    done.filter(s=>s.name.includes(f)).forEach((s)=> dl.appendChild(supplierCard(s, true, SUPPLIERS.indexOf(s))));
    if(!pl.children.length) pl.innerHTML = '<p class="empty-state">ไม่พบร้านที่ค้นหา</p>';
  }
  renderLists('');
  c.querySelector('#search').oninput = (e)=>renderLists(e.target.value);
}

function supplierCard(s, isDone, idx){

    <div class="sup-icon-wrap">

      <div class="sup-icon" style="background:${isDone?'var(--bg)':(hasPhoto?'transparent':col.bg)}; border-color:${isDone?'var(--border-strong)':(hasPhoto?col.fg:'var(--text)')};">
        ${hasPhoto
          ? `<img src="${s.imageUrl}" alt="" style="width:100%; height:100%; object-fit:cover; opacity:${isDone?'0.55':'1'};">`
          : `<i class="ti ${isDone?'ti-check':'ti-meat'}" style="font-size:min(11vw,48px); color:${isDone?'var(--text-secondary)':col.fg};" aria-hidden="true"></i>`}

/* ============ STAFF: single-page check (all products, 2-col grid) ============ */
async function renderSupplierCheck(app){
  const sup = SUPPLIERS.find(s=>s.id===state.currentSupplierId);
  const products = PRODUCTS.filter(p=>p.supplierId===sup.id);

  renderLoading(app, 'กำลังโหลดข้อมูลสต๊อกวันนี้...');
  try{
    const statusList = await getStockStatus();
    statusList.filter(s=>products.some(p=>p.id===s.productId)).forEach(s=>{
      Object.entries(s.remain||{}).forEach(([uid,val])=>{ if(val!==null) stockValues[uid]=val; });
      if(s.checked) checkedProducts.add(s.productId);
    });
  }catch(err){
    app.innerHTML = `<div class="empty-state" style="color:var(--danger);">โหลดข้อมูลไม่สำเร็จ: ${err.message}</div>`; return;
  }
  app.innerHTML = '';

  app.appendChild(topbar(sup.name, {back:()=>go('supplierList'), numBadge:SUPPLIERS.indexOf(sup)+1}));
  const c = document.createElement('div'); c.className='content';

  if(!CAMERA_PER_PRODUCT_ENABLED){
    const pickBtn = document.createElement('button');
    pickBtn.className = 'btn btn-block';
    pickBtn.style.marginBottom = '14px';
    pickBtn.innerHTML = '<i class="ti ti-photo-plus" style="font-size:16px; vertical-align:-3px; margin-right:6px;" aria-hidden="true"></i>เลือกรูปสินค้า (หลายไฟล์)';
    pickBtn.onclick = ()=> multiPhotoInput.click();
    c.appendChild(pickBtn);
  }

  const grid = document.createElement('div'); grid.className='prod-grid';
  c.appendChild(grid);

  let photoTargetPid = null;
  const photoInput = document.createElement('input');
  photoInput.type = 'file'; photoInput.accept = 'image/*'; photoInput.capture = 'environment';
  photoInput.style.display = 'none';
  c.appendChild(photoInput);
  photoInput.onchange = async ()=>{
    const file = photoInput.files[0];
    const pid = photoTargetPid;
    photoInput.value = '';
    if(!file || !pid) return;
    try{
      productPhotos[pid] = await compressImage(file, 800, 0.6);
    }catch(err){ alert('ถ่ายรูปไม่สำเร็จ: ' + err.message); }
    renderGrid();
  };

  // เลือกรูปหลายไฟล์จากเครื่อง (แทนการถ่ายทีละรูป) แล้วไปหน้าจับคู่กับสินค้า
  const multiPhotoInput = document.createElement('input');
  multiPhotoInput.type = 'file'; multiPhotoInput.accept = 'image/*'; multiPhotoInput.multiple = true;
  multiPhotoInput.style.display = 'none';
  c.appendChild(multiPhotoInput);
  multiPhotoInput.onchange = async ()=>{
    const files = Array.from(multiPhotoInput.files || []);
    multiPhotoInput.value = '';
    if(!files.length) return;
    openPhotoMatchScreen(files, products, ()=>renderGrid());
  };

  function renderGrid(){
    grid.innerHTML='';
    products.forEach((p, idx)=>{
      const isChecked = checkedProducts.has(p.id);
      const col = iconColor(idx);
      const photoSrc = productPhotos[p.id] || p.photoUrl; // p.photoUrl: persisted one-time reference photo, once backend supports it
      const isCover = ALLOW_SET_COVER_PHOTO && !!p.photoUrl && sup.imageUrl === p.photoUrl;
      const card = document.createElement('div');
      card.className = 'prod-card' + (isChecked?' checked':'') + (isCover?' is-cover':'');
      card.innerHTML = `
        <div class="prod-photo-area${(CAMERA_PER_PRODUCT_ENABLED && (!photoSrc || ALLOW_PHOTO_RETAKE))?' no-photo':''}" data-pid="${p.id}" style="background:${photoSrc?'transparent':(isChecked?'rgba(255,255,255,0.6)':col.bg)}; cursor:${CAMERA_PER_PRODUCT_ENABLED?'pointer':'default'};">
          ${photoSrc
            ? `<img src="${photoSrc}" alt="">`
            : `<div class="photo-inner"><div class="photo-placeholder"><i class="ti ti-photo-off" style="font-size:28px; color:${col.fg};" aria-hidden="true"></i><span>ยังไม่มีรูป</span></div></div>`}
          ${(photoSrc && ALLOW_PHOTO_RETAKE && CAMERA_PER_PRODUCT_ENABLED) ? `<div class="retake-badge"><i class="ti ti-camera" aria-hidden="true"></i></div>` : ''}
          ${ALLOW_SET_COVER_PHOTO ? `<button class="cover-toggle${isCover?' is-cover':''}" data-pid="${p.id}" ${p.photoUrl?'':'disabled'} aria-label="ตั้งเป็นรูปปกร้านนี้"><i class="ti ${isCover?'ti-heart-filled':'ti-heart'}" aria-hidden="true"></i></button>` : ''}
          <button class="check-toggle" data-pid="${p.id}" aria-label="ทำเครื่องหมายว่าเช็คแล้ว"><i class="ti ${isChecked?'ti-circle-check-filled':'ti-circle'}" aria-hidden="true"></i></button>
        </div>
        <p class="prod-card-name">${p.name}</p>
        ${isCover ? `<p class="cover-tag"><i class="ti ti-heart-filled" style="font-size:10px; vertical-align:-1px;" aria-hidden="true"></i> รูปปกร้านนี้</p>` : ''}
        <div class="unit-steppers-row">
          ${p.units.map(u=>`
            <div class="unit-stepper">
              <button class="step-btn minus" data-unit="${u.id}">−</button>
              <input type="text" inputmode="numeric" pattern="[0-9]*" class="step-input" data-unit="${u.id}" value="${stockValues[u.id]||0}" min="0">
              <button class="step-btn plus" data-unit="${u.id}">+</button>
              <span class="unit-tag">${u.label}</span>
            </div>
          `).join('')}
        </div>
      `;
      grid.appendChild(card);
    });

    const addCard = document.createElement('div');
    addCard.className = 'add-prod-card';
    addCard.innerHTML = '<i class="ti ti-plus" style="font-size:26px;" aria-hidden="true"></i><span>เพิ่มสินค้าใหม่</span>';
    addCard.onclick = ()=> openAddProductScreen(sup, (newProduct)=>{
      products.push(newProduct);
      PRODUCTS.push(newProduct);
      renderGrid(); updateBar();
    });
    grid.appendChild(addCard);

    grid.querySelectorAll('.check-toggle').forEach(btn=>{
      btn.onclick = (e)=>{
        e.stopPropagation();
        const pid = btn.dataset.pid;
        if(checkedProducts.has(pid)) checkedProducts.delete(pid); else checkedProducts.add(pid);
        renderGrid(); updateBar();
      };
    });
    if(ALLOW_SET_COVER_PHOTO){
      grid.querySelectorAll('.cover-toggle').forEach(btn=>{
        btn.onclick = async (e)=>{
          e.stopPropagation();
          if(btn.disabled) return;
          const pid = btn.dataset.pid;
          const p = products.find(x=>x.id===pid);
          if(!p || !p.photoUrl) return;
          btn.disabled = true;
          try{
            await apiPost('setSupplierCoverPhoto', { supplierId: sup.id, photoUrl: p.photoUrl });
            sup.imageUrl = p.photoUrl; // อัปเดตให้เห็นผลทันทีในเครื่อง
            renderGrid();
          }catch(err){
            btn.disabled = false;
            alert('ตั้งรูปปกไม่สำเร็จ: ' + err.message);
          }
        };
      });
    }
    if(CAMERA_PER_PRODUCT_ENABLED){
      grid.querySelectorAll('.prod-photo-area.no-photo').forEach(area=>{
        area.onclick = ()=>{ photoTargetPid = area.dataset.pid; photoInput.click(); };
      });
    }
    // แตะช่องกรอก/กด +/- ของสินค้าไหน ถือว่าลูกจ้าง "เช็คแล้ว" สินค้าตัวนั้นทันที
    // ไม่ต้องกดวงกลม ✓ แยกอีกขั้น กันลืมกรอกแล้วข้อมูลไม่ถูกบันทึกตอนกด "เสร็จเจ้านี้"
    function markCardChecked(uid){
      const card = grid.querySelector(`[data-unit="${uid}"]`)?.closest('.prod-card');
      if(!card) return;
      const pid = card.querySelector('.check-toggle')?.dataset.pid;
      if(!pid || checkedProducts.has(pid)) return;
      checkedProducts.add(pid);
      card.classList.add('checked');
      const icon = card.querySelector('.check-toggle i');
      if(icon){ icon.classList.remove('ti-circle'); icon.classList.add('ti-circle-check-filled'); }
      updateBar();
    }
    grid.querySelectorAll('.minus, .plus').forEach(btn=>{
      btn.onclick = ()=>{
        const uid = btn.dataset.unit;
        const input = grid.querySelector(`.step-input[data-unit="${uid}"]`);
        let v = parseInt(input.value||0,10);
        v = btn.classList.contains('plus') ? v+1 : Math.max(0,v-1);
        input.value = v; stockValues[uid] = v;
        markCardChecked(uid);
      };
    });
    grid.querySelectorAll('.step-input').forEach(inp=>{
      inp.oninput = ()=>{
        stockValues[inp.dataset.unit] = Math.max(0, parseInt(inp.value||0,10));
        markCardChecked(inp.dataset.unit);
      };
    });
  }
  renderGrid();

  const bar = document.createElement('div'); bar.className='stickybar';
  c.appendChild(bar);
  function updateBar(){
    const doneCount = products.filter(p=>checkedProducts.has(p.id)).length;
    bar.innerHTML = `<span><i class="ti ti-list-check" style="font-size:13px; vertical-align:-2px; margin-right:5px;"></i>เช็คแล้ว ${doneCount} จาก ${products.length} รายการ</span>
      <button class="btn-primary btn" id="finishSup">เสร็จเจ้านี้</button>`;
    bar.querySelector('#finishSup').onclick = async ()=>{
      const btn = bar.querySelector('#finishSup');
      // บันทึกเฉพาะสินค้าที่ลูกจ้างติ๊ก "เช็คแล้ว" จริงๆ เท่านั้น — ตัวที่ยังไม่ได้แตะเลย
      // ต้องไม่ถูกบันทึกเป็นคงเหลือ 0 ไปด้วย ไม่งั้นเจ้าของจะเข้าใจผิดว่าของหมดจริง
      // ทั้งที่จริงๆ ยังไม่ได้เช็ค
      const checkedItems = products.filter(p=>checkedProducts.has(p.id));
      if(!checkedItems.length){ alert('ยังไม่ได้ติ๊กว่าเช็คสินค้าตัวไหนเลย'); return; }
      btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
      const items = checkedItems.flatMap(p=>p.units.map(u=>({unitId:u.id, remainQty: stockValues[u.id]||0})));
      const photos = checkedItems.filter(p=>productPhotos[p.id]).map(p=>({productId:p.id, photo:productPhotos[p.id]}));
      try{
        await apiPost('saveStock', { staffName: state.staffName, supplierId: sup.id, items, photos });
        patchStockStatusChecked(checkedItems, items);
        // ทำเครื่องหมาย "เช็คแล้ว" ในหน้าเลือกร้านเฉพาะตอนเช็คครบทุกตัวจริงๆ เท่านั้น
        if(checkedItems.length === products.length){
          checkedSuppliers.add(sup.id);
          sessionCheckedSuppliers.add(sup.id);
          saveSessionChecked();
        }
        go('staffDone');
      }catch(err){
        btn.disabled = false; btn.textContent = 'เสร็จเจ้านี้';
        alert('บันทึกไม่สำเร็จ: ' + err.message);
      }
    };
  }
  updateBar();

  app.appendChild(c);
}

function renderOwnerPin(app){
  app.appendChild(topbar('ใส่รหัสฝั่งเจ้าของร้าน', {back:()=>go('home')}));
  const c = document.createElement('div'); c.className='content';
  c.innerHTML = `
    <p style="font-size:13px; color:var(--text-secondary); margin:0 0 16px;">กรอกรหัสผ่านเพื่อเข้าฝั่งเจ้าของร้าน</p>
    <input type="password" inputmode="numeric" id="pinInput" maxlength="4" placeholder="••••" style="font-size:22px; text-align:center; letter-spacing:6px; padding:14px;">
    <p id="pinError" style="color:var(--danger); font-size:12px; margin:8px 0 0; min-height:16px; text-align:center;"></p>
  `;
  app.appendChild(c);
  const input = c.querySelector('#pinInput');
  const errEl = c.querySelector('#pinError');
  input.focus();

  let checking = false;
  async function trySubmit(){
    if(checking) return;
    const val = input.value.trim();
    if(val.length < 4) return;
    checking = true;
    input.disabled = true; errEl.textContent = 'กำลังตรวจสอบ...'; errEl.style.color = 'var(--text-secondary)';
    try{
      const res = await apiGet('checkPin', {pin: val});
      if(res && res.valid){ go('ownerMenu'); return; }
      errEl.textContent = 'รหัสไม่ถูกต้อง ลองใหม่อีกครั้ง'; errEl.style.color = 'var(--danger)';
      input.value='';
    }catch(err){
      errEl.textContent = 'ตรวจสอบรหัสไม่สำเร็จ: ' + err.message; errEl.style.color = 'var(--danger)';
    }
    checking = false; input.disabled = false; input.focus();
  }
  input.addEventListener('input', trySubmit);
}

/* ============ OWNER: merged Dashboard + Analytics ============ */
async function renderOwnerStockAnalytics(app){
  app.appendChild(topbar('สต๊อก & วิเคราะห์', {back:()=>go('ownerMenu')}));
  const c = document.createElement('div'); c.className='content';
  const tabs = document.createElement('div'); tabs.className='tabs';

                     <div class="tab ${state.ownerTab==='analytics'?'active':''}" data-t="analytics">วิเคราะห์การสั่งซื้อ</div>`;
  c.appendChild(tabs);
  const body = document.createElement('div'); body.innerHTML='<p class="empty-state">กำลังโหลด...</p>'; c.appendChild(body);
  app.appendChild(c);

  tabs.querySelectorAll('.tab').forEach(t=> t.onclick = ()=>{ go('ownerStockAnalytics', {ownerTab:t.dataset.t}); });

  try{
    if(state.ownerTab === 'stock'){
      const statusList = await getStockStatus();
      statusList.forEach(s=> Object.entries(s.remain||{}).forEach(([uid,val])=>{ if(val!==null) stockValues[uid]=val; }));
      renderStockTab(body);
    } else {
      const analytics = await apiGet('analytics', {range:'7d'});
      renderAnalyticsTab(body, analytics);
    }
  }catch(err){
    body.innerHTML = `<p class="empty-state" style="color:var(--danger);">โหลดข้อมูลไม่สำเร็จ: ${err.message}</p>`;
  }
}

function renderStockTab(body){
  const allProducts = PRODUCTS.map(p=>{
    const total = p.units.reduce((sum,u)=> sum + (stockValues[u.id]||0), 0);
    return {...p, total, empty: total===0};
  });
  const total = allProducts.length;
  const empty = allProducts.filter(p=>p.empty).length;

  body.innerHTML = `<div class="metric-grid">
      <div class="metric"><p>สินค้าทั้งหมด</p><p>${total}</p></div>
      <div class="metric" style="background:var(--green-bg);"><p style="color:var(--green);">ยังมี</p><p style="color:var(--green);">${total-empty}</p></div>
      <div class="metric" style="background:var(--amber-bg);"><p style="color:var(--amber);">หมด</p><p style="color:var(--amber);">${empty}</p></div>
    </div>
    <input type="text" id="search" placeholder="ค้นหาชื่อสินค้า" style="margin-bottom:10px;">
    <div id="tableWrap"></div>`;
  const tableWrap = body.querySelector('#tableWrap');

  function renderTable(filter){
    tableWrap.innerHTML='';
    SUPPLIERS.forEach(s=>{
      const items = allProducts.filter(p=>p.supplierId===s.id && p.name.includes(filter||''));
      if(!items.length) return;
      const col = NEUTRAL_COL;
      const head = document.createElement('div'); head.className='sup-header';
      head.style.background = col.bg; head.style.color = col.text; head.style.borderColor = col.text;
      head.innerHTML = `<span>${s.name}</span>`;
      tableWrap.appendChild(head);
      const tbl = document.createElement('table'); tbl.style.width='100%'; tbl.style.fontSize='13px'; tbl.style.marginBottom='10px';
      tbl.innerHTML = items.map(p=>`<tr style="border-bottom:1px solid var(--border);">
          <td style="padding:7px 4px;">${p.name}</td>
          <td style="padding:7px 4px; text-align:right;">${p.units.map(u=>`${stockValues[u.id]||0} ${u.label}`).join(' / ')}</td>
          <td style="padding:7px 4px; text-align:right; width:55px;">${p.empty? '<span class="badge" style="background:var(--amber-mid); color:#412402;">หมด</span>' : '<span style="color:var(--text-secondary); font-size:12px;">ยังมี</span>'}</td>
        </tr>`).join('');
      tableWrap.appendChild(tbl);
    });
  }
  renderTable('');
  body.querySelector('#search').oninput = (e)=>renderTable(e.target.value);
}

/* ============ OWNER: Order page (accordion, grouped by supplier) ============ */
async function renderOrderPage(app){
  app.appendChild(topbar('สั่งของ', {back:()=>go('ownerMenu')}));
  const c = document.createElement('div'); c.className='content';
  c.innerHTML = '<p class="empty-state">กำลังโหลดข้อมูล...</p>';
  app.appendChild(c);

  let statusList;
  try{
    const [sl, orderedRes, confirmedRes] = await Promise.all([getStockStatus(), apiGet('orderedToday'), apiGet('confirmedToday')]);
    statusList = sl;
    statusList.forEach(s=> Object.entries(s.remain||{}).forEach(([uid,val])=>{ if(val!==null) stockValues[uid]=val; }));
    orderedProductIds = new Set((orderedRes && orderedRes.productIds) || []);
    confirmedSupplierIds = new Set((confirmedRes && confirmedRes.supplierIds) || []);
  }catch(err){
    c.innerHTML = `<p class="empty-state" style="color:var(--danger);">โหลดข้อมูลไม่สำเร็จ: ${err.message}</p>`;
    return;
  }
  const statusByEntry = {}; statusList.forEach(s=> statusByEntry[s.productId] = s);
  const statusByProduct = {}; statusList.forEach(s=> statusByProduct[s.productId] = s.checked);

  c.innerHTML = `<div id="stats" class="stat-strip"></div>
    <div style="display:flex; gap:8px; margin-bottom:12px;">
      <input type="text" id="search" placeholder="ค้นหาชื่อสินค้าหรือชื่อเจ้า" style="flex:1;">
    </div>
    <div id="groups"></div>`;
  const statsEl = c.querySelector('#stats');
  const groups = c.querySelector('#groups');
  const bar = document.createElement('div'); bar.className='stickybar';
  c.appendChild(bar);

  const expandedSuppliers = new Set();

  function supplierStats(s){
    const items = PRODUCTS.filter(p=>p.supplierId===s.id);
    const checkedCount = items.filter(p=>statusByProduct[p.id]).length;
    const isOrdered = items.some(p=> orderedProductIds.has(p.id));
    const isConfirmed = confirmedSupplierIds.has(s.id);
    return { items, checkedCount, isOrdered, isConfirmed };
  }

  function renderStats(){
    const withItems = SUPPLIERS.filter(s=> PRODUCTS.some(p=>p.supplierId===s.id));
    let checkedSuppliers = 0, orderedSuppliers = 0, confirmedSuppliers = 0;
    withItems.forEach(s=>{
      const { items, checkedCount, isOrdered, isConfirmed } = supplierStats(s);
      const fullyChecked = items.length > 0 && checkedCount === items.length;
      if(fullyChecked) checkedSuppliers++;
      if(isOrdered) orderedSuppliers++;
      if(isConfirmed) confirmedSuppliers++;
    });
    statsEl.innerHTML = `
      <div class="stat-card"><div class="n">${withItems.length}</div><div class="lbl">เจ้าทั้งหมด</div></div>
      <div class="stat-card green"><div class="n">${checkedSuppliers}</div><div class="lbl">เช็คสต๊อกแล้ว</div></div>
      <div class="stat-card amber"><div class="n">${orderedSuppliers}</div><div class="lbl">สร้างข้อความแล้ว</div></div>
      <div class="stat-card amber"><div class="n">${confirmedSuppliers}</div><div class="lbl">ส่งออเดอร์แล้ว</div></div>
    `;
  }

  function renderGroups(filter){
    groups.innerHTML='';
    SUPPLIERS.forEach(s=>{
      const allItems = PRODUCTS.filter(p=>p.supplierId===s.id);
      if(!allItems.length) return;
      const items = allItems.filter(p=>p.name.includes(filter||'') || s.name.includes(filter||''));
      if(!items.length) return;

      const { checkedCount, isOrdered, isConfirmed } = supplierStats(s);
      const fullyChecked = allItems.length > 0 && checkedCount === allItems.length;
      const open = expandedSuppliers.has(s.id);

      // Gate on fullyChecked too: don't show "ordered" (green) before the
      // supplier's stock is fully checked today.
      const orderDone = fullyChecked && isOrdered;
      // Single combined status per supplier — one line, one color, states an action
      // rather than two badges (stock-check count vs order status) that read as unrelated.
      // นับตามจำนวนสินค้าที่ลูกจ้างกดติ๊กว่าเช็คแล้วจริงๆ เท่านั้น — สินค้าที่ลูกจ้างเช็คแล้วแต่ไม่มีของ
      // (กรอกคงเหลือเป็น 0) ก็นับว่า "เช็คแล้ว" เหมือนกัน เพราะติ๊กผ่านการเช็คสต๊อกไปแล้วจริง
      const checkedRatio = `${checkedCount}/${allItems.length}`;
      let stateClass, statusText, subText;
      if(orderDone){ stateClass='ordered'; statusText='✓ สั่งของแล้ววันนี้'; subText=`เช็คสต๊อกครบแล้ว (${checkedRatio})`; }
      else if(checkedCount === 0){ stateClass='wait'; statusText='⏳ รอเช็คสต๊อก'; subText=`ลูกจ้างยังไม่เริ่มเช็ค (${checkedRatio} รายการ)`; }
      else if(!fullyChecked){ stateClass='partial'; statusText='⏳ เช็คสต๊อกค้างอยู่'; subText=`เช็คแล้ว ${checkedRatio} รายการ`; }
      else{ stateClass='wait'; statusText='✓ เช็คสต๊อกครบแล้ว'; subText=`พร้อมเลือกรายการที่จะสั่ง (${checkedRatio})`; }

      // จำนวนรายการที่เจ้าของกดเลือกจะสั่งจริง (orderQty > 0) — นับจากที่กรอกเองล้วนๆ
      // ไม่เกี่ยวกับคงเหลือ/เช็คสต๊อก เพื่อไม่ให้ปนกับความไม่แน่นอนว่า "คงเหลือ 0" หมายถึงหมดจริงหรือลูกจ้างข้าม
      const baseSubText = subText;
      function countSelected(){ return allItems.filter(p=> (state.orderQty[p.id] ?? 0) > 0).length; }
      function selectedSuffix(){ const n = countSelected(); return n > 0 ? ` · เลือกไว้ ${n} รายการ` : ''; }
      subText = baseSubText + selectedSuffix();

      const card = document.createElement('div'); card.className = 'ord-card state-' + stateClass + (open?' open':'');
      const strip = document.createElement('div'); strip.className = 'ord-card-strip';
      card.appendChild(strip);
      const main = document.createElement('div'); main.className = 'ord-card-main';

      const head = document.createElement('div'); head.className = 'ord-card-head';
      head.innerHTML = `
        <i class="ti ti-chevron-down chev"></i>
        ${orderDone ? '<span class="order-done-check">✓</span>' : ''}
        <span class="ord-card-name">${s.name}</span>
        <div class="ord-card-status">
          <span class="status-line ${stateClass}">${statusText}</span>
          <span class="status-sub">${subText}</span>
        </div>
      `;
      head.onclick = ()=>{
        if(expandedSuppliers.has(s.id)) expandedSuppliers.delete(s.id); else expandedSuppliers.add(s.id);
        renderGroups(c.querySelector('#search').value);
      };
      main.appendChild(head);

      // ติ๊กยืนยันด้วยมือว่า "ส่งข้อความสั่งให้ supplier จริงแล้ว" (เช่น กดส่งในไลน์แล้ว)
      // แยกจากสถานะ "สร้างข้อความแล้ว" ด้านบน ซึ่งแค่บอกว่าแอปบันทึกคำสั่งซื้อให้เท่านั้น
      // ไม่ได้รู้ว่าข้อความถูกส่งออกไปหา supplier จริงหรือยัง
      const confirmRow = document.createElement('label'); confirmRow.className = 'confirm-sent-row';
      confirmRow.innerHTML = `<input type="checkbox" ${isConfirmed?'checked':''}> ส่งออเดอร์ให้ร้านแล้ว`;
      const confirmCheckbox = confirmRow.querySelector('input');
      confirmRow.onclick = (e)=> e.stopPropagation();
      confirmCheckbox.onchange = async (e)=>{
        const checked = e.target.checked;
        confirmCheckbox.disabled = true;
        try{
          await apiPost('setSupplierOrderConfirm', { supplierId: s.id, confirmed: checked, staffName: state.staffName });
          if(checked) confirmedSupplierIds.add(s.id); else confirmedSupplierIds.delete(s.id);
          renderStats();
        }catch(err){
          e.target.checked = !checked; // revert ถ้าบันทึกไม่สำเร็จ
          alert('บันทึกสถานะไม่สำเร็จ: ' + err.message);
        }finally{
          confirmCheckbox.disabled = false;
        }
      };
      main.appendChild(confirmRow);

      const body = document.createElement('div'); body.className = 'ord-card-body';

      const allSelected = items.length > 0 && items.every(p=> (state.orderQty[p.id] ?? 0) > 0);
      const selectRow = document.createElement('div'); selectRow.className = 'select-all-row';
      selectRow.innerHTML = `<button type="button" class="link-btn" data-selecttoggle>${allSelected ? 'ไม่เลือกเลย' : 'เลือกทั้งหมด'}</button>`;
      selectRow.querySelector('[data-selecttoggle]').onclick = ()=>{
        if(allSelected) items.forEach(p=> state.orderQty[p.id] = 0);
        else items.forEach(p=>{ state.orderQty[p.id] = state.orderQty[p.id] > 0 ? state.orderQty[p.id] : 1; });
        renderGroups(c.querySelector('#search').value);
      };
      body.appendChild(selectRow);

      const groupBox = document.createElement('div'); groupBox.className='acc-group'; groupBox.style.borderRadius='0'; groupBox.style.border='none';

      items.forEach(p=>{
        const itemChecked = !!statusByProduct[p.id];
        if(state.orderQty[p.id]===undefined) state.orderQty[p.id] = 0;
        const qty = state.orderQty[p.id];
        // สินค้าที่มีหลายหน่วย (เล็ก→ใหญ่ เรียงตาม SortOrder) แสดงคงเหลือของทุกหน่วย
        // แต่สั่งของเป็นหน่วยใหญ่สุดเสมอ
        const uLabel = orderUnitLabel(p);
        const remainEntry = statusByEntry[p.id];
        const remainParts = p.units.map(u=>{
          const v = remainEntry ? remainEntry.remain[u.id] : null;
          return (v!==null && v!==undefined) ? `${v}<span class="u">${u.label}</span>` : null;
        }).filter(Boolean);
        const remainDisplay = itemChecked && remainParts.length ? remainParts.join(' ') : '–';

        const row = document.createElement('div');
        row.className = 'prow';
        row.innerHTML = `
          <div class="prow-top">
            <input type="checkbox" ${qty>0?'checked':''} data-check="${p.id}">
            <div class="prow-name">${p.name}</div>
          </div>
          <div class="prow-bottom">
            <div class="stat"><span class="lbl">คงเหลือ</span><span class="v muted">${remainDisplay}</span></div>
            <div class="stat"><span class="lbl">ขั้นต่ำ</span><span class="v muted">${p.safetyStock}<span class="u">${uLabel}</span></span></div>
            <div class="stepper">
              <button type="button" data-step="-1">−</button>
              <input type="text" inputmode="numeric" pattern="[0-9]*" class="stepper-input" value="${qty}" min="0" step="1" data-qty="${p.id}">
              <button type="button" data-step="1">+</button>
              <span class="unit-tag">${uLabel}</span>
            </div>
          </div>
        `;
        groupBox.appendChild(row);

        const qtyInput = row.querySelector(`[data-qty="${p.id}"]`);
        function setQty(v){
          state.orderQty[p.id] = Math.max(0, Math.round(v));
          qtyInput.value = state.orderQty[p.id];
          row.querySelector('[data-check]').checked = state.orderQty[p.id] > 0;
          const subEl = head.querySelector('.status-sub');
          if(subEl) subEl.textContent = baseSubText + selectedSuffix();
          updateBar();
        }
        row.querySelector('[data-check]').onchange = (e)=>{
          setQty(e.target.checked ? 1 : 0);
        };
        qtyInput.oninput = (e)=> setQty(parseFloat(e.target.value||0));
        row.querySelectorAll('[data-step]').forEach(btn=>{
          btn.onclick = ()=> setQty(state.orderQty[p.id] + Number(btn.dataset.step));
        });
      });
      body.appendChild(groupBox);

      {
        const btnRow = document.createElement('div'); btnRow.className = 'sup-order-btn-row';
        const btn = document.createElement('button');
        btn.className = 'btn btn-primary'; btn.style.fontSize='12px'; btn.style.padding='6px 10px';
        btn.textContent = isOrdered ? 'สั่งของเจ้านี้อีกครั้ง' : 'สั่งของเจ้านี้';
        btn.onclick = async (e)=>{
          e.stopPropagation();
          const supItems = allItems.filter(p=> (state.orderQty[p.id] ?? 0) > 0).map(p=>{
            return { productId:p.id, forecast: 0, orderQty: state.orderQty[p.id], rateUsed: 1, orderUnit: orderUnitLabel(p) };
          });
          if(!supItems.length){ alert('ยังไม่ได้เลือกรายการที่จะสั่งของเจ้านี้'); return; }
          btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
          try{
            await apiPost('createOrderBatch', { items: supItems });
            supItems.forEach(it=> orderedProductIds.add(it.productId));
            // เคลียร์จำนวนที่สั่งไปแล้วออกจาก state — กันไม่ให้ปุ่ม "สร้างข้อความสั่งของทั้งหมด"
            // นับซ้ำแล้วยิง createOrderBatch ให้รายการเดิมอีกรอบ และกันตัวเลขเก่าค้างให้เข้าใจผิด
            // ว่าเป็นค่าที่เพิ่งกรอกใหม่เวลาเปิดเจ้านี้ซ้ำ
            supItems.forEach(it=> state.orderQty[it.productId] = 0);
            renderStats();
            renderGroups(c.querySelector('#search').value);
          }catch(err){
            btn.disabled = false; btn.textContent = 'สั่งของเจ้านี้';
            alert('บันทึก OrderLogs ไม่สำเร็จ: ' + err.message);
          }
        };
        btnRow.appendChild(btn);
        body.appendChild(btnRow);
      }

      main.appendChild(body);
      card.appendChild(main);
      groups.appendChild(card);
    });
    if(!groups.children.length) groups.innerHTML = '<p class="empty-state">ไม่พบสินค้าที่ค้นหา</p>';
    updateBar();
  }

  function updateBar(){
    const n = Object.values(state.orderQty).filter(v=>v>0).length;
    bar.innerHTML = `<span>เลือกแล้ว ${n} รายการ</span><button class="btn-primary btn" id="genMsg" ${n===0?'disabled':''}>สร้างข้อความสั่งของทั้งหมด</button>`;
    bar.querySelector('#genMsg').onclick = async (e)=>{
      const btn = e.target; btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
      const items = Object.entries(state.orderQty).filter(([id,q])=>q>0).map(([id,q])=>{
        const p = PRODUCTS.find(x=>x.id===id);
        return { productId:id, forecast: 0, orderQty:q, rateUsed: 1, orderUnit: orderUnitLabel(p) };
      });
      try{
        await apiPost('createOrderBatch', { items });
        items.forEach(it=> orderedProductIds.add(it.productId));
        // เก็บรายการที่เพิ่งสั่งไว้ให้หน้าข้อความใช้แสดงผล ก่อนเคลียร์ state.orderQty จริง —
        // กันปุ่มนี้กดซ้ำแล้วสั่งรายการเดิมซ้ำอีกรอบ (เหมือนปุ่ม "สั่งของเจ้านี้" รายเจ้า)
        lastOrderMessageSnapshot = {};
        items.forEach(it=>{ lastOrderMessageSnapshot[it.productId] = it.orderQty; state.orderQty[it.productId] = 0; });
        go('orderMessage');
      }catch(err){
        btn.disabled = false; btn.textContent = 'สร้างข้อความสั่งของทั้งหมด';
        alert('บันทึก OrderLogs ไม่สำเร็จ: ' + err.message);
      }
    };
  }

  renderStats();
  renderGroups('');
  c.querySelector('#search').oninput = (e)=>{ renderStats(); renderGroups(e.target.value); };
}

/* ============ OWNER: Order message ============ */
function renderOrderMessage(app){
  app.appendChild(topbar('สร้างข้อความสั่งของ', {back:()=>go('orderPage')}));
  const c = document.createElement('div'); c.className='content';

  // ใช้สแนปช็อตที่เพิ่งสั่งไปถ้ามี (มาจากปุ่ม "สร้างข้อความสั่งของทั้งหมด") แทน state.orderQty
  // สดๆ เพราะ state.orderQty ถูกเคลียร์เป็น 0 ไปแล้วหลังสั่งสำเร็จ กันสั่งซ้ำ
  const qtySource = lastOrderMessageSnapshot || state.orderQty;
  lastOrderMessageSnapshot = null;
  const items = Object.entries(qtySource).filter(([id,q])=>q>0).map(([id,q])=>{
    const p = PRODUCTS.find(x=>x.id===id);
    return {...p, orderUnit: orderUnitLabel(p), qty:q};
  });
  const bySupplier = {};
  items.forEach(it=>{ (bySupplier[it.supplierId] = bySupplier[it.supplierId]||[]).push(it); });

  if(!Object.keys(bySupplier).length){
    c.innerHTML = '<p class="empty-state">ยังไม่มีรายการที่เลือกสั่ง กลับไปหน้าสั่งของก่อนนะครับ</p>';
    app.appendChild(c); return;
  }

  Object.entries(bySupplier).forEach(([supId, list])=>{
    const sup = SUPPLIERS.find(s=>s.id===supId);
    const col = NEUTRAL_COL;
    // ฟอนต์โมโนสเปซ (เช่น Courier New) ไม่รองรับตัวอักษรไทย เบราว์เซอร์เลย fallback ไปใช้ฟอนต์ไทย
    // แบบสัดส่วน (proportional) แทน — ผลคือ pad ด้วยจำนวนตัวอักษร/ช่องว่างแล้วไม่ตรงกันจริงบนจอ
    // แก้โดยไม่พึ่งการนับตัวอักษรเลย ใช้ CSS grid 3 คอลัมน์ (ชื่อ | จำนวน | หน่วยนับ)
    // — ต้องเป็น grid container เดียวที่ครอบทุกแถว (ไม่ใช่ grid แยกทีละแถว) ความกว้างคอลัมน์
    // ถึงจะคำนวณรวมจากทุกแถวแล้วตรงกันจริง ไม่ว่าชื่อแถวไหนจะสั้นหรือยาวแค่ไหน
    const rowsHtml = list.map((it,i)=>`
      <span style="min-width:0;">${i+1}. ${it.name}</span>
      <span style="text-align:right; white-space:nowrap;">${it.qty}</span>
      <span style="text-align:left; white-space:nowrap;">${it.orderUnit}</span>`).join('');
    // ข้อความล้วนสำหรับคัดลอกไปวางแอปอื่น (LINE ฯลฯ) — คุมฟอนต์ปลายทางไม่ได้ จึงคั่นด้วยช่องว่างคงที่
    // แทนการพยายามจัดคอลัมน์ด้วยจำนวนช่องว่างผันแปร (ซึ่งตรงเฉพาะตอนพรีวิวในแอปเท่านั้น)
    // ใช้ non-breaking space ( ) คั่นระหว่าง "จำนวน" กับ "หน่วยนับ" แทนช่องว่างปกติ
    // กันไม่ให้กล่องแชทไลน์ (ที่ความกว้างจำกัด) ตัดขึ้นบรรทัดใหม่คั่นกลางระหว่างเลขกับหน่วย
    // เช่น "22 หิ้ว" ต้องขึ้นบรรทัดใหม่ด้วยกันทั้งคู่ ไม่ใช่ "22" ค้างบรรทัดบนแล้ว "หิ้ว" กระเด็นไปบรรทัดล่าง
    const lines = list.map((it,i)=>`${i+1}. ${it.name}  ${it.qty} ${it.orderUnit}`).join('\n');
    const todayLabel = new Date().toLocaleDateString('th-TH', {year:'numeric', month:'short', day:'numeric'});
    const text = `สั่งสินค้า\nร้านซามูไร ไส้กรอก ตลาดเวิลด์มาเก็ต ทวีวัฒนา\nวันที่สั่ง: ${todayLabel}\n\nรายการสั่งของ\n${lines}`;

    const card = document.createElement('div');
    card.style.background='#fff'; card.style.border='1px solid var(--border)';
    card.style.borderLeft = `3px solid ${col.text}`; card.style.borderRadius='0 var(--radius-lg) var(--radius-lg) 0'; card.style.padding='14px'; card.style.marginBottom='12px';
    card.innerHTML = `
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
        <p style="margin:0; font-weight:600; font-size:14px;">${sup.name}</p>
        <button class="btn copy-btn" style="font-size:12px; padding:6px 10px;"><i class="ti ti-copy" style="font-size:13px;"></i> คัดลอก</button>
      </div>
      <div style="display:grid; grid-template-columns:1fr auto auto; column-gap:8px; row-gap:4px; align-items:baseline; font-size:12px; line-height:1.5; background:var(--bg); padding:10px; border-radius:8px;">${rowsHtml}</div>
    `;
    card.querySelector('.copy-btn').onclick = ()=>{
      navigator.clipboard?.writeText(text).catch(()=>{});
      const toast = document.createElement('div'); toast.className='copy-toast'; toast.textContent='คัดลอกแล้ว';
      document.body.appendChild(toast); setTimeout(()=>toast.remove(), 1400);
    };
    c.appendChild(card);
  });
  app.appendChild(c);
}

bootstrap();
</script>
</body>
</html>
