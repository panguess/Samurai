// ตัวจับเวลาบนหน้า "กำลังโหลด" ที่วนลองเชื่อมต่อเงียบๆ ไม่จำกัดรอบ (bootstrap/checkPin/renderSupplierList ฯลฯ)
// — ผู้ใช้ขอ 17 ก.ย. 69 หลังเจอเคสจริงที่ค้างนานถึง 8 นาทีโดยไม่มีทางรู้เลยว่าแอปยังพยายามอยู่หรือแฮงค์ไปแล้ว
// มีตัวจับเวลาจะบอกแม่นยำได้ทันทีว่า "ค้างมานานเท่าไหร่" แจ้งกลับมาได้โดยไม่ต้องเปิด Apps Script Executions
// log มาเทียบเวลาเอง
// attachLoadingTimer(el): เริ่มนับเวลาบน element ที่ให้มา ไม่โชว์อะไรถ้ายังไม่ถึง 5 วิ (กันกระพริบตอนโหลดเร็ว
// ปกติ) เช็ค el.isConnected ทุก tick กันกรณีจอเปลี่ยนไปแล้วแต่ retry loop เดิมยังวนอยู่เบื้องหลัง (ไม่เขียนทับ
// จอใหม่ผิดๆ) — คืน stop() ให้เรียกทันทีที่โหลดสำเร็จ/เลิกใช้เพื่อเคลียร์ interval ทิ้ง
// WCAG AA fix (27 ก.ย. 69, D-8): เดิมตัวจับเวลาไม่มี aria-live เลย screen reader ไม่รู้ตัวว่ากำลังนับเวลาอยู่ —
// ตั้งใจไม่ใส่ aria-live ตรงบน el ตัวที่มองเห็น (จะ noisy มาก เพราะอัปเดตทุก 1 วิ — ประกาศ "รอมาแล้ว 6 วิ", "7 วิ"...
// ทุกวินาทีน่ารำคาญเกินไป) แทนที่ด้วยสร้าง live region ที่ซ่อนด้วยตา (.sr-only) แปะไว้ข้างๆ el เอง แล้วอัปเดตแค่
// ตอนขึ้นครั้งแรก (5 วิ) กับซ้ำทุก 30 วิหลังจากนั้น ให้ข้อมูลพอเพียงไม่ถี่จนน่ารำคาญ — ทำเป็น self-contained ในฟังก์ชัน
// นี้ทั้งหมด ไม่ต้องแก้ loadingTimerHtml()/เทมเพลตทั้ง 7 จุดที่เรียกใช้เลยแม้แต่จุดเดียว (ลดความเสี่ยงพลาดจุด)
function attachLoadingTimer(el){
  const startTs = Date.now();
  let liveEl = null;
  if(el && el.parentNode){
    liveEl = document.createElement('span');
    liveEl.className = 'sr-only';
    liveEl.setAttribute('role','status');
    liveEl.setAttribute('aria-live','polite');
    el.parentNode.insertBefore(liveEl, el.nextSibling);
  }
  let lastAnnouncedSecs = -1;
  const tick = ()=>{
    if(!el || !el.isConnected) return;
    const secs = Math.floor((Date.now()-startTs)/1000);
    if(secs < 5){ el.textContent=''; return; }
    const m = Math.floor(secs/60), s = secs%60;
    const text = 'รอมาแล้ว ' + (m>0 ? (m+' นาที '+s+' วิ') : (s+' วิ'));
    el.textContent = text;
    if(liveEl && (lastAnnouncedSecs===-1 || secs - lastAnnouncedSecs >= 30)){
      liveEl.textContent = text;
      lastAnnouncedSecs = secs;
    }
  };
  const timer = setInterval(tick, 1000);
  return ()=>{ clearInterval(timer); if(liveEl && liveEl.parentNode) liveEl.remove(); };
}
// สร้าง <p id="..."> ใหม่ให้แปะต่อท้าย innerHTML ของหน้าโหลดแต่ละจุด (id ไม่ซ้ำกันเสมอ กันชนกันเวลามีหลาย
// หน้าโหลดซ้อนกันในเบื้องหลัง) คืน {id, html} — เอา id ไปหา element จริงด้วย document.getElementById(id) แล้ว
// ส่งต่อให้ attachLoadingTimer() อีกที
let _loadingTimerSeq = 0;
function loadingTimerHtml(){
  const id = 'loadTimer' + (++_loadingTimerSeq);
  return { id, html: `<p id="${id}" style="font-size:12px; color:var(--text-secondary); margin-top:8px;"></p>` };
}
function renderLoading(app, msg){
  const lt = loadingTimerHtml();
  app.innerHTML = `<div class="empty-state" style="padding:80px 0;"><div style="font-size:30px; margin-bottom:10px;">⏳</div><p>${msg||'กำลังโหลดข้อมูล...'}</p>${lt.html}</div>`;
  return attachLoadingTimer(document.getElementById(lt.id));
}

const BOOTSTRAP_CACHE_KEY = 'samurai_bootstrap_cache_v1';
// กันรีเฟรช bootstrap ถี่เกินไปตอนสลับดูหลายเจ้าติดๆ กัน (เช่น เข้าหน้าเช็คสต๊อกของเจ้านี้แล้วกลับไปเจ้าอื่น
// แล้ววนมาเจ้าเดิมอีกภายในไม่กี่วิ) — รีเฟรชจริงเมื่อห่างจากครั้งก่อนเกิน BOOTSTRAP_REFRESH_TTL เท่านั้น
// เหมือนแพทเทิร์นเดียวกับ STOCK_STATUS_TTL
const BOOTSTRAP_REFRESH_TTL = 45000; // ms
let _bootstrapRefreshTs = 0;
const BOOTSTRAP_SAFE_RERENDER_SCREENS = new Set(['home','staffName','supplierList','ownerMenu','billSupplier']);
// หน้าพวกนี้ไม่มีช่องกรอกข้อมูลจริง มีแค่ช่องค้นหา — ถ้าผู้ใช้พิมพ์ค้นหาค้างอยู่/กำลังพิมพ์ ไม่วาดทับ (คำค้นจะหาย)
function canSilentlyRerenderAfterBootstrap(){
  if(!BOOTSTRAP_SAFE_RERENDER_SCREENS.has(state.screen)) return false;
  const app = document.getElementById('app');
  const active = document.activeElement;
  if(active && app.contains(active) && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)) return false;
  return ![...app.querySelectorAll('input[type="text"], input[type="search"]')].some(i=> i.value);
}
function refreshBootstrapIfStale(onUpdated){
  if(Date.now() - _bootstrapRefreshTs < BOOTSTRAP_REFRESH_TTL) return;
  _bootstrapRefreshTs = Date.now();
  apiGet('bootstrap').then(data=>{
    SUPPLIERS = data.suppliers; PRODUCTS = data.products; STAFF = data.staff;
    writeBootstrapCache(data);
    if(onUpdated) onUpdated(data);
  }).catch(()=>{ _bootstrapRefreshTs = 0; }); // ล้มเหลว — อนุญาตให้ลองใหม่ได้เลยครั้งหน้า ไม่ต้องรอครบ TTL
}
// Speed รอบ 1 (1 ต.ค. 69 — B/C): เดิมแคช bootstrap/บิลรอตรวจเก็บใน sessionStorage ซึ่งหายทุกครั้งที่ปิดแอป
// (PWA/แท็บใหม่) — เปิดแอปครั้งแรกของวันเลยต้องรอ Apps Script เต็มๆ ทุกครั้ง (วัดได้ ~2.3 วิ / บิล ~3 วิ) ย้ายไป
// localStorage ให้อยู่ข้ามการปิดแอป ยังเป็น stale-while-revalidate เหมือนเดิม (โชว์ของเดิมทันที + ดึงของจริงเบื้องหลัง
// ทุกครั้ง) เก็บเวลาไว้ด้วย — แคชเก่ากว่า PERSIST_CACHE_MAX_AGE (ไม่ได้เปิดแอปนานมาก) ไม่ใช้ กลับไปรอโหลดแบบเดิม
// อ่าน sessionStorage คีย์เดิมเป็นทางสำรองเฉพาะแท็บที่เปิดค้างอยู่ตอนอัปเดตเวอร์ชันนี้ (ครั้งเดียว)
const PERSIST_CACHE_MAX_AGE = 7 * 24 * 3600 * 1000; // ms
const BOOTSTRAP_CACHE_KEY_V2 = 'samurai_bootstrap_cache_v2';
function readPersistCache(key, legacyKey){
  try{
    const wrapped = JSON.parse(localStorage.getItem(key));
    if(wrapped && wrapped.data && Date.now() - (wrapped.savedAt||0) < PERSIST_CACHE_MAX_AGE) return wrapped.data;
  }catch(e){}
  try{ return JSON.parse(sessionStorage.getItem(legacyKey)); }catch(e){ return null; }
}
function writePersistCache(key, legacyKey, data){
  try{ sessionStorage.removeItem(legacyKey); }catch(e){}
  try{ localStorage.setItem(key, JSON.stringify({savedAt: Date.now(), data})); }catch(e){}
}
// แคช 2 ตัวนี้ใช้โควต้า localStorage ร่วมกับ draft บิล (draft ลูกจ้างมีรูปบิลอยู่ในนั้น ใหญ่ได้ถึง ~4MB ใกล้เพดาน
// ~5MB ของ iOS Safari) — draft สำคัญกว่าแคชเสมอ ถ้าเซฟ draft ไม่ลงเพราะเต็ม saveDraft จะเรียกตัวนี้ลบแคชทิ้งแล้วลองใหม่
// (แคชหายแค่ทำให้เปิดแอปครั้งหน้าช้าเท่าเดิม 1 ครั้ง ไม่มีข้อมูลอะไรหาย)
function evictPersistCaches(){
  try{ localStorage.removeItem(BOOTSTRAP_CACHE_KEY_V2); localStorage.removeItem(PENDING_BILLS_CACHE_KEY_V2); }catch(e){}
}
function setItemDraftFirst(key, value){
  try{ localStorage.setItem(key, value); return; }catch(e){}
  evictPersistCaches();
  try{ localStorage.setItem(key, value); }catch(e){}
}
function readBootstrapCache(){ return readPersistCache(BOOTSTRAP_CACHE_KEY_V2, BOOTSTRAP_CACHE_KEY); }
function writeBootstrapCache(data){ writePersistCache(BOOTSTRAP_CACHE_KEY_V2, BOOTSTRAP_CACHE_KEY, data); }
async function bootstrap(){
  const app = document.getElementById('app');
  // ร้าน/สินค้า/พนักงาน แทบไม่เปลี่ยนบ่อย - ถ้ามี cache จากเซสชันก่อนหน้าให้ใช้ก่อนเลย
  // แล้วค่อยรีเฟรชข้อมูลใหม่เงียบๆ อยู่เบื้องหลัง แทนที่จะรอ Apps Script ทุกครั้งที่เปิดแอป
  const cached = readBootstrapCache();
  if(cached && Array.isArray(cached.suppliers) && Array.isArray(cached.products) && Array.isArray(cached.staff)){
    SUPPLIERS = cached.suppliers; PRODUCTS = cached.products; STAFF = cached.staff;
    const cachedJson = JSON.stringify(cached);
    history.replaceState({screen:'home', staffName:'', currentSupplierId:null, ownerTab:'stock'}, '');
    render();
    getStockStatus().catch(()=>{});
    apiGet('bootstrap').then(data=>{
      SUPPLIERS = data.suppliers; PRODUCTS = data.products; STAFF = data.staff;
      writeBootstrapCache(data);
      _bootstrapRefreshTs = Date.now();
      // ข้อมูลจริงมาแล้ว (เช่น หน่วยสินค้าที่เพิ่งเพิ่มในชีต) — render จากข้อมูลเก่าไปแล้วตอนต้นฟังก์ชัน
      // ต้อง render ซ้ำอีกครั้งไม่งั้นหน้าจอจะค้างข้อมูลเก่าไปตลอด session จนกว่าจะปิดแท็บ
      // Speed รอบ 1: แคชอยู่ข้ามการปิดแอปแล้ว ทางนี้จะวิ่งทุกครั้งที่เปิดแอป ผู้ใช้อาจกดเข้าหน้ากรอกข้อมูลไปก่อน
      // ข้อมูลจริงมาถึง — render() ทับหน้าเช็คสต๊อก/สั่งของ/ตรวจบิลจะล้างค่าที่พิมพ์ค้างไว้ (หน้าเช็คสต๊อกรีเซ็ต
      // supplierCheckDirty ทำให้ไม่เซฟอัตโนมัติตอนออก) จึง render ซ้ำเฉพาะเมื่อข้อมูลเปลี่ยนจริง และเฉพาะหน้าที่ไม่มี
      // ช่องกรอก — หน้าอื่นใช้ข้อมูลใหม่ (SUPPLIERS/PRODUCTS อัปเดตแล้วด้านบน) ตั้งแต่หน้าถัดไปที่เปิด
      if(JSON.stringify(data) === cachedJson) return;
      if(canSilentlyRerenderAfterBootstrap()) render();
    }).catch(()=>{});
    return;
  }

  // Show the logo immediately instead of a blank spinner - the network
  // round trip to Apps Script is the slow part, not this render.
  app.innerHTML = '';
  app.appendChild(buildHero());
  const loadingEl = document.createElement('div');
  loadingEl.className = 'content';
  const lt = loadingTimerHtml();
  loadingEl.innerHTML = `<div class="empty-state" style="padding:40px 0;"><div style="font-size:30px; margin-bottom:10px;">⏳</div><p>กำลังโหลดข้อมูลร้าน...</p>${lt.html}</div>`;
  app.appendChild(loadingEl);
  const stopTimer = attachLoadingTimer(document.getElementById(lt.id));
  // เจอจริง 15 ก.ย. 69: เดิมจำกัดแค่ 2 รอบ (10วิ แล้ว 25วิ รวม ~35วิ) แล้วยอมแพ้โชว์ error ให้กดปุ่ม "ลองใหม่"
  // เอง — แต่พบว่าเวลาทดสอบเปิด URL ของ backend ตรงๆ (เบราว์เซอร์ปกติไม่มี timeout ของตัวเอง รอได้ไม่จำกัด)
  // กลับติดสำเร็จทุกครั้ง ทั้งที่แอปพังพอดี แปลว่า backend มักจะสำเร็จจริงอยู่แล้ว แค่ช้ากว่าที่แอปยอมรอ
  // ไม่ใช่พังจริง (คล้าย cold start + DNS/TLS 2 โดเมนซ้อนกันที่เคยพบมาก่อน แต่รุนแรง/นานกว่าที่เคยเจอ) —
  // เปลี่ยนแนวทางตามที่แอปสั่งของ (index.html) ทำสำเร็จมาแล้วเมื่อวันเดียวกัน: วนลองใหม่เงียบๆ ไม่จำกัด
  // จำนวนรอบจนกว่าจะสำเร็จ แทนที่จะยอมแพ้แล้วบังคับให้ผู้ใช้กดปุ่มเอง — ไม่โชว์ error ระหว่างรอเลย ค้างแค่
  // "กำลังโหลดข้อมูลร้าน..." ไว้ เว้นจังหวะสั้นๆ ระหว่างรอบกันยิงรัวจนซ้ำเติมปัญหาถ้าเน็ต/backend กำลังหนักอยู่แล้ว
  for(;;){
    try{
      const data = await apiGet('bootstrap');
      stopTimer();
      SUPPLIERS = data.suppliers; PRODUCTS = data.products; STAFF = data.staff;
      writeBootstrapCache(data);
      _bootstrapRefreshTs = Date.now();
      getStockStatus().catch(()=>{});
      history.replaceState({screen:'home', staffName:'', currentSupplierId:null, ownerTab:'stock'}, '');
      render();
      return;
    }catch(err){
      await new Promise(r=> setTimeout(r, 3000));
    }
  }
}

// E2E fix (1 ต.ค. 69, จาก Final E2E Audit — E2E-002/E2E-003): หน้าที่ต้องรอ network (เช็คสต๊อก/รายชื่อร้าน/
// สั่งของ/Dashboard/บิลรอตรวจ/AI อ่านบิล/ตรวจ PIN) เดิมไม่รู้ตัวเลยว่าผู้ใช้ออกจากหน้าไปแล้ว — ข้อมูลมาถึงทีหลัง
// ก็ยังวาดทับหน้าปัจจุบัน (เจอจริงในเทส: หน้าเช็คสต๊อกโผล่ทับรายชื่อร้านทั้งที่ state.screen ยังเป็นรายชื่อร้าน
// ทำให้กดย้อนกลับแล้วข้อมูลที่กรอกไม่ถูกเซฟอัตโนมัติ / AI อ่านบิลเสร็จแล้วพาไปหน้าตรวจที่พังเป็นจอว่าง) และวนลอง
// เชื่อมต่อใหม่ทุก 3 วิไม่หยุดแม้ไม่มีใครดูหน้านั้นแล้ว (ไปแย่งโควต้า Apps Script กับหน้าที่ใช้อยู่จริง)
// _renderSeq เพิ่มขึ้นทุกครั้งที่ render() — หน้า async จับค่าไว้ตอนเริ่มผ่าน renderToken() แล้วเช็คหลังทุก await
// ถ้าไม่ใช่รอบล่าสุดแล้วให้หยุดเงียบๆ ทันที (ไม่วาด ไม่ go() ไม่วนลองต่อ)
let _renderSeq = 0;
function renderToken(){
  const seq = _renderSeq;
  return ()=> seq === _renderSeq;
}
function render(){
  _renderSeq++;
  const app = document.getElementById('app');
  app.innerHTML = '';
  const map = {

    billBatchAnalyzing: renderBillBatchAnalyzing, billBatchReview: renderBillBatchReview,

function topbar(title, opts={}){
  const bar = document.createElement('div'); bar.className='topbar'; bar.setAttribute('role','banner');
  if(opts.back){ const b=document.createElement('button'); b.className='back'; b.innerHTML='←'; b.setAttribute('aria-label','ย้อนกลับ'); b.onclick=opts.back; bar.appendChild(b); }
  const h = document.createElement('h1'); h.textContent = title; bar.appendChild(h);
  if(opts.meta){ const m=document.createElement('span'); m.className='meta'; m.textContent=opts.meta; bar.appendChild(m); }
  if(opts.numBadge){ const b=document.createElement('span'); b.className='topbar-num-badge'; b.textContent=opts.numBadge; bar.appendChild(b); }
  return bar;
}

  // "กำลังโหลดข้อมูลร้าน..." ตอน cold-load (ซึ่งก็ไม่มี heading เหมือนกัน) เพิ่ม H1 ที่นี่จุดเดียวแก้ทั้งคู่ —
  // ซ่อนด้วยตา (.sr-only) เพราะมีโลโก้+ข้อความเห็นด้วยตาอยู่แล้ว ไม่ต้องการให้ซ้ำซ้อนกับผู้ใช้ทั่วไป แค่ให้ screen

}

      const avatarLabel = s.avatarUrl ? `ซูมดูรูป ${s.name}` : `เพิ่มรูปโปรไฟล์ให้ ${s.name}`;

        </div>
        <div class="staff-pick" data-name="${s.name}" style="display:flex; align-items:center; flex:1; cursor:pointer;" role="button" tabindex="0">
          <p style="margin:0; font-size:15px; font-weight:600; flex:1;">${s.name}</p>
          <span style="font-size:17px;">${emojis[i % emojis.length]}</span>
        </div>
      </div>`;
    }).join('')}
  `;
  app.appendChild(c);

  const avatarInput = document.createElement('input');
  avatarInput.type = 'file'; avatarInput.accept = 'image/*'; // ไม่ตั้ง capture — ให้เลือกได้ทั้งถ่ายรูปใหม่หรือเลือกจากคลังภาพ

    avatarInput.value = '';
    if(!file || !staffId) return;
    const targetEl = c.querySelector(`.avatar-pick[data-staff-id="${staffId}"]`);
    try{
      const photo = await compressImage(file, 500, 0.7);
      const { avatarUrl } = await apiPost('saveStaffAvatar', { staffId, photo });
      const s = STAFF.find(x=>x.id===staffId);
      if(s) s.avatarUrl = avatarUrl;
      // ระหว่างอัปโหลดหน้านี้อาจถูกวาดใหม่ (ข้อมูลร้าน/พนักงานจากเครื่องถูกแทนด้วยของจริงเบื้องหลัง) — targetEl เดิมจะหลุด
      // ออกจากจอไปแล้ว อัปเดตตัวที่อยู่บนจอจริงตอนนี้ด้วย
      const shownEl = document.querySelector(`#app .avatar-pick[data-staff-id="${staffId}"]`) || targetEl;
      if(shownEl) shownEl.innerHTML = `<img src="${avatarUrl}" alt="">`;
    }catch(err){ alert('บันทึกรูปไม่สำเร็จ: ' + friendlyErrorMessage(err)); }
  };

  // ส่วนป้ายกล้องเล็กๆ มุมขวาล่างแยกไว้เป็นปุ่ม "เปลี่ยนรูป" โดยเฉพาะ ไม่ปนกับการซูมอีกต่อไป
  function openAvatarLightbox(url, name){
    const lb = document.createElement('div'); lb.className = 'avatar-lightbox';

    document.body.appendChild(lb);
    const restoreFocus = setupDialogFocus(lb, lb, ()=>close());
    function close(){ lb.remove(); restoreFocus(); }
    lb.onclick = close;
    lb.querySelector('.lb-close').onclick = (e)=>{ e.stopPropagation(); close(); };
  }
  c.querySelectorAll('.avatar-pick').forEach(avatar=>{
    bindActivatable(avatar, (e)=>{
      e.stopPropagation();
      const staffId = avatar.dataset.staffId;
      const s = STAFF.find(x=>x.id===staffId);
      if(s && s.avatarUrl) openAvatarLightbox(s.avatarUrl, s.name);
      else{ avatarTargetId = staffId; avatarInput.click(); } // ยังไม่มีรูป — ไม่มีอะไรให้ซูม เปิดตัวเลือกรูปแทนเลย
    });
  });
  c.querySelectorAll('.avatar-edit-badge').forEach(badge=>{
    bindActivatable(badge, (e)=>{
      e.stopPropagation();
      avatarTargetId = badge.closest('.avatar-wrap').querySelector('.avatar-pick').dataset.staffId;
      avatarInput.click();
    });
  });
  c.querySelectorAll('.staff-pick').forEach(el=> bindActivatable(el, ()=>go('supplierList', {staffName: el.dataset.name})));
}

function renderBillCapture(app){
  const sup = SUPPLIERS.find(s=>s.id===state.billSupplierId);
  app.appendChild(topbar('ถ่ายรูปบิล', {back:()=>go('billSupplier'), meta: sup.name}));
  const c = document.createElement('div'); c.className='content';
  c.innerHTML = `
    <p class="capture-hint">ถ่ายรูปใบส่งของ/ใบวางบิลจาก <b>${sup.name}</b> ให้เห็นชัดทุกรายการ ถ่ายได้หลายรูปถ้าบิลมีหลายหน้า</p>
    <label class="batch-toggle">
      <input type="checkbox" id="batchToggle">
      <span>
        <p class="bt-title"><i class="ti ti-sparkles" aria-hidden="true"></i> โหมดหลายบิลรวมกัน <span class="bt-new">ใหม่</span></p>
        <p class="bt-body">เปิดไว้ถ้ารูปที่ถ่ายเป็น<b>บิลคนละใบ/คนละวัน</b> (เช่น ซัพพลายเออร์เอาบิลตกหล่นมาพร้อมบิลวันนี้) — AI จะแยกเอกสารให้เอง แล้วให้ตรวจก่อนส่งทุกใบ</p>
      </span>
    </label>
    <div class="bill-photo-strip" id="photoStrip"></div>
    <div class="capture-zone">
      <i class="ti ti-camera" aria-hidden="true"></i>
      <p id="captureLabel" role="status" aria-live="polite">ยังไม่มีรูปบิล</p>
      <div class="bill-pick-row">
        <button class="btn" id="pickCamera"><i class="ti ti-camera" style="font-size:15px; vertical-align:-2px; margin-right:5px;" aria-hidden="true"></i>ถ่ายรูป</button>
        <button class="btn" id="pickGallery"><i class="ti ti-photo-plus" style="font-size:15px; vertical-align:-2px; margin-right:5px;" aria-hidden="true"></i>เลือกจากคลังภาพ</button>
      </div>
    </div>
    <button class="btn btn-primary btn-block" id="analyzeBtn" disabled>วิเคราะห์บิลด้วย AI</button>
  `;
  app.appendChild(c);
  const batchToggle = c.querySelector('#batchToggle');

  // 2 input แยกกัน — กดปุ่มไหนเปิดตัวเลือกนั้นตรงๆ ทันที ไม่ต้องผ่านเมนูเลือก "กล้อง/คลังภาพ" กลางของเบราว์เซอร์อีกที
  const cameraInput = document.createElement('input');
  cameraInput.type = 'file'; cameraInput.accept = 'image/*';
  cameraInput.setAttribute('capture', 'environment'); // ต้องใช้ setAttribute ไม่ใช่ property assignment ถึงจะบังคับเปิดกล้องตรงได้ชัวร์ทุกเบราว์เซอร์
  cameraInput.style.display = 'none';
  c.appendChild(cameraInput);

  const galleryInput = document.createElement('input');
  galleryInput.type = 'file'; galleryInput.accept = 'image/*'; galleryInput.multiple = true; // ไม่ตั้ง capture — เปิดคลังภาพตรงๆ เลือกได้หลายรูป
  galleryInput.style.display = 'none';
  c.appendChild(galleryInput);

  const pickCameraBtn = c.querySelector('#pickCamera');
  const pickGalleryBtn = c.querySelector('#pickGallery');
  pickCameraBtn.onclick = ()=> cameraInput.click();
  pickGalleryBtn.onclick = ()=> galleryInput.click();

  function drawPhotos(){
    const strip = c.querySelector('#photoStrip');
    strip.innerHTML = state.billPhotos.map((url,i)=>`
      <div class="bill-photo-chip"><img src="${url}" alt="รูปบิลที่ถ่ายไว้ หน้าที่ ${i+1} จาก ${state.billPhotos.length}"><button class="rm" data-i="${i}" aria-label="ลบรูปบิลที่ ${i+1}">✕</button></div>`).join('');
    strip.querySelectorAll('.rm').forEach(b=> b.onclick = ()=>{ state.billPhotos.splice(+b.dataset.i,1); drawPhotos(); });
    c.querySelector('#captureLabel').textContent = state.billPhotos.length ? `เลือกไว้ ${state.billPhotos.length} รูป` : 'ยังไม่มีรูปบิล';
    syncAnalyzeBtn();
  }
  // โหมดหลายบิลรวมกันต้องมีอย่างน้อย 2 รูปถึงจะมีอะไรให้ AI แยก — สลับข้อความ/ปลายทางของปุ่มตาม toggle
  function syncAnalyzeBtn(){
    const btn = c.querySelector('#analyzeBtn');
    const isBatch = batchToggle.checked;
    if(isBatch){
      btn.innerHTML = `<i class="ti ti-sparkles" aria-hidden="true"></i> แยกบิลด้วย AI (${state.billPhotos.length} รูป)`;
      btn.disabled = state.billPhotos.length < 2;
    } else {
      btn.textContent = 'วิเคราะห์บิลด้วย AI';
      btn.disabled = state.billPhotos.length === 0;
    }
  }
  batchToggle.onchange = syncAnalyzeBtn;
  drawPhotos();

  // Perf fix (27 ก.ย. 69, จาก Performance Audit): เดิมเลือกหลายรูปพร้อมกันแล้วไม่มีสัญญาณอะไรขึ้นบนจอเลย
  // ระหว่างที่ compressImage() ทำงานทีละไฟล์ (แต่ละไฟล์ ~0.5-1+ วิบนมือถือจริง) — วัดจริง 4 รูปใช้เวลารวม
  // 1.7 วิ แต่ไม่มีอะไรขึ้นบนจอเลยถึง 71% ของเวลานั้น ทำให้เข้าใจผิดว่ากดไม่ติดแล้วกดซ้ำได้ — เพิ่มข้อความ
  // "กำลังประมวลผลรูป X/N..." + ปิดปุ่มเลือกรูปชั่วคราวระหว่างบีบอัด
  async function onPicked(input){
    const files = [...input.files]; input.value = '';
    if(!files.length) return;
    const labelEl = c.querySelector('#captureLabel');
    pickCameraBtn.disabled = true; pickGalleryBtn.disabled = true;
    for(let i=0; i<files.length; i++){
      labelEl.textContent = files.length > 1 ? `กำลังประมวลผลรูป ${i+1}/${files.length}...` : 'กำลังประมวลผลรูป...';
      try{ state.billPhotos.push(await compressImage(files[i], 1600, 0.8)); }catch(e){}
    }
    pickCameraBtn.disabled = false; pickGalleryBtn.disabled = false;
    drawPhotos();
  }
  cameraInput.onchange = ()=> onPicked(cameraInput);
  galleryInput.onchange = ()=> onPicked(galleryInput);

  c.querySelector('#analyzeBtn').onclick = ()=> go(batchToggle.checked ? 'billBatchAnalyzing' : 'billAnalyzing');
}

/* ---- 4) กำลังวิเคราะห์ด้วย AI ---- */
function renderBillAnalyzing(app){
  const sup = SUPPLIERS.find(s=>s.id===state.billSupplierId);
  app.appendChild(topbar('กำลังวิเคราะห์', {}));
  const c = document.createElement('div'); c.className='content';
  c.innerHTML = `<div class="analyzing-wrap">
      <div class="spin-ring"></div>
      <h2>กำลังอ่านบิล...</h2>
      <p id="analyzeMsg">กำลังแยกรายการ จำนวน และราคาจากรูปที่ถ่ายไว้ อาจใช้เวลาสักครู่</p>
    </div>`;
  app.appendChild(c);

  // timeout ต่อครั้งยาวกว่าปกติเพราะ AI อ่านรูปช้ากว่า action ทั่วไป เดิมตั้ง 60 วิ แล้วขยับเป็น 90 วิ
  // (เจอ 59.9 วิใน Executions log) แล้วขยับเป็น 150 วิ (เจอ 88.454/113.475 วิ) แล้วขยับเป็น 270 วิ (4.5 นาที
  // — เจอ callGemini() ต้อง retry เองตอน Gemini 503 ทำให้ doPost กินเวลาถึง 2 เท่าของปกติในกรณีแย่สุด)
  //
  // อัปเดต 7 ก.ย. 69: เดิมตรงนี้ปิด auto-retry ไว้ตั้งใจ (ให้คนกด "ลองใหม่" เอง) แต่พบจริงว่าคำขอที่ยาว
  // 40-70+ วิแบบนี้ทำให้การเชื่อมต่อฝั่งเว็บหลุดเป็นระยะ ("Load failed" — ยืนยันจาก Executions log ว่า
  // backend สำเร็จทุกครั้งไม่มีข้อยกเว้น ไม่ใช่ AbortError ของเราเองด้วยเพราะยังไม่ทันถึง 270 วิ) ผู้ใช้ต้อง
  // กด "ลองใหม่" เองซ้ำๆ จนหงุดหงิด — เปลี่ยนมาใช้ apiPostSilentRetry() แทน (ดูคอมเมนต์เต็มที่นิยามฟังก์ชัน
  // ด้านบน) ปลอดภัยเพราะ analyzeBillPhoto ไม่เขียนอะไรลงชีตเลย ยิงซ้ำได้ไม่จำกัดโดยไม่เสี่ยงข้อมูลซ้ำ
  // E2E-003: ผู้ใช้กดย้อนกลับออกจากหน้านี้ระหว่างรอ AI — เดิมพอผลกลับมาก็ go('billReview') ทับหน้าที่ผู้ใช้อยู่
  // (ถ้าย้อนไปถึงหน้าเลือกซัพพลายเออร์ billSupplierId เป็น null แล้ว หน้าตรวจพังเป็นจอว่าง) ตอนนี้ทิ้งผลเงียบๆ แทน —
  // ผลยังถูกจำไว้ใน analyzeBillPhotoShared ถ้ากลับมากดวิเคราะห์รูปชุดเดิมจะได้ทันที
  const isCurrent = renderToken();
  analyzeBillPhotoShared(state.billSupplierId, state.billPhotos, (attempt, max)=>{
    const msgEl = c.querySelector('#analyzeMsg');
    if(msgEl) msgEl.textContent = attempt===1
      ? 'กำลังแยกรายการ จำนวน และราคาจากรูปที่ถ่ายไว้ อาจใช้เวลาสักครู่'
      : `การเชื่อมต่อหลุดระหว่างรอ กำลังลองใหม่ (${attempt}/${max})...`;
  })
    .then(res=>{
      if(!isCurrent()) return;
      const items = (res.items||[]).map((it,i)=>({
        _id: 'it'+i, billText: it.billText, unit: it.unit, qty: it.qty,
        receivedQty: it.qty, // ค่าเริ่มต้น = ตามบิล — AI อ่านได้แค่ตัวเลขบนบิล ส่วน "รับจริง" ให้คนถ่ายแก้เองถ้านับไม่ตรง
        unitPrice: it.unitPrice,
        likelyNonProduct: !!it.likelyNonProduct, skip: !!it.likelyNonProduct,
        productId: it.productId || null, factor: it.conversionFactor || null,
        matchType: it.matchType || null, // 'exact' | 'fuzzy' | null (จาก Code.gs analyzeBillPhoto)
        matchedAliasText: it.matchedAliasText || null, // ข้อความเดิมที่ทำให้เกิด fuzzy match (โชว์เป็นคำอธิบาย)
        confirmed: it.matchType === 'exact', // fuzzy ต้องกดยืนยันเองเสมอ ไม่นับว่าจับคู่แล้วจนกว่าจะกด
      }));
      if(!items.length){
        clearAnalyzeCache(); // ผลว่างไม่ควรถูกจำไว้ — กด "ลองใหม่" ต้องให้ AI อ่านใหม่จริง
        throw new Error('อ่านรายการจากบิลไม่ได้เลย ลองถ่ายรูปให้ชัดขึ้นอีกครั้ง');
      }
      // null สำหรับบิลเขียนมือที่ไม่มีเลขที่บิล/VAT — renderBillReview จะไม่โชว์การ์ดหัวบิลเลยในกรณีนั้น
      go('billReview', {billItems: items, billHeader: res.billHeader || null, billSupplierMismatchWarning: res.supplierMismatchWarning || null, billDuplicateWarning: res.duplicateBillWarning || null, billMode:'staff', billSubmitIdemKey: genIdemKey()}, {replace:true});
    })
    .catch(err=>{
      if(!isCurrent()) return; // ออกจากหน้านี้ไปแล้ว ไม่ต้องโชว์ error ทับหน้าอื่น
      // E2E fix (1 ต.ค. 69, E2E-009): เดิมโชว์ err.message ดิบ + กล่อง stack trace (โค้ด debug ชั่วคราวตั้งแต่ 7 ก.ย. 69
      // ที่ไม่เคยถูกถอดออก) ให้พนักงานเห็นตรงๆ — ใช้ friendlyErrorMessage() ตัวเดียวกับที่แก้ UX-001 ไปแล้ว 18 จุดแทน
      // ข้อความ [QUOTA] ยังใช้ข้อความเฉพาะของ friendlyBillError เหมือนเดิม และ error จริงยังถูก console.error ไว้ไล่บั๊กได้
      const fe = friendlyBillError(err);
      const detail = fe.title ? fe.detail : friendlyErrorMessage(err);
      c.querySelector('.analyzing-wrap').innerHTML = `
        <p style="color:var(--danger); font-weight:600; margin-bottom:6px;">${fe.title || 'อ่านบิลไม่สำเร็จ'}</p>
        <p style="margin-bottom:16px;">${escapeHtml(detail)}</p>
        <button class="btn btn-primary" id="retryAnalyze">ลองใหม่</button>
        <button class="btn-text-cancel" id="backCapture">กลับไปถ่ายรูปใหม่</button>
      `;
      c.querySelector('#retryAnalyze').onclick = ()=> render();
      c.querySelector('#backCapture').onclick = ()=> go('billCapture');
    });
}

/* ---- 4b) กำลังแยกหลายบิล (โหมดใหม่ 7 ก.ย. 69 — ดู analyzeBillBatch ใน Code.gs) ---- */
// อัปเดต 7 ก.ย. 69: เดิมยิงคำขอเดียวให้ Gemini ทั้งแยกกลุ่ม+อ่านรายการทุกบิลพร้อมกัน พบจริงใน Executions
// log ว่ากินเวลาถึง ~104 วิ (เทียบ analyzeBillPhoto บิลเดี่ยวที่ 45-49 วิผ่านทุกครั้ง) ทำให้เจอ "Load
// failed" ซ้ำๆ ทุกรอบที่ทดสอบจริง (การเชื่อมต่อทนคำขอยาวขนาดนั้นไม่ไหว) — แก้เป็น 2 ขั้นตอน: (1)
// analyzeBillBatch เร็วๆ แค่แยกกลุ่มรูปอย่างเดียว (2) วน analyzeBillPhoto ตัวเดิมที่พิสูจน์แล้วว่าไหว
// ทีละกลุ่ม เป็นคำขอสั้นๆ หลายครั้งแทนคำขอยาวครั้งเดียว
function renderBillBatchAnalyzing(app){
  app.appendChild(topbar('กำลังแยกเอกสาร', {}));
  const c = document.createElement('div'); c.className='content';
  c.innerHTML = `<div class="analyzing-wrap">
      <div class="spin-ring"></div>
      <h2 id="analyzeStage">กำลังตรวจสอบขอบเขตบิล...</h2>
      <p id="analyzeMsg">แยกว่ารูปไหนเป็นบิลใบเดียวกันก่อน อาจใช้เวลาสักครู่</p>
    </div>`;
  app.appendChild(c);

  // E2E-003: ผู้ใช้ออกจากหน้านี้ระหว่างรอ → หยุดอ่านบิลกลุ่มถัดไป (ประหยัดโควต้า Gemini) และไม่ go() ทับหน้าปัจจุบัน
  const isCurrent = renderToken();
  function showError(err){
    if(!isCurrent()) return;
    // E2E-009: ไม่โชว์ error ดิบ + stack trace อีกต่อไป (ดูคอมเมนต์เดียวกันใน renderBillAnalyzing)
    const fe = friendlyBillError(err);
    const detail = fe.title ? fe.detail : friendlyErrorMessage(err);
    c.querySelector('.analyzing-wrap').innerHTML = `
      <p style="color:var(--danger); font-weight:600; margin-bottom:6px;">${fe.title || 'แยกบิลไม่สำเร็จ'}</p>
      <p style="margin-bottom:16px;">${escapeHtml(detail)}</p>
      <button class="btn btn-primary" id="retryAnalyze">ลองใหม่</button>
      <button class="btn-text-cancel" id="backCapture">กลับไปถ่ายรูปใหม่</button>
    `;
    c.querySelector('#retryAnalyze').onclick = ()=> render();
    c.querySelector('#backCapture').onclick = ()=> go('billCapture');
  }

  (async ()=>{
    try{
      // ขั้น 1: แยกกลุ่มรูปอย่างเดียว (เร็ว ไม่อ่านรายการสินค้าเลย) — ใช้ apiPostSilentRetry() แทน apiPost()
      // ตรงๆ (7 ก.ย. 69) เพราะแม้แต่คำขอสั้นๆ ก็ยังมีโอกาสเจอการเชื่อมต่อหลุดได้ ปลอดภัยเพราะ analyzeBillBatch
      // ไม่เขียนอะไรลงชีตเลย (ดูคอมเมนต์เต็มที่นิยาม apiPostSilentRetry ด้านบน)
      const groupsRes = await apiPostSilentRetry('analyzeBillBatch', { supplierId: state.billSupplierId, photos: state.billPhotos }, 270000, 3, (attempt, max)=>{
        const stageEl = c.querySelector('#analyzeStage'), msgEl = c.querySelector('#analyzeMsg');
        if(attempt>1 && msgEl) msgEl.textContent = `การเชื่อมต่อหลุดระหว่างรอ กำลังลองใหม่ (${attempt}/${max})...`;
        else if(msgEl) msgEl.textContent = 'แยกว่ารูปไหนเป็นบิลใบเดียวกันก่อน อาจใช้เวลาสักครู่';
      }, BILL_API_URL);
      if(!isCurrent()) return;
      const rawGroups = groupsRes.groups || [];
      if(!rawGroups.length){ throw new Error('แยกกลุ่มบิลไม่สำเร็จ ลองถ่ายรูปให้ชัดขึ้นอีกครั้ง'); }

      // ขั้น 2: อ่านรายการสินค้าทีละกลุ่มด้วย analyzeBillPhoto ตัวเดิมที่ใช้งานจริงทุกวัน (เร็ว/นิ่งกว่ามาก
      // เพราะแต่ละคำขอมีแค่รูปของบิลใบเดียว) — วนทีละกลุ่มจริงตามลำดับ ไม่ยิงพร้อมกันหลายคำขอ
      const groups = [];
      for(let gi=0; gi<rawGroups.length; gi++){
        const photoIndices = rawGroups[gi].photoIndices || [];
        const stageEl = c.querySelector('#analyzeStage'), msgEl = c.querySelector('#analyzeMsg');
        if(stageEl) stageEl.textContent = `กำลังอ่านบิลที่ ${gi+1}/${rawGroups.length}...`;
        if(msgEl) msgEl.textContent = 'กำลังแยกรายการ จำนวน และราคาของบิลใบนี้ อาจใช้เวลาสักครู่';
        const photos = photoIndices.map(i=> state.billPhotos[i]);
        const res = await analyzeBillPhotoShared(state.billSupplierId, photos, (attempt, max)=>{
          if(attempt>1 && msgEl) msgEl.textContent = `การเชื่อมต่อหลุดระหว่างรอ กำลังลองใหม่บิลที่ ${gi+1} (${attempt}/${max})...`;
        });
        if(!isCurrent()) return;
        groups.push({
          photoIndices,
          items: (res.items||[]).map((it,i)=>({
            _id: 'g'+gi+'it'+i, billText: it.billText, unit: it.unit, qty: it.qty,
            receivedQty: it.qty,
            unitPrice: it.unitPrice,
            likelyNonProduct: !!it.likelyNonProduct, skip: !!it.likelyNonProduct,
            productId: it.productId || null, factor: it.conversionFactor || null,
            matchType: it.matchType || null, matchedAliasText: it.matchedAliasText || null,
            confirmed: it.matchType === 'exact',
          })),
          billHeader: res.billHeader || null,
          supplierMismatchWarning: res.supplierMismatchWarning || null,
          duplicateBillWarning: res.duplicateBillWarning || null,
          reviewed: false, submitted: false, idemKey: genIdemKey(),
        });
      }
      go('billBatchReview', {billBatchGroups: groups}, {replace:true});
    }catch(err){
      showError(err);
    }
  })();
}

/* ---- 5) ตรวจสอบ/จับคู่รายการ ---- */
// ใช้ 2 โหมด (state.billMode):
// - 'staff': ลูกจ้างถ่ายบิลใหม่ — กด "บันทึกรายการนี้" ได้เสมอไม่ว่าจับคู่ครบหรือยัง ไม่มีทางเขียน
//   PurchaseReceipts เองได้เลย (เรียก submitBillForReview ไปเข้าคิว PendingBillReceipts เท่านั้น)
// - 'owner-resume': เจ้าของเปิดบิลค้างจากหน้า "บิลรอตรวจสอบ" มาทำต่อ — ต้องจับคู่ครบก่อนถึงจะกด
//   "บันทึกต้นทุน" ได้ (เรียก finalizePurchaseReceipt เขียนลง PurchaseReceipts จริง)
function renderBillReview(app){
  const isResume = state.billMode === 'owner-resume';
  // E2E-001 (อีกทางหนึ่ง): กดปุ่ม back ของเครื่อง/เบราว์เซอร์จากหน้า "บันทึกต้นทุนเรียบร้อย" ย้อนกลับมาหน้านี้ได้ —
  // state.billItems ยังอยู่ครบ ปุ่ม "บันทึกต้นทุน" กดได้อีกรอบ = เขียน PurchaseReceipts ซ้ำ ถ้าบิลนี้ถูกบันทึก/ทิ้ง
  // ไปแล้วจากเครื่องนี้ ให้บอกชัดๆ แทนการเปิดฟอร์มให้บันทึกซ้ำ
  if(isResume && _closedPendingBatchIds.has(state.billResumeBatchId)){
    app.appendChild(topbar('ตรวจสอบรายการ', {back: ()=> go('billPendingList')}));
    const done = document.createElement('div'); done.className = 'content';
    done.innerHTML = `<p class="empty-state">บิลนี้บันทึกหรือทิ้งไปแล้ว ไม่ต้องทำซ้ำ</p>
      <button class="btn btn-primary btn-block" id="toPendingBtn">กลับไปหน้าบิลรอตรวจสอบ</button>`;
    app.appendChild(done);
    done.querySelector('#toPendingBtn').onclick = ()=> go('billPendingList');
    return;
  }
  const sup = SUPPLIERS.find(s=>s.id===state.billSupplierId);
  const products = PRODUCTS.filter(p=>p.supplierId===sup.id);
  // ออโต้เซฟความคืบหน้าไว้ในเครื่อง (localStorage) เฉพาะโหมดเจ้าของตรวจบิลค้าง — เจอจริงว่าบิลใหญ่บางเจ้า
  // (เช่นลุงทวี 20-30+ รายการ) กว่าจะจับคู่+ตั้งอัตราแปลงหน่วยครบทุกรายการใช้เวลานาน ถ้าปัดนิ้ว/กดออกจากหน้า
  // นี้โดยไม่ตั้งใจก่อนกด "บันทึกต้นทุน" (ซึ่งเป็นจุดเดียวที่เขียนข้อมูลไปเซิร์ฟเวอร์จริง) งานที่ทำมาทั้งหมดจะ
  // หายหมดต้องเริ่มจับคู่ใหม่ทุกรายการ — คีย์ด้วย batchId (มีเฉพาะโหมด owner-resume เท่านั้น เพราะ
  // batchId ถูกสร้างตอน submitBillForReview ไปแล้วก่อนหน้านี้) ไม่ทำกับโหมด staff (ถ่ายบิลใหม่) เพราะยังไม่มี
  // batchId ให้คีย์ และไม่ทำกับโหมดหลายบิล (renderBillBatchItemReview) เพราะยังไม่เคยมีรายงานปัญหานี้ที่นั่น
  const draftKey = isResume && state.billResumeBatchId ? ('billDraft_' + state.billResumeBatchId) : null;
  if(draftKey){
    try{
      const raw = localStorage.getItem(draftKey);
      if(raw){
        const draft = JSON.parse(raw);
        // เช็คจำนวนรายการให้ตรงกับของจริงจากเซิร์ฟเวอร์ก่อนใช้ — กันกรณี ItemsJSON ต้นทางเปลี่ยนไปแล้ว
        // (เช่น ถูกแก้จากที่อื่น) แล้ว draft เก่าจะเข้ากันไม่ได้ ถ้าจำนวนไม่ตรงทิ้ง draft ไปใช้ของจริงแทน
        if(Array.isArray(draft) && draft.length === state.billItems.length) state.billItems = draft;
        else localStorage.removeItem(draftKey);
      }
    }catch(e){ try{ localStorage.removeItem(draftKey); }catch(e2){} }
  }
  // [เพิ่ม 18 ก.ย. 69] โหมดลูกจ้าง (ถ่ายบิลใหม่) ยังไม่มี batchId ให้คีย์แบบ owner-resume (สร้างตอน
  // submitBillForReview เท่านั้น) — ใช้คีย์คงที่ช่องเดียว (พนักงานถ่ายบิลทีละใบตามการใช้งานจริง) เก็บ state
  // ทั้งชุดรวม billSubmitIdemKey เอง (ต่างจาก owner-resume ที่เก็บแค่ billItems เพราะข้อมูลอื่นๆ อยู่บนเซิร์ฟเวอร์
  // แล้ว) เพราะบิลนี้ยังไม่เคยถูกส่งขึ้นเซิร์ฟเวอร์เลย — เจอจริง 18 ก.ย. 69: พนักงานเจอ submitBillForReview ค้าง
  // ปิด/รีเฟรชแอปแล้วถ่ายบิลใบเดิมใหม่จากศูนย์ ได้ idempotencyKey คนละตัว (เพราะ genIdemKey() สร้างใหม่ทุกครั้ง
  // ที่ analyzeBillPhoto สำเร็จ ไม่ใช่ตอนกดส่ง) ทำให้เกิดแถวซ้ำจริงใน PendingBillReceipts (เลขที่บิลตรงกันเป๊ะ)
  // — จุดอ่าน/เสนอกู้คืน draft นี้อยู่ที่ renderBillStaff (หน้าแรกของฝั่งลูกจ้างถ่ายบิล) backend มี
  // checkDuplicateBill() เป็นชั้นป้องกันที่ 2 อยู่แล้วสำหรับบิลที่มีเลขที่บิล — draft นี้ช่วยเคสบิลเขียนมือที่
  // ไม่มีเลขที่บิลให้เทียบด้วย และลดงานที่ต้องจับคู่ใหม่ทั้งหมด
  const STAFF_DRAFT_KEY = 'samurai_staff_bill_draft_v1';
  const isStaffDraftable = state.billMode === 'staff';
  function saveDraft(){
    if(draftKey){ try{ setItemDraftFirst(draftKey, JSON.stringify(state.billItems)); }catch(e){} }
    if(isStaffDraftable){
      try{
        const payload = JSON.stringify({
          supplierId: state.billSupplierId, staffName: state.billStaffName, photos: state.billPhotos,
          items: state.billItems, billHeader: state.billHeader,
          supplierMismatchWarning: state.billSupplierMismatchWarning || null,
          duplicateBillWarning: state.billDuplicateWarning || null,
          idemKey: state.billSubmitIdemKey, savedAt: Date.now()
        });
        // กันเผื่อรูปเยอะ/ใหญ่จนเกือบเต็มโควต้า localStorage ของ origin (~5MB บน iOS Safari) — ข้ามเงียบๆ
        // ถ้าใหญ่เกินไป ไม่ error (เพดานเดียวกับแคชอื่นในไฟล์นี้)
        if(payload.length < 4 * 1024 * 1024) setItemDraftFirst(STAFF_DRAFT_KEY, payload);
      }catch(e){}
    }
  }
  let draftCleared = false; // กัน saveDraftSoon ที่ค้างคิวอยู่เขียน draft กลับมาหลังส่ง/บันทึกสำเร็จไปแล้ว
  // หน่วง 400ms ระหว่างพิมพ์ (ไม่ stringify รูปบิลหลาย MB ทุกตัวอักษร) แต่ถ้าแอปถูกปิด/สลับไปแอปอื่น/รีเฟรชก่อนครบ
  // 400ms ให้เซฟทันทีผ่าน _draftFlushHook (ดู listener pagehide/visibilitychange ระดับไฟล์) — ไม่งั้นแก้หัวบิลแล้ว
  // ปิดแอปทันทีก็ยังหายเหมือนเดิม
  let draftTimer = null;
  function flushDraftSoon(){
    clearTimeout(draftTimer); draftTimer = null;
    if(_draftFlushHook === flushDraftSoon) _draftFlushHook = null;
    if(!draftCleared) saveDraft();
  }
  function saveDraftSoon(){
    clearTimeout(draftTimer);
    draftTimer = setTimeout(flushDraftSoon, 400);
    _draftFlushHook = flushDraftSoon;
  }
  function clearDraft(){
    draftCleared = true;
    if(draftKey){ try{ localStorage.removeItem(draftKey); }catch(e){} }
    if(isStaffDraftable){ try{ localStorage.removeItem(STAFF_DRAFT_KEY); }catch(e){} }
  }
  app.appendChild(topbar('ตรวจสอบรายการ', {
    back: ()=> isResume ? go('billPendingList') : go('billCapture'),
    meta: sup.name
  }));
  const c = document.createElement('div'); c.className='content';
  c.innerHTML = `
    ${state.billSupplierMismatchWarning ? `
    <div class="supplier-mismatch-warning" role="status" aria-live="polite">
      <i class="ti ti-alert-triangle icon" aria-hidden="true"></i>
      <div style="flex:1; min-width:0;">
        <p class="smw-title">บิลนี้อาจไม่ใช่ของ ${sup.name}</p>
        <p class="smw-body">${state.billSupplierMismatchWarning}</p>
        <button class="btn" id="wrongSupplierBtn">เลือกซัพพลายเออร์ใหม่</button>
      </div>
    </div>` : ''}
    ${state.billDuplicateWarning ? `
    <div class="duplicate-bill-warning" role="status" aria-live="polite">
      <i class="ti ti-copy icon" aria-hidden="true"></i>
      <div style="flex:1; min-width:0;">
        <p class="dbw-title">บิลนี้อาจซ้ำกับที่บันทึกไปแล้ว</p>
        <p class="dbw-body">${state.billDuplicateWarning.matchType==='billNumber'
          ? `เลขที่บิล <b>${state.billDuplicateWarning.billNumber}</b> ตรงกับบิลที่บันทึกไว้ก่อนหน้านี้`
          : `ไม่มีเลขที่บิลให้เทียบ แต่รายการสินค้าตรงกับบิลก่อนหน้านี้ถึง <b>${Math.round(state.billDuplicateWarning.overlapRatio*100)}%</b>`}</p>
        <div class="dbw-meta">
          <span class="dbw-pill ${state.billDuplicateWarning.status==='finalized'?'finalized':'pending'}">${state.billDuplicateWarning.status==='finalized'?'บันทึกแล้ว':'รอตรวจสอบ'}</span>
          <span style="font-size:11px; color:var(--text-secondary);">${state.billDuplicateWarning.date||''}</span>
        </div>
        ${state.billDuplicateWarning.photoUrl ? `<button class="btn" id="viewDupePhoto">ดูรูปบิลเดิม</button>` : ''}
      </div>
    </div>` : ''}
    <div class="review-bill-strip">
      ${state.billPhotos[0] ? `<img class="rb-thumb" src="${state.billPhotos[0]}" alt="">` : ''}
      <div class="rb-txt">อ่านได้ <b>${state.billItems.length} รายการ</b> จากรูปบิล ${state.billPhotos.length} ใบ ${isResume ? '· ถ่ายโดย '+state.billStaffName : ''}<br><i class="ti ti-folder" aria-hidden="true"></i> เก็บไว้ในโฟลเดอร์ Drive ของ ${sup.name} อัตโนมัติ</div>
      <button class="btn" id="viewPhoto">ดูรูป</button>
    </div>
    <div id="billHeaderSlot"></div>
    <div id="itemList"></div>
    <div class="review-footer">
      <div class="rf-summary"><span id="rfPending" class="rf-left"></span><span>รวม <b class="rf-total" id="rfTotal">฿0</b></span></div>
      ${isResume
        ? `<button class="btn btn-primary btn-block" id="saveBtn" disabled>บันทึกต้นทุน</button>
           <button class="btn-text-cancel" id="discardBtn" style="color:var(--danger);">ทิ้งบิลนี้ (ไม่บันทึก)</button>`
        : `<button class="btn btn-primary btn-block" id="submitBtn">บันทึกรายการนี้</button>`}
    </div>
  `;
  app.appendChild(c);
  const wrongSupplierBtn = c.querySelector('#wrongSupplierBtn');
  // E2E fix (1 ต.ค. 69, E2E-007): เดิมพาไปเลือกซัพพลายเออร์ใหม่แล้วรูปบิลถูกล้างทิ้งหมด (ต้องถ่ายใหม่ทั้งชุด) และ
  // draft ของเจ้าที่ผิดยังค้างในเครื่องให้กด "ทำต่อ" ผิดเจ้าในครั้งหน้า — ตอนนี้ลบ draft เจ้าที่ผิดทิ้ง แล้วพารูปชุดเดิม
  // ไปหน้าถ่ายรูปของเจ้าที่เลือกใหม่ (ต้องให้ AI อ่านใหม่อยู่ดีเพราะการจับคู่สินค้าขึ้นกับซัพพลายเออร์)
  if(wrongSupplierBtn) wrongSupplierBtn.onclick = ()=>{ clearDraft(); go('billSupplier', {billKeepPhotos:true}); };
  const viewDupePhotoBtn = c.querySelector('#viewDupePhoto');
  if(viewDupePhotoBtn) viewDupePhotoBtn.onclick = ()=> openBillPhotoLightbox(state.billDuplicateWarning.photoUrl.split(','));
  c.querySelector('#viewPhoto').onclick = ()=> openBillPhotoLightbox(state.billPhotos);

  const listEl = c.querySelector('#itemList');

  // "จับคู่แล้ว" นับจริงเฉพาะที่ confirmed:true เท่านั้น — รายการที่ AI คาดว่าใช่ (matchType:'fuzzy')
  // ยังไม่นับว่าจับคู่จนกว่าจะมีคนกดยืนยันเอง กันเคส AI เดาผิดแล้วหลุดผ่านไปโดยไม่มีใครสังเกต
  function isResolved(it){ return it.skip || (it.productId && it.factor && it.confirmed); }
  function fmtMoney(n){ return '฿'+(n||0).toLocaleString('th-TH',{maximumFractionDigits:2}); }
  function unresolvedBillItems(){ return state.billItems.filter(it=> !isResolved(it)); }

  // บิลรายการเยอะ (ลุงทวี 50-60+ รายการ) แล้วเหลือรายการเดียวที่ยังไม่จับคู่ หาด้วยตาเปล่ายากมาก (เจอจริง
  // 11 ก.ย. 69) — ปุ่มนี้เลื่อน+ไฮไลต์ไปหารายการที่ยังไม่เสร็จให้อัตโนมัติ กดซ้ำวนไปรายการถัดไปเรื่อยๆ
  let jumpCursor = 0;
  function jumpToUnresolvedBillItem(){
    const unresolved = unresolvedBillItems();
    if(!unresolved.length) return;
    if(jumpCursor >= unresolved.length) jumpCursor = 0;
    const target = unresolved[jumpCursor];
    const el = c.querySelector('#card-' + target._id);
    if(el){
      el.scrollIntoView({behavior:'smooth', block:'center'});
      el.classList.remove('jump-highlight');
      void el.offsetWidth; // restart animation ได้แม้กดซ้ำที่รายการเดิม
      el.classList.add('jump-highlight');
      setTimeout(()=> el.classList.remove('jump-highlight'), 1450);
    }
    jumpCursor = (jumpCursor + 1) % unresolved.length;
    updateFooter();
  }

  // การ์ดหัวบิล (วันที่/เลขที่บิล/ยอดรวม/VAT) — ไม่ขึ้นเลยถ้า state.billHeader เป็น null (บิลเขียนมือ
  // ที่ไม่มีข้อมูลพวกนี้จริงๆ) ทุกช่องแก้ไขได้เพราะ AI อาจอ่านตัวเลข/ตัวหนังสือบนบิลผิดได้เหมือนรายการสินค้า
  // แยกส่วนแจ้งเตือน "ยอดไม่ตรง" ออกเป็น slot ย่อยของตัวเอง ไม่ innerHTML ทับทั้งการ์ดทุกครั้งที่พิมพ์
  // (ไม่งั้น input จะเสีย focus ทุกตัวอักษรที่พิมพ์ — เคยเจอบั๊กแบบนี้มาก่อนในจุดอื่นของแอป)
  const headerSlot = c.querySelector('#billHeaderSlot');
  function updateBillHeaderMismatch(){
    const h = state.billHeader;
    const slot = headerSlot.querySelector('#bhcMismatchSlot');
    if(!h || !slot) return;
    const itemsSum = state.billItems.filter(it=>!it.skip).reduce((s,it)=> s + (it.qty*it.unitPrice||0), 0);
    // เจอจริง 7 ก.ย. 69 (บิล PFP หลายใบ): บิลบางเจ้าพิมพ์ "ราคาต่อหน่วย" แบบรวม VAT ไว้แล้ว ทำให้ยอดรวม
    // รายการที่คำนวณเองไปตรงกับ "ยอดหลังแวต" แทนที่จะเป็น "ยอดก่อนแวต" — เดิมเทียบกับก่อนแวตอย่างเดียว
    // เลยเตือนหลอกทุกครั้งสำหรับบิลแบบนี้ทั้งที่ข้อมูลถูกต้องเป๊ะ เทียบกับทั้งสองแบบแทน ตรงอันใดอันหนึ่งถือว่าโอเค
    const matchesSubtotal = h.subtotal && Math.abs(itemsSum - h.subtotal) <= 1;
    const matchesTotal = h.total && Math.abs(itemsSum - h.total) <= 1;
    const mismatch = h.subtotal && !matchesSubtotal && !matchesTotal;
    slot.innerHTML = mismatch
      ? `<div class="bhc-mismatch"><i class="ti ti-alert-triangle" aria-hidden="true"></i> ยอดรวมสินค้าที่จับคู่ได้ (${fmtMoney(itemsSum)}) ไม่ตรงกับยอดบนบิลเลย (ทั้งก่อนแวต ${fmtMoney(h.subtotal)} และหลังแวต ${fmtMoney(h.total)}) — ลองเช็คว่ามีรายการตกหล่น/พิมพ์ยอดผิดไหม</div>`
      : '';
  }
  function renderBillHeaderCard(){
    const h = state.billHeader;
    if(!h){ headerSlot.innerHTML = ''; return; }
    headerSlot.innerHTML = `
      <div class="bill-header-card">
        <h2 class="bhc-label"><i class="ti ti-file-text" aria-hidden="true"></i> รายละเอียดบิล <span class="tag">อ่านจาก AI</span></h2>
        <div class="bhc-row">
          <div class="bhc-field"><label for="bhDateInput">วันที่บิล</label><input type="text" id="bhDateInput" class="bhDate" value="${h.billDate||''}"></div>
          <div class="bhc-field"><label for="bhNumberInput">เลขที่บิล</label><input type="text" id="bhNumberInput" class="bhNumber" value="${h.billNumber||''}"></div>
        </div>
        <div class="bhc-row">
          <div class="bhc-field"><label for="bhSubtotalInput">ยอดรวมสินค้า (฿)</label><input type="number" step="0.01" id="bhSubtotalInput" class="bhSubtotal" value="${h.subtotal||0}"></div>
          <div class="bhc-field"><label for="bhVatInput">ภาษีมูลค่าเพิ่ม (฿)</label><input type="number" step="0.01" id="bhVatInput" class="bhVat" value="${h.vat||0}"></div>
        </div>
        <div class="bhc-row" style="margin-bottom:0;">
          <div class="bhc-field total"><label for="bhTotalInput">ยอดรวมสุทธิตามบิล (฿)</label><input type="number" step="0.01" id="bhTotalInput" class="bhTotal" value="${h.total||0}"></div>
        </div>
        <div id="bhcMismatchSlot" role="status" aria-live="polite"></div>
      </div>`;
    // E2E fix (1 ต.ค. 69, E2E-008): เดิมช่องหัวบิลไม่เรียก saveDraft() เลย กด "ทำต่อ" draft แล้วเลขที่บิล/ยอดที่แก้เองหาย
    // ใช้ saveDraftSoon (หน่วง 400ms) ไม่ใช่ saveDraft ตรงๆ ทุกตัวอักษร เพราะ draft ฝั่งลูกจ้างรวมรูปบิล (หลาย MB)
    // stringify ทุกครั้งที่พิมพ์จะหน่วงการพิมพ์บนมือถือ
    headerSlot.querySelector('.bhDate').oninput = (e)=>{ h.billDate = e.target.value; saveDraftSoon(); };
    headerSlot.querySelector('.bhNumber').oninput = (e)=>{ h.billNumber = e.target.value; saveDraftSoon(); };
    headerSlot.querySelector('.bhSubtotal').oninput = (e)=>{ h.subtotal = Number(e.target.value)||0; updateBillHeaderMismatch(); saveDraftSoon(); };
    headerSlot.querySelector('.bhVat').oninput = (e)=>{ h.vat = Number(e.target.value)||0; saveDraftSoon(); };
    headerSlot.querySelector('.bhTotal').oninput = (e)=>{ h.total = Number(e.target.value)||0; saveDraftSoon(); };
    updateBillHeaderMismatch();
  }
  renderBillHeaderCard();

  function itemCard(it){
    const card = document.createElement('div');
    const pendingFuzzy = it.productId && !it.confirmed;
    card.className = 'item-card' + (it.skip ? ' is-skip' : (it.productId && it.confirmed) ? ' is-matched' : '');
    card.id = 'card-' + it._id;
    const total = (it.qty * it.unitPrice) || 0;
    const product = products.find(p=>p.id===it.productId);
    let pillHtml, bodyHtml = '';

    if(it.skip) pillHtml = `<span class="status-pill skip"><i class="ti ti-eye-off" aria-hidden="true"></i> ไม่ใช่สินค้า</span>`;
    else if(pendingFuzzy) pillHtml = `<span class="status-pill fuzzy"><i class="ti ti-sparkles" aria-hidden="true"></i> คล้ายรายการเดิม — ยืนยัน</span>`;
    else if(it.productId) pillHtml = `<span class="status-pill matched"><i class="ti ti-check" aria-hidden="true"></i> ${it.matchType==='exact' ? 'จับคู่อัตโนมัติ' : 'จับคู่แล้ว'}</span>`;
    else pillHtml = `<span class="status-pill unmatched"><i class="ti ti-alert-triangle" aria-hidden="true"></i> ต้องจับคู่</span>`;

    if(!it.skip){
      if(pendingFuzzy){
        // ข้อความบนบิลไม่ตรงกับที่เคยจำไว้เป๊ะ (แค่ "ใกล้เคียง" ตาม similarity score จาก Code.gs) — ต้องให้
        // คนตัดสินใจเอง ไม่จับคู่ให้อัตโนมัติเงียบๆ เหมือน exact match เพราะนี่คือจุดที่ AI อาจเดาผิดได้จริง
        bodyHtml += `
          <div class="fuzzy-box">
            <div class="fz-label"><i class="ti ti-sparkles" aria-hidden="true"></i> AI คาดว่าคือ</div>
            <div class="fz-name">${product ? escapeHtml(product.name) : ''}</div>
            <div class="fz-hint">เพราะเจอ "${it.billText}" ใกล้เคียงกับ "${it.matchedAliasText||''}" ที่เคยยืนยันไว้ก่อนหน้า (ต่างกันแค่การเว้นวรรค/ตัวสะกดเล็กน้อย) — กรุณายืนยันว่าใช่รายการเดียวกันจริงก่อน</div>
            <div class="fz-actions">
              <button class="fz-confirm" data-confirm="1"><i class="ti ti-check" aria-hidden="true"></i> ใช่ ยืนยัน</button>
              <button class="fz-reject" data-reject="1">ไม่ใช่ เลือกใหม่</button>
            </div>
          </div>`;
      } else if(it.productId){
        const convertedQty = it.factor ? (it.receivedQty * it.factor) : it.receivedQty;
        bodyHtml += `<div class="matched-line"><i class="ti ti-check" aria-hidden="true"></i> ${product ? escapeHtml(product.name) : ''} ${it.factor && it.factor!==1 ? `· = ${convertedQty} ${product?escapeHtml(product.orderUnit):''}` : ''}
          <button class="btn" style="margin-left:auto; padding:3px 8px; font-size:11px;" data-rematch="1">เปลี่ยน</button></div>`;
      } else {
        bodyHtml += `<select class="matchSelect" aria-label="เลือกสินค้าที่ตรงกับ ${it.billText}">
            <option value="" selected disabled>ค้นหา/เลือกสินค้าของเรา...</option>
            ${products.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}
          </select>`;
      }
      if(it.productId && it.needsFactor){
        bodyHtml += `<div class="conversion-box">
            <div class="cv-label"><i class="ti ti-sparkles" aria-hidden="true"></i> ตั้งอัตราแปลงหน่วย (ใหม่)</div>
            <div class="conversion-row">1 ${escapeHtml(it.unit)} = <input type="number" class="factorInput" min="0" step="0.01" placeholder="?" value="${it.factor!=null ? it.factor : ''}" aria-label="อัตราแปลงหน่วย ${escapeHtml(it.unit)} เป็น ${product ? escapeHtml(product.orderUnit) : 'หน่วยของเรา'}"> ${product ? escapeHtml(product.orderUnit) : 'หน่วยของเรา'}</div>
            <div class="conversion-hint">จำไว้ใช้อัตโนมัติทุกครั้งที่เจอ "${it.billText}" จาก ${sup.name} อีก</div>
          </div>`;
      }
      bodyHtml += `
        <div class="item-field-row">
          <div class="item-field"><label for="qty-${it._id}">ตามบิล (${it.unit})</label><input type="number" id="qty-${it._id}" class="qtyInput" value="${it.qty}" min="0" step="0.01"></div>
          <div class="item-field received"><label for="received-${it._id}">รับจริง (${it.unit})</label><input type="number" id="received-${it._id}" class="receivedInput" value="${it.receivedQty}" min="0" step="0.01"></div>
        </div>
        <div id="driftSlot-${it._id}" role="status" aria-live="polite"></div>
        <div class="item-field-row">
          <div class="item-field"><label for="price-${it._id}">ราคา/หน่วย (฿)</label><input type="number" id="price-${it._id}" class="priceInput" value="${it.unitPrice}" min="0" step="0.01"></div>
        </div>
        <div class="item-total"><span>รวมรายการนี้ (ตามบิล)</span><b>${fmtMoney(total)}</b></div>`;
    }

    card.innerHTML = `
      <div class="item-head">
        <div style="flex:1;min-width:0;">
          <div class="item-bill-text">${it.billText}</div>
          <div class="item-bill-raw">อ่านจากบิล: ${it.qty} ${it.unit} × ฿${it.unitPrice}</div>
        </div>
        ${pillHtml}
      </div>
      ${bodyHtml}
      <label class="item-skip-toggle"><input type="checkbox" class="skipToggle" ${it.skip?'checked':''}> ข้ามรายการนี้ (ไม่ใช่สินค้าที่ต้องสต๊อก หรือไม่มีในระบบให้จับคู่)</label>
    `;

    function renderDrift(){
      const slot = card.querySelector(`#driftSlot-${it._id}`);
      if(!slot) return;
      const d = Number((it.receivedQty - it.qty).toFixed(2));
      if(!d){ slot.innerHTML = ''; return; }
      slot.innerHTML = d < 0
        ? `<div class="drift-flag short"><i class="ti ti-alert-triangle" aria-hidden="true"></i> ซัพพลายเออร์ส่งขาด ${Math.abs(d)} ${it.unit} (บิลระบุ ${it.qty} แต่รับจริง ${it.receivedQty})</div>`
        : `<div class="drift-flag over"><i class="ti ti-alert-triangle" aria-hidden="true"></i> ได้รับเกินบิล ${d} ${it.unit} (บิลระบุ ${it.qty} แต่รับจริง ${it.receivedQty})</div>`;
    }
    renderDrift();

    const sel = card.querySelector('.matchSelect');
    if(sel) sel.onchange = ()=>{ it.productId = sel.value; it.matchType = 'manual'; it.confirmed = true; it.needsFactor = true; it.factor = null; rebuildItemCard(it); };
    const rematchBtn = card.querySelector('[data-rematch]');
    if(rematchBtn) rematchBtn.onclick = ()=>{ it.productId = null; it.factor = null; it.matchType = null; it.confirmed = false; it.needsFactor = false; rebuildItemCard(it); };
    const confirmBtn = card.querySelector('[data-confirm]');
    if(confirmBtn) confirmBtn.onclick = ()=>{ it.confirmed = true; rebuildItemCard(it); };
    const rejectBtn = card.querySelector('[data-reject]');
    if(rejectBtn) rejectBtn.onclick = ()=>{ it.productId = null; it.factor = null; it.matchType = null; it.confirmed = false; it.needsFactor = false; rebuildItemCard(it); };
    const fac = card.querySelector('.factorInput');
    if(fac) fac.oninput = ()=>{ it.factor = fac.value ? Number(fac.value) : null; updateFooter(); };
    const qtyI = card.querySelector('.qtyInput');
    if(qtyI) qtyI.oninput = ()=>{ it.qty = Number(qtyI.value)||0; card.querySelector('.item-total b').textContent = fmtMoney(it.qty*it.unitPrice); updateFooter(); renderDrift(); };
    const recI = card.querySelector('.receivedInput');
    if(recI) recI.oninput = ()=>{ it.receivedQty = Number(recI.value)||0; renderDrift(); saveDraft(); };
    const priI = card.querySelector('.priceInput');
    if(priI) priI.oninput = ()=>{ it.unitPrice = Number(priI.value)||0; card.querySelector('.item-total b').textContent = fmtMoney(it.qty*it.unitPrice); updateFooter(); };
    const skipT = card.querySelector('.skipToggle');
    if(skipT) skipT.onchange = ()=>{ it.skip = skipT.checked; rebuildItemCard(it); };

    return card;
  }

  // Perf fix (27 ก.ย. 69, จาก Performance Audit): เดิมทุกการกระทำต่อ 1 รายการ (จับคู่/เปลี่ยน/ยืนยัน/ปฏิเสธ/
  // ข้าม) เรียก drawAll() ที่รื้อสร้างการ์ดสินค้าทั้งหมดใหม่ — วัดจริงบนบิลขนาดลุงทวี (55 รายการ) แต่ละคลิก
  // หน่วง ~140-230ms ทั้งที่แก้แค่รายการเดียว แก้ตามแพทเทิร์นเดียวกับ renderSupplierCheck()'s renderGrid()/
  // check-toggle และ renderOrderPage()'s rebuildCard() — แพตช์แค่การ์ดที่แก้ ไม่แตะการ์ดอื่นเลย
  function rebuildItemCard(it){
    const oldCard = listEl.querySelector('#card-' + it._id);
    const newCard = itemCard(it);
    if(oldCard) oldCard.replaceWith(newCard); else listEl.appendChild(newCard);
    updateFooter();
  }

  function drawAll(){
    listEl.innerHTML = '';
    state.billItems.forEach(it=> listEl.appendChild(itemCard(it)));
    updateFooter();
  }
  function updateFooter(){
    saveDraft(); // เรียกซ้ำได้ปลอดภัย (localStorage เขียนทับตัวเอง) ครอบคลุมทุก path ที่แก้ state.billItems ยกเว้น receivedInput ซึ่งเรียกเองแยกต่างหากด้านบน
    const unresolved = unresolvedBillItems();
    const pending = unresolved.length;
    const total = state.billItems.filter(it=> !it.skip).reduce((s,it)=> s + (it.qty*it.unitPrice||0), 0);
    // ฝั่งลูกจ้าง: บอกความคืบหน้าเฉยๆ ไม่บล็อกการส่ง (เจ้าของจะจับคู่ส่วนที่เหลือต่อเอง)
    // ฝั่งเจ้าของ (resume): ต้องจับคู่ครบก่อนถึงจะบันทึกจริงได้ เพราะรายการที่ไม่มี ProductID ผูกต้นทุนเข้ากับสินค้าไหนไม่ได้เลย
    if(pending > 0){
      if(jumpCursor >= pending) jumpCursor = 0;
      c.querySelector('#rfPending').innerHTML = `<span class="warn">ยังไม่จับคู่อีก ${pending} รายการ</span>
        <button class="jump-btn" id="jumpUnresolvedBtn" type="button"><i class="ti ti-arrow-down" aria-hidden="true"></i> ไปที่รายการที่ยังไม่จับคู่${pending>1 ? ` (${jumpCursor+1}/${pending})` : ''}</button>`;
      c.querySelector('#jumpUnresolvedBtn').onclick = jumpToUnresolvedBillItem;
    } else {
      c.querySelector('#rfPending').innerHTML = `จับคู่ครบแล้ว (${state.billItems.length} รายการ)`;
    }
    c.querySelector('#rfTotal').textContent = fmtMoney(total);
    const saveBtn = c.querySelector('#saveBtn');
    if(saveBtn) saveBtn.disabled = pending>0;
    updateBillHeaderMismatch();
  }
  drawAll();

  const saveBtn = c.querySelector('#saveBtn');
  if(saveBtn) saveBtn.onclick = async ()=>{
    // โหมดเจ้าของเท่านั้นที่มีปุ่มนี้ — จุดเดียวในระบบที่เขียนต้นทุนจริงลง PurchaseReceipts
    saveBtn.disabled = true; saveBtn.textContent = 'กำลังบันทึก...';
    try{
      const items = state.billItems.filter(it=>!it.skip).map(it=>({
        productId: it.productId, billText: it.billText, billQty: it.qty, billUnit: it.unit,
        receivedQty: it.receivedQty, conversionFactor: it.factor || 1, unitPrice: it.unitPrice, saveAlias: true
      }));
      // ห้ามใส่ retryOnTimeout — finalizePurchaseReceipt สร้างแถวใหม่ทุกครั้งที่เรียก ไม่ idempotent
      const res = await apiPost('finalizePurchaseReceipt', {
        batchId: state.billResumeBatchId, supplierId: state.billSupplierId, staffName: state.billStaffName, items,
        billHeader: state.billHeader
      }, false, undefined, BILL_API_URL);
      clearDraft(); // บันทึกจริงสำเร็จแล้ว — เลิกต้องมี draft ค้างไว้ในเครื่องอีกต่อไป
      markPendingBillClosed(state.billResumeBatchId); // E2E-001: กันบิลนี้กลับมาโผล่ในคิวแล้วถูกบันทึกซ้ำ
      clearAnalyzeCache(); // alias ที่เพิ่งเรียนรู้ทำให้ผลจับคู่อัตโนมัติเปลี่ยน — สแกนครั้งถัดไปต้องอ่านใหม่จริง
      go('billSuccess', {billLearnedCount: res.learnedCount||0});
    }catch(err){
      saveBtn.disabled = false; saveBtn.textContent = 'บันทึกต้นทุน';
      alert('บันทึกไม่สำเร็จ: ' + friendlyErrorMessage(err));
    }
  };

  // เจอจริง 15 ก.ย. 69: บิลซ้ำเข้าคิว "บิลรอตรวจสอบ" ได้ (checkDuplicateBill ตอนสแกนเป็นแค่คำเตือน ไม่บล็อก
  // พนักงานกดบันทึกต่อได้) เดิมมีทางเดียวคือเปิด Google Sheet ไปลบแถวด้วยมือ (sandbox นี้เข้า Google ไม่ได้
  // ผู้ใช้ต้องขอไฟล์ .gs ไปแปะเองทุกครั้ง) เพิ่มปุ่มนี้ให้ทิ้งบิลที่ยืนยันว่าไม่ต้องการออกจากคิวได้จากในแอปเลย
  // — ลบแค่แถวใน PendingBillReceipts ไม่เขียนอะไรลง PurchaseReceipts/ProductAlias เลย (ไม่ใช่การบันทึก)
  const discardBtn = c.querySelector('#discardBtn');
  if(discardBtn) discardBtn.onclick = async ()=>{
    if(!confirm('ยืนยันทิ้งบิลนี้ใช่ไหม?\n\nบิลจะถูกลบออกจากคิว "บิลรอตรวจสอบ" ทันที ไม่มีการบันทึกต้นทุน และกู้คืนไม่ได้')) return;
    discardBtn.disabled = true; discardBtn.textContent = 'กำลังทิ้งบิล...';
    if(saveBtn) saveBtn.disabled = true;
    try{
      // ลบแถวด้วย batchId เป็น idempotent อยู่แล้ว (เรียกซ้ำ = ไม่เจอแถว = ไม่ throw) ปลอดภัยที่จะ retry
      await apiPost('discardPendingBill', { batchId: state.billResumeBatchId }, true, undefined, BILL_API_URL);
      clearDraft();
      markPendingBillClosed(state.billResumeBatchId); // E2E-001: รายการอัปเดตทันที ไม่โชว์บิลที่เพิ่งทิ้งค้างจากแคช
      go('billPendingList');
    }catch(err){
      discardBtn.disabled = false; discardBtn.textContent = 'ทิ้งบิลนี้ (ไม่บันทึก)';
      updateFooter(); // คืนสถานะ saveBtn.disabled ให้ตรงกับจำนวนรายการที่ยังไม่จับคู่จริง
      alert('ทิ้งบิลไม่สำเร็จ: ' + friendlyErrorMessage(err));
    }
  };

  const submitBtn = c.querySelector('#submitBtn');
  if(submitBtn) submitBtn.onclick = async ()=>{
    // ฝั่งลูกจ้างไม่มีทางเขียนลง PurchaseReceipts เองเลย ไม่ว่าจะจับคู่ครบหรือไม่ก็ตาม — ทุกใบต้องผ่าน
    // เจ้าของตรวจ/กดบันทึกจริงอีกทีเสมอ (ดู renderBillPendingList / โหมด owner-resume ด้านบน)
    submitBtn.disabled = true; submitBtn.textContent = 'กำลังบันทึก...';
    try{
      // ส่งทุกรายการ (รวมที่ข้าม) ไปด้วย — เจ้าของต้องเห็นครบทุกรายการตอนตรวจ ไม่ใช่แค่ที่ลูกจ้างเลือกเก็บ
      // ห้ามใส่ retryOnTimeout ฝั่งนี้ (auto-retry ของ apiPost เอง) — แต่ backend เช็ค idempotencyKey ให้แล้ว
      // ปลอดภัยถ้าพนักงานกดปุ่มนี้ซ้ำเองหลังเจอ error (ดูคอมเมนต์ genIdemKey ด้านบน)
      const submitRes = await apiPost('submitBillForReview', {
        supplierId: state.billSupplierId, staffName: state.billStaffName, photos: state.billPhotos, items: state.billItems,
        billHeader: state.billHeader, idempotencyKey: state.billSubmitIdemKey
      }, false, undefined, BILL_API_URL);
      clearDraft(); // ส่งสำเร็จแล้ว (ไม่ว่า backend จะสร้างแถวใหม่จริงหรือแค่คืน batchId เดิมเพราะเลขบิลซ้ำ) — เลิกต้องมี draft ค้างไว้ในเครื่อง
      clearAnalyzeCache(); // บิลเข้าคิวแล้ว — สแกนรูปเดิมซ้ำต้องได้คำเตือนบิลซ้ำใหม่จาก backend ไม่ใช่ผลเก่าที่จำไว้
      // E2E-010: backend ตอบ duplicateSkipped:true เมื่อเลขที่บิลตรงกับบิลที่เคยเข้าระบบแล้ว (ไม่ได้สร้างแถวใหม่) —
      // ส่งต่อให้หน้าสำเร็จบอกพนักงานตรงๆ แทนข้อความ "บันทึกรายการนี้แล้ว" แบบปกติ
      go('billSuccess', {billDuplicateSkipped: !!(submitRes && submitRes.duplicateSkipped)});
    }catch(err){
      submitBtn.disabled = false; submitBtn.textContent = 'บันทึกรายการนี้';
      alert('บันทึกไม่สำเร็จ: ' + friendlyErrorMessage(err));
    }
  };
}

/* ==================================================================================
   โหมดใหม่ 7 ก.ย. 69: อัปโหลดรูปหลายบิลพร้อมกัน (ดู analyzeBillBatch ใน Code.gs)
   จงใจแยกฟังก์ชันชุดนี้ทั้งหมดออกมาต่างหาก ไม่แก้ renderBillReview/renderBillSuccess ข้างบนแม้แต่บรรทัด
   เดียว — กันฟีเจอร์ใหม่ที่ยังไม่ผ่านการใช้งานจริงกระทบ flow ถ่ายบิลปกติที่พนักงานใช้ทุกวันอยู่แล้ว
   ทุกจุดที่เขียนข้อมูลจริง (submitBillForReview) เรียกโค้ดเดิมเป๊ะๆ — ไม่มี action ใหม่ที่เขียนชีตเลย
   ================================================================================== */
function fmtMoneyBatch(n){ return '฿'+(n||0).toLocaleString('th-TH',{maximumFractionDigits:2}); }

/* ---- 5b) ตรวจสอบการแบ่งบิล — AI แค่ "เสนอ" การแบ่งกลุ่ม ต้องตรวจ/แก้ก่อนส่งเสมอ ---- */
function renderBillBatchReview(app){
  const sup = SUPPLIERS.find(s=>s.id===state.billSupplierId);
  app.appendChild(topbar('ตรวจสอบการแบ่งบิล', {back:()=>go('billCapture'), meta: sup.name}));
  const c = document.createElement('div'); c.className='content';
  c.innerHTML = `
    <p class="batch-progress" id="batchProgress"></p>
    <div id="batchCards" role="list"></div>
    <button class="btn btn-primary btn-block" id="submitAllBtn">ส่งทั้งหมด</button>
  `;
  app.appendChild(c);
  drawBatchCards(c);
  c.querySelector('#submitAllBtn').onclick = ()=> submitAllBatch(c);
}

function drawBatchCards(c){
  const groups = state.billBatchGroups;
  const doneCount = groups.filter(g=>g.reviewed).length;
  c.querySelector('#batchProgress').innerHTML = `AI แยกได้ <b>${groups.length} บิล</b> จาก ${state.billPhotos.length} รูป<span>ตรวจแล้ว <b>${doneCount}/${groups.length}</b></span>`;

  const wrap = c.querySelector('#batchCards');
  wrap.innerHTML = groups.map((g,gi)=>{
    if(g.submitted) return ''; // ส่งไปแล้ว (เหลือจากกด "ส่งทั้งหมด" ที่พังกลางทาง) ไม่ต้องโชว์ซ้ำ
    const thumbs = g.photoIndices.map((i,pos)=>`<div class="bill-photo-chip"><img src="${state.billPhotos[i]}" alt="รูปบิลที่ ${gi+1} หน้าที่ ${pos+1} จาก ${g.photoIndices.length}"></div>`).join('');
    const h = g.billHeader;
    const title = h && h.billNumber ? `บิลที่ ${gi+1} · ${h.billNumber}` : `บิลที่ ${gi+1}`;
    const sub = h && h.billDate ? `${h.billDate} · ${g.photoIndices.length} รูป` : `${g.photoIndices.length} รูป · ไม่พบข้อมูลหัวบิล`;
    const total = g.items.filter(it=>!it.skip).reduce((s,it)=> s + (it.qty*it.unitPrice||0), 0);
    return `
      <div class="batch-card" role="listitem">
        <div class="bc-head">
          <div class="bc-thumbs">${thumbs}</div>
          <div class="bc-info"><p class="bc-title">${title}</p><p class="bc-sub">${sub}</p></div>
          <span class="status-pill ${g.reviewed?'done':'pending'}">${g.reviewed?'<i class="ti ti-check" aria-hidden="true"></i> ตรวจแล้ว':'รอตรวจ'}</span>
        </div>
        <div class="bc-figures"><span>${g.items.length} รายการ</span><span>ยอดรวม <b>${fmtMoneyBatch(total)}</b></span></div>
        ${g.supplierMismatchWarning ? `<div style="display:flex; gap:5px; align-items:flex-start; background:var(--danger-bg); color:var(--danger); font-size:11px; font-weight:600; padding:6px 8px; border-radius:7px; margin-bottom:9px;"><i class="ti ti-alert-triangle" aria-hidden="true" style="flex-shrink:0; margin-top:1px;"></i> อาจไม่ใช่บิลของซัพพลายเออร์นี้ — ตรวจสอบก่อนยืนยัน</div>` : ''}
        ${g.duplicateBillWarning ? `<div style="display:flex; gap:5px; align-items:flex-start; background:var(--amber-bg); color:var(--amber); font-size:11px; font-weight:600; padding:6px 8px; border-radius:7px; margin-bottom:9px;"><i class="ti ti-copy" aria-hidden="true" style="flex-shrink:0; margin-top:1px;"></i> อาจซ้ำกับบิลที่บันทึกไปแล้ว — ตรวจสอบก่อนยืนยัน</div>` : ''}
        <div class="bc-actions">
          <button class="btn" data-regroup="${gi}"><i class="ti ti-photo-plus" aria-hidden="true"></i> แก้กลุ่มรูป</button>
          <button class="btn btn-primary" data-review="${gi}">${g.reviewed?'แก้ไขรายการ':'ตรวจสอบรายการ'}</button>
        </div>
      </div>`;
  }).join('');

  wrap.querySelectorAll('[data-review]').forEach(b=> b.onclick = ()=>{ go('billBatchItemReview', {billBatchActiveIndex:+b.dataset.review}); });
  wrap.querySelectorAll('[data-regroup]').forEach(b=> b.onclick = ()=>{ go('billBatchRegroup', {billBatchRegroupFrom:+b.dataset.regroup}); });

  const remaining = groups.filter(g=>!g.submitted);
  const submitBtn = c.querySelector('#submitAllBtn');
  submitBtn.textContent = `ส่งทั้งหมด ${remaining.length} บิล เข้าคิวให้เจ้าของตรวจ`;
  submitBtn.disabled = remaining.length===0 || remaining.some(g=>!g.reviewed);
}

async function submitAllBatch(c){
  const btn = c.querySelector('#submitAllBtn');
  const groups = state.billBatchGroups;
  btn.disabled = true;
  for(let gi=0; gi<groups.length; gi++){
    const g = groups[gi];
    if(g.submitted) continue;
    btn.textContent = `กำลังส่งบิลที่ ${gi+1}...`;
    try{
      // ห้ามใส่ retryOnTimeout ฝั่งนี้ (auto-retry ของ apiPost เอง) — แต่ backend เช็ค idempotencyKey (g.idemKey,
      // สร้างครั้งเดียวตอนกลุ่มนี้ถูกสร้างขึ้น) ให้แล้ว ปลอดภัยถ้ากด "ส่งทั้งหมด" ซ้ำ เหมือนโหมดปกติทุกประการ
      // (ดูคอมเมนต์เดิมใน renderBillReview) วนเรียกทีละบิลจริงตามลำดับ ไม่ยิงพร้อมกัน
      const res = await apiPost('submitBillForReview', {
        supplierId: state.billSupplierId, staffName: state.billStaffName,
        photos: g.photoIndices.map(i=> state.billPhotos[i]), items: g.items, billHeader: g.billHeader,
        idempotencyKey: g.idemKey
      }, false, undefined, BILL_API_URL);
      g.submitted = true;
      g.duplicateSkipped = !!(res && res.duplicateSkipped); // E2E-010: นับแยกไว้โชว์ในหน้าสำเร็จ
      clearAnalyzeCache(); // เหตุผลเดียวกับโหมดบิลเดี่ยว (คำเตือนบิลซ้ำต้องคำนวณใหม่)
    }catch(err){
      btn.disabled = false;
      drawBatchCards(c);
      alert('ส่งบิลที่ ' + (gi+1) + ' ไม่สำเร็จ: ' + friendlyErrorMessage(err) + '\nบิลที่ส่งไปแล้วก่อนหน้าไม่ถูกส่งซ้ำ กด "ส่งทั้งหมด" อีกครั้งเพื่อลองบิลที่เหลือต่อได้');
      return;
    }
  }
  go('billBatchSuccess', {billBatchSubmittedCount: groups.filter(g=>g.submitted).length});
}

/* ---- 5c) ตรวจสอบรายการของบิลใดบิลหนึ่งในกลุ่ม — โครงเดียวกับ renderBillReview โหมด staff เป๊ะๆ
   (คัดลอกมาแยกต่างหากแทนที่จะเรียก renderBillReview ร่วม กันความเสี่ยงกับโค้ดโหมดปกติที่ใช้งานจริงทุกวัน)
   ต่างกันแค่: อ่าน/เขียนลง group object ที่ state.billBatchActiveIndex ชี้อยู่ (ไม่ใช่ state.billItems/
   billHeader ตรงๆ) และปุ่มยืนยันแค่ mark ว่า group นี้ตรวจแล้ว ไม่เรียก API เลย (ไปเรียกรวมทีเดียวตอนกด
   "ส่งทั้งหมด" ที่ renderBillBatchReview) ---- */
function renderBillBatchItemReview(app){
  const sup = SUPPLIERS.find(s=>s.id===state.billSupplierId);
  const products = PRODUCTS.filter(p=>p.supplierId===sup.id);
  const g = state.billBatchGroups[state.billBatchActiveIndex];
  const groupPhotos = g.photoIndices.map(i=> state.billPhotos[i]);
  app.appendChild(topbar('ตรวจสอบรายการ', { back: ()=> go('billBatchReview'), meta: sup.name }));
  const c = document.createElement('div'); c.className='content';
  c.innerHTML = `
    ${g.supplierMismatchWarning ? `
    <div class="supplier-mismatch-warning" role="status" aria-live="polite">
      <i class="ti ti-alert-triangle icon" aria-hidden="true"></i>
      <div style="flex:1; min-width:0;">
        <p class="smw-title">บิลนี้อาจไม่ใช่ของ ${sup.name}</p>
        <p class="smw-body">${g.supplierMismatchWarning}</p>
      </div>
    </div>` : ''}
    ${g.duplicateBillWarning ? `
    <div class="duplicate-bill-warning" role="status" aria-live="polite">
      <i class="ti ti-copy icon" aria-hidden="true"></i>
      <div style="flex:1; min-width:0;">
        <p class="dbw-title">บิลนี้อาจซ้ำกับที่บันทึกไปแล้ว</p>
        <p class="dbw-body">${g.duplicateBillWarning.matchType==='billNumber'
          ? `เลขที่บิล <b>${g.duplicateBillWarning.billNumber}</b> ตรงกับบิลที่บันทึกไว้ก่อนหน้านี้`
          : `ไม่มีเลขที่บิลให้เทียบ แต่รายการสินค้าตรงกับบิลก่อนหน้านี้ถึง <b>${Math.round(g.duplicateBillWarning.overlapRatio*100)}%</b>`}</p>
        <div class="dbw-meta">
          <span class="dbw-pill ${g.duplicateBillWarning.status==='finalized'?'finalized':'pending'}">${g.duplicateBillWarning.status==='finalized'?'บันทึกแล้ว':'รอตรวจสอบ'}</span>
          <span style="font-size:11px; color:var(--text-secondary);">${g.duplicateBillWarning.date||''}</span>
        </div>
        ${g.duplicateBillWarning.photoUrl ? `<button class="btn" id="viewDupePhotoBatch">ดูรูปบิลเดิม</button>` : ''}
      </div>
    </div>` : ''}
    <div class="review-bill-strip">
      ${groupPhotos[0] ? `<img class="rb-thumb" src="${groupPhotos[0]}" alt="">` : ''}
      <div class="rb-txt">อ่านได้ <b>${g.items.length} รายการ</b> จากรูปบิล ${groupPhotos.length} ใบ<br><i class="ti ti-folder" aria-hidden="true"></i> เก็บไว้ในโฟลเดอร์ Drive ของ ${sup.name} อัตโนมัติ</div>
      <button class="btn" id="viewPhoto">ดูรูป</button>
    </div>
    <div id="billHeaderSlot"></div>
    <div id="itemList"></div>
    <div class="review-footer">
      <div class="rf-summary"><span id="rfPending" class="rf-left"></span><span>รวม <b class="rf-total" id="rfTotal">฿0</b></span></div>
      <button class="btn btn-primary btn-block" id="confirmBtn">ยืนยันบิลนี้</button>
    </div>
  `;
  app.appendChild(c);
  const viewDupePhotoBatchBtn = c.querySelector('#viewDupePhotoBatch');
  if(viewDupePhotoBatchBtn) viewDupePhotoBatchBtn.onclick = ()=> openBillPhotoLightbox(g.duplicateBillWarning.photoUrl.split(','));
  c.querySelector('#viewPhoto').onclick = ()=> openBillPhotoLightbox(groupPhotos);

  const listEl = c.querySelector('#itemList');
  function isResolved(it){ return it.skip || (it.productId && it.factor && it.confirmed); }
  function unresolvedBatchItems(){ return g.items.filter(it=> !isResolved(it)); }

  // เหมือนโหมดบิลเดี่ยว — เลื่อน+ไฮไลต์ไปหารายการที่ยังไม่จับคู่ให้อัตโนมัติ กดซ้ำวนไปรายการถัดไป
  let jumpCursor = 0;
  function jumpToUnresolvedBatchItem(){
    const unresolved = unresolvedBatchItems();
    if(!unresolved.length) return;
    if(jumpCursor >= unresolved.length) jumpCursor = 0;
    const target = unresolved[jumpCursor];
    const el = c.querySelector('#card-' + target._id);
    if(el){
      el.scrollIntoView({behavior:'smooth', block:'center'});
      el.classList.remove('jump-highlight');
      void el.offsetWidth;
      el.classList.add('jump-highlight');
      setTimeout(()=> el.classList.remove('jump-highlight'), 1450);
    }
    jumpCursor = (jumpCursor + 1) % unresolved.length;
    updateFooter();
  }

  const headerSlot = c.querySelector('#billHeaderSlot');
  function updateBillHeaderMismatch(){
    const h = g.billHeader;
    const slot = headerSlot.querySelector('#bhcMismatchSlot');
    if(!h || !slot) return;
    const itemsSum = g.items.filter(it=>!it.skip).reduce((s,it)=> s + (it.qty*it.unitPrice||0), 0);
    // เจอจริง 7 ก.ย. 69 (บิล PFP หลายใบ): บิลบางเจ้าพิมพ์ "ราคาต่อหน่วย" แบบรวม VAT ไว้แล้ว ทำให้ยอดรวม
    // รายการที่คำนวณเองไปตรงกับ "ยอดหลังแวต" แทนที่จะเป็น "ยอดก่อนแวต" — เดิมเทียบกับก่อนแวตอย่างเดียว
    // เลยเตือนหลอกทุกครั้งสำหรับบิลแบบนี้ทั้งที่ข้อมูลถูกต้องเป๊ะ เทียบกับทั้งสองแบบแทน ตรงอันใดอันหนึ่งถือว่าโอเค
    const matchesSubtotal = h.subtotal && Math.abs(itemsSum - h.subtotal) <= 1;
    const matchesTotal = h.total && Math.abs(itemsSum - h.total) <= 1;
    const mismatch = h.subtotal && !matchesSubtotal && !matchesTotal;
    slot.innerHTML = mismatch
      ? `<div class="bhc-mismatch"><i class="ti ti-alert-triangle" aria-hidden="true"></i> ยอดรวมสินค้าที่จับคู่ได้ (${fmtMoneyBatch(itemsSum)}) ไม่ตรงกับยอดบนบิลเลย (ทั้งก่อนแวต ${fmtMoneyBatch(h.subtotal)} และหลังแวต ${fmtMoneyBatch(h.total)}) — ลองเช็คว่ามีรายการตกหล่น/พิมพ์ยอดผิดไหม</div>`
      : '';
  }
  function renderBillHeaderCard(){
    const h = g.billHeader;
    if(!h){ headerSlot.innerHTML = ''; return; }
    headerSlot.innerHTML = `
      <div class="bill-header-card">
        <h2 class="bhc-label"><i class="ti ti-file-text" aria-hidden="true"></i> รายละเอียดบิล <span class="tag">อ่านจาก AI</span></h2>
        <div class="bhc-row">
          <div class="bhc-field"><label for="bhDateInput">วันที่บิล</label><input type="text" id="bhDateInput" class="bhDate" value="${h.billDate||''}"></div>
          <div class="bhc-field"><label for="bhNumberInput">เลขที่บิล</label><input type="text" id="bhNumberInput" class="bhNumber" value="${h.billNumber||''}"></div>
        </div>
        <div class="bhc-row">
          <div class="bhc-field"><label for="bhSubtotalInput">ยอดรวมสินค้า (฿)</label><input type="number" step="0.01" id="bhSubtotalInput" class="bhSubtotal" value="${h.subtotal||0}"></div>
          <div class="bhc-field"><label for="bhVatInput">ภาษีมูลค่าเพิ่ม (฿)</label><input type="number" step="0.01" id="bhVatInput" class="bhVat" value="${h.vat||0}"></div>
        </div>
        <div class="bhc-row" style="margin-bottom:0;">
          <div class="bhc-field total"><label for="bhTotalInput">ยอดรวมสุทธิตามบิล (฿)</label><input type="number" step="0.01" id="bhTotalInput" class="bhTotal" value="${h.total||0}"></div>
        </div>
        <div id="bhcMismatchSlot" role="status" aria-live="polite"></div>
      </div>`;
    headerSlot.querySelector('.bhDate').oninput = (e)=>{ h.billDate = e.target.value; };
    headerSlot.querySelector('.bhNumber').oninput = (e)=>{ h.billNumber = e.target.value; };
    headerSlot.querySelector('.bhSubtotal').oninput = (e)=>{ h.subtotal = Number(e.target.value)||0; updateBillHeaderMismatch(); };
    headerSlot.querySelector('.bhVat').oninput = (e)=>{ h.vat = Number(e.target.value)||0; };
    headerSlot.querySelector('.bhTotal').oninput = (e)=>{ h.total = Number(e.target.value)||0; };
    updateBillHeaderMismatch();
  }
  renderBillHeaderCard();

  function itemCard(it){
    const card = document.createElement('div');
    const pendingFuzzy = it.productId && !it.confirmed;
    card.className = 'item-card' + (it.skip ? ' is-skip' : (it.productId && it.confirmed) ? ' is-matched' : '');
    card.id = 'card-' + it._id;
    const total = (it.qty * it.unitPrice) || 0;
    const product = products.find(p=>p.id===it.productId);
    let pillHtml, bodyHtml = '';

    if(it.skip) pillHtml = `<span class="status-pill skip"><i class="ti ti-eye-off" aria-hidden="true"></i> ไม่ใช่สินค้า</span>`;
    else if(pendingFuzzy) pillHtml = `<span class="status-pill fuzzy"><i class="ti ti-sparkles" aria-hidden="true"></i> คล้ายรายการเดิม — ยืนยัน</span>`;
    else if(it.productId) pillHtml = `<span class="status-pill matched"><i class="ti ti-check" aria-hidden="true"></i> ${it.matchType==='exact' ? 'จับคู่อัตโนมัติ' : 'จับคู่แล้ว'}</span>`;
    else pillHtml = `<span class="status-pill unmatched"><i class="ti ti-alert-triangle" aria-hidden="true"></i> ต้องจับคู่</span>`;

    if(!it.skip){
      if(pendingFuzzy){
        bodyHtml += `
          <div class="fuzzy-box">
            <div class="fz-label"><i class="ti ti-sparkles" aria-hidden="true"></i> AI คาดว่าคือ</div>
            <div class="fz-name">${product ? escapeHtml(product.name) : ''}</div>
            <div class="fz-hint">เพราะเจอ "${it.billText}" ใกล้เคียงกับ "${it.matchedAliasText||''}" ที่เคยยืนยันไว้ก่อนหน้า (ต่างกันแค่การเว้นวรรค/ตัวสะกดเล็กน้อย) — กรุณายืนยันว่าใช่รายการเดียวกันจริงก่อน</div>
            <div class="fz-actions">
              <button class="fz-confirm" data-confirm="1"><i class="ti ti-check" aria-hidden="true"></i> ใช่ ยืนยัน</button>
              <button class="fz-reject" data-reject="1">ไม่ใช่ เลือกใหม่</button>
            </div>
          </div>`;
      } else if(it.productId){
        const convertedQty = it.factor ? (it.receivedQty * it.factor) : it.receivedQty;
        bodyHtml += `<div class="matched-line"><i class="ti ti-check" aria-hidden="true"></i> ${product ? escapeHtml(product.name) : ''} ${it.factor && it.factor!==1 ? `· = ${convertedQty} ${product?escapeHtml(product.orderUnit):''}` : ''}
          <button class="btn" style="margin-left:auto; padding:3px 8px; font-size:11px;" data-rematch="1">เปลี่ยน</button></div>`;
      } else {
        bodyHtml += `<select class="matchSelect" aria-label="เลือกสินค้าที่ตรงกับ ${it.billText}">
            <option value="" selected disabled>ค้นหา/เลือกสินค้าของเรา...</option>
            ${products.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}
          </select>`;
      }
      if(it.productId && it.needsFactor){
        bodyHtml += `<div class="conversion-box">
            <div class="cv-label"><i class="ti ti-sparkles" aria-hidden="true"></i> ตั้งอัตราแปลงหน่วย (ใหม่)</div>
            <div class="conversion-row">1 ${escapeHtml(it.unit)} = <input type="number" class="factorInput" min="0" step="0.01" placeholder="?" value="${it.factor!=null ? it.factor : ''}" aria-label="อัตราแปลงหน่วย ${escapeHtml(it.unit)} เป็น ${product ? escapeHtml(product.orderUnit) : 'หน่วยของเรา'}"> ${product ? escapeHtml(product.orderUnit) : 'หน่วยของเรา'}</div>
            <div class="conversion-hint">จำไว้ใช้อัตโนมัติทุกครั้งที่เจอ "${it.billText}" จาก ${sup.name} อีก</div>
          </div>`;
      }
      bodyHtml += `
        <div class="item-field-row">
          <div class="item-field"><label for="qty-${it._id}">ตามบิล (${it.unit})</label><input type="number" id="qty-${it._id}" class="qtyInput" value="${it.qty}" min="0" step="0.01"></div>
          <div class="item-field received"><label for="received-${it._id}">รับจริง (${it.unit})</label><input type="number" id="received-${it._id}" class="receivedInput" value="${it.receivedQty}" min="0" step="0.01"></div>
        </div>
        <div id="driftSlot-${it._id}" role="status" aria-live="polite"></div>
        <div class="item-field-row">
          <div class="item-field"><label for="price-${it._id}">ราคา/หน่วย (฿)</label><input type="number" id="price-${it._id}" class="priceInput" value="${it.unitPrice}" min="0" step="0.01"></div>
        </div>
        <div class="item-total"><span>รวมรายการนี้ (ตามบิล)</span><b>${fmtMoneyBatch(total)}</b></div>`;
    }

    card.innerHTML = `
      <div class="item-head">
        <div style="flex:1;min-width:0;">
          <div class="item-bill-text">${it.billText}</div>
          <div class="item-bill-raw">อ่านจากบิล: ${it.qty} ${it.unit} × ฿${it.unitPrice}</div>
        </div>
        ${pillHtml}
      </div>
      ${bodyHtml}
      <label class="item-skip-toggle"><input type="checkbox" class="skipToggle" ${it.skip?'checked':''}> ข้ามรายการนี้ (ไม่ใช่สินค้าที่ต้องสต๊อก หรือไม่มีในระบบให้จับคู่)</label>
    `;

    function renderDrift(){
      const slot = card.querySelector(`#driftSlot-${it._id}`);
      if(!slot) return;
      const d = Number((it.receivedQty - it.qty).toFixed(2));
      if(!d){ slot.innerHTML = ''; return; }
      slot.innerHTML = d < 0
        ? `<div class="drift-flag short"><i class="ti ti-alert-triangle" aria-hidden="true"></i> ซัพพลายเออร์ส่งขาด ${Math.abs(d)} ${it.unit} (บิลระบุ ${it.qty} แต่รับจริง ${it.receivedQty})</div>`
        : `<div class="drift-flag over"><i class="ti ti-alert-triangle" aria-hidden="true"></i> ได้รับเกินบิล ${d} ${it.unit} (บิลระบุ ${it.qty} แต่รับจริง ${it.receivedQty})</div>`;
    }
    renderDrift();

    const sel = card.querySelector('.matchSelect');
    if(sel) sel.onchange = ()=>{ it.productId = sel.value; it.matchType = 'manual'; it.confirmed = true; it.needsFactor = true; it.factor = null; rebuildItemCard(it); };
    const rematchBtn = card.querySelector('[data-rematch]');
    if(rematchBtn) rematchBtn.onclick = ()=>{ it.productId = null; it.factor = null; it.matchType = null; it.confirmed = false; it.needsFactor = false; rebuildItemCard(it); };
    const confirmBtn = card.querySelector('[data-confirm]');
    if(confirmBtn) confirmBtn.onclick = ()=>{ it.confirmed = true; rebuildItemCard(it); };
    const rejectBtn = card.querySelector('[data-reject]');
    if(rejectBtn) rejectBtn.onclick = ()=>{ it.productId = null; it.factor = null; it.matchType = null; it.confirmed = false; it.needsFactor = false; rebuildItemCard(it); };
    const fac = card.querySelector('.factorInput');
    if(fac) fac.oninput = ()=>{ it.factor = fac.value ? Number(fac.value) : null; updateFooter(); };
    const qtyI = card.querySelector('.qtyInput');
    if(qtyI) qtyI.oninput = ()=>{ it.qty = Number(qtyI.value)||0; card.querySelector('.item-total b').textContent = fmtMoneyBatch(it.qty*it.unitPrice); updateFooter(); renderDrift(); };
    const recI = card.querySelector('.receivedInput');
    if(recI) recI.oninput = ()=>{ it.receivedQty = Number(recI.value)||0; renderDrift(); };
    const priI = card.querySelector('.priceInput');
    if(priI) priI.oninput = ()=>{ it.unitPrice = Number(priI.value)||0; card.querySelector('.item-total b').textContent = fmtMoneyBatch(it.qty*it.unitPrice); updateFooter(); };
    const skipT = card.querySelector('.skipToggle');
    if(skipT) skipT.onchange = ()=>{ it.skip = skipT.checked; rebuildItemCard(it); };

    return card;
  }

  // Perf fix (27 ก.ย. 69, จาก Performance Audit) — เหมือนโหมดบิลเดี่ยว (renderBillReview) ดูคอมเมนต์เต็มที่นั่น
  function rebuildItemCard(it){
    const oldCard = listEl.querySelector('#card-' + it._id);
    const newCard = itemCard(it);
    if(oldCard) oldCard.replaceWith(newCard); else listEl.appendChild(newCard);
    updateFooter();
  }

  function drawAll(){
    listEl.innerHTML = '';
    g.items.forEach(it=> listEl.appendChild(itemCard(it)));
    updateFooter();
  }
  function updateFooter(){
    const unresolved = unresolvedBatchItems();
    const pending = unresolved.length;
    const total = g.items.filter(it=> !it.skip).reduce((s,it)=> s + (it.qty*it.unitPrice||0), 0);
    // เหมือนโหมดปกติฝั่งลูกจ้าง: บอกความคืบหน้าเฉยๆ ไม่บล็อกการยืนยัน (เจ้าของจะจับคู่ส่วนที่เหลือต่อเอง)
    if(pending > 0){
      if(jumpCursor >= pending) jumpCursor = 0;
